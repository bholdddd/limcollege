ius of convergence, and can be differentiated or integrated term by term: from $\\sum x^n=\\frac1{1-x}$ you get $\\sum nx^{n-1}=\\frac{1}{(1-x)^2}$.\n\n**Example.** $\\sum_{n\\ge1}\\frac1{2^n}=1$.","pt":{"n":"Séries","d":"Somar infinitas parcelas: séries geométricas, telescópicas e de potências.","b":"**O que é.** $\\sum a_n$ é o limite das suas somas parciais.\n\n**Como usar.** Geométrica: $\\sum_{n\\ge0}r^n=\\frac1{1-r}$ para $|r|<1$. Telescópica (de Mengoli): se $a_n=b_n-b_{n+1}$, as somas parciais reduzem-se a $b_1-b_{N+1}$. Critérios: o termo geral tem de tender para $0$; $\\sum\\frac1{n^p}$ converge se e só se $p>1$; critério da razão: se $\\left|\\frac{a_{n+1}}{a_n}\\right|\\to\\rho<1$, converge. Uma série de potências $\\sum c_nx^n$ converge para $|x|<R$, o raio de convergência, e pode ser derivada ou integrada termo a termo: de $\\sum x^n=\\frac1{1-x}$ obtém-se $\\sum nx^{n-1}=\\frac{1}{(1-x)^2}$.\n\n**Exemplo.** $\\sum_{n\\ge1}\\frac1{2^n}=1$."}},{"k":"taylor","n":"Taylor series","d":"Writing functions as infinite polynomials.","b":"**What it is.** Near $x=0$, a smooth function equals $\\sum\\frac{f^{(n)}(0)}{n!}x^n$. The essentials: $e^x=\\sum\\frac{x^n}{n!}$, $\\sin x=x-\\frac{x^3}{3!}+\\frac{x^5}{5!}-\\cdots$, $\\cos x=1-\\frac{x^2}{2!}+\\frac{x^4}{4!}-\\cdots$, $\\ln(1+x)=x-\\frac{x^2}{2}+\\frac{x^3}{3}-\\cdots$, $\\arctan x=x-\\frac{x^3}{3}+\\frac{x^5}{5}-\\cdots$.\n\n**How to use it.** For limits, replace each function by its first few terms. For high derivatives at $0$: $f^{(n)}(0)=n!\\times$ (coefficient of $x^n$). You can substitute into known series, e.g. $e^{x^2}=\\sum\\frac{x^{2n}}{n!}$.\n\n**Example.** $\\frac{\\sin x-x}{x^3}=\\frac{-x^3/6+\\cdots}{x^3}\\to-\\frac16$.","pt":{"n":"Séries de Taylor","d":"Escrever funções como polinómios infinitos.","b":"**O que é.** Perto de $x=0$, uma função suave é igual a $\\sum\\frac{f^{(n)}(0)}{n!}x^n$. As essenciais: $e^x=\\sum\\frac{x^n}{n!}$, $\\sin x=x-\\frac{x^3}{3!}+\\frac{x^5}{5!}-\\cdots$, $\\cos x=1-\\frac{x^2}{2!}+\\frac{x^4}{4!}-\\cdots$, $\\ln(1+x)=x-\\frac{x^2}{2}+\\frac{x^3}{3}-\\cdots$, $\\arctan x=x-\\frac{x^3}{3}+\\frac{x^5}{5}-\\cdots$.\n\n**Como usar.** Em limites, substitua cada função pelos seus primeiros termos. Para derivadas de ordem elevada em $0$: $f^{(n)}(0)=n!\\times$ (coeficiente de $x^n$). Pode substituir em séries conhecidas, por exemplo $e^{x^2}=\\sum\\frac{x^{2n}}{n!}$.\n\n**Exemplo.** $\\frac{\\sin x-x}{x^3}=\\frac{-x^3/6+\\cdots}{x^3}\\to-\\frac16$."}},{"k":"ode","n":"Differential equations","d":"Equations for an unknown function and its derivatives.","b":"**What it is.** An equation linking a function to its derivatives, plus initial conditions that pin down the constants.\n\n**How to solve.** $y'=ky$ gives $y=Ce^{kx}$. Separable $\\frac{dy}{dx}=g(x)h(y)$: integrate $\\int\\frac{dy}{h(y)}=\\int g(x)\\,dx$. Linear $y'+p(x)y=q(x)$: multiply by $e^{\\int p}$ so the left side becomes $\\left(e^{\\int p}y\\right)'$. For $y''+by'+cy=0$, try $y=e^{rx}$ and solve $r^2+br+c=0$: distinct real roots give $C_1e^{r_1x}+C_2e^{r_2x}$, and roots $\\alpha\\pm\\beta i$ give $e^{\\alpha x}(C_1\\cos\\beta x+C_2\\sin\\beta x)$.\n\n**Example.** $y'=-2y$, $y(0)=5$ gives $y=5e^{-2x}$.","pt":{"n":"Equações diferenciais","d":"Equações para uma função desconhecida e as suas derivadas.","b":"**O que é.** Uma equação que relaciona uma função com as suas derivadas, mais condições iniciais que fixam as constantes.\n\n**Como resolver.** $y'=ky$ dá $y=Ce^{kx}$. Variáveis separáveis $\\frac{dy}{dx}=g(x)h(y)$: primitive $\\int\\frac{dy}{h(y)}=\\int g(x)\\,dx$. Linear $y'+p(x)y=q(x)$: multiplique por $e^{\\int p}$ para que o primeiro membro passe a $\\left(e^{\\int p}y\\right)'$. Para $y''+by'+cy=0$, experimente $y=e^{rx}$ e resolva $r^2+br+c=0$: raízes reais distintas dão $C_1e^{r_1x}+C_2e^{r_2x}$, e raízes $\\alpha\\pm\\beta i$ dão $e^{\\alpha x}(C_1\\cos\\beta x+C_2\\sin\\beta x)$.\n\n**Exemplo.** $y'=-2y$, $y(0)=5$ dá $y=5e^{-2x}$."}},{"k":"multivariable","n":"Partial derivatives & Lagrange","d":"Optimizing functions of several variables, with or without constraints.","b":"**What it is.** For $f(x,y)$, the partial derivative $\\frac{\\partial f}{\\partial x}$ differentiates in $x$ while holding $y$ fixed.\n\n**How to use it.** Critical points have all partial derivatives zero. Classify with $D=f_{xx}f_{yy}-f_{xy}^2$: $D>0,f_{xx}>0$ is a minimum, $D>0,f_{xx}<0$ a maximum, $D<0$ a saddle. To optimize $f$ subject to $g=c$, use Lagrange multipliers: solve $\\nabla f=\\lambda\\nabla g$ together with $g=c$.\n\n**Example.** Maximize $x+y$ on $x^2+y^2=2$: $(1,1)=\\lambda(2x,2y)$ forces $x=y=1$, so the maximum is $2$.","pt":{"n":"Derivadas parciais e multiplicadores","d":"Otimizar funções de várias variáveis, com ou sem restrições.","b":"**O que é.** Para $f(x,y)$, a derivada parcial $\\frac{\\partial f}{\\partial x}$ deriva em ordem a $x$ mantendo $y$ fixo.\n\n**Como usar.** Nos pontos críticos todas as derivadas parciais se anulam. Classifique com $D=f_{xx}f_{yy}-f_{xy}^2$: $D>0,f_{xx}>0$ é um mínimo, $D>0,f_{xx}<0$ um máximo, $D<0$ um ponto de sela. Para otimizar $f$ sujeita a $g=c$, use multiplicadores de Lagrange: resolva $\\nabla f=\\lambda\\nabla g$ juntamente com $g=c$.\n\n**Exemplo.** Maximizar $x+y$ em $x^2+y^2=2$: $(1,1)=\\lambda(2x,2y)$ obriga a $x=y=1$, logo o máximo é $2$."}},{"k":"double-integrals","n":"Double integrals","d":"Volumes over regions, iterated integrals, and polar coordinates.","b":"**What it is.** $\\iint_Rf\\,dA$ is the volume under $z=f(x,y)$ over the region $R$.\n\n**How to compute.** As an iterated integral, $\\int_a^b\\left(\\int_{g_1(x)}^{g_2(x)}f\\,dy\\right)dx$. You can swap the order if you redescribe the region, which helps when one order is impossible. Polar coordinates: $x=r\\cos\\theta$, $y=r\\sin\\theta$, $dA=r\\,dr\\,d\\theta$, ideal for discs. The same trick computes $\\left(\\int_{-\\infty}^\\infty e^{-x^2}dx\\right)^2=\\pi$.\n\n**Example.** $\\iint_{x^2+y^2\\le4}dA=\\int_0^{2\\pi}\\!\\int_0^2r\\,dr\\,d\\theta=4\\pi$.","pt":{"n":"Integrais duplos","d":"Volumes sobre regiões, integrais iterados e coordenadas polares.","b":"**O que é.** $\\iint_Rf\\,dA$ é o volume sob $z=f(x,y)$ sobre a região $R$.\n\n**Como calcular.** Como integral iterado, $\\int_a^b\\left(\\int_{g_1(x)}^{g_2(x)}f\\,dy\\right)dx$. Pode trocar a ordem se descrever de novo a região, o que ajuda quando uma das ordens é impossível. Coordenadas polares: $x=r\\cos\\theta$, $y=r\\sin\\theta$, $dA=r\\,dr\\,d\\theta$, ideais para discos. O mesmo truque calcula $\\left(\\int_{-\\infty}^\\infty e^{-x^2}dx\\right)^2=\\pi$.\n\n**Exemplo.** $\\iint_{x^2+y^2\\le4}dA=\\int_0^{2\\pi}\\!\\int_0^2r\\,dr\\,d\\theta=4\\pi$."}},{"k":"inequalities","n":"Inequalities via calculus","d":"Proving and finding bounds with derivatives, AM–GM, and symmetry.","b":"**What it is.** Many olympiad problems ask for the best bound on an expression, which is an optimization problem in disguise.\n\n**How to use it.** To show $f\\ge g$, study $h=f-g$: find its minimum, or show $h(a)=0$ and $h'\\ge0$ for $x\\ge a$. AM–GM: the arithmetic mean of positive numbers is at least their geometric mean, with equality when they are all equal. Under a symmetric constraint the extreme value often occurs at the symmetric point; Lagrange multipliers or substitution confirm it. Convexity and tangent lines give quick estimates.\n\n**Example.** $\\ln x\\le x-1$ for $x>0$: $h(x)=x-1-\\ln x$ has $h'(x)=1-\\frac1x$, so its minimum is $h(1)=0$.","pt":{"n":"Desigualdades com cálculo","d":"Provar e encontrar majorantes com derivadas, médias e simetria.","b":"**O que é.** Muitos problemas de olimpíada pedem o melhor majorante ou minorante de uma expressão, o que é um problema de otimização disfarçado.\n\n**Como usar.** Para mostrar que $f\\ge g$, estude $h=f-g$: determine o seu mínimo, ou mostre que $h(a)=0$ e $h'\\ge0$ para $x\\ge a$. Desigualdade entre as médias: a média aritmética de números positivos é pelo menos a sua média geométrica, com igualdade quando são todos iguais. Sob uma restrição simétrica, o valor extremo ocorre muitas vezes no ponto simétrico; multiplicadores de Lagrange ou uma substituição confirmam-no. A convexidade e as retas tangentes dão estimativas rápidas.\n\n**Exemplo.** $\\ln x\\le x-1$ para $x>0$: $h(x)=x-1-\\ln x$ tem $h'(x)=1-\\frac1x$, logo o seu mínimo é $h(1)=0$."}},{"k":"functional","n":"Functional equations","d":"Equations where the unknown is a whole function.","b":"**What it is.** Equations like $f(x+y)=f(x)+f(y)$ where you must find every function that works.\n\n**How to use it.** Plug in special values ($x=0$, $y=0$, $y=x$, $y=-x$) to learn $f(0)$ and symmetries. Look for fixed points $f(a)=a$. Test simple candidates (linear, $\\frac1x$, constants). With calculus, differentiate the equation or compute $f'$ from the limit definition to get a differential equation. Use any limit, continuity or monotonicity condition; it's there for a reason. Always check answers in the original equation.\n\n**Example.** If $f$ is differentiable, $f(x+y)=f(x)f(y)$ and $f'(0)=k$, then $f'(x)=f(x)f'(0)$, so $f(x)=e^{kx}$.","pt":{"n":"Equações funcionais","d":"Equações em que a incógnita é uma função.","b":"**O que é.** Equações como $f(x+y)=f(x)+f(y)$, em que é preciso encontrar todas as funções que as satisfazem.\n\n**Como usar.** Substitua valores especiais ($x=0$, $y=0$, $y=x$, $y=-x$) para descobrir $f(0)$ e simetrias. Procure pontos fixos $f(a)=a$. Teste candidatos simples (afins, $\\frac1x$, constantes). Com cálculo, derive a equação ou calcule $f'$ pela definição para obter uma equação diferencial. Use qualquer condição de limite, continuidade ou monotonia; está lá por alguma razão. Verifique sempre as respostas na equação original.\n\n**Exemplo.** Se $f$ é diferenciável, $f(x+y)=f(x)f(y)$ e $f'(0)=k$, então $f'(x)=f(x)f'(0)$, logo $f(x)=e^{kx}$."}}],"legacy":{"1":"sine-ratio","2":"conjugate-pair","3":"count-the-flats","4":"lens","5":"limit-as-slope","6":"root-minus-line","7":"two-waves","8":"under-the-arch","9":"cosine-gap","10":"mean-value-point","11":"ten-powers","12":"bend-point","13":"cubic-valley","14":"inflating-balloon","15":"log-over-x","16":"odd-one-out","17":"peak-of-decay","18":"average-arch","19":"compound-growth","20":"folding-box","21":"gaussian-bump","22":"staircase","23":"telescope","24":"implicit-slope","25":"second-contact","26":"second-look","27":"square-of-sine","28":"three-crossings","29":"tiny-tower","30":"base-swap","31":"chain-through-an-integral","32":"inverse-slope","33":"ninety-ninth-derivative","34":"riemann-squares","35":"self-power-slope","36":"sliding-ladder","37":"smooth-seam","38":"tangent-through-the-origin","39":"weighted-product","40":"ellipse-rectangle","41":"exponential-meets-parabola","42":"shadow-runner","43":"closest-to-the-parabola","44":"tan-minus-sin","45":"lowest-self-power","46":"huge-power","47":"disguised-linear-system","48":"median-minimizer","49":"odometer","50":"squared-times-cubed","51":"tangent-ceiling","52":"three-root-window","53":"weighted-am-gm","54":"bell-rectangle","55":"binomial-derivative","56":"cosine-power","57":"cube-root-asymptote","58":"cylinder-in-a-cone","59":"doubling-curve","60":"half-disc-in-disguise","61":"harmonic-window","62":"one-bump","63":"sine-minus-tangent","64":"swapped-powers","65":"symmetric-semicircle","66":"two-square-roots","67":"additive-plus","68":"arctan-riemann-sum","69":"floor-of-a-square","70":"gap-to-the-line","71":"log-tangent","72":"log-vs-root","73":"power-meets-square","74":"self-referential-integral","75":"seven-crossings","76":"tangent-region","77":"triangle-in-a-circle","78":"balanced-reciprocals","79":"binomial-integral","80":"cone-in-a-sphere","81":"log-swap","82":"root-integral-ratio","83":"the-irrational-exponent","84":"three-tangents","85":"average-near-zero","86":"corner-rod","87":"moving-window","88":"reciprocal-swap","89":"sinc-to-the-power","90":"kings-arctangent","91":"log-of-one-plus-tangent","92":"sine-product-peak","93":"factorial-r const BY_SLUG = new Map(PROBS.map(p => [p.s, p]));

const LEGACY = DATA.legacy || {};
const DIFFS = ["easy", "medium", "hard", "imo"];

/* ============================== language ============================== */
/* English is the default. Portuguese follows the course's conventions: sen, tg, arctg, sh/ch/th, argsh, log, ]a,b[ and decimal commas. */
const LANG_KEY = "limcollege:lang";

function filtered() {
  const q = UI.q.trim().toLowerCase();
  const list = PROBS.filter(p => {
    const st = statusOf(p);
    return (!UI.diff.length || UI.diff.includes(p.d)) &&
      (UI.set === "all" || p.g === UI.set) &&
      (UI.concept === "all" || p.c.includes(UI.concept)) &&
      (UI.status === "all" || (UI.status === "unsolved" && st !== "solved") || UI.status === st) &&
      (!q || ptitle(p).toLowerCase().includes(q) || String(p.n) === q.replace("#", "").replace(/^0+/, "") || p.c.some(k => conceptName(k).toLowerCase().includes(q)) || srcL(p.src || "").toLowerCase().includes(q));
  });
  const di = d => DIFFS.indexOf(d);
  const sorters = {
    "diff-asc": (a, b) => di(a.d) - di(b.d) || a.r - b.r || a.n - b.n,
    "diff-desc": (a, b) => di(b.d) - di(a.d) || b.r - a.r || a.n - b.n,
    "rating-asc": (a, b) => a.r - b.r || a.n - b.n,
    "rating-desc": (a, b) => b.r - a.r || a.n - b.n,
    "title": (a, b) => ptitle(a).localeCompare(ptitle(b), LOCALE())
  };
  return list.sort(sorters[UI.sort] || sorters["diff-asc"]);
}

    location.hash = "p-" + pool[Math.floor(Math.random() * pool.length)].s;

}

    <div class="ccard-body">${fmtText(C_(c, "b"))}</div></section>`;
}
function renderProblem(slug) {
  const p = BY_SLUG.get(slug);
  if (!p) { app.innerHTML = `<div class="empty">${L("That problem doesn't exist.", "Esse problema não existe.")} <a href="#problems">${L("Back to problems", "Voltar aos problemas")}</a></div>`; return; }
  /* first encounter of each concept: remember where it was introduced so the card stays open on this problem */
  let firstTime = false;
  p.c.forEach(k => { if (!S.seen[k]) { S.seen[k] = p.s; firstTime = true; } });
  if (firstTime) save();
  const newOnes = p.c.filter(k => S.seen[k] === p.s);
  const ps = peekProg(p.s);
  const locked = isLocked(ps), rated = isRated(ps);
  const st = stakes(p);
  let list = filtered();
  if (!list.some(x => x.s === p.s)) list = PROBS;
  const idx = list.findIndex(x => x.s === p.s);
  const prev = idx > 0 ? list[idx - 1] : null, next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;
  const showSol = ps && (ps.solved || ps.closed);
  const res = lastResult && lastResult.s === p.s ? lastResult : null;
  const promo = res && res.promo ? `<div class="promo" style="color:${tierColor(res.promo.t)}">${emblem(res.promo.t)}<div><div class="eyebrow" style="color:inherit">${res.promo.up ? L("Promoted", "Promovido") : L("Demoted", "Despromovido")}</div><b>${esc(rankOf(res.promo.r).label)}</b></div></div>` : "";

function trCheck(idk) {
  if (TR.phase !== "ask") return;
  clearTimeout(trTm);
  const inp = document.getElementById("trIn"), pre = document.getElementById("trPre");
  const raw = idk ? "" : inp.value.trim();
  let ast = null, verdict = { ok: false, note: "" };
  if (!idk) {
    if (!raw) { pre.className = "preview err"; pre.textContent = L("Type the derivative first, or press I don't know.", "Escreva primeiro a derivada, ou carregue em Não sei."); return; }
    try { ast = trParse(raw); } catch (e) { pre.className = "preview err"; pre.textContent = L("Can't read that: ", "Não consigo ler isso: ") + e.message; return; }
    verdict = trJudge(ast, TR.q);
  }
  const T = trState(), k = TR.q.r, before = trStatus(k);
  const r = T.r[k] || (T.r[k] = { c: 0, w: 0, h: "" });
  if (verdict.ok) { r.c++; T.c++; T.streak++; if (T.streak > T.best) T.best = T.streak; TR.sess.c++; }
  else { r.w++; T.streak = 0; }
  r.h = (String(r.h || "") + (verdict.ok ? "1" : "0")).slice(-10);
  T.n++; TR.sess.n++;
  save();
  TR.phase = "done"; TR.input = raw;
  TR.res = { ok: verdict.ok, idk, note: verdict.note, tex: ast ? trTex(ast) : "" };
  const after = trStatus(k);
  if (after === "mastered" && before !== "mastered") toast(L(`Mastered: ${trName(TR_BY.get(k))}`, `Dominada: ${trName(TR_BY.get(k))}`));
  drawDrill(false); drawStats(); drawRules();
}

        ? m.map(r => { const k = rankOf(r.rating); return `<a class="ps-item" role="option" aria-selected="false" href="#u-${esc(r.handle)}">${avatarImg(r, 28)}<span class="nm">@${esc(rowName(r))}<small>${esc(subline(r) || L("No school listed", "Sem escola indicada"))}</small></span><span class="rp num">${emblem(k.t)}<span style="color:${tierColor(k.t)}">${r.rating}</span></span></a>`; }).join("") + `<a class="ps-item ps-all" role="option" aria-selected="false" href="#board" data-all="1">${L("All matches on the leaderboard →", "Todos os resultados na classificação →")}</a>`
        : `<div class="ps-empty">${L(`No players match “${esc(q.trim())}”.`, `Nenhum jogador corresponde a “${esc(q.trim())}”.`)}</div>`;
    }
    pop.innerHTML = html; pop.hidden = false; inp.setAttribute("aria-expanded", "true");
    psSel = Math.min(psSel, items().length - 1); mark();
    hydrateAvatars(pop);
    psRedraw = draw;
  };
  inp.addEventListener("input", () => { psSel = -1; draw(); });
  inp.addEventListener("focus", () => { if (inp.value.trim()) draw(); });
  inp.addEventListener("keydown", e => {
    const list = items();
    if (e.key === "ArrowDown" && list.length) { e.preventDefault(); psSel = (psSel + 1) % list.length; mark(); }
    else if (e.key === "ArrowUp" && list.length) { e.preventDefault(); psSel = (psSel - 1 + list.length) % list.length; mark(); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (psSel >= 0 && list[psSel]) list[psSel].click();
      else if (inp.value.trim()) { boardQ = inp.value.trim(); close(); inp.value = ""; if (current === "board") renderBoard(); else location.hash = "board"; }
    }
    else if (e.key === "Escape") { close(); inp.blur(); }
  });
  pop.addEventListener("click", e => {
    const a = e.target.closest("a.ps-item"); if (!a) return;
    if (a.dataset.all) { boardQ = inp.value.trim(); if (current === "board") { e.preventDefault(); renderBoard(); } }
    close(); inp.value = "";
  });
  document.addEventListener("click", e => { if (!wrap.contains(e.target)) close(); });
  window.addEventListener("hashchange", close);
}

const TAKEN = v => L(`@${v} is taken. Try another.`, `@${v} já está a ser usado. Experimente outro.`);
function fileToAvatar(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error(L("Pick an image file (JPG, PNG, WebP or GIF).", "Escolha um ficheiro de imagem (JPG, PNG, WebP ou GIF).")));
    if (file.size > 20 * 1024 * 1024) return reject(new Error(L("That image is over 20 MB. Try a smaller one.", "Essa imagem tem mais de 20 MB. Experimente uma mais pequena.")));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas");
      c.width = c.height = 192;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#151a20"; ctx.fillRect(0, 0, 192, 192);
      ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 192, 192);
      URL.revokeObjectURL(url);
      let q = 0.86, d = c.toDataURL("image/jpeg", q);
      while (d.length > 60000 && q > 0.4) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
      validImg(d) ? resolve(d) : reject(new Error(L("Couldn't process that image.", "Não foi possível processar essa imagem.")));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(L("Couldn't read that image. Try a JPG or PNG.", "Não foi possível ler essa imagem. Experimente um JPG ou PNG."))); };
    img.src = url;
  });
}

    setHelp("avHelp", L("Processing…", "A processar…"));
    try { draftAvatar = await fileToAvatar(f); $("avPrev").src = draftAvatar; setHelp("avHelp", L("Looks good. Save to publish it.", "Está bom. Guarde para a publicar."), "ok"); }
    catch (err) { setHelp("avHelp", err.message, "err"); }
  });
  $("avRm").addEventListener("click", () => { draftAvatar = ""; $("avPrev").src = defaultAvatar($("fUser").value.trim() || "?"); setHelp("avHelp", L("Picture removed. Save to apply.", "Fotografia removida. Guarde para aplicar."), ""); });
  $("pf").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("pfSave");
    const username = $("fUser").value.trim();
    let ok = true;
    if (!HANDLE_RE.test(username)) { setHelp("hUser", BAD_HANDLE(), "err"); ok = false; }
    const socials = {};
    SOCIALS.forEach(s => {
      const n = normalizeSocial(s.k, $("fs_" + s.k).value);
      if (n.err) { setHelp("hs_" + s.k, n.err, "err"); ok = false; }
      else { setHelp("hs_" + s.k, ""); if (n.v) socials[s.k] = n.v; }
    });
    if (!ok) { const bad = app.querySelector(".help.err"); if (bad && bad.scrollIntoView) bad.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    btn.disabled = true; btn.textContent = L("Saving…", "A guardar…");
    if (cloud.db && cloud.uid && await cloud.handleTaken(username.toLowerCase())) {
      setHelp("hUser", TAKEN(username), "err");
      btn.disabled = false; btn.textContent = L("Save profile", "Guardar perfil"); $("fUser").focus(); return;
    }
    const year = $("fYear").value;
    const avatarChanged = draftAvatar !== (S.profile.avatar || "");
    S.profile = {
      username, bio: $("fBio").value.trim().slice(0, 160), school: $("fSchool").value.trim().slice(0, 80),
      year: YEARS.includes(year) ? year : "", socials, avatar: draftAvatar,
      avatarV: avatarChanged ? Date.now() : (S.profile.avatarV || 0)
    };
    if (avatarChanged) cloud.avDirty = true;
    S.updated = Date.now();
    if (!S.joined) S.joined = S.updated;
    lsSet(LS_KEY, S);
    let msg = L("Profile saved.", "Perfil guardado.");
    if (cloud.db && cloud.uid) {
      clearTimeout(cloud.timer);
      await cloud.flush();
      if (cloud.lastError === "handle_taken") {
        setHelp("hUser", L(`@${username} was just taken. Try another.`, `@${username} acabou de ser escolhido por outra pessoa. Experimente outro.`), "err");
        btn.disabled = false; btn.textContent = L("Save profile", "Guardar perfil"); $("fUser").focus(); return;
      }
      if (cloud.canWrite === false) msg = L("Saved on this device. Your access is view-only, so others can't see it yet.", "Guardado neste dispositivo. O seu acesso é só de leitura, por isso os outros ainda não o veem.");
    } else msg = cloud.kind === "supabase" ? L("Profile saved on this device. Sign in to publish it.", "Perfil guardado neste dispositivo. Inicie sessão para o publicar.") : L("Profile saved on this device.", "Perfil guardado neste dispositivo.");
    toast(msg);
    location.hash = "me";
  });
}

/* ============================== accounts (Supabase) ============================== */
let authMode = "signin";
const PW_SHORT = () => L("Passwords need at least 6 characters.", "A palavra-passe precisa de pelo menos 6 caracteres.");
function renderLogin() {
  const head = `<div class="ph"><div><div class="eyebrow">${L("Account", "Conta")}</div><h1>${cloud.uid ? L("Your account", "A sua conta") : authMode === "signup" ? L("Create an account", "Criar conta") : L("Sign in", "Iniciar sessão")}</h1></div></div>`;
  if (cloud.connecting) { app.innerHTML = `${head}<div class="empty">${L("Connecting…", "A ligar…")}</div>`; return; }
  if (cloud.kind !== "supabase") { app.innerHTML = `${head}<section class="section" style="margin-top:20px"><div class="panel prose"><p>${L("Accounts aren't available on this copy of the site. Your progress is saved in this browser.", "As contas não estão disponíveis nesta cópia do site. O seu progresso fica guardado neste navegador.")}</p></div></section>`; return; }
  if (cloud.uid) {
    app.innerHTML = `${head}
    <section class="section" style="margin-top:20px"><div class="panel auth-panel">
      <p>${L("Signed in as", "Sessão iniciada como")} <strong>${esc(cloud.email || L("your account", "a sua conta"))}</strong>. ${L("Your progress syncs across devices and your profile is on the leaderboard.", "O seu progresso é sincronizado entre dispositivos e o seu perfil está na classificação.")}</p>
      <div class="actions"><a class="btn primary" href="#me">${L("Go to your profile", "Ir para o seu perfil")}</a><a class="btn" href="#reset">${L("Change password", "Alterar palavra-passe")}</a><button class="btn danger" type="button" id="signOut">${L("Sign out", "Terminar sessão")}</button></div>
    </div></section>`;
    document.getElementById("signOut").addEventListener("click", signOut);
    return;
  }
  const notice = authNotice; authNotice = "";
  app.innerHTML = `${head}
  <section class="section" style="margin-top:20px"><div class="panel auth-panel">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tab" data-m="signin" aria-selected="${authMode === "signin"}">${L("Sign in", "Iniciar sessão")}</button>
      <button type="button" role="tab" class="tab" data-m="signup" aria-selected="${authMode === "signup"}">${L("Create account", "Criar conta")}</button>
    </div>
    <p class="muted" style="font-size:var(--t-sm)">${authMode === "signup" ? L("Your rating, solves and profile sync across devices, and you appear on the leaderboard. Progress you've made in this browser comes with you.", "O seu rating, os problemas resolvidos e o perfil ficam sincronizados entre dispositivos, e passa a aparecer na classificação. O progresso que fez neste navegador vem consigo.") : L("Welcome back. Progress you've made in this browser while signed out is kept if this account has none yet.", "Bem-vindo de volta. O progresso feito neste navegador sem sessão iniciada é mantido se esta conta ainda não tiver nenhum.")}</p>
    <form class="form" id="af2" novalidate style="margin-top:0">
      <div class="field"><label for="aEmail">Email</label><input id="aEmail" class="inp" type="email" autocomplete="email" spellcheck="false" required></div>
      <div class="field"><label for="aPass">${L("Password", "Palavra-passe")}</label><input id="aPass" class="inp" type="password" autocomplete="${authMode === "signup" ? "new-password" : "current-password"}" minlength="6" required>
        <span class="help">${authMode === "signup" ? L("At least 6 characters.", "Pelo menos 6 caracteres.") : `<button type="button" class="linkbtn" id="forgot">${L("Forgot your password?", "Esqueceu-se da palavra-passe?")}</button>`}</span></div>
      <div class="actions"><button class="btn primary" type="submit" id="aGo">${authMode === "signup" ? L("Create account", "Criar conta") : L("Sign in", "Iniciar sessão")}</button></div>
      <div class="result info" id="aMsg" ${notice ? "" : "hidden"} role="status">${esc(notice)}</div>
    </form>
  </div></section>`;
  const $ = id => document.getElementById(id);
  const say = (msg, kind = "info") => { const el = $("aMsg"); el.hidden = false; el.className = "result " + kind; el.textContent = msg; };
  app.querySelectorAll(".tab[data-m]").forEach(b => b.addEventListener("click", () => { authMode = b.dataset.m; renderLogin(); }));
  const f = $("forgot");
  if (f) f.addEventListener("click", async () => {
    const email = $("aEmail").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { say(L("Type your email above first, then click this again.", "Escreva primeiro o seu email acima e depois clique aqui outra vez."), "bad"); $("aEmail").focus(); return; }
    const { error } = await supaDriver.resetPassword(email);
    say(error ? (/rate limit|too many/i.test(error.message || "") ? L("We can't send reset emails right now (too many this hour). Please try again later.", "De momento não conseguimos enviar emails de recuperação (demasiados nesta hora). Tente mais tarde.") : error.message) : L(`If an account exists for ${email}, a reset link is on its way.`, `Se existir uma conta para ${email}, vai receber um link de recuperação.`), error ? "bad" : "info");
  });
  $("af2").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("aEmail").value.trim(), password = $("aPass").value;
    if (!/^\S+@\S+\.\S+$/.test(email)) { say(L("Enter a valid email address.", "Introduza um endereço de email válido."), "bad"); return; }
    if (password.length < 6) { say(PW_SHORT(), "bad"); return; }
    const btn = $("aGo"); btn.disabled = true; btn.textContent = authMode === "signup" ? L("Creating…", "A criar…") : L("Signing in…", "A entrar…");
    let res;
    try { res = authMode === "signup" ? await supaDriver.signUp(email, password) : await supaDriver.signIn(email, password); }
    catch (err) { res = { error: err }; }
    btn.disabled = false; btn.textContent = authMode === "signup" ? L("Create account", "Criar conta") : L("Sign in", "Iniciar sessão");
    if (res.error) {
      const m = String(res.error.message || "");
      say(/email rate limit/i.test(m) ? L("We can't send confirmation emails right now (too many sign-ups this hour). Please try again later.", "De momento não conseguimos enviar emails de confirmação (demasiados registos nesta hora). Tente mais tarde.")
        : /rate limit|too many/i.test(m) ? L("Too many attempts. Wait a few minutes and try again.", "Demasiadas tentativas. Espere alguns minutos e tente de novo.")
        : /invalid login/i.test(m) ? L("Wrong email or password.", "Email ou palavra-passe errados.")
        : /not confirmed/i.test(m) ? L("Confirm your email first: open the link we sent you, then sign in.", "Confirme primeiro o seu email: abra o link que lhe enviámos e depois inicie sessão.")
        : /already registered/i.test(m) ? L("That email already has an account. Sign in instead.", "Esse email já tem conta. Inicie sessão.")
        : m || L("Something went wrong. Try again.", "Algo correu mal. Tente de novo."), "bad");
      return;
    }
    if (authMode === "signup" && !(res.data && res.data.session)) { say(L(`Almost there: we sent a confirmation link to ${email}. Open it, then sign in.`, `Quase lá: enviámos um link de confirmação para ${email}. Abra-o e depois inicie sessão.`), "ok"); authMode = "signin"; return; }
    await cloud.setUser(res.data.session.user);
    toast(authMode === "signup" ? L("Account created. Welcome to the ladder.", "Conta criada. Bem-vindo à escada.") : L("Signed in.", "Sessão iniciada."));
    location.hash = "me";
  });
}
function renderReset() {
  const head = `<div class="ph"><div><div class="eyebrow">${L("Account", "Conta")}</div><h1>${L("Set a new password", "Definir nova palavra-passe")}</h1></div></div>`;
  if (cloud.connecting) { app.innerHTML = `${head}<div class="empty">${L("Connecting…", "A ligar…")}</div>`; return; }
  if (cloud.kind !== "supabase" || !cloud.uid) { app.innerHTML = `${head}<div class="empty">${L(`Open the reset link from your email, or <a href="#login">sign in</a> first.`, `Abra o link de recuperação do seu email, ou <a href="#login">inicie sessão</a> primeiro.`)}</div>`; return; }
  app.innerHTML = `${head}
  <section class="section" style="margin-top:20px"><div class="panel auth-panel">
    <form class="form" id="rf" novalidate style="margin-top:0">
      <div class="field"><label for="rPass">${L("New password", "Nova palavra-passe")}</label><input id="rPass" class="inp" type="password" autocomplete="new-password" minlength="6" required><span class="help">${L("At least 6 characters.", "Pelo menos 6 caracteres.")}</span></div>
      <div class="actions"><button class="btn primary" type="submit" id="rGo">${L("Save password", "Guardar palavra-passe")}</button></div>
      <div class="result bad" id="rMsg" hidden role="status"></div>
    </form>
  </div></section>`;
  document.getElementById("rf").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = document.getElementById("rPass").value, msg = document.getElementById("rMsg");
    if (pw.length < 6) { msg.hidden = false; msg.textContent = PW_SHORT(); return; }
    const { error } = await supaDriver.updatePassword(pw);
    if (error) { msg.hidden = false; msg.textContent = error.message; return; }
    cloud.recovery = false; toast(L("Password updated.", "Palavra-passe atualizada.")); location.hash = "me";
  });
}
async function signOut() {
  clearTimeout(cloud.timer);
  await cloud.flush();
  try { await supaDriver.signOut(); } catch {}
  await cloud.setUser(null);
  toast(L("Signed out. Your progress is saved in your account.", "Sessão terminada. O seu progresso está guardado na sua conta."));
  location.hash = "home";
}
const signInLink = text => `<a href="#login">${esc(text)}</a>`;

/* ============================== router ============================== */
let current = "home", redrawChart = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  clearMath();
  redrawChart = null;
  const prevCurrent = current;
  if (DIFFS.includes(h)) { UI.diff = [h]; lsSet(UI_KEY, UI); current = "problems"; renderProblems(); }
  else if (h === "university") { UI.set = "university"; UI.diff = []; UI.concept = "all"; UI.sort = "diff-asc"; lsSet(UI_KEY, UI); current = "problems"; renderProblems(); }
  else if (h === "problems") { current = "problems"; renderProblems(); }
  else if (/^p-[a-z0-9-]+$/.test(h)) {
    const raw = h.slice(2), slug = /^\d+$/.test(raw) ? (LEGACY[raw] || raw) : raw;
    if (current !== "p-" + slug) { lastResult = null; confirmReveal = false; openRefs = new Set(); }
    current = "p-" + slug; renderProblem(slug);
  }
  else if (h === "learn") { current = "learn"; renderLearn(); }
  else if (h === "train") { current = "train"; renderTrain(); }
  else if (/^c-[a-z-]+$/.test(h) && CBY.has(h.slice(2))) { current = h; renderConcept(h.slice(2)); }
  else if (h === "ranks") { current = "ranks"; renderRanks(); }
  else if (h === "board") { current = "board"; renderBoard(); }
  else if (h === "me") { current = "me"; renderProfile(null); }
  else if (h === "edit") { current = "edit"; renderEdit(); }
  else if (h === "login") { authMode = "signin"; current = "login"; renderLogin(); }
  else if (h === "signup") { authMode = "signup"; current = "login"; renderLogin(); }
  else if (h === "reset") { current = "reset"; renderReset(); }
  else if (/^u-[a-z0-9_.-]{3,20}$/i.test(h)) { const hd = h.slice(2).toLowerCase(); current = "u-" + hd; renderProfile(hd); }
  else { current = "home"; renderHome(); }
  renderNav();
  if (prevCurrent !== current) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
let rz = 0;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (redrawChart) redrawChart(); }, 150); });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const v = b.dataset.copy;
  try { navigator.clipboard.writeText(v).then(() => toast(L("Copied ", "Copiado: ") + v), () => toast("Discord: " + v)); } catch { toast("Discord: " + v); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && current === "problems" && document.activeElement?.id !== "q") { e.preventDefault(); document.getElementById("q")?.focus(); }
  if (e.key === "Enter" && current === "train" && TR.phase === "done" && !e.target.closest("button, a, input, textarea, select")) { e.preventDefault(); trPick(); drawDrill(true); }
});

applyStatic();
setupPlayerSearch();
route();
cloud.init();
})();
</script>
