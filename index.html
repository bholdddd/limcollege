rac{1}{2\\pi}\\approx0.159$ cm/s."}},{"s":"fixed-point-of-h","t":"Fixed Point of H","d":"medium","r":1250,"c":["continuity","roots","hyperbolic"],"q":"Let $H(x)=1+\\dfrac{\\sin x}{x}$ for $x>0$ and $H(x)=2+3\\tanh x$ for $x\\le0$. $H$ has exactly one fixed point ($H(x)=x$). Find it to at least four significant figures.","k":"ODQ1MjI2MDY4MjU0NTcxNi4x","at":"x\\approx1.61755","h":"Rule out $x\\le0$ first: there $H(x)>-1$, and compare with $x$. Then apply the Intermediate Value Theorem to $H(x)-x$ on $[1,2]$.","x":"For $x\\le0$, $H(x)-x=2+3\\tanh x-x$ stays positive: its minimum, at $x=-\\operatorname{arcosh}\\sqrt3\\approx-1.15$, is about $0.70$. So there is no fixed point there. For $x>0$, $k(x)=1+\\frac{\\sin x}x-x$ is decreasing on $(0,\\pi)$ (because $x\\cos x-\\sin x<0$ there), positive at $1$, negative at $2$, and for $x\\ge2$ it is at most $1+\\frac12-2<0$. So there is exactly one root: $x\\approx1.61755$.","g":"university","ask":"Enter the fixed point to at least four significant figures.","pt":{"t":"Ponto Fixo de H","q":"Seja $H(x)=1+\\dfrac{\\sin x}{x}$ para $x>0$ e $H(x)=2+3\\tanh x$ para $x\\le0$. $H$ tem exatamente um ponto fixo ($H(x)=x$). Determine-o com pelo menos quatro algarismos significativos.","h":"Exclua primeiro $x\\le0$: aí $H(x)>-1$; compare com $x$. Depois aplique o Teorema de Bolzano a $H(x)-x$ em $[1,2]$.","x":"Para $x\\le0$, $H(x)-x=2+3\\tanh x-x$ é sempre positiva: o seu mínimo, em $x=-\\operatorname{arcosh}\\sqrt3\\approx-1.15$, vale cerca de $0.70$. Logo não há aí ponto fixo. Para $x>0$, $k(x)=1+\\frac{\\sin x}x-x$ é decrescente em $\\mathopen{]}0,\\pi\\mathclose{[}$ (porque aí $x\\cos x-\\sin x<0$), positiva em $1$, negativa em $2$, e para $x\\ge2$ é no máximo $1+\\frac12-2<0$. Logo há exatamente uma raiz: $x\\approx1.61755$.","ask":"Introduza o ponto fixo com pelo menos quatro algarismos significativos."}},{"s":"geometric-mean-limit","t":"Geometric Mean Limit","d":"medium","r":1250,"c":["lhopital","exp-log"],"q":"Find $a>0$ such that $$\\lim_{x\\to0}\\left(\\frac{a^x+9^x}{2}\\right)^{1/x}=6.$$","k":"MC40","at":"4","h":"Take logs and apply L'Hôpital's rule at $x=0$.","x":"$\\frac1x\\ln\\frac{a^x+9^x}{2}\\to\\frac{\\ln a+\\ln9}{2}$, so the limit is $\\sqrt{9a}$. Setting $\\sqrt{9a}=6$ gives $a=4$.","g":"university","pt":{"t":"Limite da Média Geométrica","q":"Determine $a>0$ tal que $$\\lim_{x\\to0}\\left(\\frac{a^x+9^x}{2}\\right)^{1/x}=6.$$","h":"Aplique logaritmos e a Regra de Cauchy em $x=0$.","x":"$\\frac1x\\ln\\frac{a^x+9^x}{2}\\to\\frac{\\ln a+\\ln9}{2}$, logo o limite é $\\sqrt{9a}$. Fazendo $\\sqrt{9a}=6$ obtém-se $a=4$."}},{"s":"half-disc-in-disguise","t":"Half Disc in Disguise","d":"medium","r":1250,"c":["integrals","areas-volumes"],"q":"Evaluate $$\\int_0^1\\sqrt{x(1-x)}\\,dx.$$","k":"NDE0Mjc4OTYxODA5OTYyOTMuMA==","at":"\\tfrac{\\pi}{8}","h":"What curve is $y=\\sqrt{x(1-x)}$?","x":"$y^2+\\left(x-\\frac12\\right)^2=\\frac14$: the graph is the upper half of a circle of radius $\\frac12$. The area is $\\frac12\\pi\\left(\\frac12\\right)^2=\\frac\\pi8\\approx0.3927$.","g":"original","pt":{"t":"Semicírculo Disfarçado","q":"Calcule $$\\int_0^1\\sqrt{x(1-x)}\\,dx.$$","h":"Que curva é $y=\\sqrt{x(1-x)}$?","x":"$y^2+\\left(x-\\frac12\\right)^2=\\frac14$: o gráfico é a metade superior de uma circunferência de raio $\\frac12$. A área é $\\frac12\\pi\\left(\\frac12\\right)^2=\\frac\\pi8\\approx0.3927$."}},{"s":"half-angle-arcs","t":"Half-Angle Arcs","d":"medium","r":1250,"c":["inverse-trig","trig"],"q":"Compute $$\\sin^2\\!\\left(\\tfrac12\\arccos\\tfrac13\\right)-\\cos^2\\!\\left(\\tfrac12\\arcsin\\tfrac{2\\sqrt2}{3}\\right).$$","k":"MzMzMzMzMzMzMzMzMzMzMy4wLQ==","at":"-\\tfrac13","h":"$\\sin^2\\frac\\theta2=\\frac{1-\\cos\\theta}{2}$ and $\\cos^2\\frac\\theta2=\\frac{1+\\cos\\theta}{2}$. You need $\\cos\\left(\\arcsin\\frac{2\\sqrt2}{3}\\right)$.","x":"The first term is $\\frac{1-1/3}{2}=\\frac13$. For the second, $\\cos\\left(\\arcsin\\frac{2\\sqrt2}3\\right)=\\sqrt{1-\\frac89}=\\frac13$ (positive, since $\\arcsin$ lands in $[-\\frac\\pi2,\\frac\\pi2]$), so it is $\\frac{1+1/3}{2}=\\frac23$. Difference: $-\\frac13$.","g":"university","pt":{"t":"Arcos de Meio Ângulo","q":"Calcule $$\\sin^2\\!\\left(\\tfrac12\\arccos\\tfrac13\\right)-\\cos^2\\!\\left(\\tfrac12\\arcsin\\tfrac{2\\sqrt2}{3}\\right).$$","h":"$\\sin^2\\frac\\theta2=\\frac{1-\\cos\\theta}{2}$ e $\\cos^2\\frac\\theta2=\\frac{1+\\cos\\theta}{2}$. Precisa de $\\cos\\left(\\arcsin\\frac{2\\sqrt2}{3}\\right)$.","x":"A primeira parcela é $\\frac{1-1/3}{2}=\\frac13$. Para a segunda, $\\cos\\left(\\arcsin\\frac{2\\sqrt2}3\\right)=\\sqrt{1-\\frac89}=\\frac13$ (positivo, porque $\\arcsin$ toma valores em $[-\\frac\\pi2,\\frac\\pi2]$), logo vale $\\frac{1+1/3}{2}=\\frac23$. Diferença: $-\\frac13$."}},{"s":"halving-invariance","t":"Halving Invariance","d":"medium","r":1250,"c":["continuity","functional","seq-limits"],"q":"$f:\\mathbb R\\to\\mathbb R$ is continuous at $0$, $f(2x)=f(x)$ for every $x$, and $f(1)=5$. Find $f(7)$.","k":"MC41","at":"5","h":"$f(x)=f\\left(\\frac x2\\right)=f\\left(\\frac x4\\right)=\\cdots$. Let $n\\to\\infty$.","x":"$f(x)=f\\left(\\frac{x}{2^n}\\right)$ for every $n$, and $\\frac x{2^n}\\to0$, so continuity at $0$ gives $f(x)=f(0)$. $f$ is constant, equal to $f(1)=5$. So $f(7)=5$.","g":"university","pt":{"t":"Invariância por Metades","q":"$f:\\mathbb R\\to\\mathbb R$ é contínua em $0$, $f(2x)=f(x)$ para todo o $x$, e $f(1)=5$. Determine $f(7)$.","h":"$f(x)=f\\left(\\frac x2\\right)=f\\left(\\frac x4\\right)=\\cdots$. Faça $n\\to\\infty$.","x":"$f(x)=f\\left(\\frac{x}{2^n}\\right)$ para todo o $n$, e $\\frac x{2^n}\\to0$, logo a continuidade em $0$ dá $f(x)=f(0)$. $f$ é constante, igual a $f(1)=5$. Logo $f(7)=5$."}},{"s":"harmonic-window","t":"Harmonic Window","d":"medium","r":1250,"c":["riemann","exp-log"],"q":"Evaluate $$\\lim_{n\\to\\infty}\\left(\\frac{1}{n+1}+\\frac{1}{n+2}+\\cdots+\\frac{1}{2n}\\right).$$","k":"MzU0OTk1NTA4MTc0MTM5Ni4w","at":"\\ln2","h":"Rewrite each term as $\\frac1n\\cdot\\frac{1}{1+k/n}$.","x":"It is a Riemann sum for $\\int_0^1\\frac{dx}{1+x}=\\ln2\\approx0.6931$.","g":"original","pt":{"t":"Janela Harmónica","q":"Calcule $$\\lim_{n\\to\\infty}\\left(\\frac{1}{n+1}+\\frac{1}{n+2}+\\cdots+\\frac{1}{2n}\\right).$$","h":"Reescreva cada parcela como $\\frac1n\\cdot\\frac{1}{1+k/n}$.","x":"É uma soma de Riemann de $\\int_0^1\\frac{dx}{1+x}=\\ln2\\approx0.6931$."}},{"s":"log-at-zero","t":"Log at Zero","d":"medium","r":1250,"c":["improper","exp-log"],"q":"Evaluate the improper integral $$\\int_0^1\\ln x\\,dx.$$","k":"MC4xLQ==","at":"-1","h":"Use the antiderivative $x\\ln x-x$ and the limit $x\\ln x\\to0$ as $x\\to0^+$.","x":"$\\int_\\varepsilon^1\\ln x\\,dx=(0-1)-(\\varepsilon\\ln\\varepsilon-\\varepsilon)\\to-1$.","g":"original","pt":{"t":"Logaritmo em Zero","q":"Calcule o integral impróprio $$\\int_0^1\\ln x\\,dx.$$","h":"Use a primitiva $x\\ln x-x$ e o limite $x\\ln x\\to0$ quando $x\\to0^+$.","x":"$\\int_\\varepsilon^1\\ln x\\,dx=(0-1)-(\\varepsilon\\ln\\varepsilon-\\varepsilon)\\to-1$."}},{"s":"log-log-exponent","t":"Log-Log Exponent","d":"medium","r":1250,"c":["lhopital","exp-log"],"q":"Evaluate $\\displaystyle\\lim_{x\\to1^+}x^{\\ln(\\ln x)}$.","k":"MC4x","at":"1","h":"$x^{\\ln\\ln x}=e^{\\ln x\\cdot\\ln\\ln x}$. Substitute $t=\\ln x\\to0^+$.","x":"The exponent is $t\\ln t\\to0$, so the limit is $e^0=1$.","g":"university","pt":{"t":"Expoente Log-Log","q":"Calcule $\\displaystyle\\lim_{x\\to1^+}x^{\\ln(\\ln x)}$.","h":"$x^{\\ln\\ln x}=e^{\\ln x\\cdot\\ln\\ln x}$. Substitua $t=\\ln x\\to0^+$.","x":"O expoente é $t\\ln t\\to0$, logo o limite é $e^0=1$."}},{"s":"one-bump","t":"One Bump","d":"medium","r":1250,"c":["integrals","derivatives"],"q":"Let $$F(x)=\\int_0^x(t-1)(t-2)^2\\,dt.$$ How many local extrema does $F$ have?","k":"MC4x","at":"1","h":"$F'(x)=(x-1)(x-2)^2$. Where does it change sign?","x":"$F'$ is negative for $x<1$ and positive for $x>1$ except at $x=2$, where it touches $0$ without changing sign. So only $x=1$ is a local extremum: $1$.","g":"original","pt":{"t":"Uma Só Lomba","q":"Seja $$F(x)=\\int_0^x(t-1)(t-2)^2\\,dt.$$ Quantos extremos locais tem $F$?","h":"$F'(x)=(x-1)(x-2)^2$. Onde muda de sinal?","x":"$F'$ é negativa para $x<1$ e positiva para $x>1$, exceto em $x=2$, onde toca em $0$ sem mudar de sinal. Logo só $x=1$ é extremo local: $1$."}},{"s":"product-on-a-circle","t":"Product on a Circle","d":"medium","r":1250,"c":["multivariable","optimization"],"q":"Find the maximum of $xy$ subject to $x^2+y^2=8$.","k":"MC40","at":"4","h":"Lagrange multipliers, or parametrize the circle.","x":"With $x=\\sqrt8\\cos t$, $y=\\sqrt8\\sin t$: $xy=4\\sin2t\\le4$, attained at $x=y=2$.","g":"original","pt":{"t":"Produto numa Circunferência","q":"Determine o máximo de $xy$ sujeito a $x^2+y^2=8$.","h":"Multiplicadores de Lagrange, ou parametrize a circunferência.","x":"Com $x=\\sqrt8\\cos t$, $y=\\sqrt8\\sin t$: $xy=4\\sin2t\\le4$, valor atingido em $x=y=2$."}},{"s":"quadratic-under-absolute-value","t":"Quadratic Under Absolute Value","d":"medium","r":1250,"c":["domains","sup-inf"],"q":"Let $B=\\{x\\in\\mathbb R:\\ |x^2+6x+4|<x^2+1\\}$. Find $\\sup B$.","k":"NS4wLQ==","at":"-\\tfrac12","h":"$|y|<c$ means $-c<y<c$. Treat the two inequalities separately.","x":"We need $x^2+6x+4<x^2+1$, i.e. $x<-\\frac12$, and $x^2+6x+4>-x^2-1$, i.e. $2x^2+6x+5>0$, which always holds (negative discriminant). So $B=\\left(-\\infty,-\\frac12\\right)$ and $\\sup B=-\\frac12$ (not a maximum).","g":"university","pt":{"t":"Quadrática Dentro de um Módulo","q":"Seja $B=\\{x\\in\\mathbb R:\\ |x^2+6x+4|<x^2+1\\}$. Determine $\\sup B$.","h":"$|y|<c$ significa $-c<y<c$. Trate as duas desigualdades separadamente.","x":"É preciso $x^2+6x+4<x^2+1$, isto é, $x<-\\frac12$, e $x^2+6x+4>-x^2-1$, isto é, $2x^2+6x+5>0$, que é sempre verdade (discriminante negativo). Logo $B=\\left]-\\infty,-\\frac12\\right[$ e $\\sup B=-\\frac12$ (não é máximo)."}},{"s":"root-sums","t":"Root Sums","d":"medium","r":1250,"c":["seq-limits","riemann"],"q":"Evaluate $\\displaystyle\\lim_{n\\to\\infty}\\frac{\\sqrt1+\\sqrt2+\\cdots+\\sqrt n}{n^{3/2}}$.","k":"NjY2NjY2NjY2NjY2NjY2Ni4w","at":"\\tfrac23","h":"Factor out $n^{3/2}$: it is $\\frac1n\\sum\\sqrt{k/n}$, a Riemann sum. Or bound $\\sqrt k$ between $\\int_{k-1}^k\\sqrt x\\,dx$ and $\\int_k^{k+1}\\sqrt x\\,dx$.","x":"$\\frac{1}{n}\\sum_{k=1}^n\\sqrt{\\frac kn}\\to\\int_0^1\\sqrt x\\,dx=\\frac23$. (Squeeze version: $\\frac23n^{3/2}\\le\\sum\\sqrt k\\le\\frac23\\left((n+1)^{3/2}-1\\right)$.)","g":"university","pt":{"t":"Somas de Raízes","q":"Calcule $\\displaystyle\\lim_{n\\to\\infty}\\frac{\\sqrt1+\\sqrt2+\\cdots+\\sqrt n}{n^{3/2}}$.","h":"Ponha $n^{3/2}$ em evidência: fica $\\frac1n\\sum\\sqrt{k/n}$, uma soma de Riemann. Ou enquadre $\\sqrt k$ entre $\\int_{k-1}^k\\sqrt x\\,dx$ e $\\int_k^{k+1}\\sqrt x\\,dx$.","x":"$\\frac{1}{n}\\sum_{k=1}^n\\sqrt{\\frac kn}\\to\\int_0^1\\sqrt x\\,dx=\\frac23$. (Versão por enquadramento: $\\frac23n^{3/2}\\le\\sum\\sqrt k\\le\\frac23\\left((n+1)^{3/2}-1\\right)$.)"}},{"s":"sine-minus-tangent","t":"Sine Minus Tangent","d":"medium","r":1250,"c":["lhopital","trig"],"q":"Evaluate $$\\lim_{x\\to0}\\frac{x-\\sin x}{x-\\tan x}.$$","k":"NS4wLQ==","at":"-\\tfrac12","h":"One round of L'Hôpital, then simplify $1-\\sec^2x$.","x":"L'Hôpital gives $\\frac{1-\\cos x}{1-\\sec^2x}=\\frac{1-\\cos x}{-\\tan^2x}$. Since $1-\\cos x\\sim\\frac{x^2}{2}$ and $\\tan^2x\\sim x^2$, the limit is $-\\frac12$.","g":"original","pt":{"t":"Seno Menos Tangente","q":"Calcule $$\\lim_{x\\to0}\\frac{x-\\sin x}{x-\\tan x}.$$","h":"Uma aplicação da Regra de Cauchy e depois simplifique $1-\\sec^2x$.","x":"A Regra de Cauchy dá $\\frac{1-\\cos x}{1-\\sec^2x}=\\frac{1-\\cos x}{-\\tan^2x}$. Como $1-\\cos x\\sim\\frac{x^2}{2}$ e $\\tan^2x\\sim x^2$, o limite é $-\\frac12$."}},{"s":"squeezed-sum","t":"Squeezed Sum","d":"medium","r":1250,"c":["seq-limits"],"q":"Evaluate $$\\lim_{n\\to\\infty}\\sum_{k=1}^{n}\\frac{k}{n^2+k}.$$","k":"NS4w","at":"\\tfrac12","h":"Replace each denominator by its smallest and largest possible values, then use $\\sum k=\\frac{n(n+1)}{2}$.","x":"$\\frac{\\sum k}{n^2+n}\\le\\sum\\frac{k}{n^2+k}\\le\\frac{\\sum k}{n^2+1}$. Both bounds are $\\frac{n(n+1)/2}{n^2+O(n)}\\to\\frac12$, so by the squeeze theorem the limit is $\\frac12$.","g":"university","pt":{"t":"Soma Enquadrada","q":"Calcule $$\\lim_{n\\to\\infty}\\sum_{k=1}^{n}\\frac{k}{n^2+k}.$$","h":"Substitua cada denominador pelo seu menor e pelo seu maior valor possível e depois use $\\sum k=\\frac{n(n+1)}{2}$.","x":"$\\frac{\\sum k}{n^2+n}\\le\\sum\\frac{k}{n^2+k}\\le\\frac{\\sum k}{n^2+1}$. Os dois limites são $\\frac{n(n+1)/2}{n^2+O(n)}\\to\\frac12$, logo pelo Teorema das sucessões enquadradas o limite é $\\frac12$."}},{"s":"swapped-powers","t":"Swapped Powers","d":"medium","r":1250,"c":["derivatives","exp-log"],"q":"The equation $a^b=b^a$ has exactly one solution in positive integers with $a<b$. Find $a+b$.","k":"MC42","at":"6","h":"Rewrite as $\\frac{\\ln a}{a}=\\frac{\\ln b}{b}$ and study $g(x)=\\frac{\\ln x}{x}$.","x":"$g'(x)=\\frac{1-\\ln x}{x^2}$, so $g$ rises on $(0,e)$ and falls after. Two different inputs with equal $g$ must straddle $e$, so $a\\in\\{1,2\\}$. $a=1$ forces $b=1$. With $a=2$: $g(2)=g(4)$. So $(a,b)=(2,4)$ and $a+b=6$.","g":"original","pt":{"t":"Potências Trocadas","q":"A equação $a^b=b^a$ tem exatamente uma solução em inteiros positivos com $a<b$. Determine $a+b$.","h":"Reescreva como $\\frac{\\ln a}{a}=\\frac{\\ln b}{b}$ e estude $g(x)=\\frac{\\ln x}{x}$.","x":"$g'(x)=\\frac{1-\\ln x}{x^2}$, logo $g$ cresce em $\\mathopen{]}0,e\\mathclose{[}$ e decresce depois. Dois valores diferentes com o mesmo $g$ têm de ficar um de cada lado de $e$, logo $a\\in\\{1,2\\}$. $a=1$ obriga a $b=1$. Com $a=2$: $g(2)=g(4)$. Logo $(a,b)=(2,4)$ e $a+b=6$."}},{"s":"symmetric-semicircle","t":"Symmetric Semicircle","d":"medium","r":1250,"c":["symmetry","integrals"],"q":"Evaluate $$\\int_{-2}^{2}\\left(x^3\\cos\\frac{x}{2}+\\frac12\\right)\\sqrt{4-x^2}\\,dx.$$","k":"Mzk3OTg1MzU2Mjk1MTQxLjM=","at":"\\pi","h":"Split the integrand into an odd part and an even part.","x":"$x^3\\cos\\frac x2\\sqrt{4-x^2}$ is odd, so it contributes $0$. What remains is $\\frac12\\int_{-2}^2\\sqrt{4-x^2}\\,dx$, half the area of a semicircle of radius $2$: $\\frac12\\cdot2\\pi=\\pi$.","g":"original","pt":{"t":"Semicírculo Simétrico","q":"Calcule $$\\int_{-2}^{2}\\left(x^3\\cos\\frac{x}{2}+\\frac12\\right)\\sqrt{4-x^2}\\,dx.$$","h":"Separe a função integranda numa parte ímpar e numa parte par.","x":"$x^3\\cos\\frac x2\\sqrt{4-x^2}$ é ímpar, logo contribui com $0$. Resta $\\frac12\\int_{-2}^2\\sqrt{4-x^2}\\,dx$, metade da área de um semicírculo de raio $2$: $\\frac12\\cdot2\\pi=\\pi$."}},{"s":"three-factor-telescope","t":"Three-Factor Telescope","d":"medium","r":1250,"c":["induction","seq-limits"],"q":"Evaluate $$\\lim_{n\\to\\infty}\\sum_{k=1}^{n}\\frac{1}{k(k+1)(k+2)}.$$","k":"NTIuMA==","at":"\\tfrac14","h":"$\\frac{1}{k(k+1)(k+2)}=\\frac12\\left(\\frac{1}{k(k+1)}-\\frac{1}{(k+1)(k+2)}\\right)$.","x":"The sum telescopes to $\\frac14-\\frac{1}{2(n+1)(n+2)}$ (easy to confirm by induction), which tends to $\\frac14$.","g":"university","pt":{"t":"Telescópio de Três Fatores","q":"Calcule $$\\lim_{n\\to\\infty}\\sum_{k=1}^{n}\\frac{1}{k(k+1)(k+2)}.$$","h":"$\\frac{1}{k(k+1)(k+2)}=\\frac12\\left(\\frac{1}{k(k+1)}-\\frac{1}{(k+1)(k+2)}\\right)$.","x":"A soma é telescópica e dá $\\frac14-\\frac{1}{2(n+1)(n+2)}$ (fácil de confirmar por indução), que tende para $\\frac14$."}},{"s":"two-sides-of-one","t":"Two Sides of One","d":"medium","r":1250,"c":["continuity","limits"],"q":"Let $$g(x)=\\begin{cases}\\dfrac{x^2-2x+1}{x^2-3x+2}, & x<1\\\\[6pt]\\dfrac{\\sin(3x-3)}{(x-1)^3}\\,\\ln^2x, & x>1.\\end{cases}$$ Compute $\\displaystyle\\lim_{x\\to1^+}g(x)-\\lim_{x\\to1^-}g(x)$.","k":"MC4z","at":"3","h":"Left: factor and cancel. Right: use $\\sin(3t)\\sim3t$ and $\\ln x\\sim x-1$.","x":"For $x<1$, $g(x)=\\frac{(x-1)^2}{(x-1)(x-2)}=\\frac{x-1}{x-2}\\to0$. For $x>1$, $g(x)\\sim\\frac{3(x-1)(x-1)^2}{(x-1)^3}=3$. The difference is $3$, so $g$ has no continuous extension at $1$.","g":"university","pt":{"t":"Os Dois Lados de Um","q":"Seja $$g(x)=\\begin{cases}\\dfrac{x^2-2x+1}{x^2-3x+2}, & x<1\\\\[6pt]\\dfrac{\\sin(3x-3)}{(x-1)^3}\\,\\ln^2x, & x>1.\\end{cases}$$ Calcule $\\displaystyle\\lim_{x\\to1^+}g(x)-\\lim_{x\\to1^-}g(x)$.","h":"À esquerda: fatorize e simplifique. À direita: use $\\sin(3t)\\sim3t$ e $\\ln x\\sim x-1$.","x":"Para $x<1$, $g(x)=\\frac{(x-1)^2}{(x-1)(x-2)}=\\frac{x-1}{x-2}\\to0$. Para $x>1$, $g(x)\\sim\\frac{3(x-1)(x-1)^2}{(x-1)^3}=3$. A diferença é $3$, logo $g$ não é prolongável por continuidade a $1$."}},{"s":"two-square-roots","t":"Two Square Roots","d":"medium","r":1250,"c":["optimization"],"q":"Find the minimum value of $$\\sqrt{x^2+9}+\\sqrt{(8-x)^2+25}$$ over all real $x$.","k":"MTY3NDg5ODk0ODA3MzEzLjEx","at":"8\\sqrt2","h":"Read each root as a distance from $(x,0)$ to a fixed point.","x":"It is the distance from $(x,0)$ to $(0,3)$ plus the distance to $(8,-5)$. These points lie on opposite sides of the $x$-axis, so the sum is at least the straight-line distance $\\sqrt{8^2+8^2}=8\\sqrt2\\approx11.314$, attained where the segment crosses the axis.","g":"original","pt":{"t":"Duas Raízes Quadradas","q":"Determine o valor mínimo de $$\\sqrt{x^2+9}+\\sqrt{(8-x)^2+25}$$ para $x$ real.","h":"Leia cada raiz como a distância de $(x,0)$ a um ponto fixo.","x":"É a distância de $(x,0)$ a $(0,3)$ mais a distância a $(8,-5)$. Estes pontos estão em lados opostos do eixo dos $x$, logo a soma é pelo menos a distância em linha reta $\\sqrt{8^2+8^2}=8\\sqrt2\\approx11.314$, atingida onde o segmento corta o eixo."}},{"s":"a-zero-between-1-and-3","t":"A Zero Between 1 and 3","d":"medium","r":1300,"c":["continuity","roots"],"q":"Let $s(x)=3x^4-4x^3-2x^2e^{(x-1)/2}$. The Intermediate Value Theorem gives a zero $c$ of $s$ in $(1,3)$, and it is unique there. Find $c$ to at least four significant figures.","k":"MTgxNjY5NzE2ODE3ODM4OC4x","at":"c\\approx1.88387","h":"Check the signs of $s(1)$ and $s(3)$, then bisect (or use Newton's method).","x":"$s(1)=-3<0$ and $s(3)=135-18e>0$, so a zero exists. Bisection or Newton's method converges to $c\\approx1.88387$.","g":"university","ask":"Enter $c$ to at least four significant figures.","pt":{"t":"Um Zero entre 1 e 3","q":"Seja $s(x)=3x^4-4x^3-2x^2e^{(x-1)/2}$. O Teorema de Bolzano dá um zero $c$ de $s$ em $\\mathopen{]}1,3\\mathclose{[}$, que é aí único. Determine $c$ com pelo menos quatro algarismos significativos.","h":"Verifique os sinais de $s(1)$ e $s(3)$ e depois aplique o método da bissecção (ou o método de Newton).","x":"$s(1)=-3<0$ e $s(3)=135-18e>0$, logo existe um zero. A bissecção ou o método de Newton convergem para $c\\approx1.88387$.","ask":"Introduza $c$ com pelo menos quatro algarismos significativos."}},{"s":"additive-plus","t":"Additive Plus","d":"medium","r":1300,"c":["functional","derivatives"],"q":"A differentiable function satisfies $f(x+y)=f(x)+f(y)+2xy$ for all real $x,y$, and $f'(0)=3$. Find $f(2)$.","k":"MC4wMQ==","at":"10","h":"Compute $f'(x)$ directly from the limit definition.","x":"$y=0$ gives $f(0)=0$. Then $f'(x)=\\lim_{h\\to0}\\frac{f(x+h)-f(x)}{h}=\\lim_{h\\to0}\\frac{f(h)+2xh}{h}=f'(0)+2x$. So $f(x)=x^2+3x$ and $f(2)=10$.","g":"original","pt":{"t":"Aditiva e Mais Alguma Coisa","q":"Uma função diferenciável satisfaz $f(x+y)=f(x)+f(y)+2xy$ para todos os reais $x,y$, e $f'(0)=3$. Determine $f(2)$.","h":"Calcule $f'(x)$ diretamente pela definição de derivada.","x":"$y=0$ dá $f(0)=0$. Então $f'(x)=\\lim_{h\\to0}\\frac{f(x+h)-f(x)}{h}=\\lim_{h\\to0}\\frac{f(h)+2xh}{h}=f'(0)+2x$. Logo $f(x)=x^2+3x$ e $f(2)=10$."}},{"s":"arctan-riemann-sum","t":"Arctan Riemann Sum","d":"medium","r":1300,"c":["riemann","trig"],"q":"Evaluate $$\\lim_{n\\to\\infty}\\sum_{k=1}^{n}\\frac{n}{n^2+k^2}.$$","k":"Mzg0NDc5MzM2MTg5MzU4Ny4w","at":"\\tfrac{\\pi}{4}","h":"Factor out $\\frac1n$ and write the summand as a function of $\\frac kn$.","x":"$$\\sum_{k=1}^n\\frac{n}{n^2+k^2}=\\frac1n\\sum_{k=1}^n\\frac{1}{1+(k/n)^2}\\longrightarrow\\int_0^1\\frac{dx}{1+x^2}=\\arctan1=\\frac\\pi4.$$","g":"original","pt":{"t":"Soma de Riemann do Arco-Tangente","q":"Calcule $$\\lim_{n\\to\\infty}\\sum_{k=1}^{n}\\frac{n}{n^2+k^2}.$$","h":"Ponha $\\frac1n$ em evidência e escreva a parcela como função de $\\frac kn$.","x":"$$\\sum_{k=1}^n\\frac{n}{n^2+k^2}=\\frac1n\\sum_{k=1}^n\\frac{1}{1+(k/n)^2}\\longrightarrow\\int_0^1\\frac{dx}{1+x^2}=\\arctan1=\\frac\\pi4.$$"}},{"s":"area-cosine-derivative","t":"Area Cosine Derivative","d":"medium","r":1300,"c":["hyperbolic","derivatives"],"q":"Let $f(x)=\\operatorname{arcosh}\\dfrac{x+1}{x-1}$. Find $f'(3)$.","k":"NzgyMTg0OTU0MzE1NzY4ODIuMC0=","at":"-\\tfrac{\\sqrt3}{6}","h":"$(\\operatorname{arcosh}u)'=\\frac{u'}{\\sqrt{u^2-1}}$ wherever $u>1$.","x":"$u=\\frac{x+1}{x-1}$ has $u'=-\\frac{2}{(x-1)^2}$. At $x=3$: $u=2$, $u'=-\\frac12$, so $f'(3)=\\frac{-1/2}{\\sqrt3}=-\\frac{\\sqrt3}{6}\\approx-0.2887$. (The domain is $x>1$, where $u\\ge1$; it's differentiable wherever $u>1$, which is all of $x>1$.)","g":"university","pt":{"t":"Derivada do Argumento do Cosseno Hiperbólico","q":"Seja $f(x)=\\operatorname{arcosh}\\dfrac{x+1}{x-1}$. Determine $f'(3)$.","h":"$(\\operatorname{arcosh}u)'=\\frac{u'}{\\sqrt{u^2-1}}$ sempre que $u>1$.","x":"$u=\\frac{x+1}{x-1}$ tem $u'=-\\frac{2}{(x-1)^2}$. Em $x=3$: $u=2$, $u'=-\\frac12$, logo $f'(3)=\\frac{-1/2}{\\sqrt3}=-\\frac{\\sqrt3}{6}\\approx-0.2887$. (O domínio é $x>1$, onde $u\\ge1$; a função é diferenciável sempre que $u>1$, ou seja, em todo o $x>1$.)"}},{"s":"arsinh-versus-log","t":"Arsinh Versus Log","d":"medium","r":1300,"c":["hyperbolic","limits"],"q":"Evaluate $\\displaystyle\\lim_{x\\to+\\infty}\\left(\\operatorname{arsinh}x-\\ln x\\right)$.","k":"MzU0OTk1NTA4MTc0MTM5Ni4w","at":"\\ln2","h":"$\\operatorname{arsinh}x=\\ln\\left(x+\\sqrt{x^2+1}\\right)$.","x":"The difference is $\\ln\\frac{x+\\sqrt{x^2+1}}{x}=\\ln\\left(1+\\sqrt{1+\\frac1{x^2}}\\right)\\to\\ln2$.","g":"university","pt":{"t":"Argsh Contra Log","q":"Calcule $\\displaystyle\\lim_{x\\to+\\infty}\\left(\\operatorname{arsinh}x-\\ln x\\right)$.","h":"$\\operatorname{arsinh}x=\\ln\\left(x+\\sqrt{x^2+1}\\right)$.","x":"A diferença é $\\ln\\frac{x+\\sqrt{x^2+1}}{x}=\\ln\\left(1+\\sqrt{1+\\frac1{x^2}}\\right)\\to\\ln2$."}},{"s":"averaging-recursion","t":"Averaging Recursion","d":"medium","r":1300,"c":["sequences"],"q":"Let $a_1=0$, $a_2=1$ and $a_{n+2}=\\dfrac{a_{n+1}+a_n}{2}$. Find $\\displaystyle\\lim_{n\\to\\infty}a_n$.","k":"NjY2NjY2NjY2NjY2NjY2Ni4w","at":"\\tfrac23","h":"Look at the differences $d_n=a_{n+1}-a_n$: they satisfy $d_{n+1}=-\\frac12d_n$.","x":"$d_n=\\left(-\\frac12\\right)^{n-1}$, so $a_n=\\sum_{k=1}^{n-1}d_k\\to\\frac{1}{1+\\frac12}=\\frac23$. (Shortcut: $a_{n+1}+\\frac{a_n}{2}$ is constant, equal to $1$; at the limit $\\frac32L=1$.)","g":"university","pt":{"t":"Recorrência de Médias","q":"Sejam $a_1=0$, $a_2=1$ e $a_{n+2}=\\dfrac{a_{n+1}+a_n}{2}$. Calcule $\\displaystyle\\lim_{n\\to\\infty}a_n$.","h":"Considere as diferenças $d_n=a_{n+1}-a_n$: satisfazem $d_{n+1}=-\\frac12d_n$.","x":"$d_n=\\left(-\\frac12\\right)^{n-1}$, logo $a_n=\\sum_{k=1}^{n-1}d_k\\to\\frac{1}{1+\\frac12}=\\frac23$. (Atalho: $a_{n+1}+\\frac{a_n}{2}$ é constante, igual a $1$; no limite, $\\frac32L=1$.)"}},{"s":"best-quadratic-correction","t":"Best Quadratic Correction","d":"medium","r":1300,"c":["mvt","inequalities"],"q":"Find the smallest $k$ such that $\\ln(1+x)\\ge x-kx^2$ for every $x\\ge0$.","k":"NS4w","at":"\\tfrac12","h":"Small $x$ forces $k\\ge\\frac12$. For sufficiency, differentiate $\\ln(1+x)-x+\\frac{x^2}{2}$.","x":"$\\frac{x-\\ln(1+x)}{x^2}\\to\\frac12$ as $x\\to0$, so $k\\ge\\frac12$. With $k=\\frac12$, $h(x)=\\ln(1+x)-x+\\frac{x^2}2$ has $h(0)=0$ and $h'(x)=\\frac{x^2}{1+x}\\ge0$, so $h\\ge0$. The answer is $\\frac12$.","g":"university","pt":{"t":"Melhor Correção Quadrática","q":"Determine o menor $k$ tal que $\\ln(1+x)\\ge x-kx^2$ para todo o $x\\ge0$.","h":"Os valores pequenos de $x$ obrigam a $k\\ge\\frac12$. Para a suficiência, derive $\\ln(1+x)-x+\\frac{x^2}{2}$.","x":"$\\frac{x-\\ln(1+x)}{x^2}\\to\\frac12$ quando $x\\to0$, logo $k\\ge\\frac12$. Com $k=\\frac12$, $h(x)=\\ln(1+x)-x+\\frac{x^2}2$ tem $h(0)=0$ e $h'(x)=\\frac{x^2}{1+x}\\ge0$, logo $h\\ge0$. A resposta é $\\frac12$."}},{"s":"central-binomial-root","t":"Central Binomial Root","d":"medium","r":1300,"c":["seq-limits"],"q":"Evaluate $\\displaystyle\\lim_{n\\to\\infty}\\sqrt[n]{\\binom{2n}{n}}$.","k":"MC40","at":"4","h":"If $\\frac{u_{n+1}}{u_n}\\to L$, then $\\sqrt[n]{u_n}\\to L$.","x":"$\\frac{\\binom{2n+2}{n+1}}{\\binom{2n}{n}}=\\frac{(2n+2)(2n+1)}{(n+1)^2}\\to4$, so the $n$-th root tends to $4$.","g":"university","pt":{"t":"Raiz do Binomial Central","q":"Calcule $\\displaystyle\\lim_{n\\to\\infty}\\sqrt[n]{\\binom{2n}{n}}$.","h":"Se $\\frac{u_{n+1}}{u_n}\\to L$, então $\\sqrt[n]{u_n}\\to L$.","x":"$\\frac{\\binom{2n+2}{n+1}}{\\binom{2n}{n}}=\\frac{(2n+2)(2n+1)}{(n+1)^2}\\to4$, logo a raiz de índice $n$ tende para $4$."}},{"s":"circles-second-derivative","t":"Circle's Second Derivative","d":"medium","r":1300,"c":["implicit","derivatives"],"q":"On the circle $x^2+y^2=25$, find $\\dfrac{d^2y}{dx^2}$ at the point $(3,4)$.","k":"NTI2MDkzLjAt","at":"-\\tfrac{25}{64}","h":"First get $y'=-\\frac xy$, then differentiate that again (implicitly), and substitute $y'$ back in.","x":"$y''=-\\frac{y-xy'}{y^2}=-\\frac{y+x^2/y}{y^2}=-\\frac{x^2+y^2}{y^3}=-\\frac{25}{64}$.","g":"original","pt":{"t":"Segunda Derivada na Circunferência","q":"Na circunferência $x^2+y^2=25$, determine $\\dfrac{d^2y}{dx^2}$ no ponto $(3,4)$.","h":"Obtenha primeiro $y'=-\\frac xy$, derive novamente (implicitamente) e substitua $y'$.","x":"$y''=-\\frac{y-xy'}{y^2}=-\\frac{y+x^2/y}{y^2}=-\\frac{x^2+y^2}{y^3}=-\\frac{25}{64}$."}},{"s":"continuous-and-additive","t":"Continuous and Additive","d":"medium","r":1300,"c":["continuity","functional"],"q":"$f:\\mathbb R\\to\\mathbb R$ is continuous, $f(x+y)=f(x)+f(y)$ for all $x,y$, and $f(1)=2$. Find $f(\\pi)$.","k":"Njg1OTcxNzAzNTgxMzgyLjY=","at":"2\\pi","h":"Find $f$ on the integers, then on the rationals. Then use density of $\\mathbb Q$ and continuity.","x":"Induction gives $f(n)=2n$, then $f\\left(\\frac pq\\right)=\\frac{2p}{q}$, so $f(x)=2x$ on $\\mathbb Q$. For any real $x$, take rationals $q_n\\to x$: by continuity $f(x)=\\lim f(q_n)=\\lim2q_n=2x$. So $f(\\pi)=2\\pi$.","g":"university","pt":{"t":"Contínua e Aditiva","q":"$f:\\mathbb R\\to\\mathbb R$ é contínua, $f(x+y)=f(x)+f(y)$ para todos os $x,y$, e $f(1)=2$. Determine $f(\\pi)$.","h":"Determine $f$ nos inteiros e depois nos racionais. Use então a densidade de $\\mathbb Q$ e a continuidade.","x":"Por indução, $f(n)=2n$; depois $f\\left(\\frac pq\\right)=\\frac{2p}{q}$, logo $f(x)=2x$ em $\\mathbb Q$. Para qualquer real $x$, tome racionais $q_n\\to x$: pela continuidade (Heine), $f(x)=\\lim f(q_n)=\\lim2q_n=2x$. Logo $f(\\pi)=2\\pi$."}},{"s":"corner-of-a-root","t":"Corner of a Root","d":"medium","r":1300,"c":["differentiability","trig"],"q":"Let $f(x)=\\sqrt{1-\\cos x}$. Compute the right derivative $f'(0^+)$.","k":"Njc0NTY4MTE4NzYwMTcwNy4w","at":"\\tfrac{\\sqrt2}{2}","h":"$1-\\cos x=2\\sin^2\\frac x2$.","x":"$f(x)=\\sqrt2\\left|\\sin\\frac x2\\right|$, so $\\frac{f(x)-f(0)}{x}\\to\\frac{\\sqrt2}{2}$ as $x\\to0^+$ (and $-\\frac{\\sqrt2}2$ from the left). $f$ fails to be differentiable exactly at the points $2k\\pi$.","g":"university","pt":{"t":"Bico de uma Raiz","q":"Seja $f(x)=\\sqrt{1-\\cos x}$. Calcule a derivada à direita $f'(0^+)$.","h":"$1-\\cos x=2\\sin^2\\frac x2$.","x":"$f(x)=\\sqrt2\\left|\\sin\\frac x2\\right|$, logo $\\frac{f(x)-f(0)}{x}\\to\\frac{\\sqrt2}{2}$ quando $x\\to0^+$ (e $-\\frac{\\sqrt2}2$ pela esquerda). $f$ não é diferenciável exatamente nos pontos $2k\\pi$."}},{"s":"even-and-odd-e-limits","t":"Even and Odd e-Limits","d":"medium","r":1300,"c":["seq-limits","exp-log"],"q":"The sequence $u_n=\\left(1+\\dfrac{(-1)^n}{n}\\right)^{n}$ has two subsequential limits. Enter their sum.","k":"NDc4NDAzNjk2MjE2MTY4MC4z","at":"e+\\tfrac1e","h":"Even $n$: $\\left(1+\\frac1n\\right)^n$. Odd $n$: $\\left(1-\\frac1n\\right)^n$.","x":"Even terms tend to $e$ and odd terms to $e^{-1}$. Sum: $e+\\frac1e\\approx3.0862$.","g":"university","pt":{"t":"Limites de e Pares e Ímpares","q":"A sucessão $u_n=\\left(1+\\dfrac{(-1)^n}{n}\\right)^{n}$ tem dois sublimites. Introduza a sua soma.","h":"$n$ par: $\\left(1+\\frac1n\\right)^n$. $n$ ímpar: $\\left(1-\\frac1n\\right)^n$.","x":"Os termos de ordem par tendem para $e$ e os de ordem ímpar para $e^{-1}$. Soma: $e+\\frac1e\\approx3.0862$."}},{"s":"floor-of-a-square","t":"Floor of a Square","d":"medium","r":1300,"c":["integrals"],"q":"Evaluate $$\\int_0^{2}\\lfloor x^2\\rfloor\\,dx.$$","k":"NzcyMDg1MDAzNjUzNzM1OC4x","at":"5-\\sqrt2-\\sqrt3","h":"$\\lfloor x^2\\rfloor=k$ exactly when $\\sqrt k\\le x<\\sqrt{k+1}$.","x":"The integral is $1(\\sqrt2-1)+2(\\sqrt3-\\sqrt2)+3(2-\\sqrt3)=5-\\sqrt2-\\sqrt3\\approx1.8537$.","g":"original","pt":{"t":"Parte Inteira de um Quadrado","q":"Calcule $$\\int_0^{2}\\lfloor x^2\\rfloor\\,dx.$$","h":"$\\lfloor x^2\\rfloor=k$ exatamente quando $\\sqrt k\\le x<\\sqrt{k+1}$.","x":"O integral é $1(\\sqrt2-1)+2(\\sqrt3-\\sqrt2)+3(2-\\sqrt3)=5-\\sqrt2-\\sqrt3\\approx1.8537$."}},{"s":"gap-to-the-line","t":"Gap to the Line","d":"medium","r":1300,"c":["optimization"],"q":"Find the shortest distance between the parabola $y=x^2$ and the line $y=x-1$.","k":"NjAxOTk4ODU4MDAzMzAzNS4w","at":"\\tfrac{3\\sqrt2}{8}","h":"At the closest point, the parabola's tangent is parallel to the line.","x":"The slope $2x=1$ gives the point $\\left(\\frac12,\\frac14\\right)$. Its distance to $x-y-1=0$ is $\\frac{|1/2-1/4-1|}{\\sqrt2}=\\frac{3}{4\\sqrt2}=\\frac{3\\sqrt2}{8}\\approx0.5303$.","g":"original","pt":{"t":"Distância à Reta","q":"Determine a menor distância entre a parábola $y=x^2$ e a reta $y=x-1$.","h":"No ponto mais próximo, a tangente à parábola é paralela à reta.","x":"O declive $2x=1$ dá o ponto $\\left(\\frac12,\\frac14\\right)$. A sua distância a $x-y-1=0$ é $\\frac{|1/2-1/4-1|}{\\sqrt2}=\\frac{3}{4\\sqrt2}=\\frac{3\\sqrt2}{8}\\approx0.5303$."}},{"s":"log-factorial","t":"Log Factorial","d":"medium","r":1300,"c":["seq-limits","exp-log"],"q":"Evaluate $\\displaystyle\\lim_{n\\to\\infty}\\frac{\\ln(n!)}{n\\ln n}$.","k":"MC4x","at":"1","h":"Upper bound: $n!\\le n^n$. Lower bound: the largest $\\frac n2$ factors of $n!$ are each at least $\\frac n2$.","x":"Upper bound: $n!\\le n^n$, so the ratio is at most $1$. Lower bound: $\\ln n!=\\sum_{k\\le n}\\ln k\\ge\\int_1^n\\ln x\\,dx=n\\ln n-n+1$, so the ratio is at least $1-\\frac{n-1}{n\\ln n}\\to1$. (Or Stolz–Cesàro: $\\frac{\\ln(n+1)}{(n+1)\\ln(n+1)-n\\ln n}\\to1$.) The limit is $1$.","g":"university","pt":{"t":"Logaritmo do Fatorial","q":"Calcule $\\displaystyle\\lim_{n\\to\\infty}\\frac{\\ln(n!)}{n\\ln n}$.","h":"Majorante: $n!\\le n^n$. Minorante: os $\\frac n2$ maiores fatores de $n!$ são todos pelo menos $\\frac n2$.","x":"Majorante: $n!\\le n^n$, logo a razão é no máximo $1$. Minorante: $\\ln n!=\\sum_{k\\le n}\\ln k\\ge\\int_1^n\\ln x\\,dx=n\\ln n-n+1$, logo a razão é pelo menos $1-\\frac{n-1}{n\\ln n}\\to1$. (Ou Stolz–Cesàro: $\\frac{\\ln(n+1)}{(n+1)\\ln(n+1)-n\\ln n}\\to1$.) O limite é $1$."}},{"s":"log-over-linear","t":"Log Over Linear","d":"medium","r":1300,"c":["domains","exp-log"],"q":"Solve $$\\frac{\\ln(x^2+2x-3)}{x+2}>0.$$","k":"MC41LQ==","at":"-5","h":"Find the domain first. Then split by the sign of $x+2$: you need $\\ln(\\cdots)$ to have the same sign.","x":"The domain is $x<-3$ or $x>1$. The log is positive when $x^2+2x-3>1$, i.e. $x<-1-\\sqrt5$ or $x>-1+\\sqrt5$. For $x>1$ the denominator is positive, so we need the log positive: $x>\\sqrt5-1$. For $x<-3$ the denominator is negative, so we need the log negative: $-1-\\sqrt5<x<-3$. The set is $(-1-\\sqrt5,-3)\\,\\cup\\,(\\sqrt5-1,+\\infty)$, and $a+b+c=(-1-\\sqrt5)-3+(\\sqrt5-1)=-5$.","g":"university","ask":"The solution set has the form $(a,b)\\,\\cup\\,(c,+\\infty)$. Enter $a+b+c$.","pt":{"t":"Logaritmo Sobre Linear","q":"Resolva $$\\frac{\\ln(x^2+2x-3)}{x+2}>0.$$","h":"Determine primeiro o domínio. Depois separe pelo sinal de $x+2$: é preciso que $\\ln(\\cdots)$ tenha o mesmo sinal.","x":"O domínio é $x<-3$ ou $x>1$. O logaritmo é positivo quando $x^2+2x-3>1$, isto é, $x<-1-\\sqrt5$ ou $x>-1+\\sqrt5$. Para $x>1$ o denominador é positivo, logo é preciso o logaritmo positivo: $x>\\sqrt5-1$. Para $x<-3$ o denominador é negativo, logo é preciso o logaritmo negativo: $-1-\\sqrt5<x<-3$. O conjunto é $\\mathopen{]}-1-\\sqrt5,-3\\mathclose{[}\\,\\cup\\,\\mathopen{]}\\sqrt5-1,+\\infty\\mathclose{[}$, e $a+b+c=(-1-\\sqrt5)-3+(\\sqrt5-1)=-5$.","ask":"O conjunto-solução é da forma $\\mathopen{]}a,b\\mathclose{[}\\,\\cup\\,\\mathopen{]}c,+\\infty\\mathclose{[}$. Introduza $a+b+c$."}},{"s":"log-tangent","t":"Log Tangent","d":"medium","r":1300,"c":["symmetry","improper"],"q":"Evaluate the (convergent) improper integral $$\\int_0^{\\pi/2}\\ln(\\tan x)\\,dx.$$","k":"MC4w","at":"0","h":"What happens under $x\\mapsto\\frac\\pi2-x$?","x":"The substitution turns $\\ln\\tan x$ into $\\ln\\cot x=-\\ln\\tan x$, so the integral equals its own negative: $0$.","g":"original","pt":{"t":"Logaritmo da Tangente","q":"Calcule o integral impróprio (convergente) $$\\int_0^{\\pi/2}\\ln(\\tan x)\\,dx.$$","h":"O que acontece com a mudança $x\\mapsto\\frac\\pi2-x$?","x":"A substituição transforma $\\ln\\tan x$ em $\\ln\\cot x=-\\ln\\tan x$, logo o integral é igual ao seu simétrico: $0$."}},{"s":"log-vs-root","t":"Log vs Root","d":"medium","r":1300,"c":["optimization","exp-log"],"q":"Find the smallest $a$ such that $\\ln x\\le a\\sqrt{x}$ for all $x>0$.","k":"NzQ4ODI0MzI4ODg1NzUzNy4w","at":"\\tfrac2e","h":"The answer is the maximum of $\\frac{\\ln x}{\\sqrt x}$.","x":"$\\frac{d}{dx}\\frac{\\ln x}{\\sqrt x}=\\frac{2-\\ln x}{2x^{3/2}}$, which is zero at $x=e^2$. The maximum value is $\\frac{2}{e}\\approx0.7358$.","g":"original","pt":{"t":"Logaritmo Contra Raiz","q":"Determine o menor $a$ tal que $\\ln x\\le a\\sqrt{x}$ para todo o $x>0$.","h":"A resposta é o máximo de $\\frac{\\ln x}{\\sqrt x}$.","x":"$\\frac{d}{dx}\\frac{\\ln x}{\\sqrt x}=\\frac{2-\\ln x}{2x^{3/2}}$, que se anula em $x=e^2$. O valor máximo é $\\frac{2}{e}\\approx0.7358$."}},{"s":"mean-value-squeeze","t":"Mean Value Squeeze","d":"medium","r":1300,"c":["mvt","seq-limits","inverse-trig"],"q":"Evaluate $\\displaystyle\\lim_{n\\to\\infty}n^2\\left(\\arctan\\frac1n-\\arctan\\frac1{n+1}\\right)$.","k":"MC4x","at":"1","h":"By the Mean Value Theorem, the bracket equals $\\frac{1}{1+c_n^2}\\left(\\frac1n-\\frac1{n+1}\\right)$ for some $c_n$ between $\\frac1{n+1}$ and $\\frac1n$.","x":"$\\frac1n-\\frac1{n+1}=\\frac1{n(n+1)}$ and $c_n\\to0$, so the expression is $\\frac{n^2}{n(n+1)}\\cdot\\frac{1}{1+c_n^2}\\to1$.","g":"university","pt":{"t":"Enquadramento por Lagrange","q":"Calcule $\\displaystyle\\lim_{n\\to\\infty}n^2\\left(\\arctan\\frac1n-\\arctan\\frac1{n+1}\\right)$.","h":"Pelo Teorema de Lagrange, o parêntese é igual a $\\frac{1}{1+c_n^2}\\left(\\frac1n-\\frac1{n+1}\\right)$ para algum $c_n$ entre $\\frac1{n+1}$ e $\\frac1n$.","x":"$\\frac1n-\\frac1{n+1}=\\frac1{n(n+1)}$ e $c_n\\to0$, logo a expressão é $\\frac{n^2}{n(n+1)}\\cdot\\frac{1}{1+c_n^2}\\to1$."}},{"s":"parts-twice","t":"Parts Twice","d":"medium","r":1300,"c":["ibp"],"q":"Evaluate $$\\int_0^1x^2e^x\\,dx.$$","k":"MjU0MDk1NDgyODE4MjgxNy4w","at":"e-2","h":"Integrate by parts twice, lowering the power of $x$ each time.","x":"$\\int x^2e^x=x^2e^x-2\\int xe^x=x^2e^x-2(xe^x-e^x)$. From $0$ to $1$: $(e-2e+2e)-2=e-2\\approx0.7183$.","g":"original","pt":{"t":"Partes Duas Vezes","q":"Calcule $$\\int_0^1x^2e^x\\,dx.$$","h":"Primitive por partes duas vezes, baixando de cada vez a potência de $x$.","x":"$\\int x^2e^x=x^2e^x-2\\int xe^x=x^2e^x-2(xe^x-e^x)$. De $0$ a $1$: $(e-2e+2e)-2=e-2\\approx0.7183$."}},{"s":"plane-distance","t":"Plane Distance","d":"medium","r":1300,"c":["multivariable"],"q":"Find the shortest distance from the origin to the plane $x+y+z=6$.","k":"NDQ1NzczMTUxNjEwMTQ2NC4z","at":"2\\sqrt3","h":"Minimize $x^2+y^2+z^2$ on the plane with a Lagrange multiplier.","x":"$\\nabla(x^2+y^2+z^2)=\\lambda(1,1,1)$ forces $x=y=z=2$. The distance is $\\sqrt{12}=2\\sqrt3\\approx3.464$.","g":"original","pt":{"t":"Distância a um Plano","q":"Determine a menor distância da origem ao plano $x+y+z=6$.","h":"Minimize $x^2+y^2+z^2$ no plano com um multiplicador de Lagrange.","x":"$\\nabla(x^2+y^2+z^2)=\\lambda(1,1,1)$ obriga a $x=y=z=2$. A distância é $\\sqrt{12}=2\\sqrt3\\approx3.464$."}},{"s":"power-meets-square","t":"Power Meets Square","d":"medium","r":1300,"c":["roots","convexity"],"q":"How many real solutions does $2^x=x^2$ have?","k":"MC4z","at":"3","h":"Two solutions are positive integers. Then look at negative $x$, and argue there are no more.","x":"$x=2$ and $x=4$ work. For $x<0$, $2^x$ rises from $0$ to $1$ while $x^2$ falls from $\\infty$ to $0$: exactly one root. For $x>0$, $h(x)=x\\ln2-2\\ln x$ is convex ($h''=2/x^2>0$), so it has at most two zeros. Total: $3$.","g":"original","pt":{"t":"Potência Encontra Quadrado","q":"Quantas soluções reais tem $2^x=x^2$?","h":"Duas soluções são inteiros positivos. Depois veja o que se passa para $x$ negativo e justifique que não há mais.","x":"$x=2$ e $x=4$ são soluções. Para $x<0$, $2^x$ cresce de $0$ para $1$ enquanto $x^2$ decresce de $\\infty$ para $0$: exatamente uma raiz. Para $x>0$, $h(x)=x\\ln2-2\\ln x$ é convexa ($h''=2/x^2>0$), logo tem no máximo dois zeros. Total: $3$."}},{"s":"radius-check","t":"Radius Check","d":"medium","r":1300,"c":["series"],"q":"Find the radius of convergence of $$\\sum_{n=1}^{\\infty}\\frac{n^2}{3^n}x^n.$$","k":"MC4z","at":"3","h":"Ratio test on the coefficients.","x":"$\\frac{(n+1)^2/3^{n+1}}{n^2/3^n}\\to\\frac13$, so the series converges for $|x|<3$ and the radius is $3$.","g":"original","pt":{"t":"Raio de Convergência","q":"Determine o raio de convergência de $$\\sum_{n=1}^{\\infty}\\frac{n^2}{3^n}x^n.$$","h":"Critério da razão aplicado aos coeficientes.","x":"$\\frac{(n+1)^2/3^{n+1}}{n^2/3^n}\\to\\frac13$, logo a série converge para $|x|<3$ e o raio é $3$."}},{"s":"reciprocal-squares","t":"Reciprocal Squares","d":"medium","r":1300,"c":["lhopital","trig"],"q":"Evaluate $\\displaystyle\\lim_{x\\to0}\\left(\\frac{1}{\\sin^2x}-\\frac1{x^2}\\right)$.","k":"MzMzMzMzMzMzMzMzMzMzMy4w","at":"\\tfrac13","h":"Combine: $\\frac{x^2-\\sin^2x}{x^2\\sin^2x}$. Use $\\sin x=x-\\frac{x^3}{6}+\\cdots$.","x":"$\\sin^2x=x^2-\\frac{x^4}{3}+O(x^6)$, so the numerator is $\\frac{x^4}{3}+O(x^6)$ and the denominator $\\sim x^4$. The limit is $\\frac13$.","g":"university","pt":{"t":"Inversos dos Quadrados","q":"Calcule $\\displaystyle\\lim_{x\\to0}\\left(\\frac{1}{\\sin^2x}-\\frac1{x^2}\\right)$.","h":"Reduza ao mesmo denominador: $\\frac{x^2-\\sin^2x}{x^2\\sin^2x}$. Use $\\sin x=x-\\frac{x^3}{6}+\\cdots$.","x":"$\\sin^2x=x^2-\\frac{x^4}{3}+O(x^6)$, logo o numerador é $\\frac{x^4}{3}+O(x^6)$ e o denominador $\\sim x^4$. O limite é $\\frac13$."}},{"s":"saddle-count","t":"Saddle Count","d":"medium","r":1300,"c":["multivariable"],"q":"How many saddle points does $f(x,y)=x^3-3x+y^2$ have?","k":"MC4x","at":"1","h":"Find the critical points, then use $D=f_{xx}f_{yy}-f_{xy}^2$.","x":"Critical points: $3x^2-3=0$, $2y=0$, so $(\\pm1,0)$. $D=6x\\cdot2$: at $(1,0)$, $D>0$ and $f_{xx}>0$ (a minimum); at $(-1,0)$, $D<0$ (a saddle). Answer: $1$.","g":"original","pt":{"t":"Contagem de Selas","q":"Quantos pontos de sela tem $f(x,y)=x^3-3x+y^2$?","h":"Determine os pontos críticos e use $D=f_{xx}f_{yy}-f_{xy}^2$.","x":"Pontos críticos: $3x^2-3=0$, $2y=0$, logo $(\\pm1,0)$. $D=6x\\cdot2$: em $(1,0)$, $D>0$ e $f_{xx}>0$ (um mínimo); em $(-1,0)$, $D<0$ (um ponto de sela). Resposta: $1$."}},{"s":"self-referential-integral","t":"Self-Referential Integral","d":"medium","r":1300,"c":["integrals","functional"],"q":"A continuous function satisfies $$f(x)=x^2+x\\int_0^1f(t)\\,dt$$ for all $x$. Find $f(3)$.","k":"MC4xMQ==","at":"11","h":"The integral is just a number. Call it $c$.","x":"With $c=\\int_0^1f$, we have $f(x)=x^2+cx$, so $c=\\frac13+\\frac c2$, giving $c=\\frac23$. Then $f(3)=9+2=11$.","g":"original","pt":{"t":"Integral Autorreferente","q":"Uma função contínua satisfaz $$f(x)=x^2+x\\int_0^1f(t)\\,dt$$ para todo o $x$. Determine $f(3)$.","h":"O integral é apenas um número. Chame-lhe $c$.","x":"Com $c=\\int_0^1f$, tem-se $f(x)=x^2+cx$, logo $c=\\frac13+\\frac c2$, o que dá $c=\\frac23$. Então $f(3)=9+2=11$."}},{"s":"seven-crossings","t":"Seven Crossings","d":"medium","r":1300,"c":["roots","trig"],"q":"How many real solutions does $$\\sin x=\\frac{x}{10}$$ have?","k":"MC43","at":"7","h":"Any solution has $|x|\\le10$. Count crossings on each half-period for $x>0$, then use symmetry.","x":"$x=0$ is one solution. For $x>0$: one crossing in $(0,\\pi)$; none in $(\\pi,2\\pi)$ where $\\sin x<0$; two in $(2\\pi,3\\pi)$ because the arch peaks at $1>\\frac{2.5\\pi}{10}$; none in $(3\\pi,10]$. That's $3$ positive roots, $3$ negative by oddness, plus $0$: total $7$.","g":"original","pt":{"t":"Sete Interseções","q":"Determine quantas soluções reais tem a equação $$\\sin x=\\frac{x}{10}$$","h":"Qualquer solução tem $|x|\\le10$. Conte as interseções em cada meio período para $x>0$ e depois use a simetria.","x":"$x=0$ é uma solução. Para $x>0$: uma interseção em $\\mathopen{]}0,\\pi\\mathclose{[}$; nenhuma em $\\mathopen{]}\\pi,2\\pi\\mathclose{[}$, onde $\\sin x<0$; duas em $\\mathopen{]}2\\pi,3\\pi\\mathclose{[}$, porque o arco atinge o máximo $1>\\frac{2.5\\pi}{10}$; nenhuma em $\\mathopen{]}3\\pi,10]$. São $3$ raízes positivas, $3$ negativas por imparidade, mais o $0$: total $7$."}},{"s":"spring","t":"Spring","d":"medium","r":1300,"c":["ode","trig"],"q":"Solve $y''+y=0$ with $y(0)=1$ and $y'(0)=1$. Find $y\\!\\left(\\frac\\pi4\\right)$.","k":"MTU5MDM3MzI2NTMxMjQxNC4x","at":"\\sqrt2","h":"The general solution is $A\\cos x+B\\sin x$.","x":"The initial conditions give $A=1$, $B=1$, so $y=\\cos x+\\sin x$ and $y(\\frac\\pi4)=\\sqrt2$.","g":"original","pt":{"t":"Mola","q":"Resolva $y''+y=0$ com $y(0)=1$ e $y'(0)=1$. Determine $y\\!\\left(\\frac\\pi4\\right)$.","h":"A solução geral é $A\\cos x+B\\sin x$.","x":"As condições iniciais dão $A=1$, $B=1$, logo $y=\\cos x+\\sin x$ e $y(\\frac\\pi4)=\\sqrt2$."}},{"s":"tangent-region","t":"Tangent Region","d":"medium","r":1300,"c":["integrals","areas-volumes"],"q":"Find the area of the region enclosed by $y=x^3$ and its tangent line at $x=1$.","k":"NTcuNg==","at":"\\tfrac{27}{4}","h":"The tangent meets the curve again at $x=-2$.","x":"The tangent is $y=3x-2$, and $x^3-(3x-2)=(x-1)^2(x+2)\\ge0$ on $[-2,1]$. Area $=\\int_{-2}^{1}(x^3-3x+2)\\,dx=\\frac{27}{4}$.","g":"original","pt":{"t":"Região da Tangente","q":"Determine a área da região limitada por $y=x^3$ e pela sua reta tangente em $x=1$.","h":"A tangente volta a intersetar a curva em $x=-2$.","x":"A tangente é $y=3x-2$, e $x^3-(3x-2)=(x-1)^2(x+2)\\ge0$ em $[-2,1]$. Área $=\\int_{-2}^{1}(x^3-3x+2)\\,dx=\\frac{27}{4}$."}},{"s":"triangle-in-a-circle","t":"Triangle in a Circle","d":"medium","r":1300,"c":["optimization","trig"],"q":"What is the largest possible area of a triangle inscribed in a circle of radius $1$?","k":"ODU2Njc2NTAxODMwOTkyLjE=","at":"\\tfrac{3\\sqrt3}{4}","h":"Fix one side as a chord. Where should the third vertex go? Then optimize the chord.","x":"For a fixed chord the apex should be the farthest point on the circle, so the triangle is isosceles. If the half-chord is $\\sin\\theta$, the height is $1+\\cos\\theta$, and $A(\\theta)=\\sin\\theta(1+\\cos\\theta)$. $A'(\\theta)=\\cos\\theta+\\cos2\\theta=0$ gives $\\theta=\\frac\\pi3$, the equilateral triangle, with area $\\frac{3\\sqrt3}{4}\\approx1.299$.","g":"original","pt":{"t":"Triângulo num Círculo","q":"Qual é a maior área possível de um triângulo inscrito numa circunferência de raio $1$?","h":"Fixe um lado como corda. Onde deve ficar o terceiro vértice? Depois otimize a corda.","x":"Para uma corda fixa, o vértice oposto deve ser o ponto da circunferência mais afastado, logo o triângulo é isósceles. Se a meia corda é $\\sin\\theta$, a altura é $1+\\cos\\theta$, e $A(\\theta)=\\sin\\theta(1+\\cos\\theta)$. $A'(\\theta)=\\cos\\theta+\\cos2\\theta=0$ dá $\\theta=\\frac\\pi3$, o triângulo equilátero, com área $\\frac{3\\sqrt3}{4}\\approx1.299$."}},{"s":"arctans-area","t":"Arctan's Area","d":"medium","r":1350,"c":["ibp","trig"],"q":"Evaluate $$\\int_0^1\\arctan x\\,dx.$$","k":"NDY1NzQ3MTEzNzU0Mjg4MzQuMA==","at":"\\tfrac\\pi4-\\tfrac{\\ln2}{2}","h":"Parts with $u=\\arctan x$, $dv=dx$. Then a substitution.","x":"$\\int\\arctan x\\,dx=x\\arctan x-\\int\\frac{x}{1+x^2}dx=x\\arctan x-\\frac12\\ln(1+x^2)$. From $0$ to $1$: $\\frac\\pi4-\\frac{\\ln2}{2}\\approx0.4388$.","g":"original","pt":{"t":"Área do Arco-Tangente","q":"Calcule $$\\int_0^1\\arctan x\\,dx.$$","h":"Partes com $u=\\arctan x$, $dv=dx$. Depois uma substituição.","x":"$\\int\\arctan x\\,dx=x\\arctan x-\\int\\frac{x}{1+x^2}dx=x\\arctan x-\\frac12\\ln(1+x^2)$. De $0$ a $1$: $\\frac\\pi4-\\frac{\\ln2}{2}\\approx0.4388$."}},{"s":"balanced-reciprocals","t":"Balanced Reciprocals","d":"medium","r":1350,"c":["convexity","inequalities"],"q":"Positive reals $a,b$ satisfy $a+b=1$. Find the minimum of $$\\left(a+\\frac1a\\right)^2+\\left(b+\\frac1b\\right)^2.$$","k":"NS4yMQ==","at":"\\tfrac{25}{2}","h":"Is $t\\mapsto\\left(t+\\frac1t\\right)^2$ convex on $(0,1)$?","x":"$\\varphi(t)=\\left(t+\\frac1t\\right)^2=t^2+2+\\frac1{t^2}$ is convex on $t>0$. By Jensen, $\\varphi(a)+\\varphi(b)\\ge2\\varphi\\left(\\frac12\\right)=2\\cdot\\frac{25}{4}=\\frac{25}{2}$.","g":"original","pt":{"t":"Inversos Equilibrados","q":"Os reais positivos $a,b$ satisfazem $a+b=1$. Determine o mínimo de $$\\left(a+\\frac1a\\right)^2+\\left(b+\\frac1b\\right)^2.$$","h":"A função $t\\mapsto\\left(t+\\frac1t\\right)^2$ é convexa em $\\mathopen{]}0,1\\mathclose{[}$?","x":"$\\varphi(t)=\\left(t+\\frac1t\\right)^2=t^2+2+\\frac1{t^2}$ é convexa em $t>0$. Pela desigualdade de Jensen, $\\varphi(a)+\\varphi(b)\\ge2\\varphi\\left(\\frac12\\right)=2\\cdot\\frac{25}{4}=\\frac{25}{2}$."}},{"s":"binomial-integral","t":"Binomial Integral","d":"medium","r":1350,"c":["integrals"],"q":"Evaluate $$\\sum_{k=0}^{10}\\frac{1}{k+1}\\binom{10}{k}.$$","k":"MTkwOTA5MDkwOTA5MC42ODE=","at":"\\tfrac{2047}{11}","h":"Integrate $(1+x)^{10}$ from $0$ to $1$.","x":"$\\int_0^1(1+x)^{10}dx=\\sum\\binom{10}{k}\\frac{1}{k+1}$, and the left side is $\\frac{2^{11}-1}{11}=\\frac{2047}{11}\\approx186.09$.","g":"original","pt":{"t":"Integral Binomial","q":"Calcule $$\\sum_{k=0}^{10}\\frac{1}{k+1}\\binom{10}{k}.$$","h":"Integre $(1+x)^{10}$ de $0$ a $1$.","x":"$\\int_0^1(1+x)^{10}dx=\\sum\\binom{10}{k}\\frac{1}{k+1}$, e o lado esquerdo é $\\frac{2^{11}-1}{11}=\\frac{2047}{11}\\approx186.09$."}},{"s":"bowl-bottom","t":"Bowl Bottom","d":"medium","r":1350,"c":["multivariable","optimization"],"q":"Find the minimum value of $$f(x,y)=x^2+xy+y^2-3x.$$","k":"MC4zLQ==","at":"-3","h":"Set both partial derivatives to zero.","x":"$f_x=2x+y-3=0$, $f_y=x+2y=0$ give $(x,y)=(2,-1)$. The second-derivative test ($f_{xx}=2$, $D=4-1>0$) confirms a minimum: $f(2,-1)=4-2+1-6=-3$.","g":"original","pt":{"t":"Fundo da Taça","q":"Determine o valor mínimo de $$f(x,y)=x^2+xy+y^2-3x.$$","h":"Iguale as duas derivadas parciais a zero.","x":"$f_x=2x+y-3=0$, $f_y=x+2y=0$ dão $(x,y)=(2,-1)$. O teste da segunda derivada ($f_{xx}=2$, $D=4-1>0$) confirma um mínimo: $f(2,-1)=4-2+1-6=-3$."}},{"s":"cone-in-a-sphere","t":"Cone in a Sphere","d":"medium","r":1350,"c":["optimization"],"q":"A right circular cone is inscribed in a sphere of radius $3$. What is the largest possible volume of the cone?","k":"MzExOTI4MzYxMjMwMTUuMzM=","at":"\\tfrac{32\\pi}{3}","h":"If the cone has height $h$, its base radius satisfies $r^2=h(6-h)$.","x":"$V(h)=\\frac\\pi3h^2(6-h)$. $V'(h)=\\frac\\pi3(12h-3h^2)=0$ gives $h=4$, so $r^2=8$ and $V=\\frac\\pi3\\cdot8\\cdot4=\\frac{32\\pi}{3}\\approx33.51$.","g":"original","pt":{"t":"Cone numa Esfera","q":"Um cone circular reto está inscrito numa esfera de raio $3$. Qual é o maior volume possível do cone?","h":"Se o cone tem altura $h$, o raio da base satisfaz $r^2=h(6-h)$.","x":"$V(h)=\\frac\\pi3h^2(6-h)$. $V'(h)=\\frac\\pi3(12h-3h^2)=0$ dá $h=4$, logo $r^2=8$ e $V=\\frac\\pi3\\cdot8\\cdot4=\\frac{32\\pi}{3}\\approx33.51$."}},{"s":"cooling-tea","t":"Cooling Tea","d":"medium","r":1350,"c":["ode","exp-log"],"q":"Tea at $90^\\circ$C sits in a $20^\\circ$C room and cools by Newton's law: the temperature difference to the room decays exponentially. After $10$ minutes it is $60^\\circ$C. After how many minutes (from the start) is it $30^\\circ$C?","k":"NTMzMzM5NjE1MjUyMjc3LjQz","at":"\\tfrac{10\\ln7}{\\ln(7/4)}","h":"Write $T(t)=20+70e^{-kt}$ and find $e^{-10k}$ from the first reading.","x":"$60=20+70e^{-10k}$ gives $e^{-10k}=\\frac47$. We need $70e^{-kt}=10$, i.e. $e^{-kt}=\\frac17$, so $t=10\\cdot\\frac{\\ln7}{\\ln(7/4)}\\approx34.77$ minutes.","g":"original","pt":{"t":"Chá a Arrefecer","q":"Um chá a $90^\\circ$C está numa sala a $20^\\circ$C e arrefece segundo a lei de Newton: a diferença de temperatura em relação à sala decai exponencialmente. Após $10$ minutos está a $60^\\circ$C. Ao fim de quantos minutos (desde o início) está a $30^\\circ$C?","h":"Escreva $T(t)=20+70e^{-kt}$ e obtenha $e^{-10k}$ a partir da primeira leitura.","x":"$60=20+70e^{-10k}$ dá $e^{-10k}=\\frac47$. É preciso $70e^{-kt}=10$, isto é, $e^{-kt}=\\frac17$, logo $t=10\\cdot\\frac{\\ln7}{\\ln(7/4)}\\approx34.77$ minutos."}},{"s":"cosine-sign-set","t":"Cosine Sign Set","d":"medium","r":1350,"c":["sup-inf","domains"],"q":"Let $$E=\\left\\{x\\in\\,(-2\\pi,2\\pi)\\ :\\ \\frac{(\\pi-x)\\cos\\frac x2}{x}\\le0\\right\\}.$$ Compute $\\sup E-\\inf E$.","k":"Njg1OTcxNzAzNTgxMzgyLjY=","at":"2\\pi","h":"On $(-2\\pi,2\\pi)$, $\\cos\\frac x2$ is positive for $|x|<\\pi$, zero at $x=\\pm\\pi$ and negative beyond. Make a sign table with $-\\pi,0,\\pi$.","x":"On $(-2\\pi,-\\pi)$ the expression is positive; at $-\\pi$ it is $0$; on $(-\\pi,0)$ it is negative; $0$ is excluded; on $(0,\\pi)$ it is positive; at $\\pi$ it is $0$; on $(\\pi,2\\pi)$ it is positive. So $E=[-\\pi,0)\\,\\cup\\{\\pi\\}$, with $\\max E=\\pi$ and $\\min E=-\\pi$. The difference is $2\\pi$. (Missing the isolated point $\\pi$ gives $\\pi$.)","g":"university","pt":{"t":"Conjunto de Sinais do Cosseno","q":"Seja $$E=\\left\\{x\\in\\,\\mathopen{]}-2\\pi,2\\pi\\mathclose{[}\\ :\\ \\frac{(\\pi-x)\\cos\\frac x2}{x}\\le0\\right\\}.$$ Calcule $\\sup E-\\inf E$.","h":"Em $\\mathopen{]}-2\\pi,2\\pi\\mathclose{[}$, $\\cos\\frac x2$ é positivo para $|x|<\\pi$, nulo em $x=\\pm\\pi$ e negativo para lá disso. Faça um quadro de sinais com $-\\pi,0,\\pi$.","x":"Em $\\mathopen{]}-2\\pi,-\\pi\\mathclose{[}$ a expressão é positiva; em $-\\pi$ vale $0$; em $\\mathopen{]}-\\pi,0\\mathclose{[}$ é negativa; $0$ está excluído; em $\\mathopen{]}0,\\pi\\mathclose{[}$ é positiva; em $\\pi$ vale $0$; em $\\mathopen{]}\\pi,2\\pi\\mathclose{[}$ é positiva. Logo $E=[-\\pi,0\\mathclose{[}\\,\\cup\\{\\pi\\}$, com $\\max E=\\pi$ e $\\min E=-\\pi$. A diferença é $2\\pi$. (Esquecer o ponto isolado $\\pi$ dá $\\pi$.)"}},{"s":"curve-length","t":"Curve Length","d":"medium","r":1350,"c":["areas-volumes"],"q":"Find the arc length of $y=\\frac23x^{3/2}$ from $x=0$ to $x=3$.","k":"NzY2NjY2NjY2NjY2NjY2LjQ=","at":"\\tfrac{14}{3}","h":"$L=\\int_a^b\\sqrt{1+y'^2}\\,dx$, and here $y'=\\sqrt x$.","x":"$L=\\int_0^3\\sqrt{1+x}\\,dx=\\frac23\\left[(1+x)^{3/2}\\right]_0^3=\\frac23(8-1)=\\frac{14}{3}$.","g":"original","pt":{"t":"Comprimento de uma Curva","q":"Determine o comprimento do arco de $y=\\frac23x^{3/2}$ de $x=0$ a $x=3$.","h":"$L=\\int_a^b\\sqrt{1+y'^2}\\,dx$, e aqui $y'=\\sqrt x$.","x":"$L=\\int_0^3\\sqrt{1+x}\\,dx=\\frac23\\left[(1+x)^{3/2}\\right]_0^3=\\frac23(8-1)=\\frac{14}{3}$."}},{"s":"exponential-fractions-at-zero","t":"Exponential Fractions at Zero","d":"medium","r":1350,"c":["differentiability","exp-log"],"q":"Let $$g(x)=x\\,\\frac{e^{1/x}+e^{-1/x}}{e^{2/x}+e^{-1/x}}\\ (x\\ne0),\\qquad g(0)=0.$$ Compute the left derivative $g'(0^-)$.","k":"MC4x","at":"1","h":"$\\frac{g(x)}{x}$ is the fraction. As $x\\to0^-$, which exponentials blow up?","x":"For $x\\to0^-$, $\\frac1x\\to-\\infty$: $e^{1/x}\\to0$, $e^{2/x}\\to0$, and $e^{-1/x}\\to+\\infty$ dominates top and bottom, so the fraction $\\to1$. (From the right $e^{2/x}$ dominates and the fraction $\\to0$, so $g$ is continuous but not differentiable at $0$.)","g":"university","pt":{"t":"Frações Exponenciais em Zero","q":"Seja $$g(x)=x\\,\\frac{e^{1/x}+e^{-1/x}}{e^{2/x}+e^{-1/x}}\\ (x\\ne0),\\qquad g(0)=0.$$ Calcule a derivada à esquerda $g'(0^-)$.","h":"$\\frac{g(x)}{x}$ é a fração. Quando $x\\to0^-$, que exponenciais explodem?","x":"Para $x\\to0^-$, $\\frac1x\\to-\\infty$: $e^{1/x}\\to0$, $e^{2/x}\\to0$, e $e^{-1/x}\\to+\\infty$ domina no numerador e no denominador, logo a fração $\\to1$. (Pela direita domina $e^{2/x}$ e a fração $\\to0$, logo $g$ é contínua mas não diferenciável em $0$.)"}},{"s":"fifth-order-sine","t":"Fifth-Order Sine","d":"medium","r":1350,"c":["taylor","limits"],"q":"Evaluate $$\\lim_{x\\to0}\\frac{\\sin x-x+\\frac{x^3}{6}}{x^5}.$$","k":"MzMzMzMzMzMzMzMzMzMzODAwLjA=","at":"\\tfrac1{120}","h":"Write out the Taylor series of $\\sin x$ up to $x^5$.","x":"$\\sin x=x-\\frac{x^3}{6}+\\frac{x^5}{120}-\\cdots$, so the numerator is $\\frac{x^5}{120}+O(x^7)$ and the limit is $\\frac1{120}$.","g":"original","pt":{"t":"Seno de Quinta Ordem","q":"Calcule $$\\lim_{x\\to0}\\frac{\\sin x-x+\\frac{x^3}{6}}{x^5}.$$","h":"Escreva o desenvolvimento de Taylor de $\\sin x$ até $x^5$.","x":"$\\sin x=x-\\frac{x^3}{6}+\\frac{x^5}{120}-\\cdots$, logo o numerador é $\\frac{x^5}{120}+O(x^7)$ e o limite é $\\frac1{120}$."}},{"s":"inverting-a-shifted-cosine","t":"Inverting a Shifted Cosine","d":"medium","r":1350,"c":["inverse-trig","inverse-functions"],"q":"Let $h(x)=\\cos\\left(2x+\\frac\\pi4\\right)+1$ and let $F$ be the restriction of $h$ to $\\left(\\frac{3\\pi}{8},\\frac{5\\pi}{8}\\right)$, which is invertible. Find $F^{-1}\\left(\\frac12\\right)$.","k":"MzE3NDQ5NjAyMDY5NjEwNy4x","at":"\\tfrac{13\\pi}{24}","h":"On that interval $\\theta=2x+\\frac\\pi4$ runs over $(\\pi,\\frac{3\\pi}{2})$, outside the range of $\\arccos$. Use $\\cos\\theta=\\cos(2\\pi-\\theta)$.","x":"$\\cos\\theta=y-1$ with $\\theta\\in(\\pi,\\frac{3\\pi}2)$ means $2\\pi-\\theta=\\arccos(y-1)$, so $F^{-1}(y)=\\frac{7\\pi}{8}-\\frac12\\arccos(y-1)$. At $y=\\frac12$: $\\arccos\\left(-\\frac12\\right)=\\frac{2\\pi}{3}$, giving $\\frac{7\\pi}{8}-\\frac\\pi3=\\frac{13\\pi}{24}\\approx1.7017$.","g":"university","pt":{"t":"Inverter um Cosseno Deslocado","q":"Seja $h(x)=\\cos\\left(2x+\\frac\\pi4\\right)+1$ e seja $F$ a restrição de $h$ a $\\left]\\frac{3\\pi}{8},\\frac{5\\pi}{8}\\right[$, que é invertível. Determine $F^{-1}\\left(\\frac12\\right)$.","h":"Nesse intervalo, $\\theta=2x+\\frac\\pi4$ percorre $\\mathopen{]}\\pi,\\frac{3\\pi}{2}\\mathclose{[}$, fora do contradomínio de $\\arccos$. Use $\\cos\\theta=\\cos(2\\pi-\\theta)$.","x":"$\\cos\\theta=y-1$ com $\\theta\\in\\mathopen{]}\\pi,\\frac{3\\pi}2\\mathclose{[}$ significa $2\\pi-\\theta=\\arccos(y-1)$, logo $F^{-1}(y)=\\frac{7\\pi}{8}-\\frac12\\arccos(y-1)$. Em $y=\\frac12$: $\\arccos\\left(-\\frac12\\right)=\\frac{2\\pi}{3}$, o que dá $\\frac{7\\pi}{8}-\\frac\\pi3=\\frac{13\\pi}{24}\\approx1.7017$."}},{"s":"just-enough-damping","t":"Just Enough Damping","d":"medium","r":1350,"c":["differentiability"],"q":"For an integer $a\\ge1$ let $f(x)=x^a\\sin\\frac1x$ for $x\\ne0$ and $f(0)=0$. What is the smallest $a$ for which $f$ is differentiable on $\\mathbb R$ and $f'$ is continuous at $0$?","k":"MC4z","at":"3","h":"Compute $f'(0)$ from the definition, and $f'(x)$ for $x\\ne0$; ask when $f'(x)\\to f'(0)$.","x":"$f'(0)=\\lim x^{a-1}\\sin\\frac1x$ exists (and is $0$) iff $a\\ge2$. For $x\\ne0$, $f'(x)=ax^{a-1}\\sin\\frac1x-x^{a-2}\\cos\\frac1x$, which tends to $0$ iff $a\\ge3$. So $a=3$.","g":"university","pt":{"t":"Amortecimento na Medida Certa","q":"Para um inteiro $a\\ge1$, seja $f(x)=x^a\\sin\\frac1x$ para $x\\ne0$ e $f(0)=0$. Qual é o menor $a$ para o qual $f$ é diferenciável em $\\mathbb R$ e $f'$ é contínua em $0$?","h":"Calcule $f'(0)$ pela definição, e $f'(x)$ para $x\\ne0$; veja quando é que $f'(x)\\to f'(0)$.","x":"$f'(0)=\\lim x^{a-1}\\sin\\frac1x$ existe (e é $0$) se e só se $a\\ge2$. Para $x\\ne0$, $f'(x)=ax^{a-1}\\sin\\frac1x-x^{a-2}\\cos\\frac1x$, que tende para $0$ se e só se $a\\ge3$. Logo $a=3$."}},{"s":"largest-self-root","t":"Largest Self-Root","d":"medium","r":1350,"c":["sup-inf","derivatives","exp-log"],"q":"Find the maximum of the set $\\left\\{\\sqrt[n]{n}:\\ n\\in\\mathbb N^+\\right\\}$.","k":"MzgwNDcwMzA3NTk0MjI0NC4x","at":"\\sqrt[3]3","h":"Study $f(x)=x^{1/x}=e^{\\ln x/x}$ on $x>0$, then compare the two integers nearest its maximum.","x":"$\\frac{d}{dx}\\frac{\\ln x}{x}=\\frac{1-\\ln x}{x^2}$, so $f$ increases on $(0,e]$ and decreases after. The candidates are $n=2$ and $n=3$: $\\sqrt2\\approx1.414<\\sqrt[3]3\\approx1.442$. The maximum is $\\sqrt[3]3$.","g":"university","pt":{"t":"Maior Raiz de Si Mesmo","q":"Determine o máximo do conjunto $\\left\\{\\sqrt[n]{n}:\\ n\\in\\mathbb N^+\\right\\}$.","h":"Estude $f(x)=x^{1/x}=e^{\\ln x/x}$ em $x>0$ e depois compare os dois inteiros mais próximos do seu máximo.","x":"$\\frac{d}{dx}\\frac{\\ln x}{x}=\\frac{1-\\ln x}{x^2}$, logo $f$ é crescente em $\\mathopen{]}0,e]$ e decrescente depois. Os candidatos são $n=2$ e $n=3$: $\\sqrt2\\approx1.414<\\sqrt[3]3\\approx1.442$. O máximo é $\\sqrt[3]3$."}},{"s":"log-swap","t":"Log Swap","d":"medium","r":1350,"c":["symmetry","integrals"],"q":"Evaluate $$\\int_2^4\\frac{\\sqrt{\\ln(9-x)}}{\\sqrt{\\ln(9-x)}+\\sqrt{\\ln(x+3)}}\\,dx.$$","k":"MC4x","at":"1","h":"The substitution $x\\mapsto6-x$ swaps $9-x$ and $x+3$ and keeps the interval $[2,4]$.","x":"Call the integral $I$. After $x\\mapsto6-x$, the integrand becomes $\\frac{\\sqrt{\\ln(x+3)}}{\\sqrt{\\ln(x+3)}+\\sqrt{\\ln(9-x)}}$. Adding the two versions gives $\\int_2^4 1\\,dx=2$, so $I=1$.","g":"olympiad","src":"Putnam 1987 B1","pt":{"t":"Troca de Logaritmos","q":"Calcule $$\\int_2^4\\frac{\\sqrt{\\ln(9-x)}}{\\sqrt{\\ln(9-x)}+\\sqrt{\\ln(x+3)}}\\,dx.$$","h":"A substituição $x\\mapsto6-x$ troca $9-x$ com $x+3$ e mantém o intervalo $[2,4]$.","x":"Chame $I$ ao integral. Após $x\\mapsto6-x$, a função integranda passa a $\\frac{\\sqrt{\\ln(x+3)}}{\\sqrt{\\ln(x+3)}+\\sqrt{\\ln(9-x)}}$. Somando as duas versões obtém-se $\\int_2^4 1\\,dx=2$, logo $I=1$."}},{"s":"polar-disc","t":"Polar Disc","d":"medium","r":1350,"c":["double-integrals"],"q":"Evaluate $$\\iint_{x^2+y^2\\le1}(x^2+y^2)\\,dA.$$","k":"NjY5ODQ5NzYyMzY5NzA3NS4x","at":"\\tfrac\\pi2","h":"Switch to polar coordinates; remember $dA=r\\,dr\\,d\\theta$.","x":"$\\int_0^{2\\pi}\\!\\int_0^1r^2\\cdot r\\,dr\\,d\\theta=2\\pi\\cdot\\frac14=\\frac\\pi2$.","g":"original","pt":{"t":"Disco em Polares","q":"Calcule $$\\iint_{x^2+y^2\\le1}(x^2+y^2)\\,dA.$$","h":"Passe para coordenadas polares; lembre-se de que $dA=r\\,dr\\,d\\theta$.","x":"$\\int_0^{2\\pi}\\!\\int_0^1r^2\\cdot r\\,dr\\,d\\theta=2\\pi\\cdot\\frac14=\\frac\\pi2$."}},{"s":"root-integral-ratio","t":"Root Integral Ratio","d":"medium","r":1350,"c":["lhopital","integrals"],"q":"Evaluate $$\\lim_{x\\to0^+}\\frac{1}{x^3}\\int_0^{x^2}\\sin\\sqrt t\\,dt.$$","k":"NjY2NjY2NjY2NjY2NjY2Ni4w","at":"\\tfrac23","h":"L'Hôpital, with the Fundamental Theorem on the numerator.","x":"Differentiating, the numerator gives $\\sin(x)\\cdot2x$ and the denominator $3x^2$. The ratio $\\frac{2\\sin x}{3x}\\to\\frac23$.","g":"original","pt":{"t":"Razão com Integral de Raiz","q":"Calcule $$\\lim_{x\\to0^+}\\frac{1}{x^3}\\int_0^{x^2}\\sin\\sqrt t\\,dt.$$","h":"Regra de Cauchy, com o Teorema Fundamental do Cálculo no numerador.","x":"Derivando, o numerador dá $\\sin(x)\\cdot2x$ e o denominador $3x^2$. A razão $\\frac{2\\sin x}{3x}\\to\\frac23$."}},{"s":"shrinking-neighbourhoods","t":"Shrinking Neighbourhoods","d":"medium","r":1350,"c":["sup-inf"],"q":"Let $$A=\\left\\{x\\in\\mathbb R:\\ \\left|x-\\frac n2\\right|\\le\\frac{1}{2^n}\\ \\text{for some }n\\in\\mathbb N^+\\right\\},\\qquad B=A\\cap\\left(\\tfrac12,\\tfrac32\\right).$$ Find the total length of $B$.","k":"NTc4LjA=","at":"\\tfrac78","h":"$A$ is a union of intervals $\\left[\\frac n2-2^{-n},\\frac n2+2^{-n}\\right]$. Write out $n=1,2,3$; the rest lie beyond $\\frac32$.","x":"$n=1$ gives $[0,1]$, $n=2$ gives $\\left[\\frac34,\\frac54\\right]$, $n=3$ gives $\\left[\\frac{11}{8},\\frac{13}{8}\\right]$, and $n\\ge4$ lies to the right of $\\frac32$. So $B=\\left(\\frac12,\\frac54\\right]\\cup\\left[\\frac{11}{8},\\frac32\\right)$, with $\\inf B=\\frac12$ and $\\sup B=\\frac32$ (neither attained). Its length is $\\frac34+\\frac18=\\frac78$.","g":"university","pt":{"t":"Vizinhanças a Encolher","q":"Sejam $$A=\\left\\{x\\in\\mathbb R:\\ \\left|x-\\frac n2\\right|\\le\\frac{1}{2^n}\\ \\text{para algum }n\\in\\mathbb N^+\\right\\},\\qquad B=A\\cap\\left]\\tfrac12,\\tfrac32\\right[.$$ Determine o comprimento total de $B$.","h":"$A$ é uma união de intervalos $\\left[\\frac n2-2^{-n},\\frac n2+2^{-n}\\right]$. Escreva os casos $n=1,2,3$; os restantes ficam para lá de $\\frac32$.","x":"$n=1$ dá $[0,1]$, $n=2$ dá $\\left[\\frac34,\\frac54\\right]$, $n=3$ dá $\\left[\\frac{11}{8},\\frac{13}{8}\\right]$, e $n\\ge4$ fica à direita de $\\frac32$. Logo $B=\\left]\\frac12,\\frac54\\right]\\cup\\left[\\frac{11}{8},\\frac32\\right[$, com $\\inf B=\\frac12$ e $\\sup B=\\frac32$ (nenhum é atingido). O seu comprimento é $\\frac34+\\frac18=\\frac78$."}},{"s":"the-irrational-exponent","t":"The Irrational Exponent","d":"medium","r":1350,"c":["symmetry","trig"],"q":"Evaluate $$\\int_0^{\\pi/2}\\frac{dx}{1+(\\tan x)^{\\sqrt2}}.$$","k":"Mzg0NDc5MzM2MTg5MzU4Ny4w","at":"\\tfrac{\\pi}{4}","h":"Substitute $x\\mapsto\\frac\\pi2-x$ and add the result to the original.","x":"Under $x\\mapsto\\frac\\pi2-x$, $\\tan x$ becomes $\\cot x$ and the integrand becomes $\\frac{(\\tan x)^{\\sqrt2}}{1+(\\tan x)^{\\sqrt2}}$. Adding the two forms gives $\\int_0^{\\pi/2}1\\,dx=\\frac\\pi2$, so the integral is $\\frac\\pi4$. The exponent $\\sqrt2$ is a decoy.","g":"olympiad","src":"Putnam 1980 A3","pt":{"t":"O Expoente Irracional","q":"Calcule $$\\int_0^{\\pi/2}\\frac{dx}{1+(\\tan x)^{\\sqrt2}}.$$","h":"Substitua $x\\mapsto\\frac\\pi2-x$ e some o resultado ao integral original.","x":"Com $x\\mapsto\\frac\\pi2-x$, $\\tan x$ passa a $\\cot x$ e a função integranda passa a $\\frac{(\\tan x)^{\\sqrt2}}{1+(\\tan x)^{\\sqrt2}}$. Somando as duas formas obtém-se $\\int_0^{\\pi/2}1\\,dx=\\frac\\pi2$, logo o integral é $\\frac\\pi4$. O expoente $\\sqrt2$ é um engodo."}},{"s":"three-tangents","t":"Three Tangents","d":"medium","r":1350,"c":["derivatives","roots"],"q":"How many distinct lines through the point $(2,0)$ are tangent to the curve $y=x^3-x$?","k":"MC4z","at":"3","h":"Write the tangent at $x=a$ and require it to pass through $(2,0)$. Count the real solutions $a$.","x":"The tangent at $a$ is $y=(3a^2-1)(x-a)+a^3-a$. Passing through $(2,0)$ simplifies to $a^3-3a^2+1=0$. That cubic changes sign on $(-1,0)$, $(0,1)$ and $(2,3)$, so it has $3$ real roots. A line can't be tangent to a cubic at two points, so the $3$ lines are distinct.","g":"original","pt":{"t":"Três Tangentes","q":"Quantas retas distintas que passam pelo ponto $(2,0)$ são tangentes à curva $y=x^3-x$?","h":"Escreva a tangente em $x=a$ e imponha que passe por $(2,0)$. Conte as soluções reais $a$.","x":"A tangente em $a$ é $y=(3a^2-1)(x-a)+a^3-a$. Passar por $(2,0)$ simplifica-se em $a^3-3a^2+1=0$. Esta cúbica muda de sinal em $\\mathopen{]}-1,0\\mathclose{[}$, $\\mathopen{]}0,1\\mathclose{[}$ e $\\mathopen{]}2,3\\mathclose{[}$, logo tem $3$ raízes reais. Uma reta não pode ser tangente a uma cúbica em dois pontos, logo as $3$ retas são distintas."}},{"s":"weighted-halves","t":"Weighted Halves","d":"medium","r":1350,"c":["series"],"q":"Evaluate $$\\sum_{n=1}^{\\infty}\\frac{n}{2^n}.$$","k":"MC4y","at":"2","h":"Differentiate $\\sum x^n=\\frac1{1-x}$ and multiply by $x$.","x":"$\\sum_{n\\ge1}nx^n=\\frac{x}{(1-x)^2}$. At $x=\\frac12$: $\\frac{1/2}{1/4}=2$.","g":"original","pt":{"t":"Metades Pesadas","q":"Calcule $$\\sum_{n=1}^{\\infty}\\frac{n}{2^n}.$$","h":"Derive $\\sum x^n=\\frac1{1-x}$ e multiplique por $x$.","x":"$\\sum_{n\\ge1}nx^n=\\frac{x}{(1-x)^2}$. Em $x=\\frac12$: $\\frac{1/2}{1/4}=2$."}},{"s":"alternating-harmonic","t":"Alternating Harmonic","d":"medium","r":1400,"c":["series","taylor"],"q":"Evaluate $$1-\\frac12+\\frac13-\\frac14+\\frac15-\\cdots$$","k":"MzU0OTk1NTA4MTc0MTM5Ni4w","at":"\\ln2","h":"Integrate $\\frac{1}{1+x}=1-x+x^2-\\cdots$ from $0$ to $1$.","x":"$\\ln(1+x)=x-\\frac{x^2}{2}+\\frac{x^3}{3}-\\cdots$ for $-1<x\\le1$. At $x=1$ the series is $\\ln2\\approx0.6931$.","g":"original","pt":{"t":"Harmónica Alternada","q":"Calcule $$1-\\frac12+\\frac13-\\frac14+\\frac15-\\cdots$$","h":"Integre $\\frac{1}{1+x}=1-x+x^2-\\cdots$ de $0$ a $1$.","x":"$\\ln(1+x)=x-\\frac{x^2}{2}+\\frac{x^3}{3}-\\cdots$ para $-1<x\\le1$. Em $x=1$ a série vale $\\ln2\\approx0.6931$."}},{"s":"arctan-power","t":"Arctan Power","d":"medium","r":1400,"c":["lhopital","inverse-trig"],"q":"Evaluate $\\displaystyle\\lim_{x\\to+\\infty}\\left(\\frac2\\pi\\arctan x\\right)^{x}$.","k":"MzUzNzc2MjgwODc3MDkyNS4w","at":"e^{-2/\\pi}","h":"$1^\\infty$: compute $\\lim x\\left(\\frac2\\pi\\arctan x-1\\right)$.","x":"$\\frac2\\pi\\arctan x-1=-\\frac2\\pi\\left(\\frac\\pi2-\\arctan x\\right)=-\\frac2\\pi\\arctan\\frac1x\\sim-\\frac{2}{\\pi x}$. Times $x$ this tends to $-\\frac2\\pi$, so the limit is $e^{-2/\\pi}\\approx0.5290$.","g":"university","pt":{"t":"Potência do Arco-Tangente","q":"Calcule $\\displaystyle\\lim_{x\\to+\\infty}\\left(\\frac2\\pi\\arctan x\\right)^{x}$.","h":"$1^\\infty$: calcule $\\lim x\\left(\\frac2\\pi\\arctan x-1\\right)$.","x":"$\\frac2\\pi\\arctan x-1=-\\frac2\\pi\\left(\\frac\\pi2-\\arctan x\\right)=-\\frac2\\pi\\arctan\\frac1x\\sim-\\frac{2}{\\pi x}$. Multiplicado por $x$ tende para $-\\frac2\\pi$, logo o limite é $e^{-2/\\pi}\\approx0.5290$."}},{"s":"average-near-zero","t":"Average Near Zero","d":"medium","r":1400,"c":["limits","integrals"],"q":"Evaluate $$\\lim_{x\\to0}\\frac1x\\int_0^x(1+\\sin 2t)^{1/t}\\,dt.$$","k":"NTYwMzk4OTA2NTA5ODMuNw==","at":"e^2","h":"The expression is the average of the integrand over $[0,x]$. What does the integrand tend to as $t\\to0$?","x":"By the Fundamental Theorem (or the Mean Value Theorem for integrals), the limit equals $\\lim_{t\\to0}(1+\\sin2t)^{1/t}$. Its log is $\\frac{\\ln(1+\\sin2t)}{t}\\to2$, so the answer is $e^2\\approx7.389$.","g":"original","pt":{"t":"Média Perto de Zero","q":"Calcule $$\\lim_{x\\to0}\\frac1x\\int_0^x(1+\\sin 2t)^{1/t}\\,dt.$$","h":"A expressão é a média da função integranda em $[0,x]$. Para onde tende a função integranda quando $t\\to0$?","x":"Pelo Teorema Fundamental do Cálculo (ou pelo teorema do valor médio para integrais), o limite é igual a $\\lim_{t\\to0}(1+\\sin2t)^{1/t}$. O seu logaritmo é $\\frac{\\ln(1+\\sin2t)}{t}\\to2$, logo a resposta é $e^2\\approx7.389$."}},{"s":"corner-rod","t":"Corner Rod","d":"medium","r":1400,"c":["optimization","trig"],"q":"A corridor of width $1$ meets a corridor of width $3\\sqrt3$ at a right angle. What is the length of the longest thin rod that can be carried horizontally around the corner?","k":"MC44","at":"8","h":"The longest rod that fits equals the shortest segment that touches the inner corner and both outer walls. Parametrize by the angle $\\theta$.","x":"$L(\\theta)=\\frac{1}{\\sin\\theta}+\\frac{3\\sqrt3}{\\cos\\theta}$. Setting $L'=0$ gives $\\tan^3\\theta=\\frac{1}{3\\sqrt3}$, so $\\tan\\theta=\\frac{1}{\\sqrt3}$ and $\\theta=30^\\circ$. Then $L=2+\\frac{3\\sqrt3}{\\sqrt3/2}=8$.","g":"original","pt":{"t":"Vara na Esquina","q":"Um corredor de largura $1$ encontra um corredor de largura $3\\sqrt3$ em ângulo reto. Qual é o comprimento da maior vara fina que se consegue transportar horizontalmente ao virar a esquina?","h":"A maior vara que passa tem o comprimento do menor segmento que toca na esquina interior e nas duas paredes exteriores. Parametrize pelo ângulo $\\theta$.","x":"$L(\\theta)=\\frac{1}{\\sin\\theta}+\\frac{3\\sqrt3}{\\cos\\theta}$. Fazendo $L'=0$ obtém-se $\\tan^3\\theta=\\frac{1}{3\\sqrt3}$, logo $\\tan\\theta=\\frac{1}{\\sqrt3}$ e $\\theta=30^\\circ$. Então $L=2+\\frac{3\\sqrt3}{\\sqrt3/2}=8$."}},{"s":"gabriels-horn","t":"Gabriel's Horn","d":"medium","r":1400,"c":["areas-volumes","improper"],"q":"The curve $y=\\frac1x$ for $x\\ge1$ is rotated about the $x$-axis, forming an infinitely long horn. Find its volume.","k":"Mzk3OTg1MzU2Mjk1MTQxLjM=","at":"\\pi","h":"Disc method on $[1,\\infty)$, as an improper integral.","x":"$V=\\pi\\int_1^\\infty\\frac{dx}{x^2}=\\pi$. (Its surface area is infinite, which is the famous paradox.)","g":"original","pt":{"t":"Trombeta de Gabriel","q":"A curva $y=\\frac1x$, para $x\\ge1$, roda em torno do eixo dos $x$, formando uma trombeta infinitamente longa. Determine o seu volume.","h":"Método dos discos em $[1,\\infty\\mathclose{[}$, como integral impróprio.","x":"$V=\\pi\\int_1^\\infty\\frac{dx}{x^2}=\\pi$. (A sua área de superfície é infinita, e esse é o famoso paradoxo.)"}},{"s":"gamma-warm-up","t":"Gamma Warm-Up","d":"medium","r":1400,"c":["improper","ibp"],"q":"Evaluate $$\\int_0^{\\infty}x^3e^{-x}\\,dx.$$","k":"MC42","at":"6","h":"Integrate by parts to relate $\\int_0^\\infty x^ne^{-x}dx$ to $\\int_0^\\infty x^{n-1}e^{-x}dx$.","x":"With $I_n=\\int_0^\\infty x^ne^{-x}dx$, parts gives $I_n=nI_{n-1}$ (the boundary terms vanish), and $I_0=1$. So $I_3=3!=6$.","g":"original","pt":{"t":"Aquecimento Gama","q":"Calcule $$\\int_0^{\\infty}x^3e^{-x}\\,dx.$$","h":"Primitive por partes para relacionar $\\int_0^\\infty x^ne^{-x}dx$ com $\\int_0^\\infty x^{n-1}e^{-x}dx$.","x":"Com $I_n=\\int_0^\\infty x^ne^{-x}dx$, a integração por partes dá $I_n=nI_{n-1}$ (os termos de fronteira anulam-se), e $I_0=1$. Logo $I_3=3!=6$."}},{"s":"hyperbolic-mean-value","t":"Hyperbolic Mean Value","d":"medium","r":1400,"c":["hyperbolic","mvt"],"q":"Find the largest constant $c$ such that $$\\tanh x\\ \\ge\\ c\\,\\frac{x}{\\cosh^2x}\\quad\\text{for every }x>0.$$","k":"MC4x","at":"1","h":"Rewrite the condition as $c\\le\\frac{\\sinh x\\cosh x}{x}=\\frac{\\sinh2x}{2x}$.","x":"Multiplying by $\\frac{\\cosh^2x}{x}>0$, the condition is $c\\le\\frac{\\sinh2x}{2x}$ for all $x>0$. By the Mean Value Theorem, $\\frac{\\sinh t}{t}=\\cosh\\xi>1$ for some $\\xi\\in(0,t)$, and $\\frac{\\sinh t}{t}\\to1$ as $t\\to0$. So the infimum is $1$ and the largest $c$ is $1$.","g":"university","pt":{"t":"Valor Médio Hiperbólico","q":"Determine a maior constante $c$ tal que $$\\tanh x\\ \\ge\\ c\\,\\frac{x}{\\cosh^2x}\\quad\\text{para todo o }x>0.$$","h":"Reescreva a condição como $c\\le\\frac{\\sinh x\\cosh x}{x}=\\frac{\\sinh2x}{2x}$.","x":"Multiplicando por $\\frac{\\cosh^2x}{x}>0$, a condição é $c\\le\\frac{\\sinh2x}{2x}$ para todo o $x>0$. Pelo Teorema de Lagrange, $\\frac{\\sinh t}{t}=\\cosh\\xi>1$ para algum $\\xi\\in\\mathopen{]}0,t\\mathclose{[}$, e $\\frac{\\sinh t}{t}\\to1$ quando $t\\to0$. Logo o ínfimo é $1$ e o maior $c$ é $1$."}},{"s":"machins-formula","t":"Machin's Formula","d":"medium","r":1400,"c":["inverse-trig"],"q":"Compute $4\\arctan\\frac15-\\arctan\\frac1{239}$.","k":"Mzg0NDc5MzM2MTg5MzU4Ny4w","at":"\\tfrac\\pi4","h":"Compute $\\tan\\left(2\\arctan\\frac15\\right)$, then $\\tan\\left(4\\arctan\\frac15\\right)$, then use the subtraction formula.","x":"$\\tan\\left(2\\arctan\\frac15\\right)=\\frac{5}{12}$ and $\\tan\\left(4\\arctan\\frac15\\right)=\\frac{120}{119}$. Then $\\tan(\\text{difference})=\\frac{120/119-1/239}{1+\\frac{120}{119\\cdot239}}=1$, and the difference is small and positive, so it equals $\\frac\\pi4$ (John Machin's 1706 formula for computing $\\pi$).","g":"university","pt":{"t":"Fórmula de Machin","q":"Calcule $4\\arctan\\frac15-\\arctan\\frac1{239}$.","h":"Calcule $\\tan\\left(2\\arctan\\frac15\\right)$, depois $\\tan\\left(4\\arctan\\frac15\\right)$, e use a fórmula da tangente da diferença.","x":"$\\tan\\left(2\\arctan\\frac15\\right)=\\frac{5}{12}$ e $\\tan\\left(4\\arctan\\frac15\\right)=\\frac{120}{119}$. Então $\\tan(\\text{diferença})=\\frac{120/119-1/239}{1+\\frac{120}{119\\cdot239}}=1$, e a diferença é pequena e positiva, logo é igual a $\\frac\\pi4$ (a fórmula de John Machin, de 1706, para calcular $\\pi$)."}},{"s":"moving-window","t":"Moving Window","d":"medium","r":1400,"c":["integrals","optimization"],"q":"For $x>0$, let $$F(x)=\\int_x^{2x}e^{-t^2}\\,dt.$$ At what value of $x$ is $F$ largest?","k":"MTY5NjY4ODI2NTc2MDg0LjA=","at":"\\sqrt{\\tfrac{\\ln2}{3}}","h":"Differentiate with the Fundamental Theorem of Calculus. Don't forget the chain rule on the upper limit.","x":"$F'(x)=2e^{-4x^2}-e^{-x^2}$, which is zero when $e^{-3x^2}=\\frac12$, i.e. $x=\\sqrt{\\frac{\\ln2}{3}}\\approx0.4805$. $F'$ is positive before and negative after.","g":"original","pt":{"t":"Janela Móvel","q":"Para $x>0$, seja $$F(x)=\\int_x^{2x}e^{-t^2}\\,dt.$$ Para que valor de $x$ é $F$ máxima?","h":"Derive com o Teorema Fundamental do Cálculo. Não se esqueça da regra da cadeia no limite superior.","x":"$F'(x)=2e^{-4x^2}-e^{-x^2}$, que se anula quando $e^{-3x^2}=\\frac12$, isto é, $x=\\sqrt{\\frac{\\ln2}{3}}\\approx0.4805$. $F'$ é positiva antes e negativa depois."}},{"s":"open-box","t":"Open Box","d":"medium","r":1400,"c":["multivariable","optimization"],"q":"An open-top rectangular box must hold volume $32$. What is the least possible surface area (base plus four sides)?","k":"MC44NA==","at":"48","h":"With base $x\\times y$ and height $z=\\frac{32}{xy}$, minimize $xy+\\frac{64}{x}+\\frac{64}{y}$.","x":"$S=xy+\\frac{64}{y}+\\frac{64}{x}$. Setting $S_x=y-\\frac{64}{x^2}=0$ and $S_y=x-\\frac{64}{y^2}=0$ gives $x=y=4$, $z=2$, and $S=16+16+16=48$.","g":"original","pt":{"t":"Caixa Aberta","q":"Uma caixa retangular sem tampa tem de ter volume $32$. Qual é a menor área de superfície possível (base mais quatro faces laterais)?","h":"Com base $x\\times y$ e altura $z=\\frac{32}{xy}$, minimize $xy+\\frac{64}{x}+\\frac{64}{y}$.","x":"$S=xy+\\frac{64}{y}+\\frac{64}{x}$. Fazendo $S_x=y-\\frac{64}{x^2}=0$ e $S_y=x-\\frac{64}{y^2}=0$ obtém-se $x=y=4$, $z=2$, e $S=16+16+16=48$."}},{"s":"paraboloid-volume","t":"Paraboloid Volume","d":"medium","r":1400,"c":["double-integrals","areas-volumes"],"q":"Find the volume of the solid under the paraboloid $z=4-x^2-y^2$ and above the plane $z=0$.","k":"NTQzODE3ODIyMTQ3MjMxLjUy","at":"8\\pi","h":"The base is the disc $x^2+y^2\\le4$. Use polar coordinates.","x":"$\\int_0^{2\\pi}\\!\\int_0^2(4-r^2)\\,r\\,dr\\,d\\theta=2\\pi\\left[2r^2-\\frac{r^4}{4}\\right]_0^2=2\\pi\\cdot4=8\\pi$.","g":"original","pt":{"t":"Volume do Paraboloide","q":"Determine o volume do sólido abaixo do paraboloide $z=4-x^2-y^2$ e acima do plano $z=0$.","h":"A base é o disco $x^2+y^2\\le4$. Use coordenadas polares.","x":"$\\int_0^{2\\pi}\\!\\int_0^2(4-r^2)\\,r\\,dr\\,d\\theta=2\\pi\\left[2r^2-\\frac{r^4}{4}\\right]_0^2=2\\pi\\cdot4=8\\pi$."}},{"s":"reciprocal-swap","t":"Reciprocal Swap","d":"medium","r":1400,"c":["substitution","symmetry"],"q":"Evaluate $$\\int_{1/2}^{2}\\frac{1}{x}\\sin\\!\\left(x-\\frac1x\\right)dx.$$","k":"MC4w","at":"0","h":"Try the substitution $x=\\frac1u$.","x":"With $x=\\frac1u$, $\\frac{dx}{x}=-\\frac{du}{u}$, the limits swap, and $x-\\frac1x$ becomes $-\\left(u-\\frac1u\\right)$. The integral turns into its own negative, so it is $0$.","g":"original","pt":{"t":"Troca pelo Inverso","q":"Calcule $$\\int_{1/2}^{2}\\frac{1}{x}\\sin\\!\\left(x-\\frac1x\\right)dx.$$","h":"Experimente a substituição $x=\\frac1u$.","x":"Com $x=\\frac1u$, $\\frac{dx}{x}=-\\frac{du}{u}$, os limites de integração trocam, e $x-\\frac1x$ passa a $-\\left(u-\\frac1u\\right)$. O integral transforma-se no seu simétrico, logo é $0$."}},{"s":"sinc-to-the-power","t":"Sinc to the Power","d":"medium","r":1400,"c":["lhopital","exp-log"],"q":"Evaluate $$\\lim_{x\\to0}\\left(\\frac{\\sin x}{x}\\right)^{1/x^2}.$$","k":"MTQxNjA5ODQyNzE4NDY0OC4w","at":"e^{-1/6}","h":"Take logs. You will need $\\lim_{x\\to0}\\frac{\\sin x-x}{x^3}$.","x":"$\\ln L=\\lim\\frac{1}{x^2}\\ln\\frac{\\sin x}{x}$. Since $\\frac{\\sin x}{x}\\to1$, $\\ln\\frac{\\sin x}{x}\\sim\\frac{\\sin x}{x}-1=\\frac{\\sin x-x}{x}$, and $\\frac{\\sin x-x}{x^3}\\to-\\frac16$ (L'Hôpital three times). So $L=e^{-1/6}\\approx0.8465$.","g":"original","pt":{"t":"Sinc Elevado a uma Potência","q":"Calcule $$\\lim_{x\\to0}\\left(\\frac{\\sin x}{x}\\right)^{1/x^2}.$$","h":"Aplique logaritmos. Vai precisar de $\\lim_{x\\to0}\\frac{\\sin x-x}{x^3}$.","x":"$\\ln L=\\lim\\frac{1}{x^2}\\ln\\frac{\\sin x}{x}$. Como $\\frac{\\sin x}{x}\\to1$, $\\ln\\frac{\\sin x}{x}\\sim\\frac{\\sin x}{x}-1=\\frac{\\sin x-x}{x}$, e $\\frac{\\sin x-x}{x^3}\\to-\\frac16$ (Regra de Cauchy três vezes). Logo $L=e^{-1/6}\\approx0.8465$."}},{"s":"washer","t":"Washer","d":"medium","r":1400,"c":["areas-volumes"],"q":"The region between $y=x$ and $y=x^2$ is rotated about the $x$-axis. Find the volume.","k":"MTkzNjg3NDAyMDk3ODgxNC4w","at":"\\tfrac{2\\pi}{15}","h":"Washer method: $\\pi\\int(R^2-r^2)\\,dx$ with outer radius $x$ and inner radius $x^2$.","x":"$V=\\pi\\int_0^1(x^2-x^4)\\,dx=\\pi\\left(\\frac13-\\frac15\\right)=\\frac{2\\pi}{15}\\approx0.4189$.","g":"original","pt":{"t":"Anilha","q":"A região entre $y=x$ e $y=x^2$ roda em torno do eixo dos $x$. Determine o volume.","h":"Método das anilhas: $\\pi\\int(R^2-r^2)\\,dx$ com raio exterior $x$ e raio interior $x^2$.","x":"$V=\\pi\\int_0^1(x^2-x^4)\\,dx=\\pi\\left(\\frac13-\\frac15\\right)=\\frac{2\\pi}{15}\\approx0.4189$."}},{"s":"n-th-root-of-n-refined","t":"n-th Root of n, Refined","d":"medium","r":1400,"c":["seq-limits","exp-log"],"q":"Evaluate $\\displaystyle\\lim_{n\\to\\infty}\\frac{n\\left(\\sqrt[n]n-1\\right)}{\\ln n}$.","k":"MC4x","at":"1","h":"$\\sqrt[n]n=e^{\\ln n/n}$, and $\\frac{e^t-1}{t}\\to1$ as $t\\to0$.","x":"With $t_n=\\frac{\\ln n}{n}\\to0$: $\\frac{n(e^{t_n}-1)}{\\ln n}=\\frac{e^{t_n}-1}{t_n}\\to1$.","g":"university","pt":{"t":"Raiz de Índice n de n, Refinada","q":"Calcule $\\displaystyle\\lim_{n\\to\\infty}\\frac{n\\left(\\sqrt[n]n-1\\right)}{\\ln n}$.","h":"$\\sqrt[n]n=e^{\\ln n/n}$, e $\\frac{e^t-1}{t}\\to1$ quando $t\\to0$.","x":"Com $t_n=\\frac{\\ln n}{n}\\to0$: $\\frac{n(e^{t_n}-1)}{\\ln n}=\\frac{e^{t_n}-1}{t_n}\\to1$."}},{"s":"boundary-of-the-irrationals","t":"Boundary of the Irrationals","d":"medium","r":1450,"c":["sup-inf"],"q":"Let $R=\\{x\\in\\mathbb R:\\ 4|x-4|\\le|x+6|\\}$ and $S=\\mathbb R^+\\setminus\\mathbb Q$. The boundary of $R\\cap S$ is an interval. Find its length.","k":"MzMzMzMzMzMzMzMzMzMzLjU=","at":"\\tfrac{16}{3}","h":"First find $R$. Then think about which points are arbitrarily close both to irrationals in $R$ and to points outside $R\\cap S$.","x":"$R=\\left[2,\\frac{22}{3}\\right]$, so $R\\cap S$ is the set of irrationals in that interval. Every point of $\\left[2,\\frac{22}{3}\\right]$ has irrationals of the interval and rationals arbitrarily close, so the boundary is the whole interval, of length $\\frac{16}{3}$. Also $\\sup=\\frac{22}{3}$ and $\\inf=2$, but there is no max or min since both are rational.","g":"university","pt":{"t":"Fronteira dos Irracionais","q":"Sejam $R=\\{x\\in\\mathbb R:\\ 4|x-4|\\le|x+6|\\}$ e $S=\\mathbb R^+\\setminus\\mathbb Q$. A fronteira de $R\\cap S$ é um intervalo. Determine o seu comprimento.","h":"Determine primeiro $R$. Depois pense em que pontos estão arbitrariamente próximos tanto de irracionais de $R$ como de pontos fora de $R\\cap S$.","x":"$R=\\left[2,\\frac{22}{3}\\right]$, logo $R\\cap S$ é o conjunto dos irracionais desse intervalo. Todo o ponto de $\\left[2,\\frac{22}{3}\\right]$ tem irracionais do intervalo e racionais arbitrariamente próximos, logo a fronteira é o intervalo todo,
