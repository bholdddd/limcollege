 entre pontos é $\\|u-v\\|$. Em funções, $\\langle f,g\\rangle=\\int_a^bfg$ também é um produto interno.\n\n**Exemplo.** Para $u=(1,2,2)$ e $v=(2,0,1)$: $\\langle u,v\\rangle=4$, $\\|u\\|=3$, $\\|v\\|=\\sqrt5$."}},{"k":"la-orth","sub":"la","n":"Orthogonality, projections & Gram–Schmidt","d":"Perpendicular pieces, closest points and orthonormal bases.","b":"**What it is.** $u\\perp v$ when $\\langle u,v\\rangle=0$. The orthogonal complement $S^\\perp$ is everything perpendicular to $S$, with $\\dim S+\\dim S^\\perp=n$; also $(\\operatorname{Col}A^T)^\\perp=\\operatorname{Nul}A$. Each $x$ splits uniquely as $x=p+q$ with $p\\in S$, $q\\in S^\\perp$; $p=\\operatorname{proj}_Sx$ is the point of $S$ closest to $x$, and $\\|q\\|$ is the distance from $x$ to $S$.\n\n**How to use it.** Onto a line: $\\operatorname{proj}_vx=\\frac{\\langle x,v\\rangle}{\\langle v,v\\rangle}v$. Onto a subspace with an orthogonal basis $v_1,\\dots,v_k$: add the projections onto each $v_i$. Gram–Schmidt makes any basis orthogonal: keep $v_1$, then subtract from each new vector its projections onto the previous ones. Onto a hyperplane $a\\cdot x=0$, it is easier to remove the normal part: $x-\\frac{\\langle x,a\\rangle}{\\|a\\|^2}a$.\n\n**Example.** The distance from $(1,1,1)$ to the plane $x+y+z=0$ is $\\frac{|1+1+1|}{\\sqrt3}=\\sqrt3$.","pt":{"n":"Ortogonalidade, projeções e Gram-Schmidt","d":"Partes perpendiculares, pontos mais próximos e bases ortonormadas.","b":"**O que é.** $u\\perp v$ quando $\\langle u,v\\rangle=0$. O complemento ortogonal $S^\\perp$ é tudo o que é perpendicular a $S$, com $\\dim S+\\dim S^\\perp=n$; também $(\\operatorname{Col}A^T)^\\perp=\\operatorname{Nul}A$. Cada $x$ decompõe-se de forma única como $x=p+q$ com $p\\in S$ e $q\\in S^\\perp$; $p=P_S(x)$ é o ponto de $S$ mais próximo de $x$, e $\\|q\\|$ é a distância de $x$ a $S$.\n\n**Como usar.** Sobre uma reta: $P_v(x)=\\frac{\\langle x,v\\rangle}{\\langle v,v\\rangle}v$. Sobre um subespaço com uma base ortogonal $v_1,\\dots,v_k$: some as projeções sobre cada $v_i$. O método de ortogonalização de Gram-Schmidt torna qualquer base ortogonal: mantenha $v_1$ e depois subtraia a cada novo vetor as projeções sobre os anteriores. Sobre um hiperplano $a\\cdot x=0$, é mais fácil tirar a parte normal: $x-\\frac{\\langle x,a\\rangle}{\\|a\\|^2}a$.\n\n**Exemplo.** A distância de $(1,1,1)$ ao plano $x+y+z=0$ é $\\frac{|1+1+1|}{\\sqrt3}=\\sqrt3$."}},{"k":"la-lsq","sub":"la","n":"Least squares","d":"The best approximate solution when a system has none.","b":"**What it is.** When $Ax=b$ is impossible, a least-squares solution $\\hat x$ minimizes $\\|Ax-b\\|$. It satisfies the normal equations $A^TA\\hat x=A^Tb$, and $A\\hat x$ is the projection of $b$ onto $\\operatorname{Col}A$. If the columns of $A$ are independent, $\\hat x$ is unique.\n\n**How to use it.** Fitting a line $y=c_0+c_1t$ to points $(t_i,y_i)$: the rows of $A$ are $(1,t_i)$ and $b$ lists the $y_i$; solve the $2\\times2$ normal equations. The fitted line always passes through $(\\bar t,\\bar y)$, and the slope is $\\frac{\\sum(t_i-\\bar t)(y_i-\\bar y)}{\\sum(t_i-\\bar t)^2}$. The least-squares error is $\\|b-A\\hat x\\|$.\n\n**Example.** For the points $(0,0),(1,1),(2,1)$: $\\bar t=1$, $\\bar y=\\frac23$, slope $\\frac12$, so the line is $y=\\frac16+\\frac12t$.","pt":{"n":"Mínimos quadrados","d":"A melhor solução aproximada quando um sistema não tem solução.","b":"**O que é.** Quando $Ax=b$ é impossível, uma solução de mínimos quadrados $\\hat x$ minimiza $\\|Ax-b\\|$. Satisfaz as equações normais $A^TA\\hat x=A^Tb$, e $A\\hat x$ é a projeção de $b$ sobre $\\operatorname{Col}A$. Se as colunas de $A$ forem independentes, $\\hat x$ é única.\n\n**Como usar.** Ajustar uma reta $y=c_0+c_1t$ a pontos $(t_i,y_i)$: as linhas de $A$ são $(1,t_i)$ e $b$ lista os $y_i$; resolva as equações normais $2\\times2$. A reta ajustada passa sempre por $(\\bar t,\\bar y)$, e o declive é $\\frac{\\sum(t_i-\\bar t)(y_i-\\bar y)}{\\sum(t_i-\\bar t)^2}$. O erro de mínimos quadrados é $\\|b-A\\hat x\\|$.\n\n**Exemplo.** Para os pontos $(0,0),(1,1),(2,1)$: $\\bar t=1$, $\\bar y=\\frac23$, declive $\\frac12$, logo a reta é $y=\\frac16+\\frac12t$."}},{"k":"la-geometry","sub":"la","n":"Cross product, lines & planes","d":"Areas, volumes and the geometry of ℝ³.","b":"**What it is.** In $\\mathbb R^3$, $u\\times v$ is perpendicular to both $u$ and $v$, with length $\\|u\\|\\|v\\|\\sin\\theta$, the area of the parallelogram they span. It is the formal determinant with first row $e_1,e_2,e_3$. The scalar triple product $u\\cdot(v\\times w)=\\det[u\\ v\\ w]$ is the signed volume of the parallelepiped.\n\n**How to use it.** A plane through $p$ with normal $n$: $n\\cdot(x-p)=0$; three points give $n=(q-p)\\times(r-p)$. A line: $x=p+t\\,d$. Distance from a point $q$ to the plane $ax+by+cz=d$: $\\frac{|aq_1+bq_2+cq_3-d|}{\\sqrt{a^2+b^2+c^2}}$. Triangle area is half the parallelogram; tetrahedron volume is a sixth of the parallelepiped.\n\n**Example.** $(1,0,0)\\times(0,1,0)=(0,0,1)$, and the triangle $(0,0,0),(1,0,0),(0,1,0)$ has area $\\frac12$.","pt":{"n":"Produto vetorial, retas e planos","d":"Áreas, volumes e a geometria de ℝ³.","b":"**O que é.** Em $\\mathbb R^3$, $u\\times v$ é perpendicular a $u$ e a $v$, com comprimento $\\|u\\|\\|v\\|\\sin\\theta$, a área do paralelogramo que definem. É o determinante formal com primeira linha $e_1,e_2,e_3$. O produto misto $u\\cdot(v\\times w)=\\det[u\\ v\\ w]$ é o volume (com sinal) do paralelepípedo.\n\n**Como usar.** Um plano que passa por $p$ com vetor normal $n$: $n\\cdot(x-p)=0$; três pontos dão $n=(q-p)\\times(r-p)$. Uma reta: $x=p+t\\,d$. Distância de um ponto $q$ ao plano $ax+by+cz=d$: $\\frac{|aq_1+bq_2+cq_3-d|}{\\sqrt{a^2+b^2+c^2}}$. A área de um triângulo é metade da do paralelogramo; o volume de um tetraedro é um sexto do do paralelepípedo.\n\n**Exemplo.** $(1,0,0)\\times(0,1,0)=(0,0,1)$, e o triângulo $(0,0,0),(1,0,0),(0,1,0)$ tem área $\\frac12$."}},{"k":"la-orthmat","sub":"la","n":"Orthogonal matrices, rotations & reflections","d":"Matrices that preserve lengths and angles.","b":"**What it is.** $Q$ is orthogonal if $Q^TQ=I$, so $Q^{-1}=Q^T$: its columns are an orthonormal basis. Orthogonal matrices preserve inner products, lengths and angles, and $\\det Q=\\pm1$. In the plane they are rotations ($\\det=1$) and reflections across a line ($\\det=-1$). Complex eigenvalues of an orthogonal matrix have modulus $1$.\n\n**How to use it.** The reflection across the line spanned by a unit vector $u$ is $2uu^T-I$; across the hyperplane perpendicular to $u$ it is $I-2uu^T$. A rotation of $\\mathbb R^3$ fixes its axis (eigenvalue $1$) and its trace is $1+2\\cos\\theta$. Products of orthogonal matrices are orthogonal; rotating by $\\alpha$ then $\\beta$ rotates by $\\alpha+\\beta$.\n\n**Example.** $\\begin{bmatrix}0&1\\\\1&0\\end{bmatrix}$ is the reflection across $y=x$: it is orthogonal with determinant $-1$.","pt":{"n":"Matrizes ortogonais, rotações e reflexões","d":"Matrizes que preservam comprimentos e ângulos.","b":"**O que é.** $Q$ é ortogonal se $Q^TQ=I$, logo $Q^{-1}=Q^T$: as colunas formam uma base ortonormada. As matrizes ortogonais preservam produtos internos, comprimentos e ângulos, e $\\det Q=\\pm1$. No plano são rotações ($\\det=1$) e reflexões em relação a uma reta ($\\det=-1$). Os valores próprios complexos de uma matriz ortogonal têm módulo $1$.\n\n**Como usar.** A reflexão em relação à reta gerada por um vetor unitário $u$ é $2uu^T-I$; em relação ao hiperplano perpendicular a $u$ é $I-2uu^T$. Uma rotação de $\\mathbb R^3$ fixa o seu eixo (valor próprio $1$) e tem traço $1+2\\cos\\theta$. Produtos de matrizes ortogonais são ortogonais; rodar $\\alpha$ e depois $\\beta$ é rodar $\\alpha+\\beta$.\n\n**Exemplo.** $\\begin{bmatrix}0&1\\\\1&0\\end{bmatrix}$ é a reflexão em relação a $y=x$: é ortogonal com determinante $-1$."}},{"k":"la-symmetric","sub":"la","n":"Symmetric matrices & quadratic forms","d":"Real eigenvalues, orthogonal eigenvectors, and classifying forms and conics.","b":"**What it is.** A real symmetric matrix ($A^T=A$) has real eigenvalues and an orthonormal basis of eigenvectors: $A=QDQ^T$ with $Q$ orthogonal (the spectral theorem). A quadratic form is $q(x)=x^TAx$ with $A$ symmetric; in eigenvector coordinates it becomes $\\lambda_1y_1^2+\\dots+\\lambda_ny_n^2$.\n\n**How to use it.** Classify by eigenvalue signs: all $>0$ positive definite, all $\\ge0$ positive semidefinite, mixed signs indefinite. Sylvester's test: positive definite exactly when all leading principal minors are positive. On the unit sphere, $q$ ranges between the smallest and largest eigenvalue. Eigenvectors for different eigenvalues are automatically orthogonal. For conics $ax^2+bxy+cy^2=1$, the eigenvalues of $\\begin{bmatrix}a&b/2\\\\b/2&c\\end{bmatrix}$ decide ellipse (both positive) or hyperbola (opposite signs).\n\n**Example.** $x^2+4xy+y^2$ has matrix $\\begin{bmatrix}1&2\\\\2&1\\end{bmatrix}$, eigenvalues $3$ and $-1$: indefinite.","pt":{"n":"Matrizes simétricas e formas quadráticas","d":"Valores próprios reais, vetores próprios ortogonais e a classificação de formas e cónicas.","b":"**O que é.** Uma matriz real simétrica ($A^T=A$) tem valores próprios reais e uma base ortonormada de vetores próprios: $A=QDQ^T$ com $Q$ ortogonal (o teorema espectral). Uma forma quadrática é $q(x)=x^TAx$ com $A$ simétrica; nas coordenadas dos vetores próprios fica $\\lambda_1y_1^2+\\dots+\\lambda_ny_n^2$.\n\n**Como usar.** Classifique pelos sinais dos valores próprios: todos $>0$ definida positiva, todos $\\ge0$ semidefinida positiva, sinais mistos indefinida. Critério de Sylvester: definida positiva exatamente quando todos os menores principais líderes são positivos. Na esfera unitária, $q$ varia entre o menor e o maior valor próprio. Vetores próprios de valores próprios diferentes são automaticamente ortogonais. Para cónicas $ax^2+bxy+cy^2=1$, os valores próprios de $\\begin{bmatrix}a&b/2\\\\b/2&c\\end{bmatrix}$ decidem entre elipse (ambos positivos) e hipérbole (sinais opostos).\n\n**Exemplo.** $x^2+4xy+y^2$ tem matriz $\\begin{bmatrix}1&2\\\\2&1\\end{bmatrix}$, com valores próprios $3$ e $-1$: indefinida."}},{"k":"la-cayley","sub":"la","n":"Cayley–Hamilton & minimal polynomial","d":"Every matrix satisfies its own characteristic polynomial.","b":"**What it is.** Cayley–Hamilton: if $p(\\lambda)=\\det(A-\\lambda I)$, then $p(A)=0$. For $2\\times2$ this says $A^2-(\\operatorname{tr}A)A+(\\det A)I=0$. The minimal polynomial is the monic polynomial of least degree with $m(A)=0$; it divides $p$, has the same roots, and $A$ is diagonalizable exactly when $m$ has no repeated roots.\n\n**How to use it.** Reduce high powers: divide $\\lambda^k$ by $p(\\lambda)$ and keep the remainder, so $A^k$ becomes a combination of $I,A,\\dots,A^{n-1}$. Inverses too: from $p(A)=0$, solve for $A^{-1}$ as a polynomial in $A$. If $A^2=A$ (a projection) the eigenvalues are $0$ and $1$, and $\\operatorname{tr}A=\\operatorname{rank}A$.\n\n**Example.** For $A=\\begin{bmatrix}1&1\\\\1&0\\end{bmatrix}$: $A^2=A+I$, so $A^{-1}=A-I$.","pt":{"n":"Teorema de Cayley-Hamilton e polinómio mínimo","d":"Toda a matriz satisfaz o seu próprio polinómio característico.","b":"**O que é.** Teorema de Cayley-Hamilton: se $p(\\lambda)=\\det(A-\\lambda I)$, então $p(A)=0$. Para $2\\times2$ isto diz $A^2-(\\operatorname{tr}A)A+(\\det A)I=0$. O polinómio mínimo é o polinómio mónico de menor grau com $m(A)=0$; divide $p$, tem as mesmas raízes, e $A$ é diagonalizável exatamente quando $m$ não tem raízes repetidas.\n\n**Como usar.** Reduza potências altas: divida $\\lambda^k$ por $p(\\lambda)$ e fique com o resto, de modo que $A^k$ passa a combinação de $I,A,\\dots,A^{n-1}$. O mesmo para inversas: de $p(A)=0$, isole $A^{-1}$ como polinómio em $A$. Se $A^2=A$ (uma projeção), os valores próprios são $0$ e $1$, e $\\operatorname{tr}A=\\operatorname{car}A$.\n\n**Exemplo.** Para $A=\\begin{bmatrix}1&1\\\\1&0\\end{bmatrix}$: $A^2=A+I$, logo $A^{-1}=A-I$."}},{"k":"la-jordan","sub":"la","n":"Jordan form & nilpotent matrices","d":"The canonical form of a matrix that can't be diagonalized.","b":"**What it is.** Every complex square matrix is similar to a Jordan matrix: blocks $J_k(\\lambda)$ with $\\lambda$ on the diagonal and $1$ just above it. For each eigenvalue, the number of blocks is its geometric multiplicity, and the sizes add up to its algebraic multiplicity. $N$ is nilpotent if $N^k=0$ for some $k$; then all its eigenvalues are $0$.\n\n**How to use it.** Block sizes are read from ranks: the number of blocks of size at least $k$ for $\\lambda$ is $\\operatorname{rank}(A-\\lambda I)^{k-1}-\\operatorname{rank}(A-\\lambda I)^k$. The size of the largest block for $\\lambda$ is its exponent in the minimal polynomial. Powers of a block: $J_k(\\lambda)^m$ has $\\binom{m}{j}\\lambda^{m-j}$ on the $j$-th superdiagonal.\n\n**Example.** A nilpotent $4\\times4$ matrix of rank $2$ has $4-2=2$ Jordan blocks.","pt":{"n":"Forma canónica de Jordan e matrizes nilpotentes","d":"A forma canónica de uma matriz que não é diagonalizável.","b":"**O que é.** Toda a matriz quadrada complexa é semelhante a uma matriz de Jordan: blocos $J_k(\\lambda)$ com $\\lambda$ na diagonal e $1$ imediatamente acima. Para cada valor próprio, o número de blocos é a multiplicidade geométrica e os tamanhos somam a multiplicidade algébrica. $N$ é nilpotente se $N^k=0$ para algum $k$; então todos os seus valores próprios são $0$.\n\n**Como usar.** Os tamanhos dos blocos leem-se nas características: o número de blocos de tamanho pelo menos $k$ associados a $\\lambda$ é $\\operatorname{car}(A-\\lambda I)^{k-1}-\\operatorname{car}(A-\\lambda I)^k$. O tamanho do maior bloco de $\\lambda$ é o seu expoente no polinómio mínimo. Potências de um bloco: $J_k(\\lambda)^m$ tem $\\binom{m}{j}\\lambda^{m-j}$ na $j$-ésima sobrediagonal.\n\n**Exemplo.** Uma matriz nilpotente $4\\times4$ de característica $2$ tem $4-2=2$ blocos de Jordan."}},{"k":"la-special","sub":"la","n":"Special matrices & determinant tricks","d":"Vandermonde, circulant, block and rank-one structure.","b":"**What it is.** Some families have closed-form determinants. Vandermonde: $\\det[x_i^{j-1}]=\\prod_{i<j}(x_j-x_i)$. Rank-one updates: $\\det(I+uv^T)=1+v^Tu$, and $J$ (all ones, $n\\times n$) has eigenvalues $n$ and $0$. Block triangular matrices: $\\det\\begin{bmatrix}A&B\\\\0&D\\end{bmatrix}=\\det A\\det D$. Circulant matrices have eigenvalues $c_0+c_1\\omega+\\dots+c_{n-1}\\omega^{n-1}$ over the $n$-th roots of unity $\\omega$.\n\n**How to use it.** Look for structure before expanding: subtract consecutive rows to create zeros, write the matrix as $aI+bJ$ (eigenvalues $a+nb$ once and $a$ with multiplicity $n-1$), factor it as a product of triangular matrices, or find the eigenvalues and multiply them. Tridiagonal determinants satisfy a two-term recurrence from expanding along the first row.\n\n**Example.** $\\det(I_n+J_n)=n+1$, since the eigenvalues are $n+1$ once and $1$ otherwise.","pt":{"n":"Matrizes especiais e truques com determinantes","d":"Estruturas de Vandermonde, circulantes, por blocos e de característica um.","b":"**O que é.** Algumas famílias têm determinantes em forma fechada. Vandermonde: $\\det[x_i^{j-1}]=\\prod_{i<j}(x_j-x_i)$. Perturbações de característica um: $\\det(I+uv^T)=1+v^Tu$, e $J$ (só uns, $n\\times n$) tem valores próprios $n$ e $0$. Matrizes triangulares por blocos: $\\det\\begin{bmatrix}A&B\\\\0&D\\end{bmatrix}=\\det A\\det D$. As matrizes circulantes têm valores próprios $c_0+c_1\\omega+\\dots+c_{n-1}\\omega^{n-1}$ sobre as raízes $n$-ésimas da unidade $\\omega$.\n\n**Como usar.** Procure estrutura antes de desenvolver: subtraia linhas consecutivas para criar zeros, escreva a matriz como $aI+bJ$ (valores próprios $a+nb$ uma vez e $a$ com multiplicidade $n-1$), fatorize-a como produto de matrizes triangulares, ou encontre os valores próprios e multiplique-os. Os determinantes tridiagonais satisfazem uma recorrência de dois termos, desenvolvendo segundo a primeira linha.\n\n**Exemplo.** $\\det(I_n+J_n)=n+1$, porque os valores próprios são $n+1$ uma vez e $1$ nas restantes."}}],"legacy":{"1":"sine-ratio","2":"conjugate-pair","3":"count-the-flats","4":"lens","5":"limit-as-slope","6":"root-minus-line","7":"two-waves","8":"under-the-arch","9":"cosine-gap","10":"mean-value-point","11":"ten-powers","12":"bend-point","13":"cubic-valley","14":"inflating-balloon","15":"log-over-x","16":"odd-one-out","17":"peak-of-decay","18":"average-arch","19":"compound-growth","20":"folding-box","21":"gaussian-bump","22":"staircase","23":"telescope","24":"implicit-slope","25":"second-contact","26":"second-look","27":"square-of-sine","28":"three-crossings","29":"tiny-tower","30":"base-swap","31":"chain-through-an-integral","32":"inverse-slope","33":"ninety-ninth-derivative","34":"riemann-squares","35":"self-power-slope","36":"sliding-ladder","37":"smooth-seam","38":"tangent-through-the-origin","39":"weighted-product","40":"ellipse-rectangle","41":"exponential-meets-parabola","42":"shadow-runner","43":"closest-to-the-parabola","44":"tan-minus-sin","45":"lowest-self-power","46":"huge-power","47":"disguised-linear-system","48":"median-minimizer","49":"odometer","50":"squared-times-cubed","51":"tangent-ceiling","52":"three-root-window","53":"weighted-am-gm","54":"bell-rectangle","55":"binomial-derivative","56":"cosine-power","57":"cube-root-asymptote","58":"cylinder-in-a-cone","59":"doubling-curve","60":"half-disc-in-disguise","61":"harmonic-window","62":"one-bump","63":"sine-minus-tangent","64":"swapped-powers","65":"symmetric-semicircle","66":"two-square-roots","67":"additive-plus","68":"arctan-riemann-sum","69":"floor-of-a-square","70":"gap-to-the-line","71":"log-tangent","72":"log-vs-root","73":"power-meets-square","74":"self-referential-integral","75":"seven-crossings","76":"tangent-region","77":"triangle-in-a-circle","78":"balanced-reciprocals","79":"binomial-integral","80":"cone-in-a-sphere","81":"log-swap","82":"root-integral-ratio","83":"the-irrational-exponent","84":"three-tangents","85":"average-near-zero","86":"corner-rod","87":"moving-window","88":"reciprocal-swap","89":"sinc-to-the-power","90":"kings-arctangent","91":"log-of-one-plus-tangent","92":"sine-product-peak","93":"factorial-root","94":"product-of-steps","95":"tangent-twins","96":"eulers-correction","97":"kings-reciprocal-sine","98":"double-rolle","99":"triangle-sines","100":"area-under-the-inverse-sine-wave","101":"best-cubic-correction","102":"clean-cancellation","103":"ellipse-triangle","104":"power-mean-collapse","105":"quartic-over-square","106":"tiny-increments","107":"exactly-one-root","108":"exponent-shield","109":"integrating-an-inverse","110":"pis-famous-gap","111":"reciprocal-on-the-range","112":"second-order-gap","113":"weighted-distance","114":"arctangent-telescope","115":"square-root-growth","116":"squeezed-self-power","117":"thrice-cubed","118":"chebyshevs-echo","119":"inverse-pair","120":"mean-value-drift","121":"speed-limit","122":"when-powers-lose","123":"flattest-parabola","124":"logistic-decay","125":"doubling-chain","126":"infinite-tower","127":"least-squares","128":"log-over-arctan-base","129":"floor-difference","130":"riemann-error","131":"log-sine","132":"six-trig-functions","133":"iterated-sine","134":"minimum-energy","135":"bracketing-e","136":"nested-radicals","137":"a-rational-inequality","138":"area-and-side-squares","139":"difference-of-roots","140":"symmetric-cubic-bound","141":"trigonometric-sandwich","142":"almost-additive","143":"fibonacci-in-disguise","144":"four-fractions","145":"palindromic-quartic","146":"cubes-under-a-constraint","147":"cyclic-product","148":"scaling-functional-equation","149":"squares-off-by-one","150":"exactly-one-partner","151":"square-roots-sum","152":"two-interleaved-sequences","153":"vanishing-beyond-two","154":"binary-mirror","155":"floors-of-powers-of-two","156":"the-m-bius-shape","157":"fifth-powers","158":"strictly-below-it <script>
(() => {
"use strict";

/* ============================== data ============================== */
const DATA = JSON.parse(document.getElementById("data").textContent);
/* two subjects, rated separately: calculus ("calc") and linear algebra ("la"). Problems are numbered within their subject. */
const SUBJECTS = ["calc", "la"];
const ALL_PROBS = DATA.problems;
ALL_PROBS.forEach(p => { if (p.sub !== "la") p.sub = "calc"; });
const PBY = Object.fromEntries(SUBJECTS.map(s => [s, ALL_PROBS.filter(p => p.sub === s)]));
SUBJECTS.forEach(s => PBY[s].forEach((p, i) => { p.n = i + 1; }));
/* Every problem is worth a fixed number of points: you gain them when you solve it and lose them when you miss it.
   Points grow with the square of the problem's rating; each subject has its own scale (so that both are worth the same in
   total), boosted 7.92x: most of a subject's easy problems are enough to reach Limitless, and ratings keep climbing past it. */
const PTS_BOOST = 7.92;
const PTS_SCALE = { calc: 0.0358 * PTS_BOOST, la: 0.0623 * PTS_BOOST };
const ptsFor = (r, sub) => Math.max(1, Math.round((PTS_SCALE[sub] || PTS_SCALE.calc) * (r / 100) ** 2));
ALL_PROBS.forEach(p => { p.pts = ptsFor(p.r, p.sub); });
const winPts = (p, hint) => hint ? Math.max(1, Math.round(p.pts / 2)) : p.pts;
const BY_SLUG = new Map(ALL_PROBS.map(p => [p.s, p]));
const ALL_CONCEPTS = DATA.concepts;
ALL_CONCEPTS.forEach(c => { if (c.sub !== "la") c.sub = "calc"; });
const CBYSUB = Object.fromEntries(SUBJECTS.map(s => [s, ALL_CONCEPTS.filter(c => c.sub === s)]));
const CBY = new Map(ALL_CONCEPTS.map(c => [c.k, c]));
const CTOTAL = Object.fromEntries(ALL_CONCEPTS.map(c => [c.k, ALL_PROBS.filter(p => p.c.includes(c.k)).length]));
/* the subject being browsed: Home, Problems, Learn, Ranks, Leaderboard and profiles all follow it */
let SUBJ = "calc";
const SP = (sub = SUBJ) => PBY[sub];
const SC = (sub = SUBJ) => CBYSUB[sub];
const LEGACY = DATA.legacy || {};
const DIFFS = ["easy", "medium", "hard", "imo"];
const DAY = 24 * 60 * 60 * 1000;

/* ============================== language ============================== */
/* English is the default. Portuguese follows the course's conventions: sen, tg, arctg, sh/ch/th, argsh, log, ]a,b[ and decimal commas. */
const LANG_KEY = "limcollege:lang";
let LANG = "en";
const L = (en, pt) => LANG === "pt" ? pt : en;
const LOCALE = () => LANG === "pt" ? "pt-PT" : undefined;
const P_ = (p, f) => (LANG === "pt" && p.pt && p.pt[f]) || p[f];
const C_ = (c, f) => (LANG === "pt" && c.pt && c.pt[f]) || c[f];
const ptitle = p => P_(p, "t");
const TEX_PT = [
  [/\\operatorname\{arsinh\}/g, "\\operatorname{argsh}"], [/\\operatorname\{arcosh\}/g, "\\operatorname{argch}"], [/\\operatorname\{artanh\}/g, "\\operatorname{argth}"],
  [/\\arcsin(?![a-zA-Z])/g, "\\operatorname{arcsen}"], [/\\arctan(?![a-zA-Z])/g, "\\operatorname{arctg}"], [/\\operatorname\{arccot\}/g, "\\operatorname{arccotg}"],
  [/\\sinh(?![a-zA-Z])/g, "\\operatorname{sh}"], [/\\cosh(?![a-zA-Z])/g, "\\operatorname{ch}"], [/\\tanh(?![a-zA-Z])/g, "\\operatorname{th}"],
  [/\\sin(?![a-zA-Z])/g, "\\operatorname{sen}"], [/\\tan(?![a-zA-Z])/g, "\\operatorname{tg}"], [/\\cot(?![a-zA-Z])/g, "\\operatorname{cotg}"],
  [/\\csc(?![a-zA-Z])/g, "\\operatorname{cosec}"], [/\\ln(?![a-zA-Z])/g, "\\log"], [/(\d)\.(?=\d)/g, "$1{,}"]
];
const texPT = s => TEX_PT.reduce((a, [re, to]) => a.replace(re, to), s);
const MATH_RE = /\$\$[\s\S]+?\$\$|\$[^$]+?\$/g;
const mathL = s => LANG === "pt" ? String(s).replace(MATH_RE, texPT) : String(s);
const srcL = s => LANG === "pt" ? s.replace(" · Problem ", " · Problema ").replace("(with ", "(com ") : s;
const SUBJ_NAME = { get calc() { return L("Calculus", "Cálculo"); }, get la() { return L("Linear Algebra", "Álgebra Linear"); } };
const SUBJ_TAG = { get calc() { return L("Calc", "Cálc"); }, get la() { return L("LA", "AL"); } };

const DIFF_LABEL = { get easy() { return L("Easy", "Fácil"); }, get medium() { return L("Medium", "Médio"); }, get hard() { return L("Hard", "Difícil"); }, imo: "IMO" };
const ans = p => parseFloat(atob(p.k).split("").reverse().join(""));
const pnum = p => "#" + String(p.n).padStart(3, "0");
const conceptName = k => { const c = CBY.get(k); return c ? C_(c, "n") : k; };

const TIER_NAMES = {
  en: ["Iron", "Bronze", "Silver", "Gold", "Platinum", "Emerald", "Master", "Grandmaster", "Limitless"],
  pt: ["Ferro", "Bronze", "Prata", "Ouro", "Platina", "Esmeralda", "Mestre", "Grão-Mestre", "Ilimitado"]
};
const TIERS = [
  { glyph: "ε", c: "#8e959d" },
  { glyph: "δ", c: "#cd8752" },
  { glyph: "Δ", c: "#c6cfd9" },
  { glyph: "Σ", c: "#f2c14e" },
  { glyph: "∂", c: "#46d6c4" },
  { glyph: "∇", c: "#35d07a" },
  { glyph: "∫", c: "#a873ff" },
  { glyph: "Ω", c: "#ff5270" },
  { glyph: "∞", c: "#ffffff" }
].map((T, i) => Object.defineProperty(T, "name", { get: () => TIER_NAMES[LANG][i], enumerable: true }));
const DIVS = ["I", "II", "III"];
const FLOORS = [0, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300, 2400, 2500, 2600, 2700, 2800, 2900];
const START = 500;

function rankOf(r) {
  let i = 0;
  for (let j = 0; j < FLOORS.length; j++) if (r >= FLOORS[j]) i = j;
  const t = Math.floor(i / 3);
  return { i, t, tier: TIERS[t], div: DIVS[i % 3], lo: FLOORS[i], hi: i + 1 < FLOORS.length ? FLOORS[i + 1] : null, label: TIERS[t].name + " " + DIVS[i % 3] };
}

/* ============================== emblems ============================== */
let gid = 0;
function emblem(t, cls = "") {

function drawChart(hostId = "chart", series = null, emptyMsg = null) {
  const host = document.getElementById(hostId);
  if (!host) return;
  const W = Math.max(280, host.clientWidth), H = 220, padL = 44, padR = 12, padT = 12, padB = 24;
  const pts = series || [START, ...REC().hist.map(h => h.r)];
  if (pts.length < 2) {
    host.innerHTML = `<div class="chart-empty">${emptyMsg || L(`Your rating line starts with your first submission.<br>Everyone begins at ${START}, ${rankOf(START).label}.`, `A sua linha de rating começa com a primeira resposta.<br>Todos começam em ${START}, ${rankOf(START).label}.`)}</div>`;
    return;
  }
  const now = pts[pts.length - 1];
  let lo = Math.min(...pts), hi = Math.max(...pts);
  lo = Math.max(0, Math.floor((lo - 60) / 100) * 100); hi = Math.ceil((hi + 60) / 100) * 100;
  const x = i => padL + (pts.length === 1 ? 0 : i / (pts.length - 1)) * (W - padL - padR);
  const y = r => padT + (1 - (r - lo) / (hi - lo)) * (H - padT - padB);
  let bands = "", labels = "";
  for (let i = 0; i < FLOORS.length; i++) {
    const f = FLOORS[i];
    if (f > lo && f < hi && i % 3 === 0) {
      const t = i / 3;
      bands += `<line x1="${padL}" x2="${W - padR}" y1="${y(f)}" y2="${y(f)}" stroke="${tierColor(t)}" stroke-opacity=".35" stroke-dasharray="3 4"/>`;
      labels += `<text x="${W - padR}" y="${y(f) - 4}" text-anchor="end" font-size="10" fill="${tierColor(t)}" fill-opacity=".8">${TIERS[t].name}</text>`;
    }
  }
  const step = (hi - lo) <= 400 ? 100 : (hi - lo) <= 1000 ? 200 : 500;
  let grid = "";
  for (let r = Math.ceil(lo / step) * step; r <= hi; r += step) grid += `<line x1="${padL}" x2="${W - padR}" y1="${y(r)}" y2="${y(r)}" stroke="#212932"/><text x="${padL - 8}" y="${y(r) + 3}" text-anchor="end" font-size="10" fill="#6b7783">${r}</text>`;
  const line = pts.map((r, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(r).toFixed(1)}`).join("");
  const area = `${line}L${x(pts.length - 1).toFixed(1)},${H - padB}L${padL},${H - padB}Z`;
  const rk = rankOf(now), col = tierColor(rk.t), gidA = "ar" + hostId;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L(`Rating over time, now ${now}`, `Rating ao longo do tempo, agora ${now}`)}" style="font-family:var(--mono)">
    <defs><linearGradient id="${gidA}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${bands}${labels}
    <path d="${area}" fill="url(#${gidA})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length - 1)}" cy="${y(now)}" r="4" fill="${col}"/>
    <text x="${padL}" y="${H - 6}" font-size="10" fill="#6b7783">${L("start", "início")}</text><text x="${W - padR}" y="${H - 6}" font-size="10" text-anchor="end" fill="#6b7783">${L("now", "agora")}</text>
  </svg>`;
}

function filtered() {
  const q = UI.q.trim().toLowerCase();
  const list = SP().filter(p => {
    const st = statusOf(p);
    return (!UI.diff.length || UI.diff.includes(p.d)) &&
      (UI.set === "all" || p.g === UI.set) &&
      (UI.concept === "all" || p.c.includes(UI.concept)) &&
      (UI.status === "all" || (UI.status === "unsolved" && st !== "solved") || UI.status === st) &&
      (!q || ptitle(p).toLowerCase().includes(q) || String(p.n) === q.replace("#", "").replace(/^0+/, "") || p.c.some(k => conceptName(k).toLowerCase().includes(q)) || srcL(p.src || "").toLowerCase().includes(q));
  });
  const di = d => DIFFS.indexOf(d);
  const sorters = {
    "diff-asc": (a, b) => di(a.d) - di(b.d) || a.r - b.r || a.n - b.n,
    "diff-desc": (a, b) => di(b.d) - di(a.d) || b.r - a.r || a.n - b.n,
    "rating-asc": (a, b) => a.r - b.r || a.n - b.n,
    "rating-desc": (a, b) => b.r - a.r || a.n - b.n,
    "title": (a, b) => ptitle(a).localeCompare(ptitle(b), LOCALE())
  };
  return list.sort(sorters[UI.sort] || sorters["diff-asc"]);
}

function trPool() {
  if (TR.focus && TR_BY.has(TR.focus)) return [TR_BY.get(TR.focus)];
  return TR_RULES.filter(r => TR.topic === "all" || r.c === TR.topic);
}
function trPick() {
  const pool = trPool(), prev = TR.q;
  const w = pool.map(r => {
    if (prev && r.k === prev.r && pool.length > 1) return 0;
    const st = trStatus(r.k);
    return st === "struggling" ? 4 : st === "new" ? 2 : st === "mastered" ? 0.6 : 1.5;
  });
  let t = Math.random() * w.reduce((s, v) => s + v, 0), i = 0;
  for (; i < pool.length - 1; i++) { t -= w[i]; if (t < 0) break; }
  const rule = pool[i], fresh = rule.qs.filter(q => q !== prev);
  const from = fresh.length ? fresh : rule.qs;
  TR.q = from[Math.floor(Math.random() * from.length)];
  TR.phase = "ask"; TR.res = null; TR.input = "";
}

function trCheck(idk) {

  if (!idk) {
    if (!raw) { pre.className = "preview err"; pre.textContent = L("Type the derivative first, or press I don't know.", "Escreva primeiro a derivada, ou carregue em Não sei."); return; }
    try { ast = trParse(raw); } catch (e) { pre.className = "preview err"; pre.textContent = L("Can't read that: ", "Não consigo ler isso: ") + e.message; return; }
    verdict = trJudge(ast, TR.q);
  }
  const T = trState(), k = TR.q.r, before = trStatus(k);
  const r = T.r[k] || (T.r[k] = { c: 0, w: 0, h: "" });
  if (verdict.ok) { r.c++; T.c++; T.streak++; if (T.streak > T.best) T.best = T.streak; TR.sess.c++; }
  else { r.w++; T.streak = 0; }

  T.n++; TR.sess.n++;

  TR.phase = "done"; TR.input = raw;
  TR.res = { ok: verdict.ok, idk, note: verdict.note, tex: ast ? trTex(ast) : "" };
  const after = trStatus(k);
  if (after === "mastered" && before !== "mastered") toast(L(`Mastered: ${trName(TR_BY.get(k))}`, `Dominada: ${trName(TR_BY.get(k))}`));
  drawDrill(false); drawStats(); drawRules();
}

  { k: "x", label: "x", prefix: "x.com/", get ph() { return L("handle", "nome"); }, re: /^[A-Za-z0-9_]{1,15}$/, url: h => "https://x.com/" + encodeURIComponent(h), get err() { return L("X handles are up to 15 letters, digits or underscores.", "Os nomes do X têm até 15 letras, algarismos ou underscores."); } },
  { k: "instagram", label: "instagram", prefix: "instagram.com/", get ph() { return L("handle", "nome"); }, re: /^[A-Za-z0-9_.]{1,30}$/, url: h => "https://www.instagram.com/" + encodeURIComponent(h), get err() { return L("Instagram handles use letters, digits, periods and underscores.", "Os nomes do Instagram usam letras, algarismos, pontos e underscores."); } },
  { k: "linkedin", label: "linkedin", prefix: "linkedin.com/in/", get ph() { return L("your-name", "o-seu-nome"); }, re: /^[A-Za-z0-9_-]{3,100}$/, url: h => "https://www.linkedin.com/in/" + encodeURIComponent(h), get err() { return L("Use the part of your profile link that comes after /in/.", "Use a parte do link do seu perfil que vem depois de /in/."); } },
  { k: "youtube", label: "youtube", prefix: "youtube.com/@", get ph() { return L("channel", "canal"); }, re: /^[A-Za-z0-9_.-]{3,30}$/, url: h => "https://www.youtube.com/@" + encodeURIComponent(h), get err() { return L("Use your channel handle, without the @.", "Use o nome do canal, sem o @."); } },
  { k: "discord", label: "discord", prefix: "", get ph() { return L("username", "utilizador"); }, re: /^[A-Za-z0-9_.]{2,32}$/, url: null, get err() { return L("Discord usernames are 2–32 letters, digits, periods or underscores.", "Os nomes do Discord têm 2–32 letras, algarismos, pontos ou underscores."); } }
];
const str = (v, max) => typeof v === "string" ? v.slice(0, max) : "";
const numOr = (v, d) => typeof v === "number" && Number.isFinite(v) ? Math.round(v) : d;
function validImg(s) { return typeof s === "string" && s.length < 300000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s); }
function rowName(r) { return str(r.username, 20) || L("anonymous", "anónimo"); }
function defaultAvatar(name) {
  const ch = (name || "?").trim().charAt(0).toUpperCase() || "?";
  let h = 0; for (const c of (name || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const cols = ["#6cc9ff", "#c49bff", "#3ddc97", "#ffc857", "#ff7a7a", "#46d6c4", "#cd8752"], col = cols[h % cols.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="#151a20"/><path d="M0 64 L64 0 L64 64 Z" fill="${col}" fill-opacity=".08"/><text x="32" y="43" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="${col}">${esc(ch)}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function avatarImg(r, size, cls = "") {
  const mine = r.me || (r.id && r.id === cloud.uid);
  const src = mine && validImg(S.profile.avatar) ? S.profile.avatar : defaultAvatar(rowName(r));
  const lazy = !mine && r.hasAvatar && r.id ? ` data-av="${esc(r.id)}" data-avv="${esc(String(numOr(r.avv, 0)))}"` : "";
  return `<img class="av ${cls}" alt="" width="${size}" height="${size}" style="width:${size}px;height:${size}px" src="${src}"${lazy}>`;
}
function hydrateAvatars(root) {
  if (!cloud.db || !root) return;
  root.querySelectorAll("img[data-av]").forEach(img => {
    const uid = img.dataset.av, v = img.dataset.avv;
    img.removeAttribute("data-av");

}
const myRow = () => Object.assign({ id: cloud.uid, me: true }, cloud.publicDoc());
function normalizeSocial(k, raw) {
  const s = SOCIALS.find(x => x.k === k);
  let v = String(raw || "").trim();
  if (!s || !v) return { v: "" };
  if (k === "website") {
    if (!/^https?:\/\//i.test(v)) v = "https://" + v;
    try {
      const u = new URL(v);
      if (!/^https?:$/.test(u.protocol) || !u.hostname.includes(".")) throw new Error();
      const href = u.href.slice(0, 200);
      return { v: href, url: href, show: (u.hostname + u.pathname).replace(/\/$/, "").replace(/^www\./, "").slice(0, 40) };
    } catch { return { err: L("Enter a web address, like yoursite.com", "Introduza um endereço web, como oseusite.pt") }; }
  }
  v = v.replace(/^(https?:\/\/)?(www\.|m\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}\/(in\/)?/i, "").replace(/^@/, "").replace(/[/?#].*$/, "");

}

  if (!socials || typeof socials !== "object") return "";
  return SOCIALS.map(s => {
    const n = normalizeSocial(s.k, str(socials[s.k], 200));
    if (!n.v || n.err) return "";
    if (!n.url) return `<button type="button" class="social" data-copy="${esc(n.v)}" title="${L(`Copy ${s.label} username`, `Copiar o nome de ${s.label}`)}"><b>${s.label}</b><span>${esc(n.show)}</span><i aria-hidden="true">⧉</i></button>`;
    return `<a class="social" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer"><b>${s.label}</b><span>${esc(n.show)}</span><i aria-hidden="true">↗</i></a>`;
  }).join("");
}
function playerMatches(q, limit) {
  const s = q.trim().toLowerCase().replace(/^@/, "");
  if (!s || !cloud.board) return [];
  return cloud.board.filter(r => typeof r.rating === "number" && typeof r.handle === "string" && r.handle)
    .map(r => {
      const h = r.handle.toLowerCase(), sc = str(r.school, 80).toLowerCase(), yr = str(r.year, 40).toLowerCase();
      return { r, score: h === s ? 0 : h.startsWith(s) ? 1 : h.includes(s) ? 2 : sc.includes(s) ? 3 : yr.includes(s) ? 4 : -1 };
    })
    .filter(x => x.score >= 0)
    .sort((a, b) => a.score - b.score || subOf(b.r).rating - subOf(a.r).rating)
    .slice(0, limit).map(x => x.r);
}

let psRedraw = null, psSel = -1;
function setupPlayerSearch() {
  const inp = document.getElementById("ps"), pop = document.getElementById("psPop"), wrap = document.getElementById("psearch");
  const items = () => [...pop.querySelectorAll(".ps-item")];
  const close = () => { pop.hidden = true; inp.setAttribute("aria-expanded", "false"); psSel = -1; psRedraw = null; };
  const mark = () => items().forEach((el, i) => el.setAttribute("aria-selected", String(i === psSel)));
  const draw = () => {
    const q = inp.value;
    if (!q.trim()) { close(); return; }
    let html;
    if (!cloud.db) html = `<div class="ps-empty">${cloud.connecting ? L("Connecting…", "A ligar…") : L("Player search isn't available right now.", "A pesquisa de jogadores não está disponível de momento.")}</div>`;
    else if (!cloud.board) html = `<div class="ps-empty">${cloud.boardErr ? L("Players couldn't load right now.", "Não foi possível carregar os jogadores.") : L("Loading players…", "A carregar jogadores…")}</div>`;
    else {
      const m = playerMatches(q, 6);
      html = m.length
        ? m.map(r => { const x = subOf(r), k = rankOf(x.rating); return `<a class="ps-item" role="option" aria-selected="false" href="#u-${esc(r.handle)}">${avatarImg(r, 28)}<span class="nm">${nameSpan("@" + rowName(r), r.id === cloud.uid ? myNameColor() : r.nameColor)}<small>${esc(subline(r) || L("No school listed", "Sem escola indicada"))}</small></span><span class="rp num" title="${esc(SUBJ_NAME[SUBJ])}">${emblem(k.t)}<span style="color:${tierColor(k.t)}">${x.rating}</span></span></a>`; }).join("") + `<a class="ps-item ps-all" role="option" aria-selected="false" href="#board" data-all="1">${L("All matches on the leaderboard →", "Todos os resultados na classificação →")}</a>`

    }

    hydrateAvatars(pop);
    psRedraw = draw;
  };
  inp.addEventListener("input", () => { psSel = -1; draw(); });
  inp.addEventListener("focus", () => { if (inp.value.trim()) draw(); });
  inp.addEventListener("keydown", e => {
    const list = items();
    if (e.key === "ArrowDown" && list.length) { e.preventDefault(); psSel = (psSel + 1) % list.length; mark(); }
    else if (e.key === "ArrowUp" && list.length) { e.preventDefault(); psSel = (psSel - 1 + list.length) % list.length; mark(); }
    else if (e.key === "Enter") {
      e.preventDefault();
      if (psSel >= 0 && list[psSel]) list[psSel].click();
      else if (inp.value.trim()) { boardQ = inp.value.trim(); close(); inp.value = ""; if (current === "board") renderBoard(); else location.hash = "board"; }
    }
    else if (e.key === "Escape") { close(); inp.blur(); }
  });
  pop.addEventListener("click", e => {
    const a = e.target.closest("a.ps-item"); if (!a) return;
    if (a.dataset.all) { boardQ = inp.value.trim(); if (current === "board") { e.preventDefault(); renderBoard(); } }
    close(); inp.value = "";
  });
  document.addEventListener("click", e => { if (!wrap.contains(e.target)) close(); });
  window.addEventListener("hashchange", close);
}

function seasonDetail(b) {
  const d = b.r - b.s;
  return `<div class="panel sdetail" style="--tc:${tierColor(b.t)}">
    <div class="panel-head"><h3>${seasonLabel(b.n)} · ${esc(seasonMonth(b.n))}</h3><button class="linkbtn" type="button" data-sclose style="font-size:var(--t-xs)">${L("close", "fechar")}</button></div>

      <span>${L("Rating change", "Variação do rating")}</span><b class="num" style="color:${d > 0 ? "var(--ok)" : d < 0 ? "var(--bad)" : "var(--fg)"}">${signed(d)}</b>
      <span>${L("Start → end", "Início → fim")}</span><b class="num">${b.s} → ${b.r}</b>
      <span>${L("Problems solved", "Problemas resolvidos")}</span><b class="num">${b.w}</b>
      <span>${L("Misses", "Erros")}</span><b class="num">${b.l}</b>
      <span>${L("Peak rating", "Rating máximo")}</span><b class="num">${b.pk}</b>
    </div>
  </div>`;
}
function bindSeasons(r) {
  const box = document.getElementById("sDetail");
  if (!box) return;
  const badges = cleanSeasons(r.seasons).filter(b => b.sub === SUBJ), btns = [...document.querySelectorAll(".sbadge")];
  const show = n => {
    openSeason = n;
    const b = badges.find(x => x.n === n);
    btns.forEach(el => el.setAttribute("aria-expanded", String(+el.dataset.n === n && !!b)));
    box.innerHTML = b ? seasonDetail(b) : "";
    const c = box.querySelector("[data-sclose]");
    if (c) c.onclick = () => { const was = openSeason; show(0); const el = btns.find(x => +x.dataset.n === was); if (el) el.focus(); };
  };
  btns.forEach(el => { el.onclick = () => show(openSeason === +el.dataset.n ? 0 : +el.dataset.n); });
  show(badges.some(b => b.n === openSeason) ? openSeason : 0);
}

let draftAvatar = "";

const TAKEN = v => L(`@${v} is taken. Try another.`, `@${v} já está a ser usado. Experimente outro.`);
function fileToAvatar(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error(L("Pick an image file (JPG, PNG, WebP or GIF).", "Escolha um ficheiro de imagem (JPG, PNG, WebP ou GIF).")));
    if (file.size > 20 * 1024 * 1024) return reject(new Error(L("That image is over 20 MB. Try a smaller one.", "Essa imagem tem mais de 20 MB. Experimente uma mais pequena.")));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas");
      c.width = c.height = 192;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#151a20"; ctx.fillRect(0, 0, 192, 192);
      ctx.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, 192, 192);
      URL.revokeObjectURL(url);
      let q = 0.86, d = c.toDataURL("image/jpeg", q);
      while (d.length > 60000 && q > 0.4) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
      validImg(d) ? resolve(d) : reject(new Error(L("Couldn't process that image.", "Não foi possível processar essa imagem.")));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(L("Couldn't read that image. Try a JPG or PNG.", "Não foi possível ler essa imagem. Experimente um JPG ou PNG."))); };
    img.src = url;
  });
}

    catch (err) { setHelp("avHelp", err.message, "err"); }
  });
  $("avRm").addEventListener("click", () => { draftAvatar = ""; $("avPrev").src = defaultAvatar($("fUser").value.trim() || "?"); setHelp("avHelp", L("Picture removed. Save to apply.", "Fotografia removida. Guarde para aplicar."), ""); });
  $("pf").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("pfSave");
    const username = $("fUser").value.trim();
    let ok = true;
    if (!HANDLE_RE.test(username)) { setHelp("hUser", BAD_HANDLE(), "err"); ok = false; }
    const socials = {};
    SOCIALS.forEach(s => {
      const n = normalizeSocial(s.k, $("fs_" + s.k).value);
      if (n.err) { setHelp("hs_" + s.k, n.err, "err"); ok = false; }
      else { setHelp("hs_" + s.k, ""); if (n.v) socials[s.k] = n.v; }
    });
    if (!ok) { const bad = app.querySelector(".help.err"); if (bad && bad.scrollIntoView) bad.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    btn.disabled = true; btn.textContent = L("Saving…", "A guardar…");
    if (cloud.db && cloud.uid && await cloud.handleTaken(username.toLowerCase())) {
      setHelp("hUser", TAKEN(username), "err");
      btn.disabled = false; btn.textContent = L("Save profile", "Guardar perfil"); $("fUser").focus(); return;
    }
    const year = $("fYear").value;
    const avatarChanged = draftAvatar !== (S.profile.avatar || "");
    S.profile = {
      username, bio: $("fBio").value.trim().slice(0, 160), school: $("fSchool").value.trim().slice(0, 80),
      year: YEARS.includes(year) ? year : "", socials, avatar: draftAvatar,
      avatarV: avatarChanged ? Date.now() : (S.profile.avatarV || 0),
      nameColor: pickedColor()
    };
    if (avatarChanged) cloud.avDirty = true;
    S.updated = Date.now();
    if (!S.joined) S.joined = S.updated;
    lsSet(LS_KEY, S);
    let msg = L("Profile saved.", "Perfil guardado.");
    if (cloud.db && cloud.uid) {
      clearTimeout(cloud.timer);
      await cloud.flush();
      if (cloud.lastError === "handle_taken") {
        setHelp("hUser", L(`@${username} was just taken. Try another.`, `@${username} acabou de ser escolhido por outra pessoa. Experimente outro.`), "err");
        btn.disabled = false; btn.textContent = L("Save profile", "Guardar perfil"); $("fUser").focus(); return;
      }
      if (cloud.canWrite === false) msg = L("Saved on this device. Your access is view-only, so others can't see it yet.", "Guardado neste dispositivo. O seu acesso é só de leitura, por isso os outros ainda não o veem.");
    } else msg = cloud.kind === "supabase" ? L("Profile saved on this device. Sign in to publish it.", "Perfil guardado neste dispositivo. Inicie sessão para o publicar.") : L("Profile saved on this device.", "Perfil guardado neste dispositivo.");
    toast(msg);
    location.hash = "me";
  });
}

function nameColorField(pr) {
  const earned = earnedTiers(), cur = myNameColor(), nm = "@" + (pr.username || "you");
  const best = t => cleanSeasons(S.seasons).filter(b => b.t === t).map(b => `${seasonLabel(b.n)} ${SUBJ_TAG[b.sub]}`).reverse().join(", ");
  const opt = (val, t, label, sub, locked) => `<label class="nc-opt${locked ? " locked" : ""}"><input type="radio" name="nc" value="${val}" ${cur === val ? "checked" : ""} ${locked ? "disabled" : ""}>
      <span class="nc-sw" style="${t === 8 ? "background:linear-gradient(135deg,#6cc9ff,#c49bff,#ffc857)" : t >= 0 ? `background:${TIERS[t].c}` : "background:var(--fg)"}"></span>
      <span class="nc-t"><span data-nm="${t >= 0 && !locked ? val : ""}">${t >= 0 && !locked ? nameSpan(nm, val) : esc(nm)}</span><small>${esc(label)}${sub ? " · " + esc(sub) : ""}</small></span></label>`;
  return `<fieldset class="socials-set nc-set"><legend>${L("Name colour", "Cor do nome")}</legend>
    <div class="nc-opts" role="radiogroup" aria-label="${L("Name colour", "Cor do nome")}">
      ${opt("", -1, L("Default", "Padrão"), "", false)}
      ${TIER_KEYS.map((k, t) => opt(k, t, TIERS[t].name, earned.has(t) ? best(t) : L("locked", "bloqueada"), !earned.has(t))).join("")}
    </div>
    <span class="help">${earned.size ? L("Each season badge unlocks its rank's colour. Finish a season higher to unlock more.", "Cada emblema de época desbloqueia a cor do seu escalão. Termine uma época mais acima para desbloquear mais.") : L("Locked for now: finish a season (a calendar month with at least one rated result) to unlock the colour of the rank you end on.", "Bloqueado por agora: termine uma época (um mês com pelo menos um resultado com rating) para desbloquear a cor do escalão em que acabar.")}</span>
  </fieldset>`;
}
function pickedColor() {
  const el = app.querySelector('.nc-opt input[name="nc"]:checked');
  const t = el ? TIER_KEYS.indexOf(el.value) : -1;
  return t >= 0 && earnedTiers().has(t) ? TIER_KEYS[t] : "";
}

/* ============================== accounts (Supabase) ============================== */
let authMode = "signin";
const PW_SHORT = () => L("Passwords need at least 6 characters.", "A palavra-passe precisa de pelo menos 6 caracteres.");
function renderLogin() {
  const head = `<div class="ph"><div><div class="eyebrow">${L("Account", "Conta")}</div><h1>${cloud.uid ? L("Your account", "A sua conta") : authMode === "signup" ? L("Create an account", "Criar conta") : L("Sign in", "Iniciar sessão")}</h1></div></div>`;
  if (cloud.connecting) { app.innerHTML = `${head}<div class="empty">${L("Connecting…", "A ligar…")}</div>`; return; }
  if (cloud.kind !== "supabase") { app.innerHTML = `${head}<section class="section" style="margin-top:20px"><div class="panel prose"><p>${L("Accounts aren't available on this copy of the site. Your progress is saved in this browser.", "As contas não estão disponíveis nesta cópia do site. O seu progresso fica guardado neste navegador.")}</p></div></section>`; return; }
  if (cloud.uid) {
    app.innerHTML = `${head}
    <section class="section" style="margin-top:20px"><div class="panel auth-panel">
      <p>${L("Signed in as", "Sessão iniciada como")} <strong>${esc(cloud.email || L("your account", "a sua conta"))}</strong>. ${L("Your progress syncs across devices and your profile is on the leaderboard.", "O seu progresso é sincronizado entre dispositivos e o seu perfil está na classificação.")}</p>
      <div class="actions"><a class="btn primary" href="#me">${L("Go to your profile", "Ir para o seu perfil")}</a><a class="btn" href="#reset">${L("Change password", "Alterar palavra-passe")}</a><button class="btn danger" type="button" id="signOut">${L("Sign out", "Terminar sessão")}</button></div>
    </div></section>`;
    document.getElementById("signOut").addEventListener("click", signOut);
    return;
  }
  const notice = authNotice; authNotice = "";
  app.innerHTML = `${head}
  <section class="section" style="margin-top:20px"><div class="panel auth-panel">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" class="tab" data-m="signin" aria-selected="${authMode === "signin"}">${L("Sign in", "Iniciar sessão")}</button>
      <button type="button" role="tab" class="tab" data-m="signup" aria-selected="${authMode === "signup"}">${L("Create account", "Criar conta")}</button>
    </div>
    <p class="muted" style="font-size:var(--t-sm)">${authMode === "signup" ? L("Your rating, solves and profile sync across devices, and you appear on the leaderboard. Progress you've made in this browser comes with you.", "O seu rating, os problemas resolvidos e o perfil ficam sincronizados entre dispositivos, e passa a aparecer na classificação. O progresso que fez neste navegador vem consigo.") : L("Welcome back. Progress you've made in this browser while signed out is kept if this account has none yet.", "Bem-vindo de volta. O progresso feito neste navegador sem sessão iniciada é mantido se esta conta ainda não tiver nenhum.")}</p>
    <form class="form" id="af2" novalidate style="margin-top:0">
      <div class="field"><label for="aEmail">Email</label><input id="aEmail" class="inp" type="email" autocomplete="email" spellcheck="false" required></div>
      <div class="field"><label for="aPass">${L("Password", "Palavra-passe")}</label><input id="aPass" class="inp" type="password" autocomplete="${authMode === "signup" ? "new-password" : "current-password"}" minlength="6" required>
        <span class="help">${authMode === "signup" ? L("At least 6 characters.", "Pelo menos 6 caracteres.") : `<button type="button" class="linkbtn" id="forgot">${L("Forgot your password?", "Esqueceu-se da palavra-passe?")}</button>`}</span></div>
      <div class="actions"><button class="btn primary" type="submit" id="aGo">${authMode === "signup" ? L("Create account", "Criar conta") : L("Sign in", "Iniciar sessão")}</button></div>
      <div class="result info" id="aMsg" ${notice ? "" : "hidden"} role="status">${esc(notice)}</div>
    </form>
  </div></section>`;
  const $ = id => document.getElementById(id);
  const say = (msg, kind = "info") => { const el = $("aMsg"); el.hidden = false; el.className = "result " + kind; el.textContent = msg; };
  app.querySelectorAll(".tab[data-m]").forEach(b => b.addEventListener("click", () => { authMode = b.dataset.m; renderLogin(); }));
  const f = $("forgot");
  if (f) f.addEventListener("click", async () => {
    const email = $("aEmail").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) { say(L("Type your email above first, then click this again.", "Escreva primeiro o seu email acima e depois clique aqui outra vez."), "bad"); $("aEmail").focus(); return; }
    const { error } = await supaDriver.resetPassword(email);
    say(error ? (/rate limit|too many/i.test(error.message || "") ? L("We can't send reset emails right now (too many this hour). Please try again later.", "De momento não conseguimos enviar emails de recuperação (demasiados nesta hora). Tente mais tarde.") : error.message) : L(`If an account exists for ${email}, a reset link is on its way.`, `Se existir uma conta para ${email}, vai receber um link de recuperação.`), error ? "bad" : "info");
  });
  $("af2").addEventListener("submit", async e => {
    e.preventDefault();
    const email = $("aEmail").value.trim(), password = $("aPass").value;
    if (!/^\S+@\S+\.\S+$/.test(email)) { say(L("Enter a valid email address.", "Introduza um endereço de email válido."), "bad"); return; }
    if (password.length < 6) { say(PW_SHORT(), "bad"); return; }
    const btn = $("aGo"); btn.disabled = true; btn.textContent = authMode === "signup" ? L("Creating…", "A criar…") : L("Signing in…", "A entrar…");
    let res;
    try { res = authMode === "signup" ? await supaDriver.signUp(email, password) : await supaDriver.signIn(email, password); }
    catch (err) { res = { error: err }; }
    btn.disabled = false; btn.textContent = authMode === "signup" ? L("Create account", "Criar conta") : L("Sign in", "Iniciar sessão");
    if (res.error) {
      const m = String(res.error.message || "");
      say(/email rate limit/i.test(m) ? L("We can't send confirmation emails right now (too many sign-ups this hour). Please try again later.", "De momento não conseguimos enviar emails de confirmação (demasiados registos nesta hora). Tente mais tarde.")
        : /rate limit|too many/i.test(m) ? L("Too many attempts. Wait a few minutes and try again.", "Demasiadas tentativas. Espere alguns minutos e tente de novo.")
        : /invalid login/i.test(m) ? L("Wrong email or password.", "Email ou palavra-passe errados.")
        : /not confirmed/i.test(m) ? L("Confirm your email first: open the link we sent you, then sign in.", "Confirme primeiro o seu email: abra o link que lhe enviámos e depois inicie sessão.")
        : /already registered/i.test(m) ? L("That email already has an account. Sign in instead.", "Esse email já tem conta. Inicie sessão.")
        : m || L("Something went wrong. Try again.", "Algo correu mal. Tente de novo."), "bad");
      return;
    }
    if (authMode === "signup" && !(res.data && res.data.session)) { say(L(`Almost there: we sent a confirmation link to ${email}. Open it, then sign in.`, `Quase lá: enviámos um link de confirmação para ${email}. Abra-o e depois inicie sessão.`), "ok"); authMode = "signin"; return; }
    await cloud.setUser(res.data.session.user);
    toast(authMode === "signup" ? L("Account created. Welcome to the ladder.", "Conta criada. Bem-vindo à escada.") : L("Signed in.", "Sessão iniciada."));
    location.hash = "me";
  });
}
function renderReset() {
  const head = `<div class="ph"><div><div class="eyebrow">${L("Account", "Conta")}</div><h1>${L("Set a new password", "Definir nova palavra-passe")}</h1></div></div>`;
  if (cloud.connecting) { app.innerHTML = `${head}<div class="empty">${L("Connecting…", "A ligar…")}</div>`; return; }
  if (cloud.kind !== "supabase" || !cloud.uid) { app.innerHTML = `${head}<div class="empty">${L(`Open the reset link from your email, or <a href="#login">sign in</a> first.`, `Abra o link de recuperação do seu email, ou <a href="#login">inicie sessão</a> primeiro.`)}</div>`; return; }
  app.innerHTML = `${head}
  <section class="section" style="margin-top:20px"><div class="panel auth-panel">
    <form class="form" id="rf" novalidate style="margin-top:0">
      <div class="field"><label for="rPass">${L("New password", "Nova palavra-passe")}</label><input id="rPass" class="inp" type="password" autocomplete="new-password" minlength="6" required><span class="help">${L("At least 6 characters.", "Pelo menos 6 caracteres.")}</span></div>
      <div class="actions"><button class="btn primary" type="submit" id="rGo">${L("Save password", "Guardar palavra-passe")}</button></div>
      <div class="result bad" id="rMsg" hidden role="status"></div>
    </form>
  </div></section>`;
  document.getElementById("rf").addEventListener("submit", async e => {
    e.preventDefault();
    const pw = document.getElementById("rPass").value, msg = document.getElementById("rMsg");
    if (pw.length < 6) { msg.hidden = false; msg.textContent = PW_SHORT(); return; }
    const { error } = await supaDriver.updatePassword(pw);
    if (error) { msg.hidden = false; msg.textContent = error.message; return; }
    cloud.recovery = false; toast(L("Password updated.", "Palavra-passe atualizada.")); location.hash = "me";
  });
}
async function signOut() {
  clearTimeout(cloud.timer);
  await cloud.flush();
  try { await supaDriver.signOut(); } catch {}
  await cloud.setUser(null);
  toast(L("Signed out. Your progress is saved in your account.", "Sessão terminada. O seu progresso está guardado na sua conta."));
  location.hash = "home";
}
const signInLink = text => `<a href="#login">${esc(text)}</a>`;

/* ============================== router ============================== */
let current = "home", redrawChart = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!cloud.connecting) finalizeSeasons();
  clearMath();
  redrawChart = null;
  const prevCurrent = current;
  if (DIFFS.includes(h)) { UI.diff = [h]; lsSet(UI_KEY, UI); current = "problems"; renderProblems(); }
  else if (h === "university") { UI.set = "university"; UI.diff = []; UI.concept = "all"; UI.sort = "diff-asc"; lsSet(UI_KEY, UI); current = "problems"; renderProblems(); }
  else if (h === "problems") { current = "problems"; renderProblems(); }
  else if (/^p-[a-z0-9-]+$/.test(h)) {
    const raw = h.slice(2), slug = /^\d+$/.test(raw) ? (LEGACY[raw] || raw) : raw;
    if (BY_SLUG.has(slug)) setSubj(BY_SLUG.get(slug).sub);
    if (current !== "p-" + slug) { lastResult = null; confirmReveal = false; openRefs = new Set(); }
    current = "p-" + slug; renderProblem(slug);
  }
  else if (h === "learn") { current = "learn"; renderLearn(); }
  else if (h === "train") { current = "train"; renderTrain(); }
  else if (/^c-[a-z-]+$/.test(h) && CBY.has(h.slice(2))) { setSubj(CBY.get(h.slice(2)).sub); current = h; renderConcept(h.slice(2)); }
  else if (h === "calc" || h === "la") { setSubj(h); current = "problems"; renderProblems(); }
  else if (h === "ranks") { current = "ranks"; renderRanks(); }
  else if (h === "board") { current = "board"; renderBoard(); }
  else if (h === "me") { if (current !== "me") openSeason = 0; current = "me"; renderProfile(null); }
  else if (h === "edit") { current = "edit"; renderEdit(); }
  else if (h === "login") { authMode = "signin"; current = "login"; renderLogin(); }
  else if (h === "signup") { authMode = "signup"; current = "login"; renderLogin(); }
  else if (h === "reset") { current = "reset"; renderReset(); }
  else if (/^u-[a-z0-9_.-]{3,20}$/i.test(h)) { const hd = h.slice(2).toLowerCase(); if (current !== "u-" + hd) openSeason = 0; current = "u-" + hd; renderProfile(hd); }
  else { current = "home"; renderHome(); }
  renderNav();
  if (prevCurrent !== current) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
let rz = 0;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (redrawChart) redrawChart(); }, 150); });
/* the subject switch, wherever it appears */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-subj]"); if (!b) return;
  if (setSubj(b.dataset.subj)) route();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const v = b.dataset.copy;
  try { navigator.clipboard.writeText(v).then(() => toast(L("Copied ", "Copiado: ") + v), () => toast("Discord: " + v)); } catch { toast("Discord: " + v); }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && current === "problems" && document.activeElement?.id !== "q") { e.preventDefault(); document.getElementById("q")?.focus(); }
  if (e.key === "Enter" && current === "train" && TR.phase === "done" && !e.target.closest("button, a, input, textarea, select")) { e.preventDefault(); trPick(); drawDrill(true); }
});

applyStatic();
setupPlayerSearch();
route();
cloud.init();
})();
</script>
