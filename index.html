m_{x\\to0}(1+2x)^{1/x}$: o expoente $\\frac{\\ln(1+2x)}{x}\\to2$, logo o limite é $e^2$."}},{"k":"trig","n":"Trigonometry","d":"Identities, derivatives, and the arctangent integral.","b":"**What it is.** The workhorse identities: $\\sin^2x+\\cos^2x=1$, $\\sin2x=2\\sin x\\cos x$, $\\cos2x=1-2\\sin^2x$, $\\tan(a-b)=\\frac{\\tan a-\\tan b}{1+\\tan a\\tan b}$. And $a\\sin x+b\\cos x=R\\sin(x+\\varphi)$ with $R=\\sqrt{a^2+b^2}$.\n\n**How to use it.** Derivatives: $(\\sin x)'=\\cos x$, $(\\cos x)'=-\\sin x$, $(\\tan x)'=1+\\tan^2x$. The inverse tangent satisfies $(\\arctan x)'=\\frac{1}{1+x^2}$, so $\\int\\frac{dx}{a^2+x^2}=\\frac1a\\arctan\\frac xa+C$.\n\n**Example.** $\\int_0^1\\frac{dx}{1+x^2}=\\arctan1=\\frac\\pi4$.","pt":{"n":"Trigonometria","d":"Identidades, derivadas e a primitiva que dá o arco-tangente.","b":"**O que é.** As identidades essenciais: $\\sin^2x+\\cos^2x=1$, $\\sin2x=2\\sin x\\cos x$, $\\cos2x=1-2\\sin^2x$, $\\tan(a-b)=\\frac{\\tan a-\\tan b}{1+\\tan a\\tan b}$. E $a\\sin x+b\\cos x=R\\sin(x+\\varphi)$ com $R=\\sqrt{a^2+b^2}$.\n\n**Como usar.** Derivadas: $(\\sin x)'=\\cos x$, $(\\cos x)'=-\\sin x$, $(\\tan x)'=1+\\tan^2x$. O arco-tangente satisfaz $(\\arctan x)'=\\frac{1}{1+x^2}$, logo $\\int\\frac{dx}{a^2+x^2}=\\frac1a\\arctan\\frac xa+C$.\n\n**Exemplo.** $\\int_0^1\\frac{dx}{1+x^2}=\\arctan1=\\frac\\pi4$."}},{"k":"inverse-trig","n":"Inverse trig functions","d":"arcsin, arccos and arctan, their principal ranges, and the traps.","b":"**What it is.** Each trig function is inverted on one interval where it is injective, its principal branch: $\\arcsin:[-1,1]\\to\\left[-\\frac\\pi2,\\frac\\pi2\\right]$, $\\arccos:[-1,1]\\to[0,\\pi]$, $\\arctan:\\mathbb R\\to\\left(-\\frac\\pi2,\\frac\\pi2\\right)$.\n\n**How to use it.** $\\sin(\\arcsin y)=y$ always, but $\\arcsin(\\sin x)=x$ only for $x\\in\\left[-\\frac\\pi2,\\frac\\pi2\\right]$; otherwise move $x$ into that interval using $\\sin x=\\sin(\\pi-x)=\\sin(x-2\\pi)$. The same goes for $\\arccos$ on $[0,\\pi]$ and $\\arctan$ on $\\left(-\\frac\\pi2,\\frac\\pi2\\right)$. Useful facts: $\\cos(\\arcsin y)=\\sqrt{1-y^2}$, $\\arcsin y+\\arccos y=\\frac\\pi2$, $\\arctan y+\\arctan\\frac1y=\\pm\\frac\\pi2$ (the sign of $y$). Derivatives: $(\\arcsin x)'=\\frac{1}{\\sqrt{1-x^2}}$, $(\\arccos x)'=-\\frac{1}{\\sqrt{1-x^2}}$, $(\\arctan x)'=\\frac{1}{1+x^2}$.\n\n**Example.** $\\arcsin\\left(\\sin\\frac{5\\pi}{6}\\right)=\\frac\\pi6$, because $\\sin\\frac{5\\pi}6=\\sin\\frac\\pi6$ and $\\frac\\pi6$ is in the principal range.","pt":{"n":"Funções trigonométricas inversas","d":"arcsen, arccos e arctg, os seus contradomínios e as armadilhas.","b":"**O que é.** Cada função trigonométrica é invertida num intervalo onde é injetiva, a sua restrição principal: $\\arcsin:[-1,1]\\to\\left[-\\frac\\pi2,\\frac\\pi2\\right]$, $\\arccos:[-1,1]\\to[0,\\pi]$, $\\arctan:\\mathbb R\\to\\left]-\\frac\\pi2,\\frac\\pi2\\right[$.\n\n**Como usar.** $\\sin(\\arcsin y)=y$ sempre, mas $\\arcsin(\\sin x)=x$ só para $x\\in\\left[-\\frac\\pi2,\\frac\\pi2\\right]$; caso contrário, desloque $x$ para esse intervalo usando $\\sin x=\\sin(\\pi-x)=\\sin(x-2\\pi)$. O mesmo se passa com $\\arccos$ em $[0,\\pi]$ e $\\arctan$ em $\\left]-\\frac\\pi2,\\frac\\pi2\\right[$. Factos úteis: $\\cos(\\arcsin y)=\\sqrt{1-y^2}$, $\\arcsin y+\\arccos y=\\frac\\pi2$, $\\arctan y+\\arctan\\frac1y=\\pm\\frac\\pi2$ (com o sinal de $y$). Derivadas: $(\\arcsin x)'=\\frac{1}{\\sqrt{1-x^2}}$, $(\\arccos x)'=-\\frac{1}{\\sqrt{1-x^2}}$, $(\\arctan x)'=\\frac{1}{1+x^2}$.\n\n**Exemplo.** $\\arcsin\\left(\\sin\\frac{5\\pi}{6}\\right)=\\frac\\pi6$, porque $\\sin\\frac{5\\pi}6=\\sin\\frac\\pi6$ e $\\frac\\pi6$ está no contradomínio principal."}},{"k":"hyperbolic","n":"Hyperbolic functions","d":"sinh, cosh and tanh, their identities and their log-shaped inverses.","b":"**What it is.** $\\sinh x=\\frac{e^x-e^{-x}}{2}$, $\\cosh x=\\frac{e^x+e^{-x}}{2}$, $\\tanh x=\\frac{\\sinh x}{\\cosh x}$. They satisfy $\\cosh^2x-\\sinh^2x=1$, $\\sinh2x=2\\sinh x\\cosh x$ and $\\cosh x+\\sinh x=e^x$.\n\n**How to use it.** Derivatives: $(\\sinh x)'=\\cosh x$, $(\\cosh x)'=\\sinh x$, $(\\tanh x)'=\\frac{1}{\\cosh^2x}$. The inverses are logarithms: $\\operatorname{arsinh}x=\\ln\\left(x+\\sqrt{x^2+1}\\right)$, $\\operatorname{arcosh}x=\\ln\\left(x+\\sqrt{x^2-1}\\right)$ for $x\\ge1$, $\\operatorname{artanh}x=\\frac12\\ln\\frac{1+x}{1-x}$, with derivatives $\\frac{1}{\\sqrt{x^2+1}}$, $\\frac{1}{\\sqrt{x^2-1}}$ and $\\frac{1}{1-x^2}$. Near $0$: $\\sinh x\\approx x+\\frac{x^3}{6}$, $\\cosh x\\approx1+\\frac{x^2}{2}$, $\\tanh x\\approx x-\\frac{x^3}{3}$.\n\n**Example.** If $\\cosh x=\\frac54$ with $x>0$, then $\\sinh x=\\sqrt{\\frac{25}{16}-1}=\\frac34$, so $e^x=\\cosh x+\\sinh x=2$ and $x=\\ln2$.","pt":{"n":"Funções hiperbólicas","d":"sh, ch e th, as suas identidades e as inversas logarítmicas.","b":"**O que é.** $\\sinh x=\\frac{e^x-e^{-x}}{2}$, $\\cosh x=\\frac{e^x+e^{-x}}{2}$, $\\tanh x=\\frac{\\sinh x}{\\cosh x}$. Satisfazem $\\cosh^2x-\\sinh^2x=1$, $\\sinh2x=2\\sinh x\\cosh x$ e $\\cosh x+\\sinh x=e^x$.\n\n**Como usar.** Derivadas: $(\\sinh x)'=\\cosh x$, $(\\cosh x)'=\\sinh x$, $(\\tanh x)'=\\frac{1}{\\cosh^2x}$. As inversas são logaritmos: $\\operatorname{arsinh}x=\\ln\\left(x+\\sqrt{x^2+1}\\right)$, $\\operatorname{arcosh}x=\\ln\\left(x+\\sqrt{x^2-1}\\right)$ para $x\\ge1$, $\\operatorname{artanh}x=\\frac12\\ln\\frac{1+x}{1-x}$, com derivadas $\\frac{1}{\\sqrt{x^2+1}}$, $\\frac{1}{\\sqrt{x^2-1}}$ e $\\frac{1}{1-x^2}$. Perto de $0$: $\\sinh x\\approx x+\\frac{x^3}{6}$, $\\cosh x\\approx1+\\frac{x^2}{2}$, $\\tanh x\\approx x-\\frac{x^3}{3}$.\n\n**Exemplo.** Se $\\cosh x=\\frac54$ com $x>0$, então $\\sinh x=\\sqrt{\\frac{25}{16}-1}=\\frac34$, logo $e^x=\\cosh x+\\sinh x=2$ e $x=\\ln2$."}},{"k":"seq-limits","n":"Limits of sequences","d":"Dominance, conjugates, squeezing, subsequences and the e-limit.","b":"**What it is.** $u_n\\to L$ means that for every $\\varepsilon>0$, eventually $|u_n-L|<\\varepsilon$. A sequence converges exactly when all its subsequences converge to the same limit, so two different subsequential limits prove divergence.\n\n**How to compute.** Dominance scale: $\\ln n\\ll n^p\\ll a^n\\ll n!\\ll n^n$ (for $p>0$, $a>1$); divide by the dominant term. Differences of roots: multiply by the conjugate, $a-b=\\frac{a^2-b^2}{a+b}$ (or $\\frac{a^3-b^3}{a^2+ab+b^2}$ for cube roots). Squeeze theorem: if $v_n\\le u_n\\le w_n$ and both outer sequences tend to $L$, so does $u_n$; a bounded sequence times one tending to $0$ tends to $0$. For $1^\\infty$: if $u_n\\to1$ and $v_n(u_n-1)\\to a$, then $u_n^{v_n}\\to e^a$. Ratio-to-root rule: if $\\frac{u_{n+1}}{u_n}\\to L$ then $\\sqrt[n]{u_n}\\to L$.\n\n**Example.** $\\left(1+\\frac2n\\right)^{3n}\\to e^6$, because $3n\\cdot\\frac2n=6$.","pt":{"n":"Limites de sucessões","d":"Ordens de grandeza, conjugados, enquadramento, sublimites e o limite de e.","b":"**O que é.** $u_n\\to L$ significa que, para todo o $\\varepsilon>0$, a partir de certa ordem $|u_n-L|<\\varepsilon$. Uma sucessão converge exatamente quando todas as suas subsucessões convergem para o mesmo limite, logo dois sublimites diferentes provam a divergência.\n\n**Como calcular.** Diz-se que $v_n$ é dominante em relação a $u_n$, e escreve-se $u_n\\ll v_n$, quando $\\frac{u_n}{v_n}\\to0$. Escala: $\\ln n\\ll n^p\\ll a^n\\ll n!\\ll n^n$ (para $p>0$, $a>1$); divida pelo termo dominante. Diferenças de raízes: multiplique pelo conjugado, $a-b=\\frac{a^2-b^2}{a+b}$ (ou $\\frac{a^3-b^3}{a^2+ab+b^2}$ para raízes cúbicas). Teorema das sucessões enquadradas: se $v_n\\le u_n\\le w_n$ e as duas sucessões exteriores tendem para $L$, também $u_n$ tende; uma sucessão limitada vezes um infinitésimo é um infinitésimo. Para $1^\\infty$ (limite notável): se $u_n\\to1$ e $v_n(u_n-1)\\to a$, então $u_n^{v_n}\\to e^a$. Da razão para a raiz: se $\\frac{u_{n+1}}{u_n}\\to L$ então $\\sqrt[n]{u_n}\\to L$.\n\n**Exemplo.** $\\left(1+\\frac2n\\right)^{3n}\\to e^6$, porque $3n\\cdot\\frac2n=6$."}},{"k":"sequences","n":"Recursive sequences","d":"Sequences defined by a recursion: monotone convergence and rates.","b":"**What it is.** A sequence $a_n$ converges to $L$ if its terms eventually stay as close to $L$ as you like. An increasing sequence that is bounded above always converges.\n\n**How to use it.** For a recursion $a_{n+1}=g(a_n)$ with a limit $L$, pass to the limit: $L=g(L)$. To find the rate, transform: show that $a_{n+1}^2-a_n^2$ or $\\frac1{a_{n+1}}-\\frac1{a_n}$ tends to a constant $c$; summing gives $a_n^2\\approx cn$ or $\\frac1{a_n}\\approx cn$. (Stolz–Cesàro makes this rigorous.)\n\n**Example.** $a_{n+1}=\\frac{a_n}{1+a_n}$, $a_1=1$: $\\frac1{a_{n+1}}=\\frac1{a_n}+1$, so $a_n=\\frac1n$.","pt":{"n":"Sucessões por recorrência","d":"Sucessões definidas por recorrência: convergência monótona e velocidade.","b":"**O que é.** Uma sucessão $a_n$ converge para $L$ se os seus termos acabam por ficar tão perto de $L$ quanto se queira. Uma sucessão crescente e majorada é sempre convergente.\n\n**Como usar.** Para uma recorrência $a_{n+1}=g(a_n)$ com limite $L$, passe ao limite: $L=g(L)$. Para obter a velocidade, transforme: mostre que $a_{n+1}^2-a_n^2$ ou $\\frac1{a_{n+1}}-\\frac1{a_n}$ tende para uma constante $c$; somando obtém-se $a_n^2\\approx cn$ ou $\\frac1{a_n}\\approx cn$. (O Teorema de Stolz–Cesàro torna isto rigoroso.)\n\n**Exemplo.** $a_{n+1}=\\frac{a_n}{1+a_n}$, $a_1=1$: $\\frac1{a_{n+1}}=\\frac1{a_n}+1$, logo $a_n=\\frac1n$."}},{"k":"limits","n":"Limits","d":"What a function approaches, and the standard ways to compute it.","b":"**What it is.** $\\lim_{x\\to a}f(x)=L$ means $f(x)$ gets as close to $L$ as you like once $x$ is close enough to $a$ (with $x\\ne a$). The value at $a$ itself doesn't matter.\n\n**How to compute.** If $f$ is continuous at $a$, just plug in. If you get $\\frac00$, simplify first: factor and cancel, multiply by a conjugate, or reduce to standard limits: $\\frac{\\sin x}{x}\\to1$, $\\frac{1-\\cos x}{x^2}\\to\\frac12$, $\\frac{e^x-1}{x}\\to1$, $\\frac{\\ln(1+x)}{x}\\to1$. As $x\\to\\infty$, divide by the highest power. The squeeze theorem handles oscillating terms: if $g\\le f\\le h$ and $g,h\\to L$, then $f\\to L$.\n\n**Example.** $\\lim_{x\\to2}\\frac{x^2-4}{x-2}=\\lim_{x\\to2}(x+2)=4$.","pt":{"n":"Limites","d":"Para onde tende uma função, e as técnicas habituais para o calcular.","b":"**O que é.** $\\lim_{x\\to a}f(x)=L$ significa que $f(x)$ fica tão perto de $L$ quanto se queira desde que $x$ esteja suficientemente perto de $a$ (com $x\\ne a$). O valor em $a$ não interessa.\n\n**Como calcular.** Se $f$ é contínua em $a$, basta substituir. Se obtiver $\\frac00$, simplifique primeiro: fatorize e simplifique, multiplique pelo conjugado, ou reduza a limites notáveis: $\\frac{\\sin x}{x}\\to1$, $\\frac{1-\\cos x}{x^2}\\to\\frac12$, $\\frac{e^x-1}{x}\\to1$, $\\frac{\\ln(1+x)}{x}\\to1$. Quando $x\\to\\infty$, divida pela maior potência. O enquadramento resolve termos oscilantes: se $g\\le f\\le h$ e $g,h\\to L$, então $f\\to L$.\n\n**Exemplo.** $\\lim_{x\\to2}\\frac{x^2-4}{x-2}=\\lim_{x\\to2}(x+2)=4$."}},{"k":"continuity","n":"Continuity & the IVT","d":"No jumps or holes, and the guarantee that sign changes mean roots.","b":"**What it is.** $f$ is continuous at $a$ if $\\lim_{x\\to a}f(x)=f(a)$: no jumps, holes or blow-ups. Polynomials, $e^x$, $\\sin$ and $\\cos$ are continuous everywhere, $\\ln x$ on $x>0$.\n\n**How to use it.** The Intermediate Value Theorem: if $f$ is continuous on $[a,b]$ and $N$ lies between $f(a)$ and $f(b)$, then $f(c)=N$ for some $c\\in[a,b]$. In particular a sign change $f(a)<0<f(b)$ guarantees a root in between. Combine with monotonicity to count roots exactly.\n\n**Example.** $f(x)=x^3+x-1$ has $f(0)=-1<0<1=f(1)$ and $f'>0$, so it has exactly one root, and it lies in $(0,1)$.","pt":{"n":"Continuidade e Teorema de Bolzano","d":"Sem saltos nem buracos, prolongamentos por continuidade, e a garantia de que uma mudança de sinal dá um zero.","b":"**O que é.** $f$ é contínua em $a$ se $\\lim_{x\\to a}f(x)=f(a)$: sem saltos, buracos ou assíntotas. Pela definição de Heine, $f$ é contínua em $a$ se $f(x_n)\\to f(a)$ para toda a sucessão $x_n\\to a$ de termos no domínio. Os polinómios, $e^x$, $\\sin$ e $\\cos$ são contínuos em todo o $\\mathbb R$, e $\\ln x$ em $x>0$. Se $a$ não pertence ao domínio mas $\\lim_{x\\to a}f(x)$ existe e é finito, $f$ é prolongável por continuidade a $a$.\n\n**Como usar.** Teorema do valor intermédio: se $f$ é contínua em $[a,b]$ e $N$ está entre $f(a)$ e $f(b)$, então $f(c)=N$ para algum $c\\in[a,b]$. Em particular, uma mudança de sinal $f(a)<0<f(b)$ garante um zero entre $a$ e $b$ (Teorema de Bolzano). Combinado com a monotonia, permite contar zeros com exatidão. Teorema de Weierstrass: uma função contínua num intervalo fechado e limitado tem máximo e mínimo.\n\n**Exemplo.** $f(x)=x^3+x-1$ tem $f(0)=-1<0<1=f(1)$ e $f'>0$, logo tem exatamente um zero, que está em $\\mathopen{]}0,1\\mathclose{[}$."}},{"k":"derivatives","n":"Derivatives","d":"Slopes and rates of change, and the rules to compute them.","b":"**What it is.** $f'(a)=\\lim_{h\\to0}\\frac{f(a+h)-f(a)}{h}$, the slope of the tangent line at $a$, or the instantaneous rate of change.\n\n**How to compute.** Power rule $(x^n)'=nx^{n-1}$; sums and constant multiples go through. Product rule $(fg)'=f'g+fg'$, quotient rule $\\left(\\frac fg\\right)'=\\frac{f'g-fg'}{g^2}$, chain rule $\\big(f(g(x))\\big)'=f'(g(x))\\,g'(x)$. Standard ones: $(\\sin x)'=\\cos x$, $(\\cos x)'=-\\sin x$, $(e^x)'=e^x$, $(\\ln x)'=\\frac1x$. The tangent line at $a$ is $y=f(a)+f'(a)(x-a)$.\n\n**Example.** $\\frac{d}{dx}\\sin(x^2)=\\cos(x^2)\\cdot2x$.","pt":{"n":"Derivadas","d":"Declives e taxas de variação, e as regras para os calcular.","b":"**O que é.** $f'(a)=\\lim_{h\\to0}\\frac{f(a+h)-f(a)}{h}$, o declive da reta tangente em $a$, ou a taxa de variação instantânea.\n\n**Como calcular.** Regra da potência $(x^n)'=nx^{n-1}$; somas e múltiplos constantes passam diretamente. Regra do produto $(fg)'=f'g+fg'$, regra do quociente $\\left(\\frac fg\\right)'=\\frac{f'g-fg'}{g^2}$, regra da cadeia $\\big(f(g(x))\\big)'=f'(g(x))\\,g'(x)$. As habituais: $(\\sin x)'=\\cos x$, $(\\cos x)'=-\\sin x$, $(e^x)'=e^x$, $(\\ln x)'=\\frac1x$. A reta tangente em $a$ é $y=f(a)+f'(a)(x-a)$.\n\n**Exemplo.** $\\frac{d}{dx}\\sin(x^2)=\\cos(x^2)\\cdot2x$."}},{"k":"differentiability","n":"Differentiability","d":"One-sided derivatives, gluing pieces smoothly, and derivatives of inverses.","b":"**What it is.** $f$ is differentiable at $a$ when $\\lim_{x\\to a}\\frac{f(x)-f(a)}{x-a}$ exists and is finite. Where a formula changes (piecewise definitions, absolute values, roots of zero), compute the left and right derivatives separately; $f$ is differentiable there only if they agree. Differentiable implies continuous, but not the other way round.\n\n**How to use it.** To make a piecewise $f$ differentiable at the seam, first make it continuous (equal one-sided limits and value), then make the one-sided derivatives equal. A corollary of the Mean Value Theorem helps: if $f$ is continuous at $a$ and $\\lim_{x\\to a}f'(x)=L$ exists, then $f'(a)=L$. For inverses and composites: $(f^{-1})'(f(a))=\\frac{1}{f'(a)}$ and $(f\\circ g)'(a)=f'(g(a))\\,g'(a)$.\n\n**Example.** $|x|$ has left derivative $-1$ and right derivative $1$ at $0$, so it is continuous but not differentiable there.","pt":{"n":"Diferenciabilidade","d":"Derivadas laterais, colar ramos sem bicos e derivadas de inversas.","b":"**O que é.** $f$ é diferenciável em $a$ quando $\\lim_{x\\to a}\\frac{f(x)-f(a)}{x-a}$ existe e é finito. Onde a expressão muda (funções definidas por ramos, módulos, raízes de zero), calcule separadamente as derivadas à esquerda e à direita; $f$ só é diferenciável nesse ponto se coincidirem. Diferenciável implica contínua, mas não o contrário.\n\n**Como usar.** Para tornar diferenciável uma função definida por ramos no ponto de junção, torne-a primeiro contínua (limites laterais iguais ao valor) e depois iguale as derivadas laterais. Um corolário do Teorema de Lagrange ajuda: se $f$ é contínua em $a$ e $\\lim_{x\\to a}f'(x)=L$ existe, então $f'(a)=L$. Para inversas e compostas: $(f^{-1})'(f(a))=\\frac{1}{f'(a)}$ e $(f\\circ g)'(a)=f'(g(a))\\,g'(a)$.\n\n**Exemplo.** $|x|$ tem derivada à esquerda $-1$ e derivada à direita $1$ em $0$, logo é contínua mas não diferenciável nesse ponto."}},{"k":"implicit","n":"Implicit differentiation","d":"Finding slopes on curves like x² + y² = 25.","b":"**What it is.** When a curve is given by an equation in $x$ and $y$ rather than $y=f(x)$, you can still find $\\frac{dy}{dx}$.\n\n**How to use it.** Differentiate both sides with respect to $x$, treating $y$ as a function of $x$: every term with $y$ picks up a factor $y'$ by the chain rule. Then solve for $y'$.\n\n**Example.** $x^2+y^2=25$ gives $2x+2yy'=0$, so $y'=-\\frac xy$. At $(3,4)$ the slope is $-\\frac34$.","pt":{"n":"Derivação implícita","d":"Declives em curvas como x² + y² = 25.","b":"**O que é.** Quando uma curva é dada por uma equação em $x$ e $y$ em vez de $y=f(x)$, continua a ser possível calcular $\\frac{dy}{dx}$.\n\n**Como usar.** Derive ambos os membros em ordem a $x$, tratando $y$ como função de $x$: cada termo com $y$ ganha um fator $y'$ pela regra da cadeia. Depois resolva em ordem a $y'$.\n\n**Exemplo.** $x^2+y^2=25$ dá $2x+2yy'=0$, logo $y'=-\\frac xy$. Em $(3,4)$ o declive é $-\\frac34$."}},{"k":"related-rates","n":"Related rates","d":"Linking how fast connected quantities change.","b":"**What it is.** When several quantities change over time and are tied together by an equation, their rates of change are tied together too.\n\n**How to use it.** Draw the situation, name the variables, and write the equation that links them (Pythagoras, similar triangles, an area or volume formula). Differentiate with respect to $t$. Only then plug in the numbers for the instant you care about.\n\n**Example.** A circle's radius grows at $2$ cm/s. From $A=\\pi r^2$, $\\frac{dA}{dt}=2\\pi r\\frac{dr}{dt}$, which is $2\\pi\\cdot5\\cdot2=20\\pi$ cm²/s when $r=5$.","pt":{"n":"Taxas relacionadas","d":"Relacionar a rapidez com que variam grandezas ligadas entre si.","b":"**O que é.** Quando várias grandezas variam no tempo e estão ligadas por uma equação, as suas taxas de variação também estão ligadas.\n\n**Como usar.** Desenhe a situação, dê nome às variáveis e escreva a equação que as liga (Pitágoras, semelhança de triângulos, uma fórmula de área ou de volume). Derive em ordem a $t$. Só então substitua os valores do instante que interessa.\n\n**Exemplo.** O raio de um círculo cresce a $2$ cm/s. De $A=\\pi r^2$, $\\frac{dA}{dt}=2\\pi r\\frac{dr}{dt}$, que vale $2\\pi\\cdot5\\cdot2=20\\pi$ cm²/s quando $r=5$."}},{"k":"mvt","n":"Mean Value Theorem","d":"Somewhere, the instant slope equals the average slope.","b":"**What it is.** If $f$ is continuous on $[a,b]$ and differentiable inside, then $f'(c)=\\frac{f(b)-f(a)}{b-a}$ for some $c\\in(a,b)$. Rolle's theorem is the case $f(a)=f(b)$, which gives $f'(c)=0$.\n\n**How to use it.** It turns derivative bounds into value bounds: if $|f'|\\le M$ then $|f(b)-f(a)|\\le M|b-a|$. It also counts roots: between two roots of $f$ there is a root of $f'$, so $f$ has at most one more root than $f'$.\n\nCauchy's mean value theorem generalizes it: for $f,g$ continuous on $[a,b]$ and differentiable on $(a,b)$, $\\frac{f(b)-f(a)}{g(b)-g(a)}=\\frac{f'(c)}{g'(c)}$ for some $c\\in(a,b)$ (when the denominators don't vanish). It also justifies the linear approximation $f(x_0+\\Delta x)\\approx f(x_0)+f'(x_0)\\Delta x$.\n\n**Example.** If $f(0)=0$ and $f'(x)\\le3$ everywhere, then $f(2)\\le6$.","pt":{"n":"Teoremas de Rolle e Lagrange","d":"Algures, o declive instantâneo é igual ao declive médio. Inclui o Teorema de Cauchy.","b":"**O que é.** Teorema de Lagrange: se $f$ é regular em $[a,b]$ (contínua em $[a,b]$ e diferenciável em $\\mathopen{]}a,b\\mathclose{[}$), então $f'(c)=\\frac{f(b)-f(a)}{b-a}$ para algum $c\\in\\,\\mathopen{]}a,b\\mathclose{[}$. O Teorema de Rolle é o caso $f(a)=f(b)$, que dá $f'(c)=0$.\n\n**Como usar.** Transforma limites da derivada em limites dos valores: se $|f'|\\le M$ então $|f(b)-f(a)|\\le M|b-a|$. Também conta zeros: entre dois zeros de $f$ há um zero de $f'$, logo $f$ tem no máximo mais um zero do que $f'$. Consequência: se $f'>0$ num intervalo, $f$ é aí estritamente crescente.\n\nO Teorema de Cauchy generaliza-o: para $f,g$ regulares em $[a,b]$, $\\frac{f(b)-f(a)}{g(b)-g(a)}=\\frac{f'(c)}{g'(c)}$ para algum $c\\in\\,\\mathopen{]}a,b\\mathclose{[}$ (quando os denominadores não se anulam). Justifica também a fórmula dos acréscimos finitos $f(x_0+\\Delta x)\\approx f(x_0)+f'(x_0)\\Delta x$.\n\n**Exemplo.** Se $f(0)=0$ e $f'(x)\\le3$ em todo o lado, então $f(2)\\le6$."}},{"k":"lhopital","n":"L'Hôpital's rule","d":"Differentiate top and bottom to resolve 0/0 and ∞/∞.","b":"**What it is.** If $\\frac{f(x)}{g(x)}$ becomes $\\frac00$ or $\\frac{\\infty}{\\infty}$ as $x\\to a$, then $\\lim\\frac{f}{g}=\\lim\\frac{f'}{g'}$, provided the right side exists.\n\n**How to use it.** Differentiate the numerator and the denominator separately (this is not the quotient rule). You may need several rounds. Other indeterminate forms convert: write $0\\cdot\\infty$ as a fraction, and for $1^\\infty$, $0^0$, $\\infty^0$ take logs first.\n\nIf $\\lim\\frac{f'}{g'}$ does not exist, the rule says nothing: $\\frac{x^2\\cos(1/x)}{e^x-1}\\to0$, yet the quotient of derivatives has no limit.\n\n**Example.** $\\lim_{x\\to0}\\frac{e^x-1-x}{x^2}=\\lim\\frac{e^x-1}{2x}=\\lim\\frac{e^x}{2}=\\frac12$.","pt":{"n":"Regra de Cauchy","d":"Derivar numerador e denominador para levantar indeterminações 0/0 e ∞/∞.","b":"**O que é.** Se $\\frac{f(x)}{g(x)}$ dá $\\frac00$ ou $\\frac{\\infty}{\\infty}$ quando $x\\to a$, então $\\lim\\frac{f}{g}=\\lim\\frac{f'}{g'}$, desde que o segundo limite exista. (Fora de Portugal é conhecida como regra de L'Hôpital.)\n\n**Como usar.** Derive o numerador e o denominador separadamente (não é a regra do quociente). Pode ser preciso aplicá-la várias vezes. As outras indeterminações convertem-se: escreva $0\\cdot\\infty$ como fração e, para $1^\\infty$, $0^0$, $\\infty^0$, aplique primeiro logaritmos.\n\nSe $\\lim\\frac{f'}{g'}$ não existir, a regra nada permite concluir: $\\frac{x^2\\cos(1/x)}{e^x-1}\\to0$, mas o quociente das derivadas não tem limite.\n\n**Exemplo.** $\\lim_{x\\to0}\\frac{e^x-1-x}{x^2}=\\lim\\frac{e^x-1}{2x}=\\lim\\frac{e^x}{2}=\\frac12$."}},{"k":"optimization","n":"Optimization","d":"Finding the largest or smallest value with derivatives.","b":"**What it is.** The maximum and minimum of a differentiable function occur at critical points (where $f'(x)=0$ or is undefined) or at the endpoints of the domain.\n\n**How to use it.** Write the quantity as a function of one variable, using any constraint to eliminate the others. Find the critical points, then compare values at critical points and endpoints, or check that $f'$ switches sign. Second derivative test: if $f'(c)=0$ and $f''(c)<0$, it's a local max; if $f''(c)>0$, a local min.\n\n**Example.** Maximize $x(10-x)$: the derivative $10-2x$ vanishes at $x=5$, giving $25$.","pt":{"n":"Otimização","d":"Encontrar o maior ou o menor valor com derivadas.","b":"**O que é.** O máximo e o mínimo de uma função diferenciável ocorrem em pontos críticos (onde $f'(x)=0$ ou não existe) ou nos extremos do domínio.\n\n**Como usar.** Escreva a grandeza como função de uma só variável, usando as restrições para eliminar as outras. Determine os pontos críticos e compare os valores nesses pontos e nos extremos, ou verifique que $f'$ muda de sinal. Teste da segunda derivada: se $f'(c)=0$ e $f''(c)<0$, é um máximo local; se $f''(c)>0$, um mínimo local.\n\n**Exemplo.** Maximizar $x(10-x)$: a derivada $10-2x$ anula-se em $x=5$, o que dá $25$."}},{"k":"convexity","n":"Concavity & convexity","d":"How a graph bends, inflection points, and Jensen's inequality.","b":"**What it is.** If $f''>0$ the graph bends upward (convex, concave up) and lies above its tangent lines. If $f''<0$ it bends downward (concave). An inflection point is where the bending switches.\n\n**How to use it.** Jensen's inequality: for convex $f$, $f\\!\\left(\\frac{a+b}{2}\\right)\\le\\frac{f(a)+f(b)}{2}$, and in general $f(\\text{average})\\le\\text{average of }f$; the inequality flips for concave $f$. Tangent-line bound: a convex $f$ satisfies $f(x)\\ge f(a)+f'(a)(x-a)$.\n\n**Example.** $e^x$ is convex and its tangent at $0$ is $1+x$, so $e^x\\ge1+x$ for all $x$.","pt":{"n":"Concavidade e convexidade","d":"Como o gráfico curva, pontos de inflexão e a desigualdade de Jensen.","b":"**O que é.** Se $f''>0$ o gráfico tem a concavidade voltada para cima (função convexa) e fica acima das suas tangentes. Se $f''<0$ tem a concavidade voltada para baixo (côncava). Um ponto de inflexão é onde a concavidade muda.\n\n**Como usar.** Desigualdade de Jensen: para $f$ convexa, $f\\!\\left(\\frac{a+b}{2}\\right)\\le\\frac{f(a)+f(b)}{2}$ e, em geral, $f(\\text{média})\\le\\text{média de }f$; a desigualdade inverte-se para $f$ côncava. Majoração pela tangente: uma $f$ convexa satisfaz $f(x)\\ge f(a)+f'(a)(x-a)$.\n\n**Exemplo.** $e^x$ é convexa e a sua tangente em $0$ é $1+x$, logo $e^x\\ge1+x$ para todo o $x$."}},{"k":"roots","n":"Counting solutions","d":"Using the shape of a graph to count roots exactly.","b":"**What it is.** To count solutions of an equation, put it in the form $f(x)=0$ and study the graph of $f$.\n\n**How to use it.** The critical points of $f$ cut the line into pieces where $f$ is monotonic. On each piece there is at most one root, and there is exactly one when $f$ changes sign across it (IVT). Don't forget the behavior as $x\\to\\pm\\infty$. Rearranging can help: $e^x=kx$ is the same as $k=\\frac{e^x}{x}$, a horizontal line against a single graph.\n\n**Example.** For $x^3-3x-1=0$: the local max is $f(-1)=1>0$ and the local min is $f(1)=-3<0$, so there are three real roots.","pt":{"n":"Contar soluções","d":"Usar a forma do gráfico para contar zeros com exatidão.","b":"**O que é.** Para contar as soluções de uma equação, escreva-a na forma $f(x)=0$ e estude o gráfico de $f$.\n\n**Como usar.** Os pontos críticos de $f$ dividem a reta em intervalos onde $f$ é monótona. Em cada um há no máximo um zero, e há exatamente um quando $f$ muda de sinal nesse intervalo (TVI). Não se esqueça do comportamento quando $x\\to\\pm\\infty$. Reorganizar ajuda: $e^x=kx$ é o mesmo que $k=\\frac{e^x}{x}$, uma reta horizontal contra um único gráfico.\n\n**Exemplo.** Para $x^3-3x-1=0$: o máximo local é $f(-1)=1>0$ e o mínimo local é $f(1)=-3<0$, logo há três raízes reais."}},{"k":"inverse-functions","n":"Inverse functions","d":"Derivatives and integrals of f⁻¹ from those of f.","b":"**What it is.** A strictly monotonic $f$ has an inverse $f^{-1}$ with $f^{-1}(f(x))=x$. Its graph is the reflection of $f$'s graph across the line $y=x$.\n\n**How to use it.** Derivative: $(f^{-1})'(y)=\\frac{1}{f'(x)}$ where $y=f(x)$. Integral: reflecting the picture gives $\\int_{f(a)}^{f(b)}f^{-1}(y)\\,dy=b\\,f(b)-a\\,f(a)-\\int_a^bf(x)\\,dx$, so you never need a formula for $f^{-1}$.\n\n**Example.** $f(x)=x^3+2x$ has $f(1)=3$ and $f'(1)=5$, so $(f^{-1})'(3)=\\frac15$.","pt":{"n":"Funções inversas","d":"Derivadas e integrais de f⁻¹ a partir dos de f.","b":"**O que é.** Uma $f$ estritamente monótona tem inversa $f^{-1}$, com $f^{-1}(f(x))=x$. O seu gráfico é o simétrico do gráfico de $f$ em relação à reta $y=x$.\n\n**Como usar.** Derivada: $(f^{-1})'(y)=\\frac{1}{f'(x)}$ onde $y=f(x)$. Integral: refletindo a figura, $\\int_{f(a)}^{f(b)}f^{-1}(y)\\,dy=b\\,f(b)-a\\,f(a)-\\int_a^bf(x)\\,dx$, por isso nunca precisa de uma expressão para $f^{-1}$.\n\n**Exemplo.** $f(x)=x^3+2x$ tem $f(1)=3$ e $f'(1)=5$, logo $(f^{-1})'(3)=\\frac15$."}},{"k":"integrals","n":"Definite integrals & the FTC","d":"Signed area under a curve, computed with antiderivatives.","b":"**What it is.** $\\int_a^bf(x)\\,dx$ is the signed area between the graph of $f$ and the $x$-axis from $x=a$ to $x=b$: area above the axis counts positive, below counts negative.\n\n**How to calculate it.** The Fundamental Theorem of Calculus: if $F'=f$, then $\\int_a^bf(x)\\,dx=F(b)-F(a)$. So find an antiderivative and subtract its values at the ends. Basic antiderivatives: $x^n\\to\\frac{x^{n+1}}{n+1}$ ($n\\ne-1$), $\\frac1x\\to\\ln|x|$, $e^x\\to e^x$, $\\sin x\\to-\\cos x$, $\\cos x\\to\\sin x$. The other half of the theorem: $\\frac{d}{dx}\\int_a^xf(t)\\,dt=f(x)$, and with an upper limit $g(x)$ you get $f(g(x))\\,g'(x)$.\n\n**Example.** $\\int_0^23x^2\\,dx=\\big[x^3\\big]_0^2=8$.","pt":{"n":"Integrais e Teorema Fundamental","d":"Área com sinal sob uma curva, calculada com primitivas.","b":"**O que é.** $\\int_a^bf(x)\\,dx$ é a área com sinal entre o gráfico de $f$ e o eixo dos $x$, de $x=a$ a $x=b$: a área acima do eixo conta positivamente, a área abaixo conta negativamente.\n\n**Como calcular.** Teorema Fundamental do Cálculo: se $F'=f$, então $\\int_a^bf(x)\\,dx=F(b)-F(a)$. Basta encontrar uma primitiva e subtrair os seus valores nos extremos. Primitivas imediatas: $x^n\\to\\frac{x^{n+1}}{n+1}$ ($n\\ne-1$), $\\frac1x\\to\\ln|x|$, $e^x\\to e^x$, $\\sin x\\to-\\cos x$, $\\cos x\\to\\sin x$. A outra metade do teorema: $\\frac{d}{dx}\\int_a^xf(t)\\,dt=f(x)$, e com limite superior $g(x)$ obtém-se $f(g(x))\\,g'(x)$.\n\n**Exemplo.** $\\int_0^23x^2\\,dx=\\big[x^3\\big]_0^2=8$."}},{"k":"substitution","n":"u-substitution","d":"The chain rule run backwards.","b":"**What it is.** If the integrand looks like $f(g(x))\\,g'(x)$, the substitution $u=g(x)$, $du=g'(x)\\,dx$ simplifies it.\n\n**How to use it.** Spot an inner function whose derivative also appears (up to a constant factor). Change the limits too: $\\int_a^bf(g(x))g'(x)\\,dx=\\int_{g(a)}^{g(b)}f(u)\\,du$.\n\n**Example.** $\\int_0^12x(1+x^2)^3\\,dx$ with $u=1+x^2$ becomes $\\int_1^2u^3\\,du=\\frac{16-1}{4}=\\frac{15}{4}$.","pt":{"n":"Primitivação por substituição","d":"A regra da cadeia ao contrário.","b":"**O que é.** Se a função integranda tem a forma $f(g(x))\\,g'(x)$, a substituição $u=g(x)$, $du=g'(x)\\,dx$ simplifica-a.\n\n**Como usar.** Procure uma função interior cuja derivada também apareça (a menos de uma constante). Mude também os limites de integração: $\\int_a^bf(g(x))g'(x)\\,dx=\\int_{g(a)}^{g(b)}f(u)\\,du$.\n\n**Exemplo.** $\\int_0^12x(1+x^2)^3\\,dx$ com $u=1+x^2$ passa a $\\int_1^2u^3\\,du=\\frac{16-1}{4}=\\frac{15}{4}$."}},{"k":"symmetry","n":"Integral symmetry tricks","d":"Odd/even functions, King's rule, and x ↦ 1/x.","b":"**What it is.** Many hard-looking integrals collapse once you exploit a symmetry of the interval.\n\n**How to use it.** Odd functions ($f(-x)=-f(x)$) integrate to $0$ over $[-a,a]$. King's rule: $\\int_a^bf(x)\\,dx=\\int_a^bf(a+b-x)\\,dx$; if the new integrand pairs nicely with the old, add them: $2I=\\int_a^b\\big(f(x)+f(a+b-x)\\big)dx$. For intervals like $[\\frac1c,c]$ or $(0,\\infty)$ try $x\\mapsto\\frac1x$; for $\\frac{1}{1+a^x}$ on $[-c,c]$ try $x\\mapsto-x$.\n\n**Example.** $I=\\int_0^{\\pi/2}\\frac{\\sin x}{\\sin x+\\cos x}dx$: King's rule swaps $\\sin$ and $\\cos$, so $2I=\\frac\\pi2$ and $I=\\frac\\pi4$.","pt":{"n":"Simetrias em integrais","d":"Funções pares e ímpares, a troca x ↦ a+b−x e a troca x ↦ 1/x.","b":"**O que é.** Muitos integrais de aspeto difícil desfazem-se quando se aproveita uma simetria do intervalo.\n\n**Como usar.** As funções ímpares ($f(-x)=-f(x)$) têm integral $0$ em $[-a,a]$. Troca dos extremos: $\\int_a^bf(x)\\,dx=\\int_a^bf(a+b-x)\\,dx$; se a nova função integranda combina bem com a antiga, some-as: $2I=\\int_a^b\\big(f(x)+f(a+b-x)\\big)dx$. Para intervalos como $[\\frac1c,c]$ ou $\\mathopen{]}0,\\infty\\mathclose{[}$ experimente $x\\mapsto\\frac1x$; para $\\frac{1}{1+a^x}$ em $[-c,c]$ experimente $x\\mapsto-x$.\n\n**Exemplo.** $I=\\int_0^{\\pi/2}\\frac{\\sin x}{\\sin x+\\cos x}dx$: a troca $x\\mapsto\\frac\\pi2-x$ permuta $\\sin$ e $\\cos$, logo $2I=\\frac\\pi2$ e $I=\\frac\\pi4$."}},{"k":"riemann","n":"Riemann sums","d":"Integrals as limits of sums, and sums as integrals.","b":"**What it is.** An integral is the limit of rectangle sums: $\\int_0^1f(x)\\,dx=\\lim_{n\\to\\infty}\\frac1n\\sum_{k=1}^nf\\!\\left(\\frac kn\\right)$.\n\n**How to use it.** Read it backwards: to evaluate the limit of a sum, factor out $\\frac1n$ and write each term as a function of $\\frac kn$. That function is $f$, and the limit is $\\int_0^1f$. For products, take logs to get sums.\n\n**Example.** $\\lim\\frac1n\\sum_{k=1}^n\\left(\\frac kn\\right)^3=\\int_0^1x^3\\,dx=\\frac14$.","pt":{"n":"Somas de Riemann","d":"Integrais como limites de somas, e somas como integrais.","b":"**O que é.** Um integral é o limite de somas de retângulos: $\\int_0^1f(x)\\,dx=\\lim_{n\\to\\infty}\\frac1n\\sum_{k=1}^nf\\!\\left(\\frac kn\\right)$.\n\n**Como usar.** Leia ao contrário: para calcular o limite de uma soma, ponha $\\frac1n$ em evidência e escreva cada parcela como função de $\\frac kn$. Essa função é $f$, e o limite é $\\int_0^1f$. Para produtos, aplique logaritmos para obter somas.\n\n**Exemplo.** $\\lim\\frac1n\\sum_{k=1}^n\\left(\\frac kn\\right)^3=\\int_0^1x^3\\,dx=\\frac14$."}},{"k":"ibp","n":"Integration by parts","d":"The product rule run backwards.","b":"**What it is.** $\\int_a^bu\\,dv=\\big[uv\\big]_a^b-\\int_a^bv\\,du$.\n\n**How to use it.** Pick $u$ to be something that gets simpler when differentiated (polynomials, $\\ln x$, $\\arctan x$) and $dv$ something you can integrate ($e^x$, $\\sin x$, $\\cos x$, $dx$). Sometimes you apply it twice; with $e^x\\sin x$ the original integral comes back and you solve for it.\n\n**Example.** $\\int_0^1xe^{2x}dx$ with $u=x$, $dv=e^{2x}dx$: $\\left[\\frac{xe^{2x}}{2}\\right]_0^1-\\int_0^1\\frac{e^{2x}}{2}dx=\\frac{e^2}{2}-\\frac{e^2-1}{4}=\\frac{e^2+1}{4}$.","pt":{"n":"Primitivação por partes","d":"A regra do produto ao contrário.","b":"**O que é.** $\\int_a^bu\\,dv=\\big[uv\\big]_a^b-\\int_a^bv\\,du$.\n\n**Como usar.** Escolha para $u$ algo que fique mais simples ao derivar (polinómios, $\\ln x$, $\\arctan x$) e para $dv$ algo que saiba primitivar ($e^x$, $\\sin x$, $\\cos x$, $dx$). Por vezes aplica-se duas vezes; com $e^x\\sin x$ o integral original reaparece e resolve-se em ordem a ele.\n\n**Exemplo.** $\\int_0^1xe^{2x}dx$ com $u=x$, $dv=e^{2x}dx$: $\\left[\\frac{xe^{2x}}{2}\\right]_0^1-\\int_0^1\\frac{e^{2x}}{2}dx=\\frac{e^2}{2}-\\frac{e^2-1}{4}=\\frac{e^2+1}{4}$."}},{"k":"improper","n":"Improper integrals","d":"Integrals over infinite ranges or across blow-ups.","b":"**What it is.** When a limit of integration is infinite or the integrand blows up, the integral is defined as a limit: $\\int_1^\\infty f=\\lim_{b\\to\\infty}\\int_1^bf$, or $\\int_0^1f=\\lim_{\\varepsilon\\to0^+}\\int_\\varepsilon^1f$ if $f$ blows up at $0$. It converges if that limit is finite.\n\n**How to use it.** Benchmarks: $\\int_1^\\infty\\frac{dx}{x^p}$ converges iff $p>1$; $\\int_0^1\\frac{dx}{x^p}$ converges iff $p<1$; $\\int_0^\\infty e^{-ax}dx=\\frac1a$. The Gamma integral: $\\int_0^\\infty x^ne^{-x}dx=n!$.\n\n**Example.** $\\int_1^\\infty\\frac{dx}{x^3}=\\lim_{b\\to\\infty}\\left[-\\frac{1}{2x^2}\\right]_1^b=\\frac12$.","pt":{"n":"Integrais impróprios","d":"Integrais em intervalos ilimitados ou de funções ilimitadas.","b":"**O que é.** Quando um limite de integração é infinito ou a função integranda é ilimitada, o integral define-se como um limite: $\\int_1^\\infty f=\\lim_{b\\to\\infty}\\int_1^bf$, ou $\\int_0^1f=\\lim_{\\varepsilon\\to0^+}\\int_\\varepsilon^1f$ se $f$ explode em $0$. É convergente se esse limite for finito.\n\n**Como usar.** Referências: $\\int_1^\\infty\\frac{dx}{x^p}$ converge se e só se $p>1$; $\\int_0^1\\frac{dx}{x^p}$ converge se e só se $p<1$; $\\int_0^\\infty e^{-ax}dx=\\frac1a$. O integral Gama: $\\int_0^\\infty x^ne^{-x}dx=n!$.\n\n**Exemplo.** $\\int_1^\\infty\\frac{dx}{x^3}=\\lim_{b\\to\\infty}\\left[-\\frac{1}{2x^2}\\right]_1^b=\\frac12$."}},{"k":"areas-volumes","n":"Areas, volumes & length","d":"Geometry with integrals: discs, washers, arc length, polar area.","b":"**What it is.** Integrals measure more than area under a graph.\n\n**How to use it.** Area between curves: $\\int(\\text{top}-\\text{bottom})\\,dx$. Volume when $y=f(x)$ spins around the $x$-axis (discs): $V=\\pi\\int_a^bf(x)^2dx$; with a hole (washers): $\\pi\\int(R^2-r^2)\\,dx$. Arc length: $L=\\int_a^b\\sqrt{1+f'(x)^2}\\,dx$. Polar area: $A=\\frac12\\int r(\\theta)^2\\,d\\theta$.\n\n**Example.** Spinning $y=x$ on $[0,1]$ around the $x$-axis makes a cone of volume $\\pi\\int_0^1x^2dx=\\frac\\pi3$.","pt":{"n":"Áreas, volumes e comprimentos","d":"Geometria com integrais: discos, anilhas, comprimento de arco, área em polares.","b":"**O que é.** Os integrais medem mais do que a área sob um gráfico.\n\n**Como usar.** Área entre curvas: $\\int(\\text{cima}-\\text{baixo})\\,dx$. Volume quando $y=f(x)$ roda em torno do eixo dos $x$ (discos): $V=\\pi\\int_a^bf(x)^2dx$; com um buraco (anilhas): $\\pi\\int(R^2-r^2)\\,dx$. Comprimento de arco: $L=\\int_a^b\\sqrt{1+f'(x)^2}\\,dx$. Área em polares: $A=\\frac12\\int r(\\theta)^2\\,d\\theta$.\n\n**Exemplo.** Rodar $y=x$ em $[0,1]$ em torno do eixo dos $x$ dá um cone de volume $\\pi\\int_0^1x^2dx=\\frac\\pi3$."}},{"k":"series","n":"Infinite series","d":"Adding infinitely many terms: geometric, telescoping, power series.","b":"**What it is.** $\\sum a_n$ is the limit of its partial sums.\n\n**How to use it.** Geometric: $\\sum_{n\\ge0}r^n=\\frac1{1-r}$ for $|r|<1$. Telescoping: if $a_n=b_n-b_{n+1}$, partial sums collapse to $b_1-b_{N+1}$. Tests: the terms must tend to $0$; $\\sum\\frac1{n^p}$ converges iff $p>1$; ratio test: if $\\left|\\frac{a_{n+1}}{a_n}\\right|\\to\\rho<1$ it converges. A power series $\\sum c_nx^n$ converges for $|x|<R$, the radius of convergence, and can be differentiated or integrated term by term: from $\\sum x^n=\\frac1{1-x}$ you get $\\sum nx^{n-1}=\\frac{1}{(1-x)^2}$.\n\n**Example.** $\\sum_{n\\ge1}\\frac1{2^n}=1$.","pt":{"n":"Séries","d":"Somar infinitas parcelas: séries geométricas, telescópicas e de potências.","b":"**O que é.** $\\sum a_n$ é o limite das suas somas parciais.\n\n**Como usar.** Geométrica: $\\sum_{n\\ge0}r^n=\\frac1{1-r}$ para $|r|<1$. Telescópica (de Mengoli): se $a_n=b_n-b_{n+1}$, as somas parciais reduzem-se a $b_1-b_{N+1}$. Critérios: o termo geral tem de tender para $0$; $\\sum\\frac1{n^p}$ converge se e só se $p>1$; critério da razão: se $\\left|\\frac{a_{n+1}}{a_n}\\right|\\to\\rho<1$, converge. Uma série de potências $\\sum c_nx^n$ converge para $|x|<R$, o raio de convergência, e pode ser derivada ou integrada termo a termo: de $\\sum x^n=\\frac1{1-x}$ obtém-se $\\sum nx^{n-1}=\\frac{1}{(1-x)^2}$.\n\n**Exemplo.** $\\sum_{n\\ge1}\\frac1{2^n}=1$."}},{"k":"taylor","n":"Taylor series","d":"Writing functions as infinite polynomials.","b":"**What it is.** Near $x=0$, a smooth function equals $\\sum\\frac{f^{(n)}(0)}{n!}x^n$. The essentials: $e^x=\\sum\\frac{x^n}{n!}$, $\\sin x=x-\\frac{x^3}{3!}+\\frac{x^5}{5!}-\\cdots$, $\\cos x=1-\\frac{x^2}{2!}+\\frac{x^4}{4!}-\\cdots$, $\\ln(1+x)=x-\\frac{x^2}{2}+\\frac{x^3}{3}-\\cdots$, $\\arctan x=x-\\frac{x^3}{3}+\\frac{x^5}{5}-\\cdots$.\n\n**How to use it.** For limits, replace each function by its first few terms. For high derivatives at $0$: $f^{(n)}(0)=n!\\times$ (coefficient of $x^n$). You can substitute into known series, e.g. $e^{x^2}=\\sum\\frac{x^{2n}}{n!}$.\n\n**Example.** $\\frac{\\sin x-x}{x^3}=\\frac{-x^3/6+\\cdots}{x^3}\\to-\\frac16$.","pt":{"n":"Séries de Taylor","d":"Escrever funções como polinómios infinitos.","b":"**O que é.** Perto de $x=0$, uma função suave é igual a $\\sum\\frac{f^{(n)}(0)}{n!}x^n$. As essenciais: $e^x=\\sum\\frac{x^n}{n!}$, $\\sin x=x-\\frac{x^3}{3!}+\\frac{x^5}{5!}-\\cdots$, $\\cos x=1-\\frac{x^2}{2!}+\\frac{x^4}{4!}-\\cdots$, $\\ln(1+x)=x-\\frac{x^2}{2}+\\frac{x^3}{3}-\\cdots$, $\\arctan x=x-\\frac{x^3}{3}+\\frac{x^5}{5}-\\cdots$.\n\n**Como usar.** Em limites, substitua cada função pelos seus primeiros termos. Para derivadas de ordem elevada em $0$: $f^{(n)}(0)=n!\\times$ (coeficiente de $x^n$). Pode substituir em séries conhecidas, por exemplo $e^{x^2}=\\sum\\frac{x^{2n}}{n!}$.\n\n**Exemplo.** $\\frac{\\sin x-x}{x^3}=\\frac{-x^3/6+\\cdots}{x^3}\\to-\\frac16$."}},{"k":"ode","n":"Differential equations","d":"Equations for an unknown function and its derivatives.","b":"**What it is.** An equation linking a function to its derivatives, plus initial conditions that pin down the constants.\n\n**How to solve.** $y'=ky$ gives $y=Ce^{kx}$. Separable $\\frac{dy}{dx}=g(x)h(y)$: integrate $\\int\\frac{dy}{h(y)}=\\int g(x)\\,dx$. Linear $y'+p(x)y=q(x)$: multiply by $e^{\\int p}$ so the left side becomes $\\left(e^{\\int p}y\\right)'$. For $y''+by'+cy=0$, try $y=e^{rx}$ and solve $r^2+br+c=0$: distinct real roots give $C_1e^{r_1x}+C_2e^{r_2x}$, and roots $\\alpha\\pm\\beta i$ give $e^{\\alpha x}(C_1\\cos\\beta x+C_2\\sin\\beta x)$.\n\n**Example.** $y'=-2y$, $y(0)=5$ gives $y=5e^{-2x}$.","pt":{"n":"Equações diferenciais","d":"Equações para uma função desconhecida e as suas derivadas.","b":"**O que é.** Uma equação que relaciona uma função com as suas derivadas, mais condições iniciais que fixam as constantes.\n\n**Como resolver.** $y'=ky$ dá $y=Ce^{kx}$. Variáveis separáveis $\\frac{dy}{dx}=g(x)h(y)$: primitive $\\int\\frac{dy}{h(y)}=\\int g(x)\\,dx$. Linear $y'+p(x)y=q(x)$: multiplique por $e^{\\int p}$ para que o primeiro membro passe a $\\left(e^{\\int p}y\\right)'$. Para $y''+by'+cy=0$, experimente $y=e^{rx}$ e resolva $r^2+br+c=0$: raízes reais distintas dão $C_1e^{r_1x}+C_2e^{r_2x}$, e raízes $\\alpha\\pm\\beta i$ dão $e^{\\alpha x}(C_1\\cos\\beta x+C_2\\sin\\beta x)$.\n\n**Exemplo.** $y'=-2y$, $y(0)=5$ dá $y=5e^{-2x}$."}},{"k":"multivariable","n":"Partial derivatives & Lagrange","d":"Optimizing functions of several variables, with or without constraints.","b":"**What it is.** For $f(x,y)$, the partial derivative $\\frac{\\partial f}{\\partial x}$ differentiates in $x$ while holding $y$ fixed.\n\n**How to use it.** Critical points have all partial derivatives zero. Classify with $D=f_{xx}f_{yy}-f_{xy}^2$: $D>0,f_{xx}>0$ is a minimum, $D>0,f_{xx}<0$ a maximum, $D<0$ a saddle. To optimize $f$ subject to $g=c$, use Lagrange multipliers: solve $\\nabla f=\\lambda\\nabla g$ together with $g=c$.\n\n**Example.** Maximize $x+y$ on $x^2+y^2=2$: $(1,1)=\\lambda(2x,2y)$ forces $x=y=1$, so the maximum is $2$.","pt":{"n":"Derivadas parciais e multiplicadores","d":"Otimizar funções de várias variáveis, com ou sem restrições.","b":"**O que é.** Para $f(x,y)$, a derivada parcial $\\frac{\\partial f}{\\partial x}$ deriva em ordem a $x$ mantendo $y$ fixo.\n\n**Como usar.** Nos pontos críticos todas as derivadas parciais se anulam. Classifique com $D=f_{xx}f_{yy}-f_{xy}^2$: $D>0,f_{xx}>0$ é um mínimo, $D>0,f_{xx}<0$ um máximo, $D<0$ um ponto de sela. Para otimizar $f$ sujeita a $g=c$, use multiplicadores de Lagrange: resolva $\\nabla f=\\lambda\\nabla g$ juntamente com $g=c$.\n\n**Exemplo.** Maximizar $x+y$ em $x^2+y^2=2$: $(1,1)=\\lambda(2x,2y)$ obriga a $x=y=1$, logo o máximo é $2$."}},{"k":"double-integrals","n":"Double integrals","d":"Volumes over regions, iterated integrals, and polar coordinates.","b":"**What it is.** $\\iint_Rf\\,dA$ is the volume under $z=f(x,y)$ over the region $R$.\n\n**How to compute.** As an iterated integral, $\\int_a^b\\left(\\int_{g_1(x)}^{g_2(x)}f\\,dy\\right)dx$. You can swap the order if you redescribe the region, which helps when one order is impossible. Polar coordinates: $x=r\\cos\\theta$, $y=r\\sin\\theta$, $dA=r\\,dr\\,d\\theta$, ideal for discs. The same trick computes $\\left(\\int_{-\\infty}^\\infty e^{-x^2}dx\\right)^2=\\pi$.\n\n**Example.** $\\iint_{x^2+y^2\\le4}dA=\\int_0^{2\\pi}\\!\\int_0^2r\\,dr\\,d\\theta=4\\pi$.","pt":{"n":"Integrais duplos","d":"Volumes sobre regiões, integrais iterados e coordenadas polares.","b":"**O que é.** $\\iint_Rf\\,dA$ é o volume sob $z=f(x,y)$ sobre a região $R$.\n\n**Como calcular.** Como integral iterado, $\\int_a^b\\left(\\int_{g_1(x)}^{g_2(x)}f\\,dy\\right)dx$. Pode trocar a ordem se descrever de novo a região, o que ajuda quando uma das ordens é impossível. Coordenadas polares: $x=r\\cos\\theta$, $y=r\\sin\\theta$, $dA=r\\,dr\\,d\\theta$, ideais para discos. O mesmo truque calcula $\\left(\\int_{-\\infty}^\\infty e^{-x^2}dx\\right)^2=\\pi$.\n\n**Exemplo.** $\\iint_{x^2+y^2\\le4}dA=\\int_0^{2\\pi}\\!\\int_0^2r\\,dr\\,d\\theta=4\\pi$."}},{"k":"inequalities","n":"Inequalities via calculus","d":"Proving and finding bounds with derivatives, AM–GM, and symmetry.","b":"**What it is.** Many olympiad problems ask for the best bound on an expression, which is an optimization problem in disguise.\n\n**How to use it.** To show $f\\ge g$, study $h=f-g$: find its minimum, or show $h(a)=0$ and $h'\\ge0$ for $x\\ge a$. AM–GM: the arithmetic mean of positive numbers is at least their geometric mean, with equality when they are all equal. Under a symmetric constraint the extreme value often occurs at the symmetric point; Lagrange multipliers or substitution confirm it. Convexity and tangent lines give quick estimates.\n\n**Example.** $\\ln x\\le x-1$ for $x>0$: $h(x)=x-1-\\ln x$ has $h'(x)=1-\\frac1x$, so its minimum is $h(1)=0$.","pt":{"n":"Desigualdades com cálculo","d":"Provar e encontrar majorantes com derivadas, médias e simetria.","b":"**O que é.** Muitos problemas de olimpíada pedem o melhor majorante ou minorante de uma expressão, o que é um problema de otimização disfarçado.\n\n**Como usar.** Para mostrar que $f\\ge g$, estude $h=f-g$: determine o seu mínimo, ou mostre que $h(a)=0$ e $h'\\ge0$ para $x\\ge a$. Desigualdade entre as médias: a média aritmética de números positivos é pelo menos a sua média geométrica, com igualdade quando são todos iguais. Sob uma restrição simétrica, o valor extremo ocorre muitas vezes no ponto simétrico; multiplicadores de Lagrange ou uma substituição confirmam-no. A convexidade e as retas tangentes dão estimativas rápidas.\n\n**Exemplo.** $\\ln x\\le x-1$ para $x>0$: $h(x)=x-1-\\ln x$ tem $h'(x)=1-\\frac1x$, logo o seu mínimo é $h(1)=0$."}},{"k":"functional","n":"Functional equations","d":"Equations where the unknown is a whole function.","b":"**What it is.** Equations like $f(x+y)=f(x)+f(y)$ where you must find every function that works.\n\n**How to use it.** Plug in special values ($x=0$, $y=0$, $y=x$, $y=-x$) to learn $f(0)$ and symmetries. Look for fixed points $f(a)=a$. Test simple candidates (linear, $\\frac1x$, constants). With calculus, differentiate the equation or compute $f'$ from the limit definition to get a differential equation. Use any limit, continuity or monotonicity condition; it's there for a reason. Always check answers in the original equation.\n\n**Example.** If $f$ is differentiable, $f(x+y)=f(x)f(y)$ and $f'(0)=k$, then $f'(x)=f(x)f'(0)$, so $f(x)=e^{kx}$.","pt":{"n":"Equações funcionais","d":"Equações em que a incógnita é uma função.","b":"**O que é.** Equações como $f(x+y)=f(x)+f(y)$, em que é preciso encontrar todas as funções que as satisfazem.\n\n**Como usar.** Substitua valores especiais ($x=0$, $y=0$, $y=x$, $y=-x$) para descobrir $f(0)$ e simetrias. Procure pontos fixos $f(a)=a$. Teste candidatos simples (afins, $\\frac1x$, constantes). Com cálculo, derive a equação ou calcule $f'$ pela definição para obter uma equação diferencial. Use qualquer condição de limite, continuidade ou monotonia; está lá por alguma razão. Verifique sempre as respostas na equação original.\n\n**Exemplo.** Se $f$ é diferenciável, $f(x+y)=f(x)f(y)$ e $f'(0)=k$, então $f'(x)=f(x)f'(0)$, logo $f(x)=e^{kx}$."}},{"k":"la-systems","sub":"la","n":"Linear systems & Gaussian elimination","d":"Writing a system as an augmented matrix and reducing it to row echelon form.","b":"**What it is.** A system of linear equations is stored as its augmented matrix $[A\\,|\\,b]$. Three elementary row operations (swap two rows, multiply a row by a nonzero number, add a multiple of one row to another) never change the solution set. Gaussian elimination uses them to reach a row echelon form: zero rows at the bottom, and each row's first nonzero entry (its pivot) strictly to the right of the pivot above.\n\n**How to use it.** Work column by column: pick a pivot, clear everything below it, move on. Then read the system from the bottom up (back substitution), or keep going to the reduced form, where every pivot is $1$ and is the only nonzero entry in its column. Columns with a pivot give dependent variables; the others are free and become parameters.\n\n**Example.** For $x+y=3,\\ 2x+3y=8$: $L_2-2L_1$ gives $y=2$, then $x=1$.","pt":{"n":"Sistemas lineares e eliminação de Gauss","d":"Escrever um sistema como matriz aumentada e reduzi-la a uma matriz em escada.","b":"**O que é.** Um sistema de equações lineares fica guardado na sua matriz aumentada $[A\\,|\\,b]$. As três operações elementares sobre linhas (trocar duas linhas, multiplicar uma linha por um número não nulo, somar a uma linha um múltiplo de outra) nunca mudam o conjunto das soluções. O método de eliminação de Gauss usa-as para chegar a uma matriz em escada de linhas: linhas nulas no fundo e o primeiro elemento não nulo de cada linha (o pivô) estritamente à direita do pivô da linha de cima.\n\n**Como usar.** Trabalhe coluna a coluna: escolha um pivô, anule tudo o que está por baixo e avance. Depois leia o sistema de baixo para cima (substituição ascendente), ou continue até à forma reduzida, em que cada pivô é $1$ e é o único elemento não nulo da sua coluna. As colunas com pivô dão as variáveis dependentes; as outras são livres e passam a parâmetros.\n\n**Exemplo.** Para $x+y=3,\\ 2x+3y=8$: $L_2-2L_1$ dá $y=2$, e depois $x=1$."}},{"k":"la-rank","sub":"la","n":"Rank & classifying systems","d":"Counting pivots tells you whether a system has no, one or infinitely many solutions.","b":"**What it is.** The rank of a matrix, $\\operatorname{rank}A$, is the number of pivots in any row echelon form of it. For a system $Ax=b$ with $n$ unknowns there are exactly three cases: impossible if $\\operatorname{rank}[A\\,|\\,b]>\\operatorname{rank}A$ (a pivot in the last column); possible and determined if both ranks equal $n$; possible and undetermined if both ranks are equal but smaller than $n$, with $n-\\operatorname{rank}A$ free variables.\n\n**How to use it.** With a parameter, eliminate first and only then look at the entries that depend on it: the values that kill a pivot are the ones to examine separately. A homogeneous system $Ax=0$ is never impossible; it has nonzero solutions exactly when $\\operatorname{rank}A<n$.\n\n**Example.** If elimination ends with the row $[\\,0\\ 0\\ \\ a-2\\,|\\,a-2\\,]$, then $a\\ne2$ gives a unique solution and $a=2$ gives infinitely many.","pt":{"n":"Característica e classificação de sistemas","d":"Contar pivôs diz se um sistema tem zero, uma ou infinitas soluções.","b":"**O que é.** A característica de uma matriz, $\\operatorname{car}A$, é o número de pivôs de qualquer matriz em escada obtida a partir dela. Para um sistema $Ax=b$ com $n$ incógnitas há exatamente três casos: impossível se $\\operatorname{car}[A\\,|\\,b]>\\operatorname{car}A$ (um pivô na última coluna); possível e determinado se ambas as características forem iguais a $n$; possível e indeterminado se forem iguais mas menores do que $n$, com $n-\\operatorname{car}A$ variáveis livres (o grau de indeterminação).\n\n**Como usar.** Com um parâmetro, elimine primeiro e só depois olhe para as entradas que dependem dele: os valores que anulam um pivô são os que se estudam à parte. Um sistema homogéneo $Ax=0$ nunca é impossível; tem soluções não nulas exatamente quando $\\operatorname{car}A<n$.\n\n**Exemplo.** Se a eliminação termina com a linha $[\\,0\\ 0\\ \\ a-2\\,|\\,a-2\\,]$, então $a\\ne2$ dá uma só solução e $a=2$ dá infinitas."}},{"k":"la-matrices","sub":"la","n":"Matrix algebra","d":"Sums, products, transposes, traces and powers, and the rules they do and don't follow.","b":"**What it is.** An $m\\times n$ matrix times an $n\\times p$ matrix is $m\\times p$, with $[AB]_{ij}=\\sum_k a_{ik}b_{kj}$: row $i$ of $A$ against column $j$ of $B$. Column $j$ of $AB$ is $A$ times column $j$ of $B$. The transpose swaps rows and columns, with $(AB)^T=B^TA^T$. The trace $\\operatorname{tr}A$ is the sum of the diagonal.\n\n**How to use it.** Products are associative and distributive but not commutative: in general $AB\\ne BA$, so $(A+B)^2=A^2+AB+BA+B^2$. Useful facts: $\\operatorname{tr}(AB)=\\operatorname{tr}(BA)$; diagonal matrices multiply entry by entry, so $D^k$ just raises the diagonal to the $k$-th power; for powers, compute $A^2$, $A^3$ and look for a pattern.\n\n**Example.** $\\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}^n=\\begin{bmatrix}1&n\\\\0&1\\end{bmatrix}$.","pt":{"n":"Álgebra de matrizes","d":"Somas, produtos, transpostas, traços e potências, e as regras que seguem ou não.","b":"**O que é.** Uma matriz $m\\times n$ vezes uma matriz $n\\times p$ dá uma matriz $m\\times p$, com $[AB]_{ij}=\\sum_k a_{ik}b_{kj}$: a linha $i$ de $A$ contra a coluna $j$ de $B$. A coluna $j$ de $AB$ é $A$ vezes a coluna $j$ de $B$. A transposta troca linhas com colunas, com $(AB)^T=B^TA^T$. O traço $\\operatorname{tr}A$ é a soma da diagonal principal.\n\n**Como usar.** O produto é associativo e distributivo mas não é comutativo: em geral $AB\\ne BA$, logo $(A+B)^2=A^2+AB+BA+B^2$. Factos úteis: $\\operatorname{tr}(AB)=\\operatorname{tr}(BA)$; as matrizes diagonais multiplicam-se entrada a entrada, por isso $D^k$ só eleva a diagonal à potência $k$; para potências, calcule $A^2$, $A^3$ e procure um padrão.\n\n**Exemplo.** $\\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}^n=\\begin{bmatrix}1&n\\\\0&1\\end{bmatrix}$."}},{"k":"la-inverse","sub":"la","n":"Inverse matrices","d":"When a square matrix can be undone, and how to compute the inverse.","b":"**What it is.** A square matrix $A$ is invertible if some $A^{-1}$ has $AA^{-1}=A^{-1}A=I$. Equivalently: its reduced form is $I$, $\\operatorname{rank}A=n$, $Ax=0$ only has $x=0$, $Ax=b$ always has exactly one solution, or $\\det A\\ne0$. For $2\\times2$: $\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}^{-1}=\\frac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}$.\n\n**How to use it.** Gauss–Jordan: reduce $[A\\,|\\,I]$ until the left block is $I$; the right block is then $A^{-1}$. Rules: $(AB)^{-1}=B^{-1}A^{-1}$, $(A^T)^{-1}=(A^{-1})^T$, $(kA)^{-1}=\\frac1kA^{-1}$. To solve a matrix equation such as $AXB=C$, multiply on the correct side: $X=A^{-1}CB^{-1}$. Each elementary row operation is multiplication on the left by an elementary matrix.\n\n**Example.** If $A^3=0$ then $(I-A)^{-1}=I+A+A^2$.","pt":{"n":"Matriz inversa","d":"Quando uma matriz quadrada se pode desfazer, e como calcular a inversa.","b":"**O que é.** Uma matriz quadrada $A$ é invertível se existir $A^{-1}$ com $AA^{-1}=A^{-1}A=I$. Equivalentemente: a sua forma reduzida é $I$, $\\operatorname{car}A=n$, $Ax=0$ só tem a solução $x=0$, $Ax=b$ tem sempre uma e uma só solução, ou $\\det A\\ne0$. Para $2\\times2$: $\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}^{-1}=\\frac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}$.\n\n**Como usar.** Método de Gauss-Jordan: reduza $[A\\,|\\,I]$ até o bloco da esquerda ser $I$; o bloco da direita é então $A^{-1}$. Regras: $(AB)^{-1}=B^{-1}A^{-1}$, $(A^T)^{-1}=(A^{-1})^T$, $(kA)^{-1}=\\frac1kA^{-1}$. Para resolver uma equação matricial como $AXB=C$, multiplique do lado certo: $X=A^{-1}CB^{-1}$. Cada operação elementar sobre linhas é a multiplicação à esquerda por uma matriz elementar.\n\n**Exemplo.** Se $A^3=0$, então $(I-A)^{-1}=I+A+A^2$."}},{"k":"la-det","sub":"la","n":"Determinants","d":"One number that measures volume scaling and decides invertibility.","b":"**What it is.** $\\det A$ is defined for square matrices. For $2\\times2$ it is $ad-bc$; in general it can be expanded along any row or column (Laplace): $\\det A=\\sum_j(-1)^{i+j}a_{ij}\\det A_{ij}$, where $A_{ij}$ deletes row $i$ and column $j$. Geometrically, $|\\det A|$ is the factor by which $A$ scales areas or volumes.\n\n**How to use it.** Row operations act predictably: swapping two rows changes the sign, multiplying a row by $k$ multiplies $\\det$ by $k$, adding a multiple of a row to another changes nothing. So eliminate to a triangular matrix and multiply the diagonal. Key rules: $\\det(AB)=\\det A\\det B$, $\\det A^T=\\det A$, $\\det A^{-1}=\\frac1{\\det A}$, $\\det(kA)=k^n\\det A$ for $n\\times n$, and $A$ is invertible exactly when $\\det A\\ne0$. Expand along a row or column with many zeros.\n\n**Example.** If $A$ is $3\\times3$ with $\\det A=2$, then $\\det(2A^{-1})=2^3\\cdot\\frac12=4$.","pt":{"n":"Determinantes","d":"Um número que mede a mudança de volume e decide a invertibilidade.","b":"**O que é.** $\\det A$ está definido para matrizes quadradas. Para $2\\times2$ é $ad-bc$; em geral pode desenvolver-se segundo qualquer linha ou coluna (desenvolvimento de Laplace): $\\det A=\\sum_j(-1)^{i+j}a_{ij}\\det A_{ij}$, onde $A_{ij}$ apaga a linha $i$ e a coluna $j$. Geometricamente, $|\\det A|$ é o fator pelo qual $A$ multiplica áreas ou volumes.\n\n**Como usar.** As operações sobre linhas têm efeitos previsíveis: trocar duas linhas muda o sinal, multiplicar uma linha por $k$ multiplica o determinante por $k$, somar a uma linha um múltiplo de outra não muda nada. Por isso, elimine até uma matriz triangular e multiplique a diagonal. Regras essenciais: $\\det(AB)=\\det A\\det B$, $\\det A^T=\\det A$, $\\det A^{-1}=\\frac1{\\det A}$, $\\det(kA)=k^n\\det A$ para $n\\times n$, e $A$ é invertível exatamente quando $\\det A\\ne0$. Desenvolva segundo uma linha ou coluna com muitos zeros.\n\n**Exemplo.** Se $A$ é $3\\times3$ com $\\det A=2$, então $\\det(2A^{-1})=2^3\\cdot\\frac12=4$."}},{"k":"la-cramer","sub":"la","n":"Adjugate & Cramer's rule","d":"Cofactors give an explicit inverse and an explicit solution of square systems.","b":"**What it is.** The cofactor of $a_{ij}$ is $(-1)^{i+j}\\det A_{ij}$. The adjugate $\\operatorname{adj}A$ is the transpose of the matrix of cofactors, and $A\\,\\operatorname{adj}A=(\\det A)I$, so $A^{-1}=\\frac{1}{\\det A}\\operatorname{adj}A$. Cramer's rule: if $\\det A\\ne0$, the solution of $Ax=b$ has $x_i=\\frac{\\det A_i}{\\det A}$, where $A_i$ is $A$ with column $i$ replaced by $b$.\n\n**How to use it.** Cramer is ideal when you need only one unknown, or one entry of $A^{-1}$: $[A^{-1}]_{ij}=\\frac{(-1)^{i+j}\\det A_{ji}}{\\det A}$ (note the swapped indices). Also $\\det(\\operatorname{adj}A)=(\\det A)^{n-1}$.\n\n**Example.** For $2x+y=5,\\ x+3y=5$: $x=\\frac{\\det\\begin{bmatrix}5&1\\\\5&3\\end{bmatrix}}{5}=2$.","pt":{"n":"Matriz adjunta e regra de Cramer","d":"Os complementos algébricos dão uma inversa explícita e uma solução explícita de sistemas quadrados.","b":"**O que é.** O complemento algébrico de $a_{ij}$ é $(-1)^{i+j}\\det A_{ij}$. A matriz adjunta $\\operatorname{adj}A$ é a transposta da matriz dos complementos algébricos, e $A\\,\\operatorname{adj}A=(\\det A)I$, logo $A^{-1}=\\frac{1}{\\det A}\\operatorname{adj}A$. Regra de Cramer: se $\\det A\\ne0$, a solução de $Ax=b$ tem $x_i=\\frac{\\det A_i}{\\det A}$, onde $A_i$ é $A$ com a coluna $i$ substituída por $b$.\n\n**Como usar.** A regra de Cramer é ideal quando só precisa de uma incógnita, ou de uma entrada de $A^{-1}$: $[A^{-1}]_{ij}=\\frac{(-1)^{i+j}\\det A_{ji}}{\\det A}$ (repare na troca de índices). Também $\\det(\\operatorname{adj}A)=(\\det A)^{n-1}$.\n\n**Exemplo.** Para $2x+y=5,\\ x+3y=5$: $x=\\frac{\\det\\begin{bmatrix}5&1\\\\5&3\\end{bmatrix}}{5}=2$."}},{"k":"la-span","sub":"la","n":"Linear combinations & spans","d":"Which vectors you can build from a given set.","b":"**What it is.** A linear combination of $v_1,\\dots,v_k$ is any $c_1v_1+\\dots+c_kv_k$. Their span, $\\operatorname{span}\\{v_1,\\dots,v_k\\}$, is the set of all such combinations; it is always a subspace. A set spans $\\mathbb R^m$ if every vector of $\\mathbb R^m$ is a combination of it.\n\n**How to use it.** \"Is $b$ a combination of $v_1,\\dots,v_k$?\" is the same as \"is the system with augmented matrix $[\\,v_1\\cdots v_k\\,|\\,b\\,]$ possible?\". The vectors span $\\mathbb R^m$ exactly when the matrix with them as columns has a pivot in every row, that is, rank $m$. In particular you need at least $m$ vectors. To describe a span by equations, eliminate with a general $b=(b_1,\\dots,b_m)$ and read the conditions from the zero rows.\n\n**Example.** $\\operatorname{span}\\{(1,1),(2,2)\\}$ is the line $y=x$, so it does not span $\\mathbb R^2$.","pt":{"n":"Combinações lineares e conjuntos geradores","d":"Que vetores se conseguem construir a partir de um dado conjunto.","b":"**O que é.** Uma combinação linear de $v_1,\\dots,v_k$ é qualquer $c_1v_1+\\dots+c_kv_k$. O conjunto gerado, $L(\\{v_1,\\dots,v_k\\})$, é o conjunto de todas essas combinações; é sempre um subespaço. Um conjunto gera $\\mathbb R^m$ se todo o vetor de $\\mathbb R^m$ for combinação linear dos seus vetores.\n\n**Como usar.** \"$b$ é combinação linear de $v_1,\\dots,v_k$?\" é o mesmo que \"o sistema de matriz aumentada $[\\,v_1\\cdots v_k\\,|\\,b\\,]$ é possível?\". Os vetores geram $\\mathbb R^m$ exatamente quando a matriz que os tem como colunas tem um pivô em cada linha, ou seja, característica $m$. Em particular, são precisos pelo menos $m$ vetores. Para descrever um conjunto gerado por equações, elimine com um $b=(b_1,\\dots,b_m)$ genérico e leia as condições nas linhas nulas.\n\n**Exemplo.** $L(\\{(1,1),(2,2)\\})$ é a reta $y=x$, logo não gera $\\mathbb R^2$."}},{"k":"la-indep","sub":"la","n":"Linear independence","d":"When no vector in a set is redundant.","b":"**What it is.** Vectors $v_1,\\dots,v_k$ are linearly independent if $c_1v_1+\\dots+c_kv_k=0$ forces $c_1=\\dots=c_k=0$; otherwise one of them is a combination of the others. Two vectors are dependent exactly when one is a multiple of the other; any set containing $0$ is dependent; more than $m$ vectors in $\\mathbb R^m$ are always dependent.\n\n**How to use it.** Put the vectors as columns of a matrix and eliminate: they are independent exactly when every column has a pivot (rank $k$). For $n$ vectors in $\\mathbb R^n$, this is the same as a nonzero determinant. With a parameter, find the values that make the determinant (or a pivot) vanish.\n\n**Example.** $(1,0,0),(1,1,0),(1,1,1)$ are independent: the matrix is triangular with determinant $1$.","pt":{"n":"Independência linear","d":"Quando nenhum vetor de um conjunto está a mais.","b":"**O que é.** Os vetores $v_1,\\dots,v_k$ são linearmente independentes se $c_1v_1+\\dots+c_kv_k=0$ obrigar a $c_1=\\dots=c_k=0$; caso contrário, um deles é combinação linear dos restantes. Dois vetores são dependentes exatamente quando um é múltiplo do outro; qualquer conjunto que contenha $0$ é dependente; mais de $m$ vetores em $\\mathbb R^m$ são sempre dependentes.\n\n**Como usar.** Ponha os vetores como colunas de uma matriz e elimine: são independentes exatamente quando todas as colunas têm pivô (característica $k$). Para $n$ vetores em $\\mathbb R^n$, isso é o mesmo que um determinante não nulo. Com um parâmetro, procure os valores que anulam o determinante (ou um pivô).\n\n**Exemplo.** $(1,0,0),(1,1,0),(1,1,1)$ são independentes: a matriz é triangular com determinante $1$."}},{"k":"la-basis","sub":"la","n":"Subspaces, bases & dimension","d":"The size of a subspace, and the sizes of sums and intersections.","b":"**What it is.** A subspace is a nonempty set closed under sums and scalar multiples (so it contains $0$). A basis is a linearly independent spanning set; all bases have the same size, the dimension. $\\mathbb R^n$ has dimension $n$, the polynomials of degree at most $n$ have dimension $n+1$, and the $m\\times n$ matrices have dimension $mn$.\n\n**How to use it.** In a space of dimension $d$, any $d$ independent vectors already form a basis, and so do any $d$ spanning vectors. A subspace described by $k$ independent equations in $\\mathbb R^n$ has dimension $n-k$. For two subspaces, $\\dim(U+V)+\\dim(U\\cap V)=\\dim U+\\dim V$; $U+V$ is spanned by the union of their bases. A set like $\\{x:x_1+x_2=1\\}$ is not a subspace: it misses $0$.\n\n**Example.** $\\{(x,y,z):x+y+z=0\\}$ has dimension $3-1=2$, with basis $(1,-1,0),(1,0,-1)$.","pt":{"n":"Subespaços, bases e dimensão","d":"O tamanho de um subespaço, e os tamanhos de somas e interseções.","b":"**O que é.** Um subespaço é um conjunto não vazio fechado para somas e para produtos por escalares (logo contém $0$). Uma base é um conjunto gerador linearmente independente; todas as bases têm o mesmo número de elementos, a dimensão. $\\mathbb R^n$ tem dimensão $n$, os polinómios de grau até $n$ têm dimensão $n+1$ e as matrizes $m\\times n$ têm dimensão $mn$.\n\n**Como usar.** Num espaço de dimensão $d$, quaisquer $d$ vetores independentes já formam uma base, e o mesmo acontece com quaisquer $d$ vetores geradores. Um subespaço descrito por $k$ equações independentes em $\\mathbb R^n$ tem dimensão $n-k$. Para dois subespaços, $\\dim(U+V)+\\dim(U\\cap V)=\\dim U+\\dim V$; $U+V$ é gerado pela união das bases. Um conjunto como $\\{x:x_1+x_2=1\\}$ não é subespaço: não contém $0$.\n\n**Exemplo.** $\\{(x,y,z):x+y+z=0\\}$ tem dimensão $3-1=2$, com base $(1,-1,0),(1,0,-1)$."}},{"k":"la-nulcol","sub":"la","n":"Null space, column space & rank–nullity","d":"The subspaces attached to a matrix, and the count that links them.","b":"**What it is.** For an $m\\times n$ matrix $A$: the null space $\\operatorname{Nul}A=\\{x\\in\\mathbb R^n:Ax=0\\}$ and the column space $\\operatorname{Col}A$, spanned by the columns (the set of all $b$ for which $Ax=b$ is possible). The row space is $\\operatorname{Col}A^T$. Their dimensions: $\\dim\\operatorname{Col}A=\\dim\\operatorname{Col}A^T=\\operatorname{rank}A$ and $\\dim\\operatorname{Nul}A=n-\\operatorname{rank}A$ (the nullity). So rank $+$ nullity $=$ number of columns.\n\n**How to use it.** Eliminate once. The pivot columns of the original $A$ are a basis of $\\operatorname{Col}A$; the nonzero rows of the echelon form are a basis of the row space; solving $Ax=0$ with one parameter per free variable gives a basis of $\\operatorname{Nul}A$. Always $\\operatorname{rank}A\\le\\min(m,n)$, and $\\operatorname{rank}(AB)\\le\\min(\\operatorname{rank}A,\\operatorname{rank}B)$.\n\n**Example.** A $3\\times5$ matrix of rank $3$ has a null space of dimension $2$ and $\\operatorname{Col}A=\\mathbb R^3$.","pt":{"n":"Espaço nulo, espaço das colunas e nulidade","d":"Os subespaços associados a uma matriz e a contagem que os liga.","b":"**O que é.** Para uma matriz $A$ do tipo $m\\times n$: o espaço nulo $\\operatorname{Nul}A=\\{x\\in\\mathbb R^n:Ax=0\\}$ e o espaço das colunas $\\operatorname{Col}A$, gerado pelas colunas (o conjunto dos $b$ para os quais $Ax=b$ é possível). O espaço das linhas é $\\operatorname{Col}A^T$. As dimensões: $\\dim\\operatorname{Col}A=\\dim\\operatorname{Col}A^T=\\operatorname{car}A$ e $\\dim\\operatorname{Nul}A=n-\\operatorname{car}A$ (a nulidade). Ou seja, característica $+$ nulidade $=$ número de colunas.\n\n**Como usar.** Elimine uma vez. As colunas de $A$ (a original) onde há pivô formam uma base de $\\operatorname{Col}A$; as linhas não nulas da matriz em escada formam uma base do espaço das linhas; resolver $Ax=0$ com um parâmetro por cada variável livre dá uma base de $\\operatorname{Nul}A$. Sempre $\\operatorname{car}A\\le\\min(m,n)$, e $\\operatorname{car}(AB)\\le\\min(\\operatorname{car}A,\\operatorname{car}B)$.\n\n**Exemplo.** Uma matriz $3\\times5$ de característica $3$ tem espaço nulo de dimensão $2$ e $\\operatorname{Col}A=\\mathbb R^3$."}},{"k":"la-coords","sub":"la","n":"Coordinates & change of basis","d":"Describing the same vector in different bases.","b":"**What it is.** In an ordered basis $B=(v_1,\\dots,v_n)$ every vector is uniquely $x=\\alpha_1v_1+\\dots+\\alpha_nv_n$; the coordinate vector is $[x]_B=(\\alpha_1,\\dots,\\alpha_n)$. The change-of-basis matrix $M_{E\\leftarrow B}$ has the vectors of $B$ as columns and turns $B$-coordinates into standard ones: $x=M_{E\\leftarrow B}[x]_B$.\n\n**How to use it.** To get $[x]_B$, solve $M_{E\\leftarrow B}\\,[x]_B=x$, i.e. use $M_{B\\leftarrow E}=M_{E\\leftarrow B}^{-1}$. Between two bases, go through the standard one: $M_{B_2\\leftarrow B_1}=M_{B_2\\leftarrow E}\\,M_{E\\leftarrow B_1}$. Every invertible matrix is a change-of-basis matrix.\n\n**Example.** In $B=((1,0),(1,1))$, the vector $(3,5)$ is $-2(1,0)+5(1,1)$, so $[(3,5)]_B=(-2,5)$.","pt":{"n":"Coordenadas e mudança de base","d":"Descrever o mesmo vetor em bases diferentes.","b":"**O que é.** Numa base ordenada $B=(v_1,\\dots,v_n)$, cada vetor escreve-se de forma única como $x=\\alpha_1v_1+\\dots+\\alpha_nv_n$; o vetor das coordenadas é $[x]_B=(\\alpha_1,\\dots,\\alpha_n)$. A matriz de mudança de base $M_{E\\leftarrow B}$ tem os vetores de $B$ como colunas e transforma coordenadas em $B$ em coordenadas canónicas: $x=M_{E\\leftarrow B}[x]_B$.\n\n**Como usar.** Para obter $[x]_B$, resolva $M_{E\\leftarrow B}\\,[x]_B=x$, ou seja, use $M_{B\\leftarrow E}=M_{E\\leftarrow B}^{-1}$. Entre duas bases, passe pela canónica: $M_{B_2\\leftarrow B_1}=M_{B_2\\leftarrow E}\\,M_{E\\leftarrow B_1}$. Toda a matriz invertível é uma matriz de mudança de base.\n\n**Exemplo.** Na base $B=((1,0),(1,1))$, o vetor $(3,5)$ é $-2(1,0)+5(1,1)$, logo $[(3,5)]_B=(-2,5)$."}},{"k":"la-linmap","sub":"la","n":"Linear transformations & their matrices","d":"Maps that respect sums and scalars are matrices in disguise.","b":"**What it is.** $T:E_1\\to E_2$ is linear if $T(u+v)=T(u)+T(v)$ and $T(\\alpha u)=\\alpha T(u)$; then $T(0)=0$. A linear map is determined by the images of a basis. The standard matrix of $T:\\mathbb R^n\\to\\mathbb R^m$ has columns $T(e_1),\\dots,T(e_n)$ and $T(x)=[T]x$. In bases $B_1,B_2$, the matrix $[T]_{B_2B_1}$ has columns $[T(u_j)]_{B_2}$.\n\n**How to use it.** A formula is linear exactly when every component is a combination of the variables with no constant terms, products or powers. Composition is matrix product: $[S\\circ T]=[S][T]$. Changing bases: $[T]_{\\mathcal D_2\\mathcal D_1}=M_{\\mathcal D_2\\leftarrow B_2}\\,[T]_{B_2B_1}\\,M_{B_1\\leftarrow\\mathcal D_1}$; for one basis, $[T]_B=P^{-1}[T]P$ with $P=M_{E\\leftarrow B}$. Rotations of the plane by $\\theta$ have matrix $\\begin{bmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{bmatrix}$.\n\n**Example.** If $T(1,3)=(1,1)$ and $T(5,7)=(2,3)$, then $T(4,4)=T(5,7)-T(1,3)=(1,2)$.","pt":{"n":"Transformações lineares e representação matricial","d":"Funções que respeitam somas e escalares são matrizes disfarçadas.","b":"**O que é.** $T:E_1\\to E_2$ é linear se $T(u+v)=T(u)+T(v)$ e $T(\\alpha u)=\\alpha T(u)$; então $T(0)=0$. Uma transformação linear fica determinada pelas imagens de uma base. A matriz de $T:\\mathbb R^n\\to\\mathbb R^m$ nas bases canónicas tem colunas $T(e_1),\\dots,T(e_n)$ e $T(x)=[T]x$. Nas bases $B_1,B_2$, a matriz $[T]_{B_2B_1}$ tem colunas $[T(u_j)]_{B_2}$.\n\n**Como usar.** Uma expressão é linear exatamente quando cada componente é uma combinação das variáveis sem termos constantes, produtos ou potências. A composição é o produto de matrizes: $[S\\circ T]=[S][T]$. Mudança de bases: $[T]_{\\mathcal D_2\\mathcal D_1}=M_{\\mathcal D_2\\leftarrow B_2}\\,[T]_{B_2B_1}\\,M_{B_1\\leftarrow\\mathcal D_1}$; para uma só base, $[T]_B=P^{-1}[T]P$ com $P=M_{E\\leftarrow B}$. As rotações do plano de amplitude $\\theta$ têm matriz $\\begin{bmatrix}\\cos\\theta&-\\sin\\theta\\\\\\sin\\theta&\\cos\\theta\\end{bmatrix}$.\n\n**Exemplo.** Se $T(1,3)=(1,1)$ e $T(5,7)=(2,3)$, então $T(4,4)=T(5,7)-T(1,3)=(1,2)$."}},{"k":"la-kerim","sub":"la","n":"Kernel & image","d":"What a linear map kills and what it reaches, and the dimension count between them.","b":"**What it is.** For linear $T:E_1\\to E_2$: the kernel $\\ker T=\\{x:T(x)=0\\}$ and the image $\\operatorname{im}T=\\{T(x)\\}$, both subspaces. In bases, they correspond to $\\operatorname{Nul}$ and $\\operatorname{Col}$ of the representing matrix, so $\\dim\\ker T+\\dim\\operatorname{im}T=\\dim E_1$.\n\n**How to use it.** $T$ is injective exactly when $\\ker T=\\{0\\}$; surjective exactly when $\\dim\\operatorname{im}T=\\dim E_2$. Between spaces of the same finite dimension, injective, surjective and invertible are all the same thing. A map from a bigger space to a smaller one can't be injective; from smaller to bigger, it can't be surjective. $T(x)=b$ is possible exactly when $b\\in\\operatorname{im}T$, and its solutions are one particular solution plus $\\ker T$.\n\n**Example.** $T(p)=p'$ on polynomials of degree $\\le3$ has kernel the constants (dimension $1$), so its image has dimension $3$.","pt":{"n":"Núcleo e contradomínio","d":"O que uma transformação linear anula e o que atinge, e a contagem de dimensões entre os dois.","b":"**O que é.** Para $T:E_1\\to E_2$ linear: o núcleo $\\operatorname{Nuc}T=\\{x:T(x)=0\\}$ e o contradomínio (imagem) $\\operatorname{Im}T=\\{T(x)\\}$, ambos subespaços. Fixadas bases, correspondem ao $\\operatorname{Nul}$ e ao $\\operatorname{Col}$ da matriz que representa $T$, logo $\\dim\\operatorname{Nuc}T+\\dim\\operatorname{Im}T=\\dim E_1$.\n\n**Como usar.** $T$ é injetiva exatamente quando $\\operatorname{Nuc}T=\\{0\\}$; sobrejetiva exatamente quando $\\dim\\operatorname{Im}T=\\dim E_2$. Entre espaços da mesma dimensão finita, injetiva, sobrejetiva e invertível são a mesma coisa. Uma transformação de um espaço maior para um menor não pode ser injetiva; de um menor para um maior, não pode ser sobrejetiva. $T(x)=b$ é possível exatamente quando $b\\in\\operatorname{Im}T$, e as soluções são uma solução particular mais $\\operatorname{Nuc}T$.\n\n**Exemplo.** $T(p)=p'$ nos polinómios de grau $\\le3$ tem por núcleo as constantes (dimensão $1$), logo a imagem tem dimensão $3$."}},{"k":"la-eigen","sub":"la","n":"Eigenvalues & eigenvectors","d":"Directions a matrix only stretches, and by how much.","b":"**What it is.** $\\lambda$ is an eigenvalue of $A$ if $Av=\\lambda v$ for some $v\\ne0$ (an eigenvector). The eigenvalues are the roots of the characteristic polynomial $p(\\lambda)=\\det(A-\\lambda I)$; the eigenspace is $E(\\lambda)=\\operatorname{Nul}(A-\\lambda I)$. The algebraic multiplicity is the multiplicity as a root; the geometric multiplicity is $\\dim E(\\lambda)$, and $1\\le$ geometric $\\le$ algebraic.\n\n**How to use it.** Shortcuts: the eigenvalues add up to $\\operatorname{tr}A$ and multiply to $\\det A$ (counted with multiplicity); a triangular matrix has its diagonal as eigenvalues; $A^k$ has eigenvalues $\\lambda^k$, $A^{-1}$ has $\\frac1\\lambda$, $A+cI$ has $\\lambda+c$. $0$ is an eigenvalue exactly when $A$ is singular. For $2\\times2$: $p(\\lambda)=\\lambda^2-(\\operatorname{tr}A)\\lambda+\\det A$.\n\n**Example.** $\\begin{bmatrix}2&1\\\\1&2\\end{bmatrix}$ has trace $4$ and determinant $3$, so its eigenvalues are $1$ and $3$.","pt":{"n":"Valores e vetores próprios","d":"As direções que uma matriz só estica, e por quanto.","b":"**O que é.** $\\lambda$ é valor próprio de $A$ se $Av=\\lambda v$ para algum $v\\ne0$ (um vetor próprio). Os valores próprios são as raízes do polinómio característico $p(\\lambda)=\\det(A-\\lambda I)$; o espaço próprio é $E(\\lambda)=\\operatorname{Nul}(A-\\lambda I)$. A multiplicidade algébrica é a multiplicidade como raiz; a multiplicidade geométrica é $\\dim E(\\lambda)$, e $1\\le$ geométrica $\\le$ algébrica.\n\n**Como usar.** Atalhos: os valores próprios somam $\\operatorname{tr}A$ e multiplicam $\\det A$ (contados com multiplicidade); uma matriz triangular tem a diagonal como valores próprios; $A^k$ tem valores próprios $\\lambda^k$, $A^{-1}$ tem $\\frac1\\lambda$, $A+cI$ tem $\\lambda+c$. $0$ é valor próprio exatamente quando $A$ é singular. Para $2\\times2$: $p(\\lambda)=\\lambda^2-(\\operatorname{tr}A)\\lambda+\\det A$.\n\n**Exemplo.** $\\begin{bmatrix}2&1\\\\1&2\\end{bmatrix}$ tem traço $4$ e determinante $3$, logo os valores próprios são $1$ e $3$."}},{"k":"la-diag","sub":"la","n":"Diagonalization & matrix powers","d":"Writing A = PDP⁻¹ to compute powers and long-run behaviour.","b":"**What it is.** $A$ ($n\\times n$) is diagonalizable if $A=PDP^{-1}$ with $D$ diagonal; the columns of $P$ are $n$ independent eigenvectors and $D$ holds the matching eigenvalues. This happens exactly when, for every eigenvalue, the geometric multiplicity equals the algebraic one. $n$ distinct eigenvalues are enough.\n\n**How to use it.** Powers become easy: $A^k=PD^kP^{-1}$. In a long run $x_{k+1}=Ax_k$, write $x_0$ in eigenvectors; the term with the largest $|\\lambda|$ dominates, and eigenvalue $1$ gives the steady state (as in Markov matrices, whose columns sum to $1$). Linear recurrences such as Fibonacci become $2\\times2$ matrix powers.\n\n**Example.** $\\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}$ has the eigenvalue $1$ twice but only a line of eigenvectors, so it is not diagonalizable.","pt":{"n":"Diagonalização e potências de matrizes","d":"Escrever A = PDP⁻¹ para calcular potências e o comportamento a longo prazo.","b":"**O que é.** $A$ ($n\\times n$) é diagonalizável se $A=PDP^{-1}$ com $D$ diagonal; as colunas de $P$ são $n$ vetores próprios independentes e $D$ contém os valores próprios correspondentes. Isto acontece exatamente quando, para cada valor próprio, a multiplicidade geométrica é igual à algébrica. Ter $n$ valores próprios distintos é suficiente.\n\n**Como usar.** As potências ficam fáceis: $A^k=PD^kP^{-1}$. Numa evolução $x_{k+1}=Ax_k$, escreva $x_0$ em vetores próprios; o termo com o maior $|\\lambda|$ domina, e o valor próprio $1$ dá o estado estacionário (como nas matrizes de Markov, cujas colunas somam $1$). Recorrências lineares como a de Fibonacci passam a potências de matrizes $2\\times2$.\n\n**Exemplo.** $\\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}$ tem o valor próprio $1$ duas vezes mas só uma reta de vetores próprios, logo não é diagonalizável."}},{"k":"la-inner","sub":"la","n":"Inner products, norms & angles","d":"Lengths and angles from the dot product, and the inequalities that come with it.","b":"**What it is.** The usual inner product on $\\mathbb R^n$ is $\\langle u,v\\rangle=u_1v_1+\\dots+u_nv_n$, with norm $\\|u\\|=\\sqrt{\\langle u,u\\rangle}$ and angle given by $\\cos\\theta=\\frac{\\langle u,v\\rangle}{\\|u\\|\\|v\\|}$. In general an inner product is any symmetric, bilinear, positive definite form; on $\\mathbb R^n$ these are exactly $\\langle u,v\\rangle=u^TGv$ with $G$ symmetric positive definite.\n\n**How to use it.** Cauchy–Schwarz: $|\\langle u,v\\rangle|\\le\\|u\\|\\|v\\|$, with equality only for parallel vectors; triangle inequality $\\|u+v\\|\\le\\|u\\|+\\|v\\|$. Expand norms like squares: $\\|u+v\\|^2=\\|u\\|^2+2\\langle u,v\\rangle+\\|v\\|^2$. The distance between points is $\\|u-v\\|$. On functions, $\\langle f,g\\rangle=\\int_a^bfg$ is an inner product too.\n\n**Example.** For $u=(1,2,2)$ and $v=(2,0,1)$: $\\langle u,v\\rangle=4$, $\\|u\\|=3$, $\\|v\\|=\\sqrt5$.","pt":{"n":"Produto interno, norma e ângulos","d":"Comprimentos e ângulos a partir do produto interno, e as desigualdades que vêm com ele.","b":"**O que é.** O produto interno usual em $\\mathbb R^n$ é $\\langle u,v\\rangle=u_1v_1+\\dots+u_nv_n$, com norma $\\|u\\|=\\sqrt{\\langle u,u\\rangle}$ e ângulo dado por $\\cos\\theta=\\frac{\\langle u,v\\rangle}{\\|u\\|\\|v\\|}$. Em geral, um produto interno é qualquer forma simétrica, bilinear e definida positiva; em $\\mathbb R^n$ são exatamente as formas $\\langle u,v\\rangle=u^TGv$ com $G$ simétrica definida positiva.\n\n**Como usar.** Desigualdade de Cauchy-Schwarz: $|\\langle u,v\\rangle|\\le\\|u\\|\\|v\\|$, com igualdade só para vetores paralelos; desigualdade triangular $\\|u+v\\|\\le\\|u\\|+\\|v\\|$. Desenvolva normas como quadrados: $\\|u+v\\|^2=\\|u\\|^2+2\\langle u,v\\rangle+\\|v\\|^2$. A distância
