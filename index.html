":["improper","trig"],"q":"Evaluate $$\\int_0^{\\infty}e^{-x}\\,\\frac{\\sin x}{x}\\,dx.$$","k":"Mzg0NDc5MzM2MTg5MzU4Ny4w","at":"\\tfrac\\pi4","h":"Consider $F(a)=\\int_0^\\infty e^{-x}\\frac{\\sin ax}{x}dx$ and differentiate in $a$.","x":"$F'(a)=\\int_0^\\infty e^{-x}\\cos ax\\,dx=\\frac{1}{1+a^2}$ and $F(0)=0$, so $F(a)=\\arctan a$ and $F(1)=\\frac\\pi4$.","g":"original","pt":{"t":"O Sinc Amortecido de Feynman","q":"Calcule $$\\int_0^{\\infty}e^{-x}\\,\\frac{\\sin x}{x}\\,dx.$$","h":"Considere $F(a)=\\int_0^\\infty e^{-x}\\frac{\\sin ax}{x}dx$ e derive em ordem a $a$.","x":"$F'(a)=\\int_0^\\infty e^{-x}\\cos ax\\,dx=\\frac{1}{1+a^2}$ e $F(0)=0$, logo $F(a)=\\arctan a$ e $F(1)=\\frac\\pi4$."}},{"s":"four-fractions","t":"Four Fractions","d":"imo","r":2500,"c":["inequalities","continuity"],"q":"Determine all possible values of $$S=\\frac{a}{a+b+d}+\\frac{b}{a+b+c}+\\frac{c}{b+c+d}+\\frac{d}{a+c+d}$$ where $a,b,c,d$ are arbitrary positive real numbers.","k":"MC4z","at":"3","h":"Bound $S$ below by enlarging every denominator to $a+b+c+d$, and above by pairing terms.","x":"Each denominator is less than $a+b+c+d$, so $S>1$. Shrinking denominators pairwise, $\\frac{a}{a+b+d}+\\frac{b}{a+b+c}<\\frac{a}{a+b}+\\frac{b}{a+b}=1$ and similarly for the other pair, so $S<2$. Continuity plus examples approaching both ends (e.g. $a=b=t,c=d=1$ with $t\\to0$ or $\\infty$, and $a=c\\to0$) show every value in $(1,2)$ occurs. The set is $(1,2)$, so $p+q=3$.","g":"olympiad","src":"IMO 1974 · Problem 5","ask":"The set of values is an open interval $(p,q)$. Enter $p+q$.","pt":{"t":"Quatro Frações","q":"Determine todos os valores possíveis de $$S=\\frac{a}{a+b+d}+\\frac{b}{a+b+c}+\\frac{c}{b+c+d}+\\frac{d}{a+c+d}$$ onde $a,b,c,d$ são números reais positivos arbitrários.","h":"Minore $S$ aumentando todos os denominadores para $a+b+c+d$, e majore-a agrupando os termos aos pares.","x":"Cada denominador é menor do que $a+b+c+d$, logo $S>1$. Diminuindo os denominadores aos pares, $\\frac{a}{a+b+d}+\\frac{b}{a+b+c}<\\frac{a}{a+b}+\\frac{b}{a+b}=1$ e analogamente para o outro par, logo $S<2$. A continuidade, junto com exemplos que se aproximam dos dois extremos (por exemplo $a=b=t,c=d=1$ com $t\\to0$ ou $\\infty$, e $a=c\\to0$), mostra que todos os valores de $\\mathopen{]}1,2\\mathclose{[}$ ocorrem. O conjunto é $\\mathopen{]}1,2\\mathclose{[}$, logo $p+q=3$.","ask":"O conjunto dos valores é um intervalo aberto $\\mathopen{]}p,q\\mathclose{[}$. Introduza $p+q$."}},{"s":"frullanis-arctangent","t":"Frullani's Arctangent","d":"imo","r":2500,"c":["improper","double-integrals","trig"],"q":"Evaluate $$\\int_0^{\\infty}\\frac{\\arctan(\\pi x)-\\arctan x}{x}\\,dx.$$","k":"Mjk3NTQ2ODk5NDczMTg5Ny4x","at":"\\tfrac\\pi2\\ln\\pi","h":"Write the numerator as $\\int_1^\\pi\\frac{x}{1+t^2x^2}\\,dt$ and swap the order.","x":"$\\frac{\\arctan(\\pi x)-\\arctan x}{x}=\\int_1^\\pi\\frac{dt}{1+t^2x^2}$. Swapping, $\\int_1^\\pi\\int_0^\\infty\\frac{dx}{1+t^2x^2}\\,dt=\\int_1^\\pi\\frac{\\pi}{2t}\\,dt=\\frac\\pi2\\ln\\pi\\approx1.7981$.","g":"olympiad","src":"Putnam 1982 A3","pt":{"t":"O Arco-Tangente de Frullani","q":"Calcule $$\\int_0^{\\infty}\\frac{\\arctan(\\pi x)-\\arctan x}{x}\\,dx.$$","h":"Escreva o numerador como $\\int_1^\\pi\\frac{x}{1+t^2x^2}\\,dt$ e troque a ordem.","x":"$\\frac{\\arctan(\\pi x)-\\arctan x}{x}=\\int_1^\\pi\\frac{dt}{1+t^2x^2}$. Trocando a ordem, $\\int_1^\\pi\\int_0^\\infty\\frac{dx}{1+t^2x^2}\\,dt=\\int_1^\\pi\\frac{\\pi}{2t}\\,dt=\\frac\\pi2\\ln\\pi\\approx1.7981$."}},{"s":"palindromic-quartic","t":"Palindromic Quartic","d":"imo","r":2550,"c":["optimization","roots"],"q":"Let $a$ and $b$ be real numbers for which the equation $$x^4+ax^3+bx^2+ax+1=0$$ has at least one real solution. Over all such pairs $(a,b)$, find the least possible value of $a^2+b^2$.","k":"OC4w","at":"\\tfrac45","h":"Divide by $x^2$ and set $t=x+\\frac1x$, so $|t|\\ge2$.","x":"The equation becomes $t^2+at+b-2=0$ with $|t|\\ge2$. For fixed $t$, $(a,b)$ lies on a line, and the distance from the origin gives $a^2+b^2\\ge\\frac{(t^2-2)^2}{t^2+1}$. With $s=t^2\\ge4$, $\\frac{(s-2)^2}{s+1}$ increases in $s$, so the minimum is at $s=4$: $\\frac45$. It is attained, e.g., by $a=-\\frac45$, $b=-\\frac25$ with root $x=1$.","g":"olympiad","src":"IMO 1973 · Problem 3","pt":{"t":"Quártica Palindrómica","q":"Sejam $a$ e $b$ números reais para os quais a equação $$x^4+ax^3+bx^2+ax+1=0$$ tem pelo menos uma solução real. Sobre todos estes pares $(a,b)$, determine o menor valor possível de $a^2+b^2$.","h":"Divida por $x^2$ e faça $t=x+\\frac1x$, de modo que $|t|\\ge2$.","x":"A equação passa a $t^2+at+b-2=0$ com $|t|\\ge2$. Para $t$ fixo, $(a,b)$ está numa reta, e a distância à origem dá $a^2+b^2\\ge\\frac{(t^2-2)^2}{t^2+1}$. Com $s=t^2\\ge4$, $\\frac{(s-2)^2}{s+1}$ é crescente em $s$, logo o mínimo é em $s=4$: $\\frac45$. É atingido, por exemplo, por $a=-\\frac45$, $b=-\\frac25$, com raiz $x=1$."}},{"s":"cosine-products","t":"Cosine Products","d":"imo","r":2600,"c":["integrals","trig"],"q":"For which integers $m$ with $1\\le m\\le10$ is $$I_m=\\int_0^{2\\pi}\\cos x\\,\\cos2x\\,\\cos3x\\cdots\\cos mx\\,dx$$ nonzero?","k":"MC40","at":"4","h":"Write each cosine as $\\frac{e^{ikx}+e^{-ikx}}{2}$. The integral is nonzero exactly when some choice of signs makes $\\pm1\\pm2\\pm\\cdots\\pm m=0$.","x":"Expanding, $I_m=\\frac{2\\pi}{2^m}\\cdot\\#\\{\\text{sign choices with }\\pm1\\pm2\\cdots\\pm m=0\\}$. A zero sum needs $1+2+\\dots+m=\\frac{m(m+1)}{2}$ even, i.e. $m\\equiv0,3\\pmod4$, and then it is achievable. In $1..10$: $m=3,4,7,8$. Answer: $4$ values.","g":"olympiad","src":"Putnam 1985 A5","ask":"Enter how many such $m$ there are.","pt":{"t":"Produtos de Cossenos","q":"Para que inteiros $m$ com $1\\le m\\le10$ é $$I_m=\\int_0^{2\\pi}\\cos x\\,\\cos2x\\,\\cos3x\\cdots\\cos mx\\,dx$$ não nulo?","h":"Escreva cada cosseno como $\\frac{e^{ikx}+e^{-ikx}}{2}$. O integral é não nulo exatamente quando alguma escolha de sinais torna $\\pm1\\pm2\\pm\\cdots\\pm m=0$.","x":"Desenvolvendo, $I_m=\\frac{2\\pi}{2^m}\\cdot\\#\\{\\text{escolhas de sinais com }\\pm1\\pm2\\cdots\\pm m=0\\}$. Uma soma nula exige que $1+2+\\dots+m=\\frac{m(m+1)}{2}$ seja par, isto é, $m\\equiv0,3\\pmod4$, e nesse caso é possível. Em $1..10$: $m=3,4,7,8$. Resposta: $4$ valores.","ask":"Introduza quantos valores de $m$ há."}},{"s":"cubes-under-a-constraint","t":"Cubes Under a Constraint","d":"imo","r":2600,"c":["inequalities"],"q":"Let $a,b,c$ be positive reals with $abc=1$. Find the minimum value of $$\\frac{1}{a^3(b+c)}+\\frac{1}{b^3(c+a)}+\\frac{1}{c^3(a+b)}.$$","k":"NS4x","at":"\\tfrac32","h":"Substitute $x=\\frac1a$, $y=\\frac1b$, $z=\\frac1c$ so that $xyz=1$.","x":"With $x=\\frac1a$ etc., the first term is $\\frac{x^3}{\\frac1y+\\frac1z}=\\frac{x^2}{y+z}$ (using $xyz=1$). By Cauchy–Schwarz, $\\sum\\frac{x^2}{y+z}\\ge\\frac{(x+y+z)^2}{2(x+y+z)}=\\frac{x+y+z}{2}\\ge\\frac{3}{2}$ by AM–GM. Equality at $a=b=c=1$. (The original problem: prove the sum is at least $\\frac32$.)","g":"olympiad","src":"IMO 1995 · Problem 2","pt":{"t":"Cubos Sob uma Restrição","q":"Sejam $a,b,c$ reais positivos com $abc=1$. Determine o valor mínimo de $$\\frac{1}{a^3(b+c)}+\\frac{1}{b^3(c+a)}+\\frac{1}{c^3(a+b)}.$$","h":"Substitua $x=\\frac1a$, $y=\\frac1b$, $z=\\frac1c$, de modo que $xyz=1$.","x":"Com $x=\\frac1a$, etc., o primeiro termo é $\\frac{x^3}{\\frac1y+\\frac1z}=\\frac{x^2}{y+z}$ (usando $xyz=1$). Pela desigualdade de Cauchy–Schwarz, $\\sum\\frac{x^2}{y+z}\\ge\\frac{(x+y+z)^2}{2(x+y+z)}=\\frac{x+y+z}{2}\\ge\\frac{3}{2}$ pela desigualdade das médias. Igualdade em $a=b=c=1$. (O problema original: provar que a soma é pelo menos $\\frac32$.)"}},{"s":"cyclic-product","t":"Cyclic Product","d":"imo","r":2600,"c":["inequalities"],"q":"Let $a,b,c$ be positive reals with $abc=1$. Find the maximum value of $$\\left(a-1+\\frac1b\\right)\\left(b-1+\\frac1c\\right)\\left(c-1+\\frac1a\\right).$$","k":"MC4x","at":"1","h":"Write $a=\\frac xy$, $b=\\frac yz$, $c=\\frac zx$.","x":"With that substitution the product becomes $\\frac{(x-y+z)(y-z+x)(z-x+y)}{xyz}$. At most one factor is negative; if one is, the product is negative. Otherwise pair them: $(x-y+z)(x+y-z)=x^2-(y-z)^2\\le x^2$. Multiplying the three cyclic versions, the square of the product is at most $(xyz)^2$, so the product is at most $xyz$. The maximum $1$ is attained at $a=b=c=1$. (The original problem: prove the product is at most $1$.)","g":"olympiad","src":"IMO 2000 · Problem 2","pt":{"t":"Produto Cíclico","q":"Sejam $a,b,c$ reais positivos com $abc=1$. Determine o valor máximo de $$\\left(a-1+\\frac1b\\right)\\left(b-1+\\frac1c\\right)\\left(c-1+\\frac1a\\right).$$","h":"Escreva $a=\\frac xy$, $b=\\frac yz$, $c=\\frac zx$.","x":"Com essa substituição, o produto passa a $\\frac{(x-y+z)(y-z+x)(z-x+y)}{xyz}$. No máximo um fator é negativo; se houver um, o produto é negativo. Caso contrário, agrupe-os aos pares: $(x-y+z)(x+y-z)=x^2-(y-z)^2\\le x^2$. Multiplicando as três versões cíclicas, o quadrado do produto é no máximo $(xyz)^2$, logo o produto é no máximo $xyz$. O máximo $1$ é atingido em $a=b=c=1$. (O problema original: provar que o produto é no máximo $1$.)"}},{"s":"scaling-functional-equation","t":"Scaling Functional Equation","d":"imo","r":2600,"c":["functional","limits"],"q":"Find all functions $f$ from the positive reals to the positive reals such that $$f\\big(xf(y)\\big)=yf(x)\\quad\\text{for all }x,y>0,$$ and $f(x)\\to0$ as $x\\to\\infty$.","k":"Mi4w","at":"\\tfrac15","h":"Show $f(1)=1$ and that $f$ is an involution. Then consider a fixed point $a=xf(x)$.","x":"Every $a=xf(x)$ is a fixed point, fixed points are closed under products and reciprocals, and a fixed point $a>1$ would give $f(a^n)=a^n\\not\\to0$. A fixed point $a<1$ gives the fixed point $\\frac1a>1$. So the only fixed point is $1$, hence $xf(x)=1$ and $f(x)=\\frac1x$. The submitted value is $f(5)=\\frac15$.","g":"olympiad","src":"IMO 1983 · Problem 1","ask":"There is exactly one such function. Enter $f(5)$.","pt":{"t":"Equação Funcional de Escala","q":"Determine todas as funções $f$ dos reais positivos nos reais positivos tais que $$f\\big(xf(y)\\big)=yf(x)\\quad\\text{para todos os }x,y>0,$$ e $f(x)\\to0$ quando $x\\to\\infty$.","h":"Mostre que $f(1)=1$ e que $f$ é uma involução. Depois considere um ponto fixo $a=xf(x)$.","x":"Todo o $a=xf(x)$ é ponto fixo, os pontos fixos são fechados para produtos e inversos, e um ponto fixo $a>1$ daria $f(a^n)=a^n\\not\\to0$. Um ponto fixo $a<1$ dá o ponto fixo $\\frac1a>1$. Logo o único ponto fixo é $1$, portanto $xf(x)=1$ e $f(x)=\\frac1x$. O valor a submeter é $f(5)=\\frac15$.","ask":"Existe exatamente uma função nestas condições. Introduza $f(5)$."}},{"s":"sophomores-dream","t":"Sophomore's Dream","d":"imo","r":2600,"c":["taylor","ibp","series"],"q":"Evaluate $$\\int_0^1x^{-x}\\,dx$$ to at least four significant figures. (Hint: the answer is also the value of a strikingly simple series.)","k":"NjM2NjI2MDc5OTU4MjE5Mi4x","at":"\\sum_{n\\ge1}n^{-n}\\approx1.29129","h":"$x^{-x}=e^{-x\\ln x}=\\sum\\frac{(-x\\ln x)^n}{n!}$, and $\\int_0^1x^n\\ln^nx\\,dx$ has a closed form.","x":"Integrating by parts $n$ times, $\\int_0^1x^n(-\\ln x)^n\\,dx=\\frac{n!}{(n+1)^{n+1}}$. So the integral equals $\\sum_{n\\ge0}\\frac{1}{(n+1)^{n+1}}=\\sum_{n\\ge1}n^{-n}=1.29128\\ldots$","g":"original","ask":"Enter the value to at least four significant figures.","pt":{"t":"O Sonho do Segundo Ano","q":"Calcule $$\\int_0^1x^{-x}\\,dx$$ com pelo menos quatro algarismos significativos. (Sugestão: a resposta é também o valor de uma série surpreendentemente simples.)","h":"$x^{-x}=e^{-x\\ln x}=\\sum\\frac{(-x\\ln x)^n}{n!}$, e $\\int_0^1x^n\\ln^nx\\,dx$ tem uma forma fechada.","x":"Primitivando por partes $n$ vezes, $\\int_0^1x^n(-\\ln x)^n\\,dx=\\frac{n!}{(n+1)^{n+1}}$. Logo o integral é igual a $\\sum_{n\\ge0}\\frac{1}{(n+1)^{n+1}}=\\sum_{n\\ge1}n^{-n}=1.29128\\ldots$","ask":"Introduza o valor com pelo menos quatro algarismos significativos."}},{"s":"squares-off-by-one","t":"Squares Off by One","d":"imo","r":2600,"c":["inequalities"],"q":"Let $x,y,z$ be real numbers, each different from $1$, with $xyz=1$. Find the minimum value of $$\\frac{x^2}{(x-1)^2}+\\frac{y^2}{(y-1)^2}+\\frac{z^2}{(z-1)^2}.$$","k":"MC4x","at":"1","h":"Set $a=\\frac{x}{x-1}$ and so on. Translate $xyz=1$ into a relation among $a,b,c$.","x":"With $a=\\frac{x}{x-1}$, $b=\\frac{y}{y-1}$, $c=\\frac{z}{z-1}$ we have $x=\\frac{a}{a-1}$, and $xyz=1$ becomes $abc=(a-1)(b-1)(c-1)$, i.e. $ab+bc+ca=a+b+c-1$. Then $a^2+b^2+c^2=(a+b+c)^2-2(a+b+c)+2=(a+b+c-1)^2+1\\ge1$. Equality is achievable (infinitely many rational triples), so the minimum is $1$.","g":"olympiad","src":"IMO 2008 · Problem 2","pt":{"t":"Quadrados Desfasados de Um","q":"Sejam $x,y,z$ números reais, todos diferentes de $1$, com $xyz=1$. Determine o valor mínimo de $$\\frac{x^2}{(x-1)^2}+\\frac{y^2}{(y-1)^2}+\\frac{z^2}{(z-1)^2}.$$","h":"Faça $a=\\frac{x}{x-1}$, e assim por diante. Traduza $xyz=1$ numa relação entre $a,b,c$.","x":"Com $a=\\frac{x}{x-1}$, $b=\\frac{y}{y-1}$, $c=\\frac{z}{z-1}$ tem-se $x=\\frac{a}{a-1}$, e $xyz=1$ passa a $abc=(a-1)(b-1)(c-1)$, isto é, $ab+bc+ca=a+b+c-1$. Então $a^2+b^2+c^2=(a+b+c)^2-2(a+b+c)+2=(a+b+c-1)^2+1\\ge1$. A igualdade é atingível (há uma infinidade de ternos racionais), logo o mínimo é $1$."}},{"s":"unit-square-series","t":"Unit Square Series","d":"imo","r":2600,"c":["double-integrals","series"],"q":"Evaluate $$\\int_0^1\\!\\int_0^1\\frac{dx\\,dy}{1-xy}.$$ (It is a classical constant.)","k":"NDYyMjg0ODY2MDQzOTQ0Ni4x","at":"\\tfrac{\\pi^2}{6}","h":"Expand $\\frac{1}{1-xy}$ as a geometric series and integrate term by term.","x":"$\\frac1{1-xy}=\\sum_{n\\ge0}(xy)^n$, and $\\iint x^ny^n=\\frac1{(n+1)^2}$. So the integral is $\\sum\\frac1{n^2}=\\frac{\\pi^2}{6}\\approx1.6449$.","g":"original","pt":{"t":"Série no Quadrado Unitário","q":"Calcule $$\\int_0^1\\!\\int_0^1\\frac{dx\\,dy}{1-xy}.$$ (É uma constante clássica.)","h":"Desenvolva $\\frac{1}{1-xy}$ em série geométrica e integre termo a termo.","x":"$\\frac1{1-xy}=\\sum_{n\\ge0}(xy)^n$, e $\\iint x^ny^n=\\frac1{(n+1)^2}$. Logo o integral é $\\sum\\frac1{n^2}=\\frac{\\pi^2}{6}\\approx1.6449$."}},{"s":"binomial-coefficient-integral","t":"Binomial Coefficient Integral","d":"imo","r":2700,"c":["series","integrals"],"q":"For real $\\alpha$, let $C(\\alpha)$ be the coefficient of $x^{1992}$ in the power series expansion of $(1+x)^{\\alpha}$ about $x=0$. Evaluate $$\\int_0^1C(-y-1)\\left(\\frac{1}{y+1}+\\frac{1}{y+2}+\\cdots+\\frac{1}{y+1992}\\right)dy.$$","k":"MC4yOTkx","at":"1992","h":"Write $C(-y-1)$ as a product. Then notice the sum is a logarithmic derivative.","x":"$C(-y-1)=\\binom{-y-1}{1992}=\\frac{(y+1)(y+2)\\cdots(y+1992)}{1992!}$. The sum of reciprocals is its logarithmic derivative, so the integrand is $\\frac{d}{dy}\\frac{(y+1)\\cdots(y+1992)}{1992!}$. The integral is $\\frac{1993!-1992!}{1992!}=1992$.","g":"olympiad","src":"Putnam 1992 A2","pt":{"t":"Integral de um Coeficiente Binomial","q":"Para $\\alpha$ real, seja $C(\\alpha)$ o coeficiente de $x^{1992}$ no desenvolvimento em série de potências de $(1+x)^{\\alpha}$ em torno de $x=0$. Calcule $$\\int_0^1C(-y-1)\\left(\\frac{1}{y+1}+\\frac{1}{y+2}+\\cdots+\\frac{1}{y+1992}\\right)dy.$$","h":"Escreva $C(-y-1)$ como um produto. Depois repare que a soma é uma derivada logarítmica.","x":"$C(-y-1)=\\binom{-y-1}{1992}=\\frac{(y+1)(y+2)\\cdots(y+1992)}{1992!}$. A soma dos inversos é a sua derivada logarítmica, logo a função integranda é $\\frac{d}{dy}\\frac{(y+1)\\cdots(y+1992)}{1992!}$. O integral é $\\frac{1993!-1992!}{1992!}=1992$."}},{"s":"exactly-one-partner","t":"Exactly One Partner","d":"imo","r":2700,"c":["functional","inequalities"],"q":"Find all functions $f$ from the positive reals to the positive reals such that for every $x>0$ there is exactly one $y>0$ satisfying $$xf(y)+yf(x)\\le2.$$","k":"NTIuMA==","at":"\\tfrac14","h":"Show the partner of $x$ must be $x$ itself. That gives $xf(x)\\le1$. Then rule out strict inequality.","x":"If the partner $y$ of $x$ differed from $x$, then neither $x$ nor $y$ would be its own partner, so $xf(x)>1$ and $yf(y)>1$; but then $xf(y)+yf(x)\\ge2\\sqrt{xf(x)\\,yf(y)}>2$, a contradiction. So each $x$ is its own partner and $xf(x)\\le1$ for all $x$. If $xf(x)<1$ for some $x$, then for $y$ close to $x$ we get $xf(y)+yf(x)\\le\\frac xy+yf(x)$, which is close to $1+xf(x)<2$, giving a second partner. Hence $f(x)=\\frac1x$, which works since $\\frac xy+\\frac yx\\le2$ only for $y=x$. The submitted value is $f(4)=\\frac14$.","g":"olympiad","src":"IMO 2022 · Problem 2","ask":"There is exactly one such function. Enter $f(4)$.","pt":{"t":"Exatamente Um Par","q":"Determine todas as funções $f$ dos reais positivos nos reais positivos tais que, para todo o $x>0$, existe exatamente um $y>0$ que satisfaz $$xf(y)+yf(x)\\le2.$$","h":"Mostre que o par de $x$ tem de ser o próprio $x$. Isso dá $xf(x)\\le1$. Depois exclua a desigualdade estrita.","x":"Se o par $y$ de $x$ fosse diferente de $x$, então nem $x$ nem $y$ seriam o seu próprio par, logo $xf(x)>1$ e $yf(y)>1$; mas então $xf(y)+yf(x)\\ge2\\sqrt{xf(x)\\,yf(y)}>2$, uma contradição. Logo cada $x$ é o seu próprio par e $xf(x)\\le1$ para todo o $x$. Se $xf(x)<1$ para algum $x$, então para $y$ perto de $x$ obtém-se $xf(y)+yf(x)\\le\\frac xy+yf(x)$, que está perto de $1+xf(x)<2$, o que dá um segundo par. Portanto $f(x)=\\frac1x$, que funciona porque $\\frac xy+\\frac yx\\le2$ só para $y=x$. O valor a submeter é $f(4)=\\frac14$.","ask":"Existe exatamente uma função nestas condições. Introduza $f(4)$."}},{"s":"square-roots-sum","t":"Square Roots Sum","d":"imo","r":2700,"c":["inequalities","convexity"],"q":"Find the minimum value of $$\\frac{a}{\\sqrt{a^2+8bc}}+\\frac{b}{\\sqrt{b^2+8ca}}+\\frac{c}{\\sqrt{c^2+8ab}}$$ over all positive reals $a,b,c$.","k":"MC4x","at":"1","h":"Look for an exponent $r$ with $\\frac{a}{\\sqrt{a^2+8bc}}\\ge\\frac{a^r}{a^r+b^r+c^r}$.","x":"The tangent-line trick gives $\\frac{a}{\\sqrt{a^2+8bc}}\\ge\\frac{a^{4/3}}{a^{4/3}+b^{4/3}+c^{4/3}}$ (equivalent, after squaring and AM–GM, to $(a^{4/3}+b^{4/3}+c^{4/3})^2-a^{8/3}\\ge8a^{2/3}bc$). Summing the three bounds gives at least $1$, with equality at $a=b=c$. (The original problem: prove the sum is at least $1$.)","g":"olympiad","src":"IMO 2001 · Problem 2","pt":{"t":"Soma de Raízes Quadradas","q":"Determine o valor mínimo de $$\\frac{a}{\\sqrt{a^2+8bc}}+\\frac{b}{\\sqrt{b^2+8ca}}+\\frac{c}{\\sqrt{c^2+8ab}}$$ sobre todos os reais positivos $a,b,c$.","h":"Procure um expoente $r$ com $\\frac{a}{\\sqrt{a^2+8bc}}\\ge\\frac{a^r}{a^r+b^r+c^r}$.","x":"O truque da reta tangente dá $\\frac{a}{\\sqrt{a^2+8bc}}\\ge\\frac{a^{4/3}}{a^{4/3}+b^{4/3}+c^{4/3}}$ (equivalente, depois de elevar ao quadrado e usar a desigualdade das médias, a $(a^{4/3}+b^{4/3}+c^{4/3})^2-a^{8/3}\\ge8a^{2/3}bc$). Somando as três minorações obtém-se pelo menos $1$, com igualdade em $a=b=c$. (O problema original: provar que a soma é pelo menos $1$.)"}},{"s":"e-times-factorial","t":"e Times Factorial","d":"imo","r":2700,"c":["series","limits","taylor"],"q":"Evaluate $$\\lim_{n\\to\\infty}n\\sin\\left(2\\pi e\\,n!\\right).$$","k":"Njg1OTcxNzAzNTgxMzgyLjY=","at":"2\\pi","h":"Write $e\\,n!$ using $e=\\sum\\frac1{k!}$: it is an integer plus a small tail.","x":"$e\\,n!=\\sum_{k\\le n}\\frac{n!}{k!}+\\frac{1}{n+1}+\\frac{1}{(n+1)(n+2)}+\\cdots$, where the first part is an integer. The tail is $\\frac1n+O\\!\\left(\\frac1{n^2}\\right)$. So $\\sin(2\\pi en!)=\\sin\\left(\\frac{2\\pi}{n}+O(n^{-2})\\right)$ and $n\\sin(\\cdot)\\to2\\pi$.","g":"original","pt":{"t":"e Vezes Fatorial","q":"Calcule $$\\lim_{n\\to\\infty}n\\sin\\left(2\\pi e\\,n!\\right).$$","h":"Escreva $e\\,n!$ usando $e=\\sum\\frac1{k!}$: é um inteiro mais uma pequena cauda.","x":"$e\\,n!=\\sum_{k\\le n}\\frac{n!}{k!}+\\frac{1}{n+1}+\\frac{1}{(n+1)(n+2)}+\\cdots$, onde a primeira parte é um inteiro. A cauda é $\\frac1n+O\\!\\left(\\frac1{n^2}\\right)$. Logo $\\sin(2\\pi en!)=\\sin\\left(\\frac{2\\pi}{n}+O(n^{-2})\\right)$ e $n\\sin(\\cdot)\\to2\\pi$."}},{"s":"series-times-series","t":"Series Times Series","d":"imo","r":2800,"c":["series","improper","taylor"],"q":"Evaluate $$\\int_0^{\\infty}\\left(x-\\frac{x^3}{2}+\\frac{x^5}{2\\cdot4}-\\frac{x^7}{2\\cdot4\\cdot6}+\\cdots\\right)\\left(1+\\frac{x^2}{2^2}+\\frac{x^4}{2^2\\cdot4^2}+\\frac{x^6}{2^2\\cdot4^2\\cdot6^2}+\\cdots\\right)dx.$$","k":"MjgyMTAwNzA3MjEyNzg0Ni4x","at":"\\sqrt e","h":"The first factor is $xe^{-x^2/2}$. Multiply it into the second series and integrate term by term.","x":"The first factor equals $xe^{-x^2/2}$, and $\\int_0^\\infty x^{2k+1}e^{-x^2/2}dx=2^kk!$. The $k$th term of the second series is $\\frac{x^{2k}}{4^k(k!)^2}$, so term-by-term integration gives $\\sum\\frac{2^kk!}{4^k(k!)^2}=\\sum\\frac{(1/2)^k}{k!}=e^{1/2}$.","g":"olympiad","src":"Putnam 1997 A3","pt":{"t":"Série Vezes Série","q":"Calcule $$\\int_0^{\\infty}\\left(x-\\frac{x^3}{2}+\\frac{x^5}{2\\cdot4}-\\frac{x^7}{2\\cdot4\\cdot6}+\\cdots\\right)\\left(1+\\frac{x^2}{2^2}+\\frac{x^4}{2^2\\cdot4^2}+\\frac{x^6}{2^2\\cdot4^2\\cdot6^2}+\\cdots\\right)dx.$$","h":"O primeiro fator é $xe^{-x^2/2}$. Multiplique-o pela segunda série e integre termo a termo.","x":"O primeiro fator é igual a $xe^{-x^2/2}$, e $\\int_0^\\infty x^{2k+1}e^{-x^2/2}dx=2^kk!$. O termo de ordem $k$ da segunda série é $\\frac{x^{2k}}{4^k(k!)^2}$, logo a integração termo a termo dá $\\sum\\frac{2^kk!}{4^k(k!)^2}=\\sum\\frac{(1/2)^k}{k!}=e^{1/2}$."}},{"s":"the-m-bius-shape","t":"The Möbius Shape","d":"imo","r":2800,"c":["functional"],"q":"Let $S$ be the set of real numbers greater than $-1$. Find all functions $f:S\\to S$ such that\n(i) $f\\big(x+f(y)+xf(y)\\big)=y+f(x)+yf(x)$ for all $x,y\\in S$;\n(ii) $\\dfrac{f(x)}{x}$ is strictly increasing on each of the intervals $-1<x<0$ and $0<x$.","k":"NS4wLQ==","at":"-\\tfrac12","h":"With $x=y$, every point $x+f(x)+xf(x)$ is a fixed point of $f$. Condition (ii) allows at most one fixed point in each of $(-1,0)$, $\\{0\\}$, $(0,\\infty)$.","x":"A fixed point $u\\neq0$ would produce another fixed point $u^2+2u$ on the same side of $0$ (and with $x=y=u$), contradicting (ii). So the only fixed point is $0$, and $x+f(x)+xf(x)=0$, i.e. $f(x)=-\\frac{x}{1+x}$, which satisfies both conditions. The submitted value is $f(1)=-\\frac12$.","g":"olympiad","src":"IMO 1994 · Problem 5","ask":"There is exactly one such function. Enter $f(1)$.","pt":{"t":"A Forma de Möbius","q":"Seja $S$ o conjunto dos números reais maiores do que $-1$. Determine todas as funções $f:S\\to S$ tais que\n(i) $f\\big(x+f(y)+xf(y)\\big)=y+f(x)+yf(x)$ para todos os $x,y\\in S$;\n(ii) $\\dfrac{f(x)}{x}$ é estritamente crescente em cada um dos intervalos $-1<x<0$ e $0<x$.","h":"Com $x=y$, todo o ponto $x+f(x)+xf(x)$ é ponto fixo de $f$. A condição (ii) permite no máximo um ponto fixo em cada um dos conjuntos $\\mathopen{]}-1,0\\mathclose{[}$, $\\{0\\}$, $\\mathopen{]}0,\\infty\\mathclose{[}$.","x":"Um ponto fixo $u\\neq0$ produziria outro ponto fixo $u^2+2u$ do mesmo lado de $0$ (com $x=y=u$), o que contradiz (ii). Logo o único ponto fixo é $0$, e $x+f(x)+xf(x)=0$, isto é, $f(x)=-\\frac{x}{1+x}$, que satisfaz as duas condições. O valor a submeter é $f(1)=-\\frac12$.","ask":"Existe exatamente uma função nestas condições. Introduza $f(1)$."}},{"s":"fifth-powers","t":"Fifth Powers","d":"imo","r":2850,"c":["inequalities"],"q":"Let $x,y,z$ be positive reals with $xyz\\ge1$. Find the minimum value of $$\\frac{x^5-x^2}{x^5+y^2+z^2}+\\frac{y^5-y^2}{y^5+z^2+x^2}+\\frac{z^5-z^2}{z^5+x^2+y^2}.$$","k":"MC4w","at":"0","h":"Compare each term with $\\frac{x^5-x^2}{x^3(x^2+y^2+z^2)}$.","x":"Since $\\frac{x^5-x^2}{x^5+y^2+z^2}\\ge\\frac{x^5-x^2}{x^3(x^2+y^2+z^2)}=\\frac{x^2-1/x}{x^2+y^2+z^2}$, the sum is at least $\\frac{x^2+y^2+z^2-(1/x+1/y+1/z)}{x^2+y^2+z^2}$. With $xyz\\ge1$, $\\frac1x\\le yz\\le\\frac{y^2+z^2}{2}$, so the numerator is $\\ge0$. Equality at $x=y=z=1$, so the minimum is $0$.","g":"olympiad","src":"IMO 2005 · Problem 3","pt":{"t":"Quintas Potências","q":"Sejam $x,y,z$ reais positivos com $xyz\\ge1$. Determine o valor mínimo de $$\\frac{x^5-x^2}{x^5+y^2+z^2}+\\frac{y^5-y^2}{y^5+z^2+x^2}+\\frac{z^5-z^2}{z^5+x^2+y^2}.$$","h":"Compare cada termo com $\\frac{x^5-x^2}{x^3(x^2+y^2+z^2)}$.","x":"Como $\\frac{x^5-x^2}{x^5+y^2+z^2}\\ge\\frac{x^5-x^2}{x^3(x^2+y^2+z^2)}=\\frac{x^2-1/x}{x^2+y^2+z^2}$, a soma é pelo menos $\\frac{x^2+y^2+z^2-(1/x+1/y+1/z)}{x^2+y^2+z^2}$. Com $xyz\\ge1$, $\\frac1x\\le yz\\le\\frac{y^2+z^2}{2}$, logo o numerador é $\\ge0$. Igualdade em $x=y=z=1$, logo o mínimo é $0$."}},{"s":"arnolds-limit","t":"Arnold's Limit","d":"imo","r":2900,"c":["taylor","limits","trig"],"q":"Evaluate $$\\lim_{x\\to0}\\frac{\\sin(\\tan x)-\\tan(\\sin x)}{\\arcsin(\\arctan x)-\\arctan(\\arcsin x)}.$$","k":"MC4x","at":"1","h":"Both numerator and denominator vanish to order $x^7$. Compute their $x^7$ coefficients.","x":"Expanding with Taylor series, $\\sin(\\tan x)-\\tan(\\sin x)=-\\frac{x^7}{30}+O(x^9)$ and $\\arcsin(\\arctan x)-\\arctan(\\arcsin x)=-\\frac{x^7}{30}+O(x^9)$. The ratio tends to $1$. (A slicker argument uses that $f\\circ g-g\\circ f$ behaves the same way for any pair of functions tangent to the identity.)","g":"original","pt":{"t":"O Limite de Arnold","q":"Calcule $$\\lim_{x\\to0}\\frac{\\sin(\\tan x)-\\tan(\\sin x)}{\\arcsin(\\arctan x)-\\arctan(\\arcsin x)}.$$","h":"O numerador e o denominador anulam-se ambos até à ordem $x^7$. Calcule os seus coeficientes de $x^7$.","x":"Desenvolvendo em série de Taylor, $\\sin(\\tan x)-\\tan(\\sin x)=-\\frac{x^7}{30}+O(x^9)$ e $\\arcsin(\\arctan x)-\\arctan(\\arcsin x)=-\\frac{x^7}{30}+O(x^9)$. A razão tende para $1$. (Um argumento mais elegante usa o facto de $f\\circ g-g\\circ f$ se comportar da mesma forma para qualquer par de funções tangentes à identidade.)"}},{"s":"best-constant","t":"Best Constant","d":"imo","r":3000,"c":["inequalities","multivariable"],"q":"Determine the least real number $M$ such that $$\\left|ab(a^2-b^2)+bc(b^2-c^2)+ca(c^2-a^2)\\right|\\le M\\left(a^2+b^2+c^2\\right)^2$$ holds for all real numbers $a,b,c$.","k":"MzM0NzE0NDY1NzQ3NzkzLjA=","at":"\\tfrac{9\\sqrt2}{32}","h":"The left side factors as $|(a-b)(b-c)(c-a)(a+b+c)|$.","x":"Factor the left side as $|(a-b)(b-c)(c-a)(a+b+c)|$. WLOG $a\\le b\\le c$; AM–GM on $(b-a)(c-b)$ and a second AM–GM combining $(c-a)^2$ with $(a+b+c)^2$ yields the bound with $M=\\frac{9\\sqrt2}{32}$. Equality occurs for $a,b,c$ proportional to $1-\\frac{3}{\\sqrt2},\\,1,\\,1+\\frac{3}{\\sqrt2}$. So $M=\\frac{9\\sqrt2}{32}\\approx0.3977$.","g":"olympiad","src":"IMO 2006 · Problem 3","pt":{"t":"Melhor Constante","q":"Determine o menor número real $M$ tal que $$\\left|ab(a^2-b^2)+bc(b^2-c^2)+ca(c^2-a^2)\\right|\\le M\\left(a^2+b^2+c^2\\right)^2$$ para todos os números reais $a,b,c$.","h":"O lado esquerdo fatoriza-se como $|(a-b)(b-c)(c-a)(a+b+c)|$.","x":"Fatorize o lado esquerdo como $|(a-b)(b-c)(c-a)(a+b+c)|$. Sem perda de generalidade, $a\\le b\\le c$; a desigualdade das médias aplicada a $(b-a)(c-b)$ e uma segunda aplicação que combina $(c-a)^2$ com $(a+b+c)^2$ dão a majoração com $M=\\frac{9\\sqrt2}{32}$. A igualdade ocorre para $a,b,c$ proporcionais a $1-\\frac{3}{\\sqrt2},\\,1,\\,1+\\frac{3}{\\sqrt2}$. Logo $M=\\frac{9\\sqrt2}{32}\\approx0.3977$."}},{"s":"double-sum","t":"Double Sum","d":"imo","r":3000,"c":["series"],"q":"Evaluate $$\\sum_{k=1}^{\\infty}\\frac{(-1)^{k-1}}{k}\\sum_{n=0}^{\\infty}\\frac{1}{k2^n+1}.$$","k":"MC4x","at":"1","h":"Write $\\frac{1}{k2^n+1}=\\int_0^1x^{k2^n}\\,dx$ and sum over $k$ first.","x":"Summing over $k$ inside the integral, $\\sum_k\\frac{(-1)^{k-1}}{k}x^{k2^n}=\\ln\\!\\left(1+x^{2^n}\\right)$. Summing over $n$, $\\prod_{n\\ge0}\\left(1+x^{2^n}\\right)=\\frac{1}{1-x}$, because every exponent has exactly one binary expansion. So the double sum is $\\int_0^1-\\ln(1-x)\\,dx=1$.","g":"olympiad","src":"Putnam 2016 B6","pt":{"t":"Soma Dupla","q":"Calcule $$\\sum_{k=1}^{\\infty}\\frac{(-1)^{k-1}}{k}\\sum_{n=0}^{\\infty}\\frac{1}{k2^n+1}.$$","h":"Escreva $\\frac{1}{k2^n+1}=\\int_0^1x^{k2^n}\\,dx$ e some primeiro em $k$.","x":"Somando em $k$ dentro do integral, $\\sum_k\\frac{(-1)^{k-1}}{k}x^{k2^n}=\\ln\\!\\left(1+x^{2^n}\\right)$. Somando em $n$, $\\prod_{n\\ge0}\\left(1+x^{2^n}\\right)=\\frac{1}{1-x}$, porque cada expoente tem exatamente uma representação binária. Logo a soma dupla é $\\int_0^1-\\ln(1-x)\\,dx=1$."}},{"s":"which-pairs-solve","sub":"la","d":"easy","r":800,"c":["la-systems"],"g":"university","t":"Which Pairs Solve It","q":"How many of the pairs $(0,0)$, $(-1,1)$, $(1,-1)$ and $(1,1)$ are solutions of the system $$\\begin{cases}x+y=0\\\\-x-2y=1\\\\2x+2y=0\\end{cases}$$","h":"A pair is a solution only if it satisfies every equation at once.","x":"The first and third equations force $y=-x$; then the second reads $-x+2x=1$, so $x=1$. Only $(1,-1)$ works: $1$ pair.","at":"1","k":"MC4x","pt":{"t":"Que Pares São Solução","q":"Quantos dos pares $(0,0)$, $(-1,1)$, $(1,-1)$ e $(1,1)$ são soluções do sistema $$\\begin{cases}x+y=0\\\\-x-2y=1\\\\2x+2y=0\\end{cases}$$","h":"Um par só é solução se satisfizer todas as equações ao mesmo tempo.","x":"A primeira e a terceira equações obrigam a $y=-x$; depois a segunda fica $-x+2x=1$, logo $x=1$. Só $(1,-1)$ serve: $1$ par."}},{"s":"two-lines-meet","sub":"la","d":"easy","r":810,"c":["la-systems"],"g":"university","t":"Two Lines Meet","q":"Solve $$\\begin{cases}x+2y=1\\\\x+3y=0.\\end{cases}$$","h":"Subtract the first equation from the second.","x":"$L_2-L_1$ gives $y=-1$, and then $x=1-2y=3$. The two lines meet at $(3,-1)$, so $x-y=4$.","at":"4","k":"MC40","ask":"The system has a unique solution $(x,y)$. Enter $x-y$.","pt":{"t":"Duas Retas Encontram-se","q":"Resolva $$\\begin{cases}x+2y=1\\\\x+3y=0.\\end{cases}$$","h":"Subtraia a primeira equação à segunda.","x":"$L_2-L_1$ dá $y=-1$, e então $x=1-2y=3$. As duas retas intersetam-se em $(3,-1)$, logo $x-y=4$.","ask":"O sistema tem uma única solução $(x,y)$. Introduza $x-y$."}},{"s":"three-planes-meet","sub":"la","d":"easy","r":860,"c":["la-systems"],"g":"university","t":"Three Planes Meet","q":"Solve $$\\begin{cases}2x+2y+3z=1\\\\x+2y+z=0\\\\x-y+z=0.\\end{cases}$$","h":"Put $x+2y+z=0$ first, then eliminate $x$ from the other two equations.","x":"Subtracting the second and third equations gives $3y=0$, so $y=0$ and $z=-x$. Then $2x+3z=1$ becomes $-x=1$: the planes meet at $(-1,0,1)$, and $x+2y+3z=2$.","at":"2","k":"MC4y","ask":"Enter $x+2y+3z$ for the unique solution.","pt":{"t":"Três Planos Encontram-se","q":"Resolva $$\\begin{cases}2x+2y+3z=1\\\\x+2y+z=0\\\\x-y+z=0.\\end{cases}$$","h":"Ponha $x+2y+z=0$ em primeiro lugar e elimine $x$ das outras duas equações.","x":"Subtraindo a segunda e a terceira equações obtém-se $3y=0$, logo $y=0$ e $z=-x$. Então $2x+3z=1$ passa a $-x=1$: os planos intersetam-se em $(-1,0,1)$, e $x+2y+3z=2$.","ask":"Introduza $x+2y+3z$ para a única solução."}},{"s":"four-unknowns","sub":"la","d":"easy","r":980,"c":["la-systems"],"g":"university","t":"Four Unknowns","q":"Solve $$\\begin{cases}y_1+y_3+2y_4=0\\\\y_1+2y_2+y_3+y_4=1\\\\y_2+2y_4=8\\\\y_1+2y_3+y_4=0.\\end{cases}$$","h":"Subtract the first equation from the second and from the fourth: $y_1$ disappears from both.","x":"$L_2-L_1$: $2y_2-y_4=1$. $L_4-L_1$: $y_3-y_4=0$. With $y_2+2y_4=8$ this gives $y_2=2$, $y_4=3$, then $y_3=3$ and $y_1=-y_3-2y_4=-9$.","at":"-9","k":"MC45LQ==","ask":"Enter $y_1$.","pt":{"t":"Quatro Incógnitas","q":"Resolva $$\\begin{cases}y_1+y_3+2y_4=0\\\\y_1+2y_2+y_3+y_4=1\\\\y_2+2y_4=8\\\\y_1+2y_3+y_4=0.\\end{cases}$$","h":"Subtraia a primeira equação à segunda e à quarta: $y_1$ desaparece de ambas.","x":"$L_2-L_1$: $2y_2-y_4=1$. $L_4-L_1$: $y_3-y_4=0$. Com $y_2+2y_4=8$ obtém-se $y_2=2$, $y_4=3$, depois $y_3=3$ e $y_1=-y_3-2y_4=-9$.","ask":"Introduza $y_1$."}},{"s":"coin-jar","sub":"la","d":"easy","r":880,"c":["la-systems"],"g":"university","t":"Coin Jar","q":"A jar holds coins of $1$, $5$ and $10$ cents: $13$ coins worth $83$ cents in total. How many $10$-cent coins are there?","h":"Two equations, three unknowns, but the answers must be nonnegative whole numbers.","x":"With $a+b+c=13$ and $a+5b+10c=83$, subtracting gives $4b+9c=70$. The only nonnegative solution with $a\\ge0$ is $c=6$, $b=4$, $a=3$. So there are $6$ coins of $10$ cents.","at":"6","k":"MC42","pt":{"t":"Mealheiro","q":"Um mealheiro contém moedas de $1$, $5$ e $10$ cêntimos: $13$ moedas que valem $83$ cêntimos no total. Quantas moedas de $10$ cêntimos há?","h":"Duas equações e três incógnitas, mas as respostas têm de ser inteiros não negativos.","x":"Com $a+b+c=13$ e $a+5b+10c=83$, subtraindo obtém-se $4b+9c=70$. A única solução não negativa com $a\\ge0$ é $c=6$, $b=4$, $a=3$. Há portanto $6$ moedas de $10$ cêntimos."}},{"s":"four-averages","sub":"la","d":"easy","r":940,"c":["la-systems"],"g":"university","t":"Four Averages","q":"Four integers are given. Choosing three of them, averaging those three and adding the fourth gives, in the four possible ways, $29$, $23$, $21$ and $17$. What is the largest of the four integers?","h":"Add all four equations: each number appears with total weight $1+3\\cdot\\frac13=2$.","x":"Adding gives $2(a+b+c+d)=90$, so the sum is $45$. Each equation reads $\\frac{45-d}{3}+d=29$, i.e. $15+\\frac{2d}3=29$, so $d=21$; likewise the others are $12$, $9$ and $3$. The largest is $21$.","at":"21","k":"MC4xMg==","pt":{"t":"Quatro Médias","q":"São dados quatro números inteiros. Escolhendo três deles, fazendo a respetiva média e somando o quarto, obtêm-se, das quatro maneiras possíveis, $29$, $23$, $21$ e $17$. Qual é o maior dos quatro números?","h":"Some as quatro equações: cada número aparece com peso total $1+3\\cdot\\frac13=2$.","x":"Somando obtém-se $2(a+b+c+d)=90$, logo a soma é $45$. Cada equação fica $\\frac{45-d}{3}+d=29$, isto é, $15+\\frac{2d}3=29$, logo $d=21$; da mesma forma os outros são $12$, $9$ e $3$. O maior é $21$."}},{"s":"parabola-through-points","sub":"la","d":"easy","r":900,"c":["la-systems"],"g":"university","t":"Parabola Through Three Points","q":"The polynomial $p(t)=a_0+a_1t+a_2t^2$ has a graph through $(1,12)$, $(2,15)$ and $(3,16)$. Find $p(4)$.","h":"Each point gives one linear equation in $a_0,a_1,a_2$.","x":"The system $a_0+a_1+a_2=12$, $a_0+2a_1+4a_2=15$, $a_0+3a_1+9a_2=16$ gives $p(t)=7+6t-t^2$. So $p(4)=7+24-16=15$.","at":"15","k":"MC41MQ==","pt":{"t":"Parábola por Três Pontos","q":"O gráfico do polinómio $p(t)=a_0+a_1t+a_2t^2$ passa pelos pontos $(1,12)$, $(2,15)$ e $(3,16)$. Determine $p(4)$.","h":"Cada ponto dá uma equação linear em $a_0,a_1,a_2$.","x":"O sistema $a_0+a_1+a_2=12$, $a_0+2a_1+4a_2=15$, $a_0+3a_1+9a_2=16$ dá $p(t)=7+6t-t^2$. Logo $p(4)=7+24-16=15$."}},{"s":"line-of-solutions","sub":"la","d":"easy","r":1040,"c":["la-systems","la-rank"],"g":"university","t":"A Line of Solutions","q":"Consider $$\\begin{cases}y+z=0\\\\2x+3w=2\\\\6x+3y+3z+4w=6\\\\3x+2w=3\\\\5x+y+z+5w=5.\\end{cases}$$ Its solutions form a line in $\\mathbb R^4$, and $x+w$ takes the same value at every solution. Find it.","h":"Use $y+z=0$ to remove $y$ and $z$ from the other equations.","x":"With $y+z=0$ the remaining equations involve only $x,w$: $2x+3w=2$ and $3x+2w=3$ give $x=1$, $w=0$ (and the other two agree). The solutions are $(1,-z,z,0)$, so $x+w=1$.","at":"1","k":"MC4x","pt":{"t":"Uma Reta de Soluções","q":"Considere $$\\begin{cases}y+z=0\\\\2x+3w=2\\\\6x+3y+3z+4w=6\\\\3x+2w=3\\\\5x+y+z+5w=5.\\end{cases}$$ As soluções formam uma reta em $\\mathbb R^4$, e $x+w$ toma o mesmo valor em todas. Determine-o.","h":"Use $y+z=0$ para eliminar $y$ e $z$ das outras equações.","x":"Com $y+z=0$, as restantes equações só envolvem $x,w$: $2x+3w=2$ e $3x+2w=3$ dão $x=1$, $w=0$ (e as outras duas confirmam). As soluções são $(1,-z,z,0)$, logo $x+w=1$."}},{"s":"center-of-mass","sub":"la","d":"easy","r":830,"c":["la-span"],"g":"university","t":"Center of Mass","q":"Point masses of $2$, $5$, $2$ and $1$ grams sit at $(5,-4,3)$, $(4,3,-2)$, $(-4,-3,-1)$ and $(-9,8,6)$. The center of mass is $\\frac1m(m_1v_1+\\dots+m_4v_4)$, with $m$ the total mass. Find its $x$-coordinate.","h":"It is a linear combination of the points with coefficients $\\frac{m_i}{m}$.","x":"$m=10$ and the $x$-coordinates give $\\frac{2\\cdot5+5\\cdot4+2\\cdot(-4)+1\\cdot(-9)}{10}=\\frac{13}{10}$. (The full center is $\\left(\\frac{13}{10},\\frac9{10},0\\right)$.)","at":"\\frac{13}{10}","k":"My4x","pt":{"t":"Centro de Massa","q":"Massas pontuais de $2$, $5$, $2$ e $1$ gramas estão em $(5,-4,3)$, $(4,3,-2)$, $(-4,-3,-1)$ e $(-9,8,6)$. O centro de massa é $\\frac1m(m_1v_1+\\dots+m_4v_4)$, com $m$ a massa total. Determine a sua coordenada $x$.","h":"É uma combinação linear dos pontos com coeficientes $\\frac{m_i}{m}$.","x":"$m=10$ e as coordenadas $x$ dão $\\frac{2\\cdot5+5\\cdot4+2\\cdot(-4)+1\\cdot(-9)}{10}=\\frac{13}{10}$. (O centro completo é $\\left(\\frac{13}{10},\\frac9{10},0\\right)$.)"}},{"s":"undetermined-pair","sub":"la","d":"medium","r":1200,"c":["la-systems","la-rank"],"g":"university","t":"When It's Undetermined","q":"The system $$\\begin{cases}x+4y+3z=10\\\\2x+7y-2z=10\\\\x+5y+\\alpha z=\\beta\\end{cases}$$ is undetermined for exactly one pair $(\\alpha,\\beta)$. Find $\\alpha+\\beta$.","h":"Eliminate $x$, then $y$. The last row is $[\\,0\\ \\ 0\\ \\ \\ast\\ |\\ \\ast\\,]$; both entries must vanish.","x":"$L_2-2L_1$ gives $-y-8z=-10$ and $L_3-L_1$ gives $y+(\\alpha-3)z=\\beta-10$. Adding: $(\\alpha-11)z=\\beta-20$. It is undetermined exactly when $\\alpha=11$ and $\\beta=20$, so $\\alpha+\\beta=31$.","at":"31","k":"MC4xMw==","pt":{"t":"Quando É Indeterminado","q":"O sistema $$\\begin{cases}x+4y+3z=10\\\\2x+7y-2z=10\\\\x+5y+\\alpha z=\\beta\\end{cases}$$ é indeterminado para exatamente um par $(\\alpha,\\beta)$. Determine $\\alpha+\\beta$.","h":"Elimine $x$ e depois $y$. A última linha é $[\\,0\\ \\ 0\\ \\ \\ast\\ |\\ \\ast\\,]$; ambas as entradas têm de se anular.","x":"$L_2-2L_1$ dá $-y-8z=-10$ e $L_3-L_1$ dá $y+(\\alpha-3)z=\\beta-10$. Somando: $(\\alpha-11)z=\\beta-20$. É indeterminado exatamente quando $\\alpha=11$ e $\\beta=20$, logo $\\alpha+\\beta=31$."}},{"s":"undetermined-product","sub":"la","d":"medium","r":1220,"c":["la-systems","la-rank"],"g":"university","t":"Only One Way to Be Undetermined","q":"Find the only values of $\\alpha$ and $\\beta$ for which $$\\begin{cases}2x+7y=9\\\\2x+\\alpha y+\\beta z=1\\\\2x+7y+z=7\\end{cases}$$ is undetermined, and enter $\\alpha\\beta$.","h":"The first and third equations already fix $z$.","x":"$L_3-L_1$ gives $z=-2$. Then the second becomes $2x+\\alpha y=1+2\\beta$, which must be a multiple of $2x+7y=9$: $\\alpha=7$ and $1+2\\beta=9$, so $\\beta=4$. Hence $\\alpha\\beta=28$.","at":"28","k":"MC44Mg==","pt":{"t":"Só Uma Forma de Ser Indeterminado","q":"Determine os únicos valores de $\\alpha$ e $\\beta$ para os quais $$\\begin{cases}2x+7y=9\\\\2x+\\alpha y+\\beta z=1\\\\2x+7y+z=7\\end{cases}$$ é indeterminado, e introduza $\\alpha\\beta$.","h":"A primeira e a terceira equações já fixam $z$.","x":"$L_3-L_1$ dá $z=-2$. Então a segunda fica $2x+\\alpha y=1+2\\beta$, que tem de ser múltipla de $2x+7y=9$: $\\alpha=7$ e $1+2\\beta=9$, logo $\\beta=4$. Portanto $\\alpha\\beta=28$."}},{"s":"make-it-possible","sub":"la","d":"medium","r":1160,"c":["la-systems","la-span"],"g":"university","t":"Make It Possible","q":"For which $b_3$ is the system $$\\begin{cases}x+y+3z=1\\\\2x+2y-z=2\\\\4x+4y+5z=b_3\\end{cases}$$ possible?","h":"Work with a general right-hand side $(b_1,b_2,b_3)$ and look at the zero row.","x":"The third row of $A$ is $2L_1+L_2$, so the system is possible exactly when $b_3=2b_1+b_2$. Here $b_3=2+2=4$.","at":"4","k":"MC40","pt":{"t":"Torná-lo Possível","q":"Para que valor de $b_3$ é possível o sistema $$\\begin{cases}x+y+3z=1\\\\2x+2y-z=2\\\\4x+4y+5z=b_3\\end{cases}$$","h":"Trabalhe com um segundo membro genérico $(b_1,b_2,b_3)$ e olhe para a linha nula.","x":"A terceira linha de $A$ é $2L_1+L_2$, logo o sistema é possível exatamente quando $b_3=2b_1+b_2$. Aqui $b_3=2+2=4$."}},{"s":"two-undetermined-cases","sub":"la","d":"medium","r":1480,"c":["la-systems","la-rank"],"g":"university","t":"Two Undetermined Cases","q":"Discuss the system $$\\begin{cases}2x+y+z=-6\\beta\\\\\\alpha x+3y+2z=2\\beta\\\\2x+y+(\\alpha+1)z=4\\end{cases}$$ in terms of $\\alpha$ and $\\beta$. It is undetermined for exactly two pairs $(\\alpha,\\beta)$. Enter the sum of the two values of $\\beta$.","h":"The determinant of the coefficient matrix is $-\\alpha(\\alpha-6)$. Study $\\alpha=0$ and $\\alpha=6$ separately.","x":"For $\\alpha\\ne0,6$ it is determined. For $\\alpha=0$: $L_3-L_1$ gives $0=4+6\\beta$, and elimination leaves a consistent system exactly when $\\beta=-\\frac23$. For $\\alpha=6$: $L_3-L_1$ gives $6z=4+6\\beta$ and $L_2-3L_1$ gives $-z=20\\beta$; consistency forces $\\beta=-\\frac{2}{63}$. The sum is $-\\frac23-\\frac2{63}=-\\frac{44}{63}$.","at":"-\\frac{44}{63}","k":"NDg5NjIxNDg5NjIxNDg5Ni4wLQ==","pt":{"t":"Dois Casos Indeterminados","q":"Discuta o sistema $$\\begin{cases}2x+y+z=-6\\beta\\\\\\alpha x+3y+2z=2\\beta\\\\2x+y+(\\alpha+1)z=4\\end{cases}$$ em função de $\\alpha$ e $\\beta$. É indeterminado para exatamente dois pares $(\\alpha,\\beta)$. Introduza a soma dos dois valores de $\\beta$.","h":"O determinante da matriz dos coeficientes é $-\\alpha(\\alpha-6)$. Estude $\\alpha=0$ e $\\alpha=6$ separadamente.","x":"Para $\\alpha\\ne0,6$ é determinado. Para $\\alpha=0$: $L_3-L_1$ dá $0=4+6\\beta$, e a eliminação deixa um sistema possível exatamente quando $\\beta=-\\frac23$. Para $\\alpha=6$: $L_3-L_1$ dá $6z=4+6\\beta$ e $L_2-3L_1$ dá $-z=20\\beta$; a compatibilidade obriga a $\\beta=-\\frac{2}{63}$. A soma é $-\\frac23-\\frac2{63}=-\\frac{44}{63}$."}},{"s":"vandermonde-system","sub":"la","d":"medium","r":1300,"c":["la-systems","la-rank"],"g":"original","t":"Squares on the Right","q":"For which values of $k$ is the system $$\\begin{cases}x+y+z=1\\\\x+2y+kz=3\\\\x+4y+k^2z=9\\end{cases}$$ impossible? Enter the sum of all such $k$.","h":"The determinant is $(k-1)(k-2)$, so only $k=1$ and $k=2$ can go wrong. Check each.","x":"For $k\\ne1,2$ there is a unique solution. For $k=1$ the columns of $x$ and $z$ coincide, and $(1,3,9)$ would have to be $c_1(1,1,1)+c_2(1,2,4)$: the first two rows give $c_2=2$, $c_1=-1$, but then the third gives $7\\ne9$. The same happens for $k=2$. So the system is impossible for $k=1$ and $k=2$, and the sum is $3$.","at":"3","k":"MC4z","pt":{"t":"Quadrados à Direita","q":"Para que valores de $k$ é impossível o sistema $$\\begin{cases}x+y+z=1\\\\x+2y+kz=3\\\\x+4y+k^2z=9\\end{cases}$$ Introduza a soma de todos esses $k$.","h":"O determinante é $(k-1)(k-2)$, logo só $k=1$ e $k=2$ podem correr mal. Verifique cada um.","x":"Para $k\\ne1,2$ há uma só solução. Para $k=1$ as colunas de $x$ e de $z$ coincidem, e $(1,3,9)$ teria de ser $c_1(1,1,1)+c_2(1,2,4)$: as duas primeiras linhas dão $c_2=2$, $c_1=-1$, mas a terceira dá $7\\ne9$. O mesmo acontece para $k=2$. Logo o sistema é impossível para $k=1$ e $k=2$, e a soma é $3$."}},{"s":"nontrivial-homogeneous","sub":"la","d":"medium","r":1260,"c":["la-rank","la-det"],"g":"original","t":"Nonzero Solutions","q":"For which $a$ does the homogeneous system $$\\begin{cases}x+ay+z=0\\\\ax+y+z=0\\\\x+y+az=0\\end{cases}$$ have nonzero solutions? Enter the sum of the distinct values of $a$.","h":"A square homogeneous system has nonzero solutions exactly when the determinant is $0$.","x":"The determinant factors as $-(a-1)^2(a+2)$. It vanishes for $a=1$ and $a=-2$, whose sum is $-1$.","at":"-1","k":"MC4xLQ==","pt":{"t":"Soluções Não Nulas","q":"Para que valores de $a$ tem o sistema homogéneo $$\\begin{cases}x+ay+z=0\\\\ax+y+z=0\\\\x+y+az=0\\end{cases}$$ soluções não nulas? Introduza a soma dos valores distintos de $a$.","h":"Um sistema homogéneo quadrado tem soluções não nulas exatamente quando o determinante é $0$.","x":"O determinante fatoriza-se como $-(a-1)^2(a+2)$. Anula-se para $a=1$ e $a=-2$, cuja soma é $-1$."}},{"s":"free-variables-count","sub":"la","d":"medium","r":1180,"c":["la-rank"],"g":"original","t":"Counting Free Variables","q":"How many free variables does the system $Ax=0$ have, for $$A=\\begin{bmatrix}1 & 2 & 0 & 1 & 3 \\\\ 2 & 4 & 1 & 0 & 1 \\\\ 3 & 6 & 1 & 1 & 4\\end{bmatrix}?$$","h":"Free variables $=$ number of columns $-$ rank.","x":"The third row is the sum of the first two, and the first two are independent, so the rank is $2$. With $5$ columns there are $5-2=3$ free variables.","at":"3","k":"MC4z","pt":{"t":"Contar Variáveis Livres","q":"Quantas variáveis livres tem o sistema $Ax=0$, para $$A=\\begin{bmatrix}1 & 2 & 0 & 1 & 3 \\\\ 2 & 4 & 1 & 0 & 1 \\\\ 3 & 6 & 1 & 1 & 4\\end{bmatrix}?$$","h":"Variáveis livres $=$ número de colunas $-$ característica.","x":"A terceira linha é a soma das duas primeiras, e as duas primeiras são independentes, logo a característica é $2$. Com $5$ colunas há $5-2=3$ variáveis livres."}},{"s":"echelon-pivots","sub":"la","d":"easy","r":870,"c":["la-systems","la-rank"],"g":"university","t":"Counting Pivots","q":"What is the rank of $$\\begin{bmatrix}1&5&0&3&-6&0\\\\0&0&0&-3&0&9\\\\0&0&0&0&2&-4\\\\0&0&0&0&0&0\\end{bmatrix}?$$","h":"The matrix is already in row echelon form.","x":"The pivots are $1$, $-3$ and $2$ in columns $1$, $4$ and $5$, so the rank is $3$.","at":"3","k":"MC4z","pt":{"t":"Contar Pivôs","q":"Qual é a característica de $$\\begin{bmatrix}1&5&0&3&-6&0\\\\0&0&0&-3&0&9\\\\0&0&0&0&2&-4\\\\0&0&0&0&0&0\\end{bmatrix}?$$","h":"A matriz já está em escada de linhas.","x":"Os pivôs são $1$, $-3$ e $2$, nas colunas $1$, $4$ e $5$, logo a característica é $3$."}},{"s":"equation-from-solutions","sub":"la","d":"medium","r":1250,"c":["la-systems"],"g":"university","t":"An Equation from Its Solutions","q":"Find a linear equation $x_1+bx_2+cx_3=d$ whose solution set is $\\{(3t+2s,\\ t-s+1,\\ 2t-s+2):s,t\\in\\mathbb R\\}$. Enter $b+c+d$.","h":"The directions $(3,1,2)$ and $(2,-1,-1)$ must satisfy the homogeneous equation; the point $(0,1,2)$ fixes $d$.","x":"$3+b+2c=0$ and $2-b-c=0$ give $c=-5$, $b=7$. The point $(0,1,2)$ gives $d=7-10=-3$. The equation is $x_1+7x_2-5x_3=-3$, and $b+c+d=-1$.","at":"-1","k":"MC4xLQ==","pt":{"t":"Uma Equação a Partir das Soluções","q":"Encontre uma equação linear $x_1+bx_2+cx_3=d$ cujo conjunto de soluções seja $\\{(3t+2s,\\ t-s+1,\\ 2t-s+2):s,t\\in\\mathbb R\\}$. Introduza $b+c+d$.","h":"As direções $(3,1,2)$ e $(2,-1,-1)$ têm de satisfazer a equação homogénea; o ponto $(0,1,2)$ fixa $d$.","x":"$3+b+2c=0$ e $2-b-c=0$ dão $c=-5$, $b=7$. O ponto $(0,1,2)$ dá $d=7-10=-3$. A equação é $x_1+7x_2-5x_3=-3$, e $b+c+d=-1$."}},{"s":"product-entry","sub":"la","d":"easy","r":820,"c":["la-matrices"],"g":"original","t":"One Entry of a Product","q":"Let $$A=\\begin{bmatrix}1 & 2 & 3 \\\\ 0 & -1 & 4\\end{bmatrix},\\qquad B=\\begin{bmatrix}2 & 0 & 5 \\\\ 1 & 3 & 2 \\\\ 0 & 1 & -1\\end{bmatrix}.$$ Find the entry in row $2$, column $3$ of $AB$.","h":"Only row $2$ of $A$ and column $3$ of $B$ matter.","x":"Row $2$ of $A$ is $(0,-1,4)$ and column $3$ of $B$ is $(5,2,-1)$: $0\\cdot5+(-1)\\cdot2+4\\cdot(-1)=-6$.","at":"-6","k":"MC42LQ==","pt":{"t":"Uma Entrada de um Produto","q":"Sejam $$A=\\begin{bmatrix}1 & 2 & 3 \\\\ 0 & -1 & 4\\end{bmatrix},\\qquad B=\\begin{bmatrix}2 & 0 & 5 \\\\ 1 & 3 & 2 \\\\ 0 & 1 & -1\\end{bmatrix}.$$ Determine a entrada da linha $2$, coluna $3$ de $AB$.","h":"Só interessam a linha $2$ de $A$ e a coluna $3$ de $B$.","x":"A linha $2$ de $A$ é $(0,-1,4)$ e a coluna $3$ de $B$ é $(5,2,-1)$: $0\\cdot5+(-1)\\cdot2+4\\cdot(-1)=-6$."}},{"s":"trace-of-product","sub":"la","d":"easy","r":900,"c":["la-matrices"],"g":"university","t":"Trace of a Product","q":"For $A=\\begin{bmatrix}1&2\\\\3&4\\end{bmatrix}$ and $B=\\begin{bmatrix}0&1\\\\-1&2\\end{bmatrix}$, compute $\\operatorname{tr}(AB)-\\operatorname{tr}(BA)+\\operatorname{tr}(A)\\operatorname{tr}(B)$.","h":"$\\operatorname{tr}(AB)=\\operatorname{tr}(BA)$ always.","x":"The first two terms cancel, since $\\operatorname{tr}(AB)=\\operatorname{tr}(BA)$ for all square $A,B$. What is left is $5\\cdot2=10$.","at":"10","k":"MC4wMQ==","pt":{"t":"Traço de um Produto","q":"Para $A=\\begin{bmatrix}1&2\\\\3&4\\end{bmatrix}$ e $B=\\begin{bmatrix}0&1\\\\-1&2\\end{bmatrix}$, calcule $\\operatorname{tr}(AB)-\\operatorname{tr}(BA)+\\operatorname{tr}(A)\\operatorname{tr}(B)$.","h":"$\\operatorname{tr}(AB)=\\operatorname{tr}(BA)$ sempre.","x":"Os dois primeiros termos cancelam-se, porque $\\operatorname{tr}(AB)=\\operatorname{tr}(BA)$ para quaisquer $A,B$ quadradas. Resta $5\\cdot2=10$."}},{"s":"shear-power","sub":"la","d":"easy","r":950,"c":["la-matrices"],"g":"original","t":"Power of a Shear","q":"Let $A=\\begin{bmatrix}1&3\\\\0&1\\end{bmatrix}$. Find the top-right entry of $A^{10}$.","h":"Compute $A^2$ and $A^3$ and spot the pattern.","x":"$A^n=\\begin{bmatrix}1&3n\\\\0&1\\end{bmatrix}$ (each multiplication adds another $3$). So the entry is $30$.","at":"30","k":"MC4wMw==","pt":{"t":"Potência de um Corte","q":"Seja $A=\\begin{bmatrix}1&3\\\\0&1\\end{bmatrix}$. Determine a entrada do canto superior direito de $A^{10}$.","h":"Calcule $A^2$ e $A^3$ e encontre o padrão.","x":"$A^n=\\begin{bmatrix}1&3n\\\\0&1\\end{bmatrix}$ (cada multiplicação acrescenta mais $3$). Logo a entrada é $30$."}},{"s":"antidiagonal-power","sub":"la","d":"medium","r":1170,"c":["la-matrices"],"g":"university","t":"Antidiagonal Powers","q":"Let $A=\\begin{bmatrix}0&2\\\\2&0\\end{bmatrix}$. Find the sum of all entries of $A^7$.","h":"$A^2=4I$.","x":"Since $A^2=4I$, $A^{2k}=4^kI$ and $A^{2k+1}=4^kA$. So $A^7=64A$, with entries $0,128,128,0$: the sum is $256$.","at":"256","k":"MC42NTI=","pt":{"t":"Potências Antidiagonais","q":"Seja $A=\\begin{bmatrix}0&2\\\\2&0\\end{bmatrix}$. Determine a soma de todas as entradas de $A^7$.","h":"$A^2=4I$.","x":"Como $A^2=4I$, $A^{2k}=4^kI$ e $A^{2k+1}=4^kA$. Logo $A^7=64A$, com entradas $0,128,128,0$: a soma é $256$."}},{"s":"noncommuting-square","sub":"la","d":"medium","r":1210,"c":["la-matrices"],"g":"original","t":"The Binomial That Fails","q":"For $A=\\begin{bmatrix}1&1\\\\0&0\\end{bmatrix}$ and $B=\\begin{bmatrix}0&0\\\\1&1\\end{bmatrix}$, find the top-left entry of $(A+B)^2-(A^2+2AB+B^2)$.","h":"$(A+B)^2=A^2+AB+BA+B^2$, so the difference is $BA-AB$.","x":"The difference is $BA-AB$. Here $AB=\\begin{bmatrix}1&1\\\\0&0\\end{bmatrix}$ and $BA=\\begin{bmatrix}0&0\\\\1&1\\end{bmatrix}$, so $BA-AB=\\begin{bmatrix}-1&-1\\\\1&1\\end{bmatrix}$ and the entry is $-1$. Since $AB\\ne BA$, the familiar binomial formula fails.","at":"-1","k":"MC4xLQ==","pt":{"t":"O Binómio Que Falha","q":"Para $A=\\begin{bmatrix}1&1\\\\0&0\\end{bmatrix}$ e $B=\\begin{bmatrix}0&0\\\\1&1\\end{bmatrix}$, determine a entrada do canto superior esquerdo de $(A+B)^2-(A^2+2AB+B^2)$.","h":"$(A+B)^2=A^2+AB+BA+B^2$, logo a diferença é $BA-AB$.","x":"A diferença é $BA-AB$. Aqui $AB=\\begin{bmatrix}1&1\\\\0&0\\end{bmatrix}$ e $BA=\\begin{bmatrix}0&0\\\\1&1\\end{bmatrix}$, logo $BA-AB=\\begin{bmatrix}-1&-1\\\\1&1\\end{bmatrix}$ e a entrada é $-1$. Como $AB\\ne BA$, a fórmula do binómio habitual falha."}},{"s":"markov-product","sub":"la","d":"medium","r":1190,"c":["la-matrices"],"g":"university","t":"Two Markov Steps","q":"A Markov matrix has entries in $[0,1]$ and columns that add up to $1$. With $M=\\begin{bmatrix}0.3&0.1\\\\0.7&0.9\\end{bmatrix}$ and $x_0=(1,0)$, find the first component of $M^2x_0$.","h":"$Mx_0$ is the first column of $M$.","x":"$Mx_0=(0.3,0.7)$ and then $M(0.3,0.7)=(0.09+0.07,\\ 0.21+0.63)=(0.16,0.84)$. The first component is $0.16$.","at":"0.16","k":"NjEuMA==","pt":{"t":"Dois Passos de Markov","q":"Uma matriz de Markov tem entradas em $[0,1]$ e colunas que somam $1$. Com $M=\\begin{bmatrix}0.3&0.1\\\\0.7&0.9\\end{bmatrix}$ e $x_0=(1,0)$, determine a primeira componente de $M^2x_0$.","h":"$Mx_0$ é a primeira coluna de $M$.","x":"$Mx_0=(0.3,0.7)$ e depois $M(0.3,0.7)=(0.09+0.07,\\ 0.21+0.63)=(0.16,0.84)$. A primeira componente é $0.16$."}},{"s":"aat-symmetric-sum","sub":"la","d":"easy","r":880,"c":["la-matrices"],"g":"university","t":"A Times Its Transpose","q":"For $A=\\begin{bmatrix}1&3&-1&-3\\\\0&2&4&-2\\end{bmatrix}$, find the sum of the diagonal entries of $AA^T$.","h":"The $i$-th diagonal entry of $AA^T$ is the squared length of row $i$ of $A$.","x":"Row $1$ gives $1+9+1+9=20$ and row $2$ gives $0+4+16+4=24$. The trace of $AA^T$ is $44$ (the sum of the squares of all entries of $A$).","at":"44","k":"MC40NA==","pt":{"t":"A Vezes a Sua Transposta","q":"Para $A=\\begin{bmatrix}1&3&-1&-3\\\\0&2&4&-2\\end{bmatrix}$, determine a soma das entradas da diagonal de $AA^T$.","h":"A $i$-ésima entrada diagonal de $AA^T$ é o quadrado do comprimento da linha $i$ de $A$.","x":"A linha $1$ dá $1+9+1+9=20$ e a linha $2$ dá $0+4+16+4=24$. O traço de $AA^T$ é $44$ (a soma dos quadrados de todas as entradas de $A$)."}},{"s":"two-by-two-inverse","sub":"la","d":"easy","r":830,"c":["la-inverse"],"g":"university","t":"Two by Two Inverse","q":"Find the top-left entry of the inverse of $\\begin{bmatrix}1&2\\\\2&1\\end{bmatrix}$.","h":"$\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}^{-1}=\\frac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}$.","x":"$ad-bc=1-4=-3$, so the inverse is $-\\frac13\\begin{bmatrix}1&-2\\\\-2&1\\end{bmatrix}$ and the top-left entry is $-\\frac13$.","at":"-\\frac{1}{3}","k":"MzMzMzMzMzMzMzMzMzMzMy4wLQ==","pt":{"t":"Inversa Dois por Dois","q":"Determine a entrada do canto superior esquerdo da inversa de $\\begin{bmatrix}1&2\\\\2&1\\end{bmatrix}$.","h":"$\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}^{-1}=\\frac{1}{ad-bc}\\begin{bmatrix}d&-b\\\\-c&a\\end{bmatrix}$.","x":"$ad-bc=1-4=-3$, logo a inversa é $-\\frac13\\begin{bmatrix}1&-2\\\\-2&1\\end{bmatrix}$ e a entrada do canto superior esquerdo é $-\\frac13$."}},{"s":"gauss-jordan-inverse","sub":"la","d":"easy","r":1000,"c":["la-inverse"],"g":"university","t":"Gauss–Jordan","q":"Compute the inverse of $$A=\\begin{bmatrix}1&-1&0\\\\1&1&-1\\\\0&1&1\\end{bmatrix}$$ and enter the sum of all its entries.","h":"Reduce $[A\\,|\\,I]$ until the left block is $I$.","x":"Gauss–Jordan gives $A^{-1}=\\frac13\\begin{bmatrix}2&1&1\\\\-1&1&1\\\\1&-1&2\\end{bmatrix}$. The entries add up to $\\frac{7}{3}$.","at":"\\frac{7}{3}","k":"NTMzMzMzMzMzMzMzMzMzMy4y","pt":{"t":"Gauss-Jordan","q":"Calcule a inversa de $$A=\\begin{bmatrix}1&-1&0\\\\1&1&-1\\\\0&1&1\\end{bmatrix}$$ e introduza a soma de todas as suas entradas.","h":"Reduza $[A\\,|\\,I]$ até o bloco da esquerda ser $I$.","x":"O método de Gauss-Jordan dá $A^{-1}=\\frac13\\begin{bmatrix}2&1&1\\\\-1&1&1\\\\1&-1&2\\end{bmatrix}$. As entradas somam $\\frac{7}{3}$."}},{"s":"bidiagonal-inverse","sub":"la","d":"easy","r":1080,"c":["la-inverse"],"g":"university","t":"Inverse of a Staircase","q":"Find the inverse of $$A=\\begin{bmatrix}1&2&3&4\\\\0&1&2&3\\\\0&0&1&2\\\\0&0&0&1\\end{bmatrix}$$ and enter its top-right entry.","h":"Back-substitute column by column, or guess that the inverse is very sparse and check.","x":"$A^{-1}=\\begin{bmatrix}1&-2&1&0\\\\0&1&-2&1\\\\0&0&1&-2\\\\0&0&0&1\\end{bmatrix}$, as multiplying by $A$ confirms. The top-right entry is $0$.","at":"0","k":"MC4w","pt":{"t":"Inversa de uma Escada","q":"Determine a inversa de $$A=\\begin{bmatrix}1&2&3&4\\\\0&1&2&3\\\\0&0&1&2\\\\0&0&0&1\\end{bmatrix}$$ e introduza a sua entrada do canto superior direito.","h":"Faça substituição ascendente coluna a coluna, ou adivinhe que a inversa tem muitos zeros e verifique.","x":"$A^{-1}=\\begin{bmatrix}1&-2&1&0\\\\0&1&-2&1\\\\0&0&1&-2\\\\0&0&0&1\\end{bmatrix}$, como se confirma multiplicando por $A$. A entrada do canto superior direito é $0$."}},{"s":"matrix-equation","sub":"la","d":"medium","r":1240,"c":["la-inverse"],"g":"university","t":"Solve for X","q":"Let $$A=\\begin{bmatrix}2&0&-3\\\\-2&0&4\\\\-2&1&2\\end{bmatrix},\\qquad B=\\begin{bmatrix}0&0&1\\\\0&1&0\\\\1&0&0\\end{bmatrix}.$$ Find the unique $X$ with $B^2XA^{-1}=B$ and enter the sum of its entries.","h":"$B$ swaps rows $1$ and $3$, so $B^2=I$.","x":"Since $B^2=I$, the equation is $XA^{-1}=B$, so $X=BA$: the rows of $A$ in reverse order, $X=\\begin{bmatrix}-2&1&2\\\\-2&0&4\\\\2&0&-3\\end{bmatrix}$. Its entries add up to $2$.","at":"2","k":"MC4y","pt":{"t":"Resolver em Ordem a X","q":"Sejam $$A=\\begin{bmatrix}2&0&-3\\\\-2&0&4\\\\-2&1&2\\end{bmatrix},\\qquad B=\\begin{bmatrix}0&0&1\\\\0&1&0\\\\1&0&0\\end{bmatrix}.$$ Determine a única matriz $X$ com $B^2XA^{-1}=B$ e introduza a soma das suas entradas.","h":"$B$ troca as linhas $1$ e $3$, logo $B^2=I$.","x":"Como $B^2=I$, a equação é $XA^{-1}=B$, logo $X=BA$: as linhas de $A$ por ordem inversa, $X=\\begin{bmatrix}-2&1&2\\\\-2&0&4\\\\2&0&-3\\end{bmatrix}$. As entradas somam $2$."}},{"s":"nilpotent-geometric","sub":"la","d":"medium","r":1280,"c":["la-inverse"],"g":"university","t":"Geometric Series of Matrices","q":"Let $A=\\begin{bmatrix}0&0&0\\\\1&0&0\\\\0&1&0\\end{bmatrix}$, so that $A^3=0$. Find the bottom-left entry of $(I-A)^{-1}$.","h":"Check that $(I-A)(I+A+A^2)=I-A^3$.","x":"$(I-A)^{-1}=I+A+A^2$, which is the lower triangular matrix of ones. Its bottom-left entry, from $A^2$, is $1$.","at":"1","k":"MC4x","pt":{"t":"Série Geométrica de Matrizes","q":"Seja $A=\\begin{bmatrix}0&0&0\\\\1&0&0\\\\0&1&0\\end{bmatrix}$, de modo que $A^3=0$. Determine a entrada do canto inferior esquerdo de $(I-A)^{-1}$.","h":"Verifique que $(I-A)(I+A+A^2)=I-A^3$.","x":"$(I-A)^{-1}=I+A+A^2$, que é a matriz triangular inferior só com uns. A entrada do canto inferior esquerdo, que vem de $A^2$, é $1$."}},{"s":"product-inverse","sub":"la","d":"medium","r":1320,"c":["la-inverse"],"g":"university","t":"Inverse of a Product","q":"With $$A=\\begin{bmatrix}1&0&-3\\\\0&1&0\\\\0&0&1\\end{bmatrix},\\ B=\\begin{bmatrix}0&1&0\\\\1&0&0\\\\0&0&1\\end{bmatrix},\\ C=\\begin{bmatrix}1&0&0\\\\0&2&0\\\\0&0&1\\end{bmatrix},\\ D=\\begin{bmatrix}1&0&0\\\\0&1&0\\\\0&5&1\\end{bmatrix},$$ find the entry in row $3$, column $3$ of $(ABCD)^{-1}$.","h":"$(ABCD)^{-1}=D^{-1}C^{-1}B^{-1}A^{-1}$, and each factor is elementary, so its inverse is immediate.","x":"$ABCD=\\begin{bmatrix}0&-13&-3\\\\1&0&0\\\\0&5&1\\end{bmatrix}$ and its inverse is $\\begin{bmatrix}0&1&0\\\\\\frac12&0&\\frac32\\\\-\\frac52&0&-\\frac{13}{2}\\end{bmatrix}$. The requested entry is $-\\frac{13}{2}$.","at":"-\\frac{13}{2}","k":"NS42LQ==","pt":{"t":"Inversa de um Produto","q":"Com $$A=\\begin{bmatrix}1&0&-3\\\\0&1&0\\\\0&0&1\\end{bmatrix},\\ B=\\begin{bmatrix}0&1&0\\\\1&0&0\\\\0&0&1\\end{bmatrix},\\ C=\\begin{bmatrix}1&0&0\\\\0&2&0\\\\0&0&1\\end{bmatrix},\\ D=\\begin{bmatrix}1&0&0\\\\0&1&0\\\\0&5&1\\end{bmatrix},$$ determine a entrada da linha $3$, coluna $3$ de $(ABCD)^{-1}$.","h":"$(ABCD)^{-1}=D^{-1}C^{-1}B^{-1}A^{-1}$, e cada fator é elementar, por isso a sua inversa é imediata.","x":"$ABCD=\\begin{bmatrix}0&-13&-3\\\\1&0&0\\\\0&5&1\\end{bmatrix}$ e a sua inversa é $\\begin{bmatrix}0&1&0\\\\\\frac12&0&\\frac32\\\\-\\frac52&0&-\\frac{13}{2}\\end{bmatrix}$. A entrada pedida é $-\\frac{13}{2}$."}},{"s":"inverse-of-sum","sub":"la","d":"hard","r":1650,"c":["la-inverse","la-matrices"],"g":"original","t":"Inverse of I Plus a Rank-One","q":"Let $J$ be the $5\\times5$ matrix with every entry equal to $1$. The inverse of $I+J$ has the form $I+cJ$. Find $c$.","h":"$J^2=5J$.","x":"$(I+J)(I+cJ)=I+(1+c)J+cJ^2=I+(1+c+5c)J$. This is $I$ when $1+6c=0$, so $c=-\\frac16$.","at":"-\\frac{1}{6}","k":"NjY2NjY2NjY2NjY2NjY2NjEuMC0=","pt":{"t":"Inversa de I Mais Característica Um","q":"Seja $J$ a matriz $5\\times5$ com todas as entradas iguais a $1$. A inversa de $I+J$ tem a forma $I+cJ$. Determine $c$.","h":"$J^2=5J$.","x":"$(I+J)(I+cJ)=I+(1+c)J+cJ^2=I+(1+c+5c)J$. Isto é $I$ quando $1+6c=0$, logo $c=-\\frac16$."}},{"s":"inverse-entry-parameter","sub":"la","d":"medium","r":1400,"c":["la-inverse","la-det"],"g":"original","t":"When the Inverse Exists","q":"The matrix $\\begin{bmatrix}1&1&1\\\\1&2&4\\\\1&3&k\\end{bmatrix}$ is invertible for all $k$ except one. For $k=10$, find the bottom-right entry of its inverse.","h":"The bottom-right entry of $A^{-1}$ is the cofactor of $a_{33}$ divided by $\\det A$.","x":"$\\det A=k-7$ (so $k=7$ is the exception). The cofactor of $a_{33}$ is $\\det\\begin{bmatrix}1&1\\\\1&2\\end{bmatrix}=1$. For $k=10$ the entry is $\\frac{1}{3}$.","at":"\\frac{1}{3}","k":"MzMzMzMzMzMzMzMzMzMzMy4w","pt":{"t":"Quando Existe Inversa","q":"A matriz $\\begin{bmatrix}1&1&1\\\\1&2&4\\\\1&3&k\\end{bmatrix}$ é invertível para todos os $k$ menos um. Para $k=10$, determine a entrada do canto inferior direito da sua inversa.","h":"A entrada do canto inferior direito de $A^{-1}$ é o complemento algébrico de $a_{33}$ a dividir por $\\det A$.","x":"$\\det A=k-7$ (logo $k=7$ é a exceção). O complemento algébrico de $a_{33}$ é $\\det\\begin{bmatrix}1&1\\\\1&2\\end{bmatrix}=1$. Para $k=10$ a entrada é $\\frac{1}{3}$."}},{"s":"det-two-by-two","sub":"la","d":"easy","r":800,"c":["la-det"],"g":"original","t":"Two by Two","q":"Compute $\\det\\begin{bmatrix}3&7\\\\2&5\\end{bmatrix}$.","h":"$\\det\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}=ad-bc$.","x":"$3\\cdot5-7\\cdot2=1$.","at":"1","k":"MC4x","pt":{"t":"Dois por Dois","q":"Calcule $\\det\\begin{bmatrix}3&7\\\\2&5\\end{bmatrix}$.","h":"$\\det\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}=ad-bc$.","x":"$3\\cdot5-7\\cdot2=1$."}},{"s":"det-three-by-three","sub":"la","d":"easy","r":840,"c":["la-det"],"g":"original","t":"Three by Three","q":"Compute $$\\det\\begin{bmatrix}1&2&0\\\\2&1&3\\\\0&1&1\\end{bmatrix}.$$","h":"Expand along the first row, which has a zero.","x":"$1\\cdot(1\\cdot1-3\\cdot1)-2\\cdot(2\\cdot1-3\\cdot0)+0=-2-4=-6$.","at":"-6","k":"MC42LQ==","pt":{"t":"Três por Três","q":"Calcule $$\\det\\begin{bmatrix}1&2&0\\\\2&1&3\\\\0&1&1\\end{bmatrix}.$$","h":"Desenvolva segundo a primeira linha, que tem um zero.","x":"$1\\cdot(1\\cdot1-3\\cdot1)-2\\cdot(2\\cdot1-3\\cdot0)+0=-2-4=-6$."}},{"s":"triangular-det","sub":"la","d":"easy","r":820,"c":["la-det"],"g":"original","t":"Read the Diagonal","q":"Compute $$\\det\\begin{bmatrix}2&7&-1&4\\\\0&-1&5&3\\\\0&0&3&8\\\\0&0&0&\\tfrac12\\end{bmatrix}.$$","h":"The determinant of a triangular matrix is the product of its diagonal.","x":"$2\\cdot(-1)\\cdot3\\cdot\\frac12=-3$.","at":"-3","k":"MC4zLQ==","pt":{"t":"Ler a Diagonal","q":"Calcule $$\\det\\begin{bmatrix}2&7&-1&4\\\\0&-1&5&3\\\\0&0&3&8\\\\0&0&0&\\tfrac12\\end{bmatrix}.$$","h":"O determinante de uma matriz triangular é o produto da diagonal.","x":"$2\\cdot(-1)\\cdot3\\cdot\\frac12=-3$."}},{"s":"row-operations-det","sub":"la","d":"easy","r":900,"c":["la-det"],"g":"original","t":"Row Operations and the Determinant","q":"$A$ is $3\\times3$ with $\\det A=5$. The matrix $B$ is obtained from $A$ by swapping rows $1$ and $2$, then multiplying row $3$ by $3$, then adding $4$ times row $1$ to row $2$. Find $\\det B$.","h":"Swap: sign change. Scaling a row: multiply. Adding a multiple of a row: no change.","x":"$5\\to-5\\to-15\\to-15$. So $\\det B=-15$.","at":"-15","k":"MC41MS0=","pt":{"t":"Operações sobre Linhas e o Determinante","q":"$A$ é $3\\times3$ com $\\det A=5$. A matriz $B$ obtém-se de $A$ trocando as linhas $1$ e $2$, depois multiplicando a linha $3$ por $3$ e depois somando à linha $2$ a linha $1$ multiplicada por $4$. Determine $\\det B$.","h":"Troca: muda o sinal. Multiplicar uma linha: multiplica. Somar um múltiplo de uma linha: não muda.","x":"$5\\to-5\\to-15\\to-15$. Logo $\\det B=-15$."}},{"s":"det-of-scalar-multiple","sub":"la","d":"easy","r":950,"c":["la-det"],"g":"original","t":"Scaling a Whole Matrix","q":"$A$ is a $4\\times4$ matrix with $\\det A=-3$. Find $\\det(2A)$.","h":"Multiplying the matrix by $2$ multiplies each of the $4$ rows by $2$.","x":"$\\det(2A)=2^4\\det A=16\\cdot(-3)=-48$.","at":"-48","k":"MC44NC0=","pt":{"t":"Multiplicar a Matriz Toda","q":"$A$ é uma matriz $4\\times4$ com $\\det A=-3$. Determine $\\det(2A)$.","h":"Multiplicar a matriz por $2$ multiplica cada uma das $4$ linhas por $2$.","x":"$\\det(2A)=2^4\\det A=16\\cdot(-3)=-48$."}},{"s":"det-of-product-rules","sub":"la","d":"easy","r":1050,"c":["la-det"],"g":"original","t":"Products, Inverses, Transposes","q":"$A$ and $B$ are $3\\times3$ with $\\det A=2$ and $\\det B=-5$. Find $\\det\\left(AB^{-1}A^T\\right)$.","h":"The determinant is multiplicative, $\\det B^{-1}=\\frac1{\\det B}$ and $\\det A^T=\\det A$.","x":"$2\\cdot\\left(-\\frac15\\right)\\cdot2=-\\frac45$.","at":"-\\frac{4}{5}","k":"OC4wLQ==","pt":{"t":"Produtos, Inversas, Transpostas","q":"$A$ e $B$ são $3\\times3$ com $\\det A=2$ e $\\det B=-5$. Determine $\\det\\left(AB^{-1}A^T\\right)$.","h":"O determinante é multiplicativo, $\\det B^{-1}=\\frac1{\\det B}$ e $\\det A^T=\\det A$.","x":"$2\\cdot\\left(-\\frac15\\right)\\cdot2=-\\frac45$."}},{"s":"singular-for-k","sub":"la","d":"easy","r":880,"c":["la-det","la-inverse"],"g":"original","t":"Singular for One k","q":"For which $k$ is $\\begin{bmatrix}1&2&3\\\\4&5&6\\\\7&8&k\\end{bmatrix}$ not invertible?","h":"Compute the determinant as a function of $k$, or notice that the rows are in arithmetic progression when $k=9$.","x":"The determinant is $-3k+27$, which vanishes for $k=9$ (then row $3$ $=2\\cdot$row $2-$row $1$).","at":"9","k":"MC45","pt":{"t":"Singular para Um k","q":"Para que valor de $k$ é que $\\begin{bmatrix}1&2&3\\\\4&5&6\\\\7&8&k\\end{bmatrix}$ não é invertível?","h":"Calcule o determinante em função de $k$, ou repare que as linhas estão em progressão aritmética quando $k=9$.","x":"O determinante é $-3k+27$, que se anula para $k=9$ (aí linha $3$ $=2\\cdot$linha $2-$linha $1$)."}},{"s":"triangle-area-det","sub":"la","d":"easy","r":900,"c":["la-det","la-geometry"],"g":"original","t":"Triangle Area","q":"Find the area of the triangle with vertices $(1,1)$, $(4,2)$ and $(2,5)$.","h":"The two edge vectors from $(1,1)$ span a parallelogram of area $|\\det|$; the triangle is half of it.","x":"The edges are $(3,1)$ and $(1,4)$, with $\\det\\begin{bmatrix}3&1\\\\1&4\\end{bmatrix}=11$. The area is $\\frac{11}2$.","at":"\\frac{11}{2}","k":"NS41","pt":{"t":"Área de um Triângulo","q":"Determine a área do triângulo de vértices $(1,1)$, $(4,2)$ e $(2,5)$.","h":"Os dois vetores-aresta a partir de $(1,1)$ definem um paralelogramo de área $|\\det|$; o triângulo é metade.","x":"As arestas são $(3,1)$ e $(1,4)$, com $\\det\\begin{bmatrix}3&1\\\\1&4\\end{bmatrix}=11$. A área é $\\frac{11}2$."}},{"s":"volume-scaling","sub":"la","d":"easy","r":860,"c":["la-det","la-linmap"],"g":"original","t":"Volume Scaling","q":"$T(x,y,z)=(x+y,\\ y+z,\\ z+x)$ maps the unit cube to a parallelepiped. What is its volume?","h":"Volumes are multiplied by $|\\det[T]|$.","x":"$[T]=\\begin{bmatrix}1&1&0\\\\0&1&1\\\\1&0&1\\end{bmatrix}$ has determinant $1\\cdot1-1\\cdot(0-1)=2$, so the volume is $2$.","at":"2","k":"MC4y","pt":{"t":"Fator de Volume","q":"$T(x,y,z)=(x+y,\\ y+z,\\ z+x)$ transforma o cubo unitário num paralelepípedo. Qual é o seu volume?","h":"Os volumes são multiplicados por $|\\det[T]|$.","x":"$[T]=\\begin{bmatrix}1&1&0\\\\0&1&1\\\\1&0&1\\end{bmatrix}$ tem determinante $1\\cdot1-1\\cdot(0-1)=2$, logo o volume é $2$."}},{"s":"laplace-with-zeros","sub":"la","d":"medium","r":1180,"c":["la-det"],"g":"original","t":"Checkerboard of Zeros","q":"Compute $$\\det\\begin{bmatrix}1&0&2&0\\\\0&3&0&1\\\\4&0&5&0\\\\0&2&0&1\\end{bmatrix}.$$","h":"Reorder rows and columns $1,3,2,4$ (the same permutation on both, so the sign doesn't change): the matrix becomes block diagonal.","x":"The blocks are $\\begin{bmatrix}1&2\\\\4&5\\end{bmatrix}$ and $\\begin{bmatrix}3&1\\\\2&1\\end{bmatrix}$, with determinants $-3$ and $1$. The determinant is $-3$.","at":"-3","k":"MC4zLQ==","pt":{"t":"Xadrez de Zeros","q":"Calcule $$\\det\\begin{bmatrix}1&0&2&0\\\\0&3&0&1\\\\4&0&5&0\\\\0&2&0&1\\end{bmatrix}.$$","h":"Reordene linhas e colunas pela ordem $1,3,2,4$ (a mesma permutação nas duas, logo o sinal não muda): a matriz fica diagonal por blocos.","x":"Os blocos são $\\begin{bmatrix}1&2\\\\4&5\\end{bmatrix}$ e $\\begin{bmatrix}3&1\\\\2&1\\end{bmatrix}$, com determinantes $-3$ e $1$. O determinante é $-3$."}},{"s":"det-from-another","sub":"la","d":"medium","r":1220,"c":["la-det"],"g":"original","t":"A Determinant from Another","q":"Suppose $\\det\\begin{bmatrix}a&b&c\\\\d&e&f\\\\g&h&i\\end{bmatrix}=4$. Find $$\\det\\begin{bmatrix}g&h&i\\\\3d&3e&3f\\\\a+2d&b+2e&c+2f\\end{bmatrix}.$$","h":"Undo the operations one at a time: remove the multiple of row $2$ from row $3$, factor out the $3$, then put the rows back in order.","x":"Subtracting $\\frac23$ of row $2$ from row $3$ leaves $(a,b,c)$ there without changing the determinant. Factoring $3$ out of row $2$ multiplies by $3$. The rows are then $(g,h,i),(d,e,f),(a,b,c)$: swapping rows $1$ and $3$ gives the original, so one sign change. The answer is $3\\cdot(-4)=-12$.","at":"-12","k":"MC4yMS0=","pt":{"t":"Um Determinante a Partir de Outro","q":"Suponha que $\\det\\begin{bmatrix}a&b&c\\\\d&e&f\\\\g&h&i\\end{bmatrix}=4$. Determine $$\\det\\begin{bmatrix}g&h&i\\\\3d&3e&3f\\\\a+2d&b+2e&c+2f\\end{bmatrix}.$$","h":"Desfaça as operações uma de cada vez: tire o múltiplo da linha $2$ à linha $3$, ponha o $3$ em evidência e reordene as linhas.","x":"Subtraindo à linha $3$ $\\frac23$ da linha $2$ fica lá $(a,b,c)$, sem mudar o determinante. Pôr $3$ em evidência na linha $2$ multiplica por $3$. As linhas ficam $(g,h,i),(d,e,f),(a,b,c)$: trocar as linhas $1$ e $3$ dá a original, logo uma mudança de sinal. A resposta é $3\\cdot(-4)=-12$."}},{"s":"gram-determinant","sub":"la","d":"medium","r":1240,"c":["la-det","la-matrices"],"g":"original","t":"A Times A Transpose","q":"For $A=\\begin{bmatrix}1&2&0\\\\0&1&1\\end{bmatrix}$, compute $\\det(AA^T)$ and $\\det(A^TA)$, and enter their sum.","h":"$A^TA$ is $3\\times3$ but has rank at most $2$.","x":"$AA^T=\\begin{bmatrix}5&2\\\\2&2\\end{bmatrix}$ has determinant $6$. $A^TA$ is $3\\times3$ of rank $2$, so its determinant is $0$. The sum is $6$.","at":"6","k":"MC42","pt":{"t":"A Vezes A Transposta","q":"Para $A=\\begin{bmatrix}1&2&0\\\\0&1&1\\end{bmatrix}$, calcule $\\det(AA^T)$ e $\\det(A^TA)$, e introduza a sua soma.","h":"$A^TA$ é $3\\times3$ mas tem característica no máximo $2$.","x":"$AA^T=\\begin{bmatrix}5&2\\\\2&2\\end{bmatrix}$ tem determinante $6$. $A^TA$ é $3\\times3$ de característica $2$, logo o determinante é $0$. A soma é $6$."}},{"s":"vandermonde-four","sub":"la","d":"medium","r":1300,"c":["la-det","la-special"],"g":"original","t":"Vandermonde","q":"Compute $$\\det\\begin{bmatrix}1&1&1&1\\\\1&2&3&4\\\\1&4&9&16\\\\1&8&27&64\\end{bmatrix}.$$","h":"Columns are $(1,x,x^2,x^3)$ for $x=1,2,3,4$: a Vandermonde matrix.","x":"$\\prod_{i<j}(x_j-x_i)=(2-1)(3-1)(4-1)(3-2)(4-2)(4-3)=1\\cdot2\\cdot3\\cdot1\\cdot2\\cdot1=12$.","at":"12","k":"MC4yMQ==","pt":{"t":"Vandermonde","q":"Calcule $$\\det\\begin{bmatrix}1&1&1&1\\\\1&2&3&4\\\\1&4&9&16\\\\1&8&27&64\\end{bmatrix}.$$","h":"As colunas são $(1,x,x^2,x^3)$ para $x=1,2,3,4$: uma matriz de Vandermonde.","x":"$\\prod_{i<j}(x_j-x_i)=(2-1)(3-1)(4-1)(3-2)(4-2)(4-3)=1\\cdot2\\cdot3\\cdot1\\cdot2\\cdot1=12$."}},{"s":"tridiagonal-det","sub":"la","d":"medium","r":1450,"c":["la-det","la-special"],"g":"original","t":"Tridiagonal","q":"Let $D_n$ be the determinant of the $n\\times n$ matrix with $2$ on the diagonal, $-1$ just above and just below it, and $0$ elsewhere. Find $D_6$.","h":"Expanding along the first row gives $D_n=2D_{n-1}-D_{n-2}$.","x":"$D_1=2$, $D_2=3$, and the recurrence $D_n=2D_{n-1}-D_{n-2}$ keeps the differences equal, so $D_n=n+1$. Hence $D_6=7$.","at":"7","k":"MC43","pt":{"t":"Tridiagonal","q":"Seja $D_n$ o determinante da matriz $n\\times n$ com $2$ na diagonal, $-1$ imediatamente acima e abaixo dela, e $0$ no resto. Determine $D_6$.","h":"Desenvolvendo segundo a primeira linha obtém-se $D_n=2D_{n-1}-D_{n-2}$.","x":"$D_1=2$, $D_2=3$, e a recorrência $D_n=2D_{n-1}-D_{n-2}$ mantém as diferenças iguais, logo $D_n=n+1$. Portanto $D_6=7$."}},{"s":"two-i-plus-ones","sub":"la","d":"medium","r":1420,"c":["la-det","la-special"],"g":"original","t":"Two I Plus All Ones","q":"Compute $\\det(2I+J)$, where $I$ and $J$ are $5\\times5$ and $J$ has every entry equal to $1$.","h":"$J$ has eigenvalue $5$ once (eigenvector $(1,1,1,1,1)$) and $0$ four times.","x":"$2I+J$ has eigenvalues $7$ once and $2$ four times, so the determinant is $7\\cdot2^4=112$. (Alternatively, add all columns to the first and factor out $7$.)","at":"112","k":"MC4yMTE=","pt":{"t":"Duas Vezes I Mais Uns","q":"Calcule $\\det(2I+J)$, onde $I$ e $J$ são $5\\times5$ e $J$ tem todas as entradas iguais a $1$.","h":"$J$ tem o valor próprio $5$ uma vez (vetor próprio $(1,1,1,1,1)$) e $0$ quatro vezes.","x":"$2I+J$ tem valores próprios $7$ uma vez e $2$ quatro vezes, logo o determinante é $7\\cdot2^4=112$. (Em alternativa, some todas as colunas à primeira e ponha $7$ em evidência.)"}},{"s":"adjugate-det","sub":"la","d":"medium","r":1250,"c":["la-cramer","la-det"],"g":"original","t":"Determinant of the Adjugate","q":"$A$ is $3\\times3$ with $\\det A=3$. Find $\\det(\\operatorname{adj}A)$.","h":"$A\\,\\operatorname{adj}A=(\\det A)I$.","x":"Taking determinants: $\\det A\\cdot\\det(\\operatorname{adj}A)=(\\det A)^3$, so $\\det(\\operatorname{adj}A)=(\\det A)^2=9$.","at":"9","k":"MC45","pt":{"t":"Determinante da Adjunta","q":"$A$ é $3\\times3$ com $\\det A=3$. Determine $\\det(\\operatorname{adj}A)$.","h":"$A\\,\\operatorname{adj}A=(\\det A)I$.","x":"Aplicando determinantes: $\\det A\\cdot\\det(\\operatorname{adj}A)=(\\det A)^3$, logo $\\det(\\operatorname{adj}A)=(\\det A)^2=9$."}},{"s":"cramer-one-unknown","sub":"la","d":"medium","r":1160,"c":["la-cramer"],"g":"original","t":"Just One Unknown","q":"Use Cramer's rule to find $z$ in $$\\begin{cases}x+y+z=6\\\\x-y+2z=5\\\\2x+y-z=1.\\end{cases}$$","h":"$z=\\frac{\\det A_3}{\\det A}$, where $A_3$ has the right-hand side in place of the third column.","x":"$\\det A=7$ and $\\det A_3=\\det\\begin{bmatrix}1&1&6\\\\1&-1&5\\\\2&1&1\\end{bmatrix}=21$, so $z=3$. (The full solution is $(1,2,3)$.)","at":"3","k":"MC4z","pt":{"t":"Só Uma Incógnita","q":"Use a regra de Cramer para determinar $z$ em $$\\begin{cases}x+y+z=6\\\\x-y+2z=5\\\\2x+y-z=1.\\end{cases}$$","h":"$z=\\frac{\\det A_3}{\\det A}$, onde $A_3$ tem o segundo membro no lugar da terceira coluna.","x":"$\\det A=7$ e $\\det A_3=\\det\\begin{bmatrix}1&1&6\\\\1&-1&5\\\\2&1&1\\end{bmatrix}=21$, logo $z=3$. (A solução completa é $(1,2,3)$.)"}},{"s":"inverse-entry-cofactor","sub":"la","d":"medium","r":1230,"c":["la-cramer","la-inverse"],"g":"original","t":"One Entry of the Inverse","q":"Let $A=\\begin{bmatrix}2&1&0\\\\1&3&1\\\\0&1&2\\end{bmatrix}$. Find the entry in row $1$, column $2$ of $A^{-1}$.","h":"$[A^{-1}]_{12}=\\frac{C_{21}}{\\det A}$: the cofactor of the entry in row $2$, column $1$.","x":"$\\det A=8$. $C_{21}=-\\det\\begin{bmatrix}1&0\\\\1&2\\end{bmatrix}=-2$. So the entry is $-\\frac28=-\\frac14$.","at":"-\\frac{1}{4}","k":"NTIuMC0=","pt":{"t":"Uma Entrada da Inversa","q":"Seja $A=\\begin{bmatrix}2&1&0\\\\1&3&1\\\\0&1&2\\end{bmatrix}$. Determine a entrada da linha $1$, coluna $2$ de $A^{-1}$.","h":"$[A^{-1}]_{12}=\\frac{C_{21}}{\\det A}$: o complemento algébrico da entrada da linha $2$, coluna $1$.","x":"$\\det A=8$. $C_{21}=-\\det\\begin{bmatrix}1&0\\\\1&2\\end{bmatrix}=-2$. Logo a entrada é $-\\frac28=-\\frac14$."}},{"s":"block-triangular-det","sub":"la","d":"medium","r":1280,"c":["la-det","la-special"],"g":"original","t":"Block Triangular","q":"Compute $$\\det\\begin{bmatrix}2&1&7&-3\\\\1&2&4&9\\\\0&0&1&5\\\\0&0&2&8\\end{bmatrix}.$$","h":"$\\det\\begin{bmatrix}A&B\\\\0&D\\end{bmatrix}=\\det A\\cdot\\det D$.","x":"The diagonal blocks have determinants $4-1=3$ and $8-10=-2$. The determinant is $-6$; the top-right block doesn't matter.","at":"-6","k":"MC42LQ==","pt":{"t":"Triangular por Blocos","q":"Calcule $$\\det\\begin{bmatrix}2&1&7&-3\\\\1&2&4&9\\\\0&0&1&5\\\\0&0&2&8\\end{bmatrix}.$$","h":"$\\det\\begin{bmatrix}A&B\\\\0&D\\end{bmatrix}=\\det A\\cdot\\det D$.","x":"Os blocos diagonais têm determinantes $4-1=3$ e $8-10=-2$. O determinante é $-6$; o bloco do canto superior direito não interessa."}},{"s":"sum-of-indices-det","sub":"la","d":"medium","r":1200,"c":["la-det","la-nulcol"],"g":"original","t":"Entries i + j","q":"Let $A$ be the $5\\times5$ matrix with $a_{ij}=i+j$. Find $\\det A$.","h":"Every row is a combination of $(1,1,1,1,1)$ and $(1,2,3,4,5)$.","x":"Row $i$ equals $i\\cdot(1,\\dots,1)+(1,2,\\dots,5)$, so the rank is at most $2<5$ and $\\det A=0$.","at":"0","k":"MC4w","pt":{"t":"Entradas i + j","q":"Seja $A$ a matriz $5\\times5$ com $a_{ij}=i+j$. Determine $\\det A$.","h":"Todas as linhas são combinações de $(1,1,1,1,1)$ e $(1,2,3,4,5)$.","x":"A linha $i$ é $i\\cdot(1,\\dots,1)+(1,2,\\dots,5)$, logo a característica é no máximo $2<5$ e $\\det A=0$."}},{"s":"circulant-three","sub":"la","d":"medium","r":1480,"c":["la-det","la-special"],"g":"original","t":"Circulant","q":"Compute $$\\det\\begin{bmatrix}1&2&3\\\\3&1&2\\\\2&3&1\\end{bmatrix}.$$","h":"Add all columns to the first: every entry there becomes $6$.","x":"After adding the columns to the first, factor out $6$: $6\\det\\begin{bmatrix}1&2&3\\\\1&1&2\\\\1&3&1\\end{bmatrix}=6\\cdot3=18$. (In general this circulant has determinant $a^3+b^3+c^3-3abc$.)","at":"18","k":"MC44MQ==","pt":{"t":"Circulante","q":"Calcule $$\\det\\begin{bmatrix}1&2&3\\\\3&1&2\\\\2&3&1\\end{bmatrix}.$$","h":"Some todas as colunas à primeira: todas as entradas dela passam a $6$.","x":"Depois de somar as colunas à primeira, ponha $6$ em evidência: $6\\det\\begin{bmatrix}1&2&3\\\\1&1&2\\\\1&3&1\\end{bmatrix}=6\\cdot3=18$. (Em geral, esta circulante tem determinante $a^3+b^3+c^3-3abc$.)"}},{"s":"count-invertible-binary","sub":"la","d":"medium","r":1350,"c":["la-det"],"g":"original","t":"Invertible Zero-One Matrices","q":"How many $2\\times2$ matrices with every entry in $\\{0,1\\}$ are invertible?","h":"$ad-bc\\ne0$ with each of $ad$, $bc$ equal to $0$ or $1$.","x":"Either $ad=1$ and $bc=0$ ($a=d=1$, and $3$ choices of $(b,c)$), or $ad=0$ and $bc=1$ (another $3$). That makes $6$ out of $16$.","at":"6","k":"MC42","pt":{"t":"Matrizes de Zeros e Uns Invertíveis","q":"Quantas matrizes $2\\times2$ com todas as entradas em $\\{0,1\\}$ são invertíveis?","h":"$ad-bc\\ne0$ com cada um de $ad$, $bc$ igual a $0$ ou $1$.","x":"Ou $ad=1$ e $bc=0$ ($a=d=1$, e $3$ escolhas de $(b,c)$), ou $ad=0$ e $bc=1$ (outras $3$). São $6$ das $16$."}},{"s":"min-matrix-det","sub":"la","d":"hard","r":1650,"c":["la-det","la-special"],"g":"original","t":"Entries min(i, j)","q":"Let $A$ be the $10\\times10$ matrix with $a_{ij}=\\min(i,j)$. Find $\\det A$.","h":"Subtract each row from the one below it, starting at the bottom.","x":"Row $i$ is $(1,2,\\dots,i,i,\\dots,i)$. Replacing row $i$ by row $i$ minus row $i-1$ (from the bottom up) gives rows $(0,\\dots,0,1,1,\\dots,1)$ starting at column $i$: an upper triangular matrix of ones. The determinant is $1$.","at":"1","k":"MC4x","pt":{"t":"Entradas min(i, j)","q":"Seja $A$ a matriz $10\\times10$ com $a_{ij}=\\min(i,j)$. Determine $\\det A$.","h":"Subtraia cada linha à de baixo, começando pelo fundo.","x":"A linha $i$ é $(1,2,\\dots,i,i,\\dots,i)$. Substituindo a linha $i$ pela linha $i$ menos a linha $i-1$ (de baixo para cima) obtêm-se linhas $(0,\\dots,0,1,1,\\dots,1)$ a começar na coluna $i$: uma matriz triangular superior de uns. O determinante é $1$."}},{"s":"distance-matrix-det","sub":"la","d":"hard","r":1900,"c":["la-det","la-special"],"g":"original","t":"Entries |i − j|","q":"Let $A$ be the $5\\times5$ matrix with $a_{ij}=|i-j|$. Find $\\det A$.","h":"Replace row $i$ by row $i$ minus row $i+1$ for $i=1,\\dots,4$; the new rows are mostly $\\pm1$.","x":"After $L_i\\to L_i-L_{i+1}$, row $i$ ($i\\le4$) is $(-1,\\dots,-1,1,\\dots,1)$ with the sign change after column $i$. Adding the last column to the others then makes the matrix triangular up to the last row. Carrying it through gives $(-1)^{n-1}(n-1)2^{n-2}$, which for $n=5$ is $4\\cdot8=32$.","at":"32","k":"MC4yMw==","pt":{"t":"Entradas |i − j|","q":"Seja $A$ a matriz $5\\times5$ com $a_{ij}=|i-j|$. Determine $\\det A$.","h":"Substitua a linha $i$ pela lin
