le $$\\sum_{n=1}^{\\infty}\\arctan\\frac{2}{n^2}.$$","h":"$\\frac{2}{n^2}=\\frac{(n+1)-(n-1)}{1+(n+1)(n-1)}$.","x":"Logo $\\arctan\\frac2{n^2}=\\arctan(n+1)-\\arctan(n-1)$. A soma parcial é telescópica e dá $\\arctan N+\\arctan(N+1)-\\arctan0-\\arctan1\\to\\frac\\pi2+\\frac\\pi2-\\frac\\pi4=\\frac{3\\pi}{4}$."}},{"s":"feynmans-log-quotient","t":"Feynman's Log Quotient","d":"imo","r":2400,"c":["improper","exp-log"],"q":"Evaluate $$\\int_0^1\\frac{x-1}{\\ln x}\\,dx.$$","k":"MzU0OTk1NTA4MTc0MTM5Ni4w","at":"\\ln2","h":"Study $F(t)=\\int_0^1\\frac{x^t-1}{\\ln x}dx$ and differentiate in $t$.","x":"$F'(t)=\\int_0^1x^t\\,dx=\\frac{1}{t+1}$ and $F(0)=0$, so $F(t)=\\ln(t+1)$ and $F(1)=\\ln2$.","g":"original","pt":{"t":"O Quociente Logarítmico de Feynman","q":"Calcule $$\\int_0^1\\frac{x-1}{\\ln x}\\,dx.$$","h":"Estude $F(t)=\\int_0^1\\frac{x^t-1}{\\ln x}dx$ e derive em ordem a $t$.","x":"$F'(t)=\\int_0^1x^t\\,dx=\\frac{1}{t+1}$ e $F(0)=0$, logo $F(t)=\\ln(t+1)$ e $F(1)=\\ln2$."}},{"s":"max-in-the-exponent","t":"Max in the Exponent","d":"imo","r":2400,"c":["double-integrals"],"q":"Evaluate $$\\int_0^1\\!\\int_0^2e^{\\max(4x^2,\\,y^2)}\\,dy\\,dx.$$","k":"ODExMjc1NjEwNTcwOTk3LjYy","at":"\\tfrac{e^4-1}{2}","h":"Split the rectangle along the curve where $4x^2=y^2$, i.e. $y=2x$. On each piece one variable's integral is elementary.","x":"Where $y<2x$ the integrand is $e^{4x^2}$; integrating in $y$ first gives $\\int_0^12xe^{4x^2}dx=\\frac{e^4-1}{4}$. Where $y>2x$ it is $e^{y^2}$; integrating in $x$ first gives $\\int_0^2\\frac y2e^{y^2}dy=\\frac{e^4-1}{4}$. Total: $\\frac{e^4-1}{2}\\approx26.80$.","g":"olympiad","src":"Putnam 1989 A2 (with a = 1, b = 2)","pt":{"t":"Máximo no Expoente","q":"Calcule $$\\int_0^1\\!\\int_0^2e^{\\max(4x^2,\\,y^2)}\\,dy\\,dx.$$","h":"Divida o retângulo ao longo da curva onde $4x^2=y^2$, isto é, $y=2x$. Em cada parte, o integral numa das variáveis é elementar.","x":"Onde $y<2x$ a função integranda é $e^{4x^2}$; integrando primeiro em $y$ obtém-se $\\int_0^12xe^{4x^2}dx=\\frac{e^4-1}{4}$. Onde $y>2x$ é $e^{y^2}$; integrando primeiro em $x$ obtém-se $\\int_0^2\\frac y2e^{y^2}dy=\\frac{e^4-1}{4}$. Total: $\\frac{e^4-1}{2}\\approx26.80$."}},{"s":"symmetric-cubic-bound","t":"Symmetric Cubic Bound","d":"imo","r":2400,"c":["inequalities","multivariable"],"q":"Let $x,y,z$ be non-negative reals with $x+y+z=1$. Find the maximum value of $$xy+yz+zx-2xyz.$$","k":"NDI5NTI5NTI5NTI5NTI5NTIuMA==","at":"\\tfrac{7}{27}","h":"Consider $(1-2x)(1-2y)(1-2z)$.","x":"$(1-2x)(1-2y)(1-2z)=1-2+4(xy+yz+zx)-8xyz$, so the expression is $\\frac{1+(1-2x)(1-2y)(1-2z)}{4}$. At most one factor can be negative. If all are positive, AM–GM bounds their product by $\\left(\\frac13\\right)^3$, giving $\\frac{1+1/27}{4}=\\frac{7}{27}$, attained at $x=y=z=\\frac13$. (The original problem: prove $0\\le xy+yz+zx-2xyz\\le\\frac7{27}$.)","g":"olympiad","src":"IMO 1984 · Problem 1","pt":{"t":"Majorante Cúbico Simétrico","q":"Sejam $x,y,z$ reais não negativos com $x+y+z=1$. Determine o valor máximo de $$xy+yz+zx-2xyz.$$","h":"Considere $(1-2x)(1-2y)(1-2z)$.","x":"$(1-2x)(1-2y)(1-2z)=1-2+4(xy+yz+zx)-8xyz$, logo a expressão é $\\frac{1+(1-2x)(1-2y)(1-2z)}{4}$. No máximo um fator pode ser negativo. Se todos forem positivos, a desigualdade das médias majora o seu produto por $\\left(\\frac13\\right)^3$, o que dá $\\frac{1+1/27}{4}=\\frac{7}{27}$, atingido em $x=y=z=\\frac13$. (O problema original: provar que $0\\le xy+yz+zx-2xyz\\le\\frac7{27}$.)"}},{"s":"weighted-log-sine","t":"Weighted Log Sine","d":"imo","r":2400,"c":["symmetry","improper"],"q":"Evaluate $$\\int_0^{\\pi}x\\ln(\\sin x)\\,dx.$$","k":"ODU1ODI5MTMyNDQ1MDI0LjMt","at":"-\\tfrac{\\pi^2}{2}\\ln2","h":"King's rule replaces $x$ by $\\frac\\pi2$. Then you need $\\int_0^\\pi\\ln\\sin x\\,dx$.","x":"With $x\\mapsto\\pi-x$, $I=\\frac\\pi2\\int_0^\\pi\\ln\\sin x\\,dx=\\frac\\pi2\\cdot(-\\pi\\ln2)=-\\frac{\\pi^2}{2}\\ln2\\approx-3.4205$.","g":"original","pt":{"t":"Logaritmo do Seno Pesado","q":"Calcule $$\\int_0^{\\pi}x\\ln(\\sin x)\\,dx.$$","h":"A regra do rei substitui $x$ por $\\frac\\pi2$. Depois precisa de $\\int_0^\\pi\\ln\\sin x\\,dx$.","x":"Com $x\\mapsto\\pi-x$, $I=\\frac\\pi2\\int_0^\\pi\\ln\\sin x\\,dx=\\frac\\pi2\\cdot(-\\pi\\ln2)=-\\frac{\\pi^2}{2}\\ln2\\approx-3.4205$."}},{"s":"bose-integral","t":"Bose Integral","d":"imo","r":2500,"c":["improper","series"],"q":"Evaluate $$\\int_0^{\\infty}\\frac{x}{e^x-1}\\,dx.$$ (It is a classical constant.)","k":"NDYyMjg0ODY2MDQzOTQ0Ni4x","at":"\\tfrac{\\pi^2}{6}","h":"$\\frac{1}{e^x-1}=\\sum_{n\\ge1}e^{-nx}$.","x":"Term by term, $\\int_0^\\infty xe^{-nx}dx=\\frac1{n^2}$, so the integral is $\\sum\\frac1{n^2}=\\frac{\\pi^2}{6}$.","g":"original","pt":{"t":"Integral de Bose","q":"Calcule $$\\int_0^{\\infty}\\frac{x}{e^x-1}\\,dx.$$ (É uma constante clássica.)","h":"$\\frac{1}{e^x-1}=\\sum_{n\\ge1}e^{-nx}$.","x":"Termo a termo, $\\int_0^\\infty xe^{-nx}dx=\\frac1{n^2}$, logo o integral é $\\sum\\frac1{n^2}=\\frac{\\pi^2}{6}$."}},{"s":"dirichlet-integral","t":"Dirichlet Integral","d":"imo","r":2500,"c":["improper","trig"],"q":"Evaluate the (conditionally convergent) integral $$\\int_0^{\\infty}\\frac{\\sin x}{x}\\,dx.$$","k":"NjY5ODQ5NzYyMzY5NzA3NS4x","at":"\\tfrac\\pi2","h":"Use $F(a)=\\int_0^\\infty e^{-ax}\\frac{\\sin x}{x}dx$ and let $a\\to0^+$.","x":"$F'(a)=-\\int_0^\\infty e^{-ax}\\sin x\\,dx=-\\frac{1}{1+a^2}$, and $F(a)\\to0$ as $a\\to\\infty$. So $F(a)=\\frac\\pi2-\\arctan a$ and, letting $a\\to0^+$, the integral is $\\frac\\pi2$.","g":"original","pt":{"t":"Integral de Dirichlet","q":"Calcule o integral (simplesmente convergente) $$\\int_0^{\\infty}\\frac{\\sin x}{x}\\,dx.$$","h":"Use $F(a)=\\int_0^\\infty e^{-ax}\\frac{\\sin x}{x}dx$ e faça $a\\to0^+$.","x":"$F'(a)=-\\int_0^\\infty e^{-ax}\\sin x\\,dx=-\\frac{1}{1+a^2}$, e $F(a)\\to0$ quando $a\\to\\infty$. Logo $F(a)=\\frac\\pi2-\\arctan a$ e, fazendo $a\\to0^+$, o integral é $\\frac\\pi2$."}},{"s":"feynmans-damped-sinc","t":"Feynman's Damped Sinc","d":"imo","r":2500,"c":["improper","trig"],"q":"Evaluate $$\\int_0^{\\infty}e^{-x}\\,\\frac{\\sin x}{x}\\,dx.$$","k":"Mzg0NDc5MzM2MTg5MzU4Ny4w","at":"\\tfrac\\pi4","h":"Consider $F(a)=\\int_0^\\infty e^{-x}\\frac{\\sin ax}{x}dx$ and differentiate in $a$.","x":"$F'(a)=\\int_0^\\infty e^{-x}\\cos ax\\,dx=\\frac{1}{1+a^2}$ and $F(0)=0$, so $F(a)=\\arctan a$ and $F(1)=\\frac\\pi4$.","g":"original","pt":{"t":"O Sinc Amortecido de Feynman","q":"Calcule $$\\int_0^{\\infty}e^{-x}\\,\\frac{\\sin x}{x}\\,dx.$$","h":"Considere $F(a)=\\int_0^\\infty e^{-x}\\frac{\\sin ax}{x}dx$ e derive em ordem a $a$.","x":"$F'(a)=\\int_0^\\infty e^{-x}\\cos ax\\,dx=\\frac{1}{1+a^2}$ e $F(0)=0$, logo $F(a)=\\arctan a$ e $F(1)=\\frac\\pi4$."}},{"s":"four-fractions","t":"Four Fractions","d":"imo","r":2500,"c":["inequalities","continuity"],"q":"Determine all possible values of $$S=\\frac{a}{a+b+d}+\\frac{b}{a+b+c}+\\frac{c}{b+c+d}+\\frac{d}{a+c+d}$$ where $a,b,c,d$ are arbitrary positive real numbers.","k":"MC4z","at":"3","h":"Bound $S$ below by enlarging every denominator to $a+b+c+d$, and above by pairing terms.","x":"Each denominator is less than $a+b+c+d$, so $S>1$. Shrinking denominators pairwise, $\\frac{a}{a+b+d}+\\frac{b}{a+b+c}<\\frac{a}{a+b}+\\frac{b}{a+b}=1$ and similarly for the other pair, so $S<2$. Continuity plus examples approaching both ends (e.g. $a=b=t,c=d=1$ with $t\\to0$ or $\\infty$, and $a=c\\to0$) show every value in $(1,2)$ occurs. The set is $(1,2)$, so $p+q=3$.","g":"olympiad","src":"IMO 1974 · Problem 5","ask":"The set of values is an open interval $(p,q)$. Enter $p+q$.","pt":{"t":"Quatro Frações","q":"Determine todos os valores possíveis de $$S=\\frac{a}{a+b+d}+\\frac{b}{a+b+c}+\\frac{c}{b+c+d}+\\frac{d}{a+c+d}$$ onde $a,b,c,d$ são números reais positivos arbitrários.","h":"Minore $S$ aumentando todos os denominadores para $a+b+c+d$, e majore-a agrupando os termos aos pares.","x":"Cada denominador é menor do que $a+b+c+d$, logo $S>1$. Diminuindo os denominadores aos pares, $\\frac{a}{a+b+d}+\\frac{b}{a+b+c}<\\frac{a}{a+b}+\\frac{b}{a+b}=1$ e analogamente para o outro par, logo $S<2$. A continuidade, junto com exemplos que se aproximam dos dois extremos (por exemplo $a=b=t,c=d=1$ com $t\\to0$ ou $\\infty$, e $a=c\\to0$), mostra que todos os valores de $\\mathopen{]}1,2\\mathclose{[}$ ocorrem. O conjunto é $\\mathopen{]}1,2\\mathclose{[}$, logo $p+q=3$.","ask":"O conjunto dos valores é um intervalo aberto $\\mathopen{]}p,q\\mathclose{[}$. Introduza $p+q$."}},{"s":"frullanis-arctangent","t":"Frullani's Arctangent","d":"imo","r":2500,"c":["improper","double-integrals","trig"],"q":"Evaluate $$\\int_0^{\\infty}\\frac{\\arctan(\\pi x)-\\arctan x}{x}\\,dx.$$","k":"Mjk3NTQ2ODk5NDczMTg5Ny4x","at":"\\tfrac\\pi2\\ln\\pi","h":"Write the numerator as $\\int_1^\\pi\\frac{x}{1+t^2x^2}\\,dt$ and swap the order.","x":"$\\frac{\\arctan(\\pi x)-\\arctan x}{x}=\\int_1^\\pi\\frac{dt}{1+t^2x^2}$. Swapping, $\\int_1^\\pi\\int_0^\\infty\\frac{dx}{1+t^2x^2}\\,dt=\\int_1^\\pi\\frac{\\pi}{2t}\\,dt=\\frac\\pi2\\ln\\pi\\approx1.7981$.","g":"olympiad","src":"Putnam 1982 A3","pt":{"t":"O Arco-Tangente de Frullani","q":"Calcule $$\\int_0^{\\infty}\\frac{\\arctan(\\pi x)-\\arctan x}{x}\\,dx.$$","h":"Escreva o numerador como $\\int_1^\\pi\\frac{x}{1+t^2x^2}\\,dt$ e troque a ordem.","x":"$\\frac{\\arctan(\\pi x)-\\arctan x}{x}=\\int_1^\\pi\\frac{dt}{1+t^2x^2}$. Trocando a ordem, $\\int_1^\\pi\\int_0^\\infty\\frac{dx}{1+t^2x^2}\\,dt=\\int_1^\\pi\\frac{\\pi}{2t}\\,dt=\\frac\\pi2\\ln\\pi\\approx1.7981$."}},{"s":"palindromic-quartic","t":"Palindromic Quartic","d":"imo","r":2550,"c":["optimization","roots"],"q":"Let $a$ and $b$ be real numbers for which the equation $$x^4+ax^3+bx^2+ax+1=0$$ has at least one real solution. Over all such pairs $(a,b)$, find the least possible value of $a^2+b^2$.","k":"OC4w","at":"\\tfrac45","h":"Divide by $x^2$ and set $t=x+\\frac1x$, so $|t|\\ge2$.","x":"The equation becomes $t^2+at+b-2=0$ with $|t|\\ge2$. For fixed $t$, $(a,b)$ lies on a line, and the distance from the origin gives $a^2+b^2\\ge\\frac{(t^2-2)^2}{t^2+1}$. With $s=t^2\\ge4$, $\\frac{(s-2)^2}{s+1}$ increases in $s$, so the minimum is at $s=4$: $\\frac45$. It is attained, e.g., by $a=-\\frac45$, $b=-\\frac25$ with root $x=1$.","g":"olympiad","src":"IMO 1973 · Problem 3","pt":{"t":"Quártica Palindrómica","q":"Sejam $a$ e $b$ números reais para os quais a equação $$x^4+ax^3+bx^2+ax+1=0$$ tem pelo menos uma solução real. Sobre todos estes pares $(a,b)$, determine o menor valor possível de $a^2+b^2$.","h":"Divida por $x^2$ e faça $t=x+\\frac1x$, de modo que $|t|\\ge2$.","x":"A equação passa a $t^2+at+b-2=0$ com $|t|\\ge2$. Para $t$ fixo, $(a,b)$ está numa reta, e a distância à origem dá $a^2+b^2\\ge\\frac{(t^2-2)^2}{t^2+1}$. Com $s=t^2\\ge4$, $\\frac{(s-2)^2}{s+1}$ é crescente em $s$, logo o mínimo é em $s=4$: $\\frac45$. É atingido, por exemplo, por $a=-\\frac45$, $b=-\\frac25$, com raiz $x=1$."}},{"s":"cosine-products","t":"Cosine Products","d":"imo","r":2600,"c":["integrals","trig"],"q":"For which integers $m$ with $1\\le m\\le10$ is $$I_m=\\int_0^{2\\pi}\\cos x\\,\\cos2x\\,\\cos3x\\cdots\\cos mx\\,dx$$ nonzero?","k":"MC40","at":"4","h":"Write each cosine as $\\frac{e^{ikx}+e^{-ikx}}{2}$. The integral is nonzero exactly when some choice of signs makes $\\pm1\\pm2\\pm\\cdots\\pm m=0$.","x":"Expanding, $I_m=\\frac{2\\pi}{2^m}\\cdot\\#\\{\\text{sign choices with }\\pm1\\pm2\\cdots\\pm m=0\\}$. A zero sum needs $1+2+\\dots+m=\\frac{m(m+1)}{2}$ even, i.e. $m\\equiv0,3\\pmod4$, and then it is achievable. In $1..10$: $m=3,4,7,8$. Answer: $4$ values.","g":"olympiad","src":"Putnam 1985 A5","ask":"Enter how many such $m$ there are.","pt":{"t":"Produtos de Cossenos","q":"Para que inteiros $m$ com $1\\le m\\le10$ é $$I_m=\\int_0^{2\\pi}\\cos x\\,\\cos2x\\,\\cos3x\\cdots\\cos mx\\,dx$$ não nulo?","h":"Escreva cada cosseno como $\\frac{e^{ikx}+e^{-ikx}}{2}$. O integral é não nulo exatamente quando alguma escolha de sinais torna $\\pm1\\pm2\\pm\\cdots\\pm m=0$.","x":"Desenvolvendo, $I_m=\\frac{2\\pi}{2^m}\\cdot\\#\\{\\text{escolhas de sinais com }\\pm1\\pm2\\cdots\\pm m=0\\}$. Uma soma nula exige que $1+2+\\dots+m=\\frac{m(m+1)}{2}$ seja par, isto é, $m\\equiv0,3\\pmod4$, e nesse caso é possível. Em $1..10$: $m=3,4,7,8$. Resposta: $4$ valores.","ask":"Introduza quantos valores de $m$ há."}},{"s":"cubes-under-a-constraint","t":"Cubes Under a Constraint","d":"imo","r":2600,"c":["inequalities"],"q":"Let $a,b,c$ be positive reals with $abc=1$. Find the minimum value of $$\\frac{1}{a^3(b+c)}+\\frac{1}{b^3(c+a)}+\\frac{1}{c^3(a+b)}.$$","k":"NS4x","at":"\\tfrac32","h":"Substitute $x=\\frac1a$, $y=\\frac1b$, $z=\\frac1c$ so that $xyz=1$.","x":"With $x=\\frac1a$ etc., the first term is $\\frac{x^3}{\\frac1y+\\frac1z}=\\frac{x^2}{y+z}$ (using $xyz=1$). By Cauchy–Schwarz, $\\sum\\frac{x^2}{y+z}\\ge\\frac{(x+y+z)^2}{2(x+y+z)}=\\frac{x+y+z}{2}\\ge\\frac{3}{2}$ by AM–GM. Equality at $a=b=c=1$. (The original problem: prove the sum is at least $\\frac32$.)","g":"olympiad","src":"IMO 1995 · Problem 2","pt":{"t":"Cubos Sob uma Restrição","q":"Sejam $a,b,c$ reais positivos com $abc=1$. Determine o valor mínimo de $$\\frac{1}{a^3(b+c)}+\\frac{1}{b^3(c+a)}+\\frac{1}{c^3(a+b)}.$$","h":"Substitua $x=\\frac1a$, $y=\\frac1b$, $z=\\frac1c$, de modo que $xyz=1$.","x":"Com $x=\\frac1a$, etc., o primeiro termo é $\\frac{x^3}{\\frac1y+\\frac1z}=\\frac{x^2}{y+z}$ (usando $xyz=1$). Pela desigualdade de Cauchy–Schwarz, $\\sum\\frac{x^2}{y+z}\\ge\\frac{(x+y+z)^2}{2(x+y+z)}=\\frac{x+y+z}{2}\\ge\\frac{3}{2}$ pela desigualdade das médias. Igualdade em $a=b=c=1$. (O problema original: provar que a soma é pelo menos $\\frac32$.)"}},{"s":"cyclic-product","t":"Cyclic Product","d":"imo","r":2600,"c":["inequalities"],"q":"Let $a,b,c$ be positive reals with $abc=1$. Find the maximum value of $$\\left(a-1+\\frac1b\\right)\\left(b-1+\\frac1c\\right)\\left(c-1+\\frac1a\\right).$$","k":"MC4x","at":"1","h":"Write $a=\\frac xy$, $b=\\frac yz$, $c=\\frac zx$.","x":"With that substitution the product becomes $\\frac{(x-y+z)(y-z+x)(z-x+y)}{xyz}$. At most one factor is negative; if one is, the product is negative. Otherwise pair them: $(x-y+z)(x+y-z)=x^2-(y-z)^2\\le x^2$. Multiplying the three cyclic versions, the square of the product is at most $(xyz)^2$, so the product is at most $xyz$. The maximum $1$ is attained at $a=b=c=1$. (The original problem: prove the product is at most $1$.)","g":"olympiad","src":"IMO 2000 · Problem 2","pt":{"t":"Produto Cíclico","q":"Sejam $a,b,c$ reais positivos com $abc=1$. Determine o valor máximo de $$\\left(a-1+\\frac1b\\right)\\left(b-1+\\frac1c\\right)\\left(c-1+\\frac1a\\right).$$","h":"Escreva $a=\\frac xy$, $b=\\frac yz$, $c=\\frac zx$.","x":"Com essa substituição, o produto passa a $\\frac{(x-y+z)(y-z+x)(z-x+y)}{xyz}$. No máximo um fator é negativo; se houver um, o produto é negativo. Caso contrário, agrupe-os aos pares: $(x-y+z)(x+y-z)=x^2-(y-z)^2\\le x^2$. Multiplicando as três versões cíclicas, o quadrado do produto é no máximo $(xyz)^2$, logo o produto é no máximo $xyz$. O máximo $1$ é atingido em $a=b=c=1$. (O problema original: provar que o produto é no máximo $1$.)"}},{"s":"scaling-functional-equation","t":"Scaling Functional Equation","d":"imo","r":2600,"c":["functional","limits"],"q":"Find all functions $f$ from the positive reals to the positive reals such that $$f\\big(xf(y)\\big)=yf(x)\\quad\\text{for all }x,y>0,$$ and $f(x)\\to0$ as $x\\to\\infty$.","k":"Mi4w","at":"\\tfrac15","h":"Show $f(1)=1$ and that $f$ is an involution. Then consider a fixed point $a=xf(x)$.","x":"Every $a=xf(x)$ is a fixed point, fixed points are closed under products and reciprocals, and a fixed point $a>1$ would give $f(a^n)=a^n\\not\\to0$. A fixed point $a<1$ gives the fixed point $\\frac1a>1$. So the only fixed point is $1$, hence $xf(x)=1$ and $f(x)=\\frac1x$. The submitted value is $f(5)=\\frac15$.","g":"olympiad","src":"IMO 1983 · Problem 1","ask":"There is exactly one such function. Enter $f(5)$.","pt":{"t":"Equação Funcional de Escala","q":"Determine todas as funções $f$ dos reais positivos nos reais positivos tais que $$f\\big(xf(y)\\big)=yf(x)\\quad\\text{para todos os }x,y>0,$$ e $f(x)\\to0$ quando $x\\to\\infty$.","h":"Mostre que $f(1)=1$ e que $f$ é uma involução. Depois considere um ponto fixo $a=xf(x)$.","x":"Todo o $a=xf(x)$ é ponto fixo, os pontos fixos são fechados para produtos e inversos, e um ponto fixo $a>1$ daria $f(a^n)=a^n\\not\\to0$. Um ponto fixo $a<1$ dá o ponto fixo $\\frac1a>1$. Logo o único ponto fixo é $1$, portanto $xf(x)=1$ e $f(x)=\\frac1x$. O valor a submeter é $f(5)=\\frac15$.","ask":"Existe exatamente uma função nestas condições. Introduza $f(5)$."}},{"s":"sophomores-dream","t":"Sophomore's Dream","d":"imo","r":2600,"c":["taylor","ibp","series"],"q":"Evaluate $$\\int_0^1x^{-x}\\,dx$$ to at least four significant figures. (Hint: the answer is also the value of a strikingly simple series.)","k":"NjM2NjI2MDc5OTU4MjE5Mi4x","at":"\\sum_{n\\ge1}n^{-n}\\approx1.29129","h":"$x^{-x}=e^{-x\\ln x}=\\sum\\frac{(-x\\ln x)^n}{n!}$, and $\\int_0^1x^n\\ln^nx\\,dx$ has a closed form.","x":"Integrating by parts $n$ times, $\\int_0^1x^n(-\\ln x)^n\\,dx=\\frac{n!}{(n+1)^{n+1}}$. So the integral equals $\\sum_{n\\ge0}\\frac{1}{(n+1)^{n+1}}=\\sum_{n\\ge1}n^{-n}=1.29128\\ldots$","g":"original","ask":"Enter the value to at least four significant figures.","pt":{"t":"O Sonho do Segundo Ano","q":"Calcule $$\\int_0^1x^{-x}\\,dx$$ com pelo menos quatro algarismos significativos. (Sugestão: a resposta é também o valor de uma série surpreendentemente simples.)","h":"$x^{-x}=e^{-x\\ln x}=\\sum\\frac{(-x\\ln x)^n}{n!}$, e $\\int_0^1x^n\\ln^nx\\,dx$ tem uma forma fechada.","x":"Primitivando por partes $n$ vezes, $\\int_0^1x^n(-\\ln x)^n\\,dx=\\frac{n!}{(n+1)^{n+1}}$. Logo o integral é igual a $\\sum_{n\\ge0}\\frac{1}{(n+1)^{n+1}}=\\sum_{n\\ge1}n^{-n}=1.29128\\ldots$","ask":"Introduza o valor com pelo menos quatro algarismos significativos."}},{"s":"squares-off-by-one","t":"Squares Off by One","d":"imo","r":2600,"c":["inequalities"],"q":"Let $x,y,z$ be real numbers, each different from $1$, with $xyz=1$. Find the minimum value of $$\\frac{x^2}{(x-1)^2}+\\frac{y^2}{(y-1)^2}+\\frac{z^2}{(z-1)^2}.$$","k":"MC4x","at":"1","h":"Set $a=\\frac{x}{x-1}$ and so on. Translate $xyz=1$ into a relation among $a,b,c$.","x":"With $a=\\frac{x}{x-1}$, $b=\\frac{y}{y-1}$, $c=\\frac{z}{z-1}$ we have $x=\\frac{a}{a-1}$, and $xyz=1$ becomes $abc=(a-1)(b-1)(c-1)$, i.e. $ab+bc+ca=a+b+c-1$. Then $a^2+b^2+c^2=(a+b+c)^2-2(a+b+c)+2=(a+b+c-1)^2+1\\ge1$. Equality is achievable (infinitely many rational triples), so the minimum is $1$.","g":"olympiad","src":"IMO 2008 · Problem 2","pt":{"t":"Quadrados Desfasados de Um","q":"Sejam $x,y,z$ números reais, todos diferentes de $1$, com $xyz=1$. Determine o valor mínimo de $$\\frac{x^2}{(x-1)^2}+\\frac{y^2}{(y-1)^2}+\\frac{z^2}{(z-1)^2}.$$","h":"Faça $a=\\frac{x}{x-1}$, e assim por diante. Traduza $xyz=1$ numa relação entre $a,b,c$.","x":"Com $a=\\frac{x}{x-1}$, $b=\\frac{y}{y-1}$, $c=\\frac{z}{z-1}$ tem-se $x=\\frac{a}{a-1}$, e $xyz=1$ passa a $abc=(a-1)(b-1)(c-1)$, isto é, $ab+bc+ca=a+b+c-1$. Então $a^2+b^2+c^2=(a+b+c)^2-2(a+b+c)+2=(a+b+c-1)^2+1\\ge1$. A igualdade é atingível (há uma infinidade de ternos racionais), logo o mínimo é $1$."}},{"s":"unit-square-series","t":"Unit Square Series","d":"imo","r":2600,"c":["double-integrals","series"],"q":"Evaluate $$\\int_0^1\\!\\int_0^1\\frac{dx\\,dy}{1-xy}.$$ (It is a classical constant.)","k":"NDYyMjg0ODY2MDQzOTQ0Ni4x","at":"\\tfrac{\\pi^2}{6}","h":"Expand $\\frac{1}{1-xy}$ as a geometric series and integrate term by term.","x":"$\\frac1{1-xy}=\\sum_{n\\ge0}(xy)^n$, and $\\iint x^ny^n=\\frac1{(n+1)^2}$. So the integral is $\\sum\\frac1{n^2}=\\frac{\\pi^2}{6}\\approx1.6449$.","g":"original","pt":{"t":"Série no Quadrado Unitário","q":"Calcule $$\\int_0^1\\!\\int_0^1\\frac{dx\\,dy}{1-xy}.$$ (É uma constante clássica.)","h":"Desenvolva $\\frac{1}{1-xy}$ em série geométrica e integre termo a termo.","x":"$\\frac1{1-xy}=\\sum_{n\\ge0}(xy)^n$, e $\\iint x^ny^n=\\frac1{(n+1)^2}$. Logo o integral é $\\sum\\frac1{n^2}=\\frac{\\pi^2}{6}\\approx1.6449$."}},{"s":"binomial-coefficient-integral","t":"Binomial Coefficient Integral","d":"imo","r":2700,"c":["series","integrals"],"q":"For real $\\alpha$, let $C(\\alpha)$ be the coefficient of $x^{1992}$ in the power series expansion of $(1+x)^{\\alpha}$ about $x=0$. Evaluate $$\\int_0^1C(-y-1)\\left(\\frac{1}{y+1}+\\frac{1}{y+2}+\\cdots+\\frac{1}{y+1992}\\right)dy.$$","k":"MC4yOTkx","at":"1992","h":"Write $C(-y-1)$ as a product. Then notice the sum is a logarithmic derivative.","x":"$C(-y-1)=\\binom{-y-1}{1992}=\\frac{(y+1)(y+2)\\cdots(y+1992)}{1992!}$. The sum of reciprocals is its logarithmic derivative, so the integrand is $\\frac{d}{dy}\\frac{(y+1)\\cdots(y+1992)}{1992!}$. The integral is $\\frac{1993!-1992!}{1992!}=1992$.","g":"olympiad","src":"Putnam 1992 A2","pt":{"t":"Integral de um Coeficiente Binomial","q":"Para $\\alpha$ real, seja $C(\\alpha)$ o coeficiente de $x^{1992}$ no desenvolvimento em série de potências de $(1+x)^{\\alpha}$ em torno de $x=0$. Calcule $$\\int_0^1C(-y-1)\\left(\\frac{1}{y+1}+\\frac{1}{y+2}+\\cdots+\\frac{1}{y+1992}\\right)dy.$$","h":"Escreva $C(-y-1)$ como um produto. Depois repare que a soma é uma derivada logarítmica.","x":"$C(-y-1)=\\binom{-y-1}{1992}=\\frac{(y+1)(y+2)\\cdots(y+1992)}{1992!}$. A soma dos inversos é a sua derivada logarítmica, logo a função integranda é $\\frac{d}{dy}\\frac{(y+1)\\cdots(y+1992)}{1992!}$. O integral é $\\frac{1993!-1992!}{1992!}=1992$."}},{"s":"exactly-one-partner","t":"Exactly One Partner","d":"imo","r":2700,"c":["functional","inequalities"],"q":"Find all functions $f$ from the positive reals to the positive reals such that for every $x>0$ there is exactly one $y>0$ satisfying $$xf(y)+yf(x)\\le2.$$","k":"NTIuMA==","at":"\\tfrac14","h":"Show the partner of $x$ must be $x$ itself. That gives $xf(x)\\le1$. Then rule out strict inequality.","x":"If the partner $y$ of $x$ differed from $x$, then neither $x$ nor $y$ would be its own partner, so $xf(x)>1$ and $yf(y)>1$; but then $xf(y)+yf(x)\\ge2\\sqrt{xf(x)\\,yf(y)}>2$, a contradiction. So each $x$ is its own partner and $xf(x)\\le1$ for all $x$. If $xf(x)<1$ for some $x$, then for $y$ close to $x$ we get $xf(y)+yf(x)\\le\\frac xy+yf(x)$, which is close to $1+xf(x)<2$, giving a second partner. Hence $f(x)=\\frac1x$, which works since $\\frac xy+\\frac yx\\le2$ only for $y=x$. The submitted value is $f(4)=\\frac14$.","g":"olympiad","src":"IMO 2022 · Problem 2","ask":"There is exactly one such function. Enter $f(4)$.","pt":{"t":"Exatamente Um Par","q":"Determine todas as funções $f$ dos reais positivos nos reais positivos tais que, para todo o $x>0$, existe exatamente um $y>0$ que satisfaz $$xf(y)+yf(x)\\le2.$$","h":"Mostre que o par de $x$ tem de ser o próprio $x$. Isso dá $xf(x)\\le1$. Depois exclua a desigualdade estrita.","x":"Se o par $y$ de $x$ fosse diferente de $x$, então nem $x$ nem $y$ seriam o seu próprio par, logo $xf(x)>1$ e $yf(y)>1$; mas então $xf(y)+yf(x)\\ge2\\sqrt{xf(x)\\,yf(y)}>2$, uma contradição. Logo cada $x$ é o seu próprio par e $xf(x)\\le1$ para todo o $x$. Se $xf(x)<1$ para algum $x$, então para $y$ perto de $x$ obtém-se $xf(y)+yf(x)\\le\\frac xy+yf(x)$, que está perto de $1+xf(x)<2$, o que dá um segundo par. Portanto $f(x)=\\frac1x$, que funciona porque $\\frac xy+\\frac yx\\le2$ só para $y=x$. O valor a submeter é $f(4)=\\frac14$.","ask":"Existe exatamente uma função nestas condições. Introduza $f(4)$."}},{"s":"square-roots-sum","t":"Square Roots Sum","d":"imo","r":2700,"c":["inequalities","convexity"],"q":"Find the minimum value of $$\\frac{a}{\\sqrt{a^2+8bc}}+\\frac{b}{\\sqrt{b^2+8ca}}+\\frac{c}{\\sqrt{c^2+8ab}}$$ over all positive reals $a,b,c$.","k":"MC4x","at":"1","h":"Look for an exponent $r$ with $\\frac{a}{\\sqrt{a^2+8bc}}\\ge\\frac{a^r}{a^r+b^r+c^r}$.","x":"The tangent-line trick gives $\\frac{a}{\\sqrt{a^2+8bc}}\\ge\\frac{a^{4/3}}{a^{4/3}+b^{4/3}+c^{4/3}}$ (equivalent, after squaring and AM–GM, to $(a^{4/3}+b^{4/3}+c^{4/3})^2-a^{8/3}\\ge8a^{2/3}bc$). Summing the three bounds gives at least $1$, with equality at $a=b=c$. (The original problem: prove the sum is at least $1$.)","g":"olympiad","src":"IMO 2001 · Problem 2","pt":{"t":"Soma de Raízes Quadradas","q":"Determine o valor mínimo de $$\\frac{a}{\\sqrt{a^2+8bc}}+\\frac{b}{\\sqrt{b^2+8ca}}+\\frac{c}{\\sqrt{c^2+8ab}}$$ sobre todos os reais positivos $a,b,c$.","h":"Procure um expoente $r$ com $\\frac{a}{\\sqrt{a^2+8bc}}\\ge\\frac{a^r}{a^r+b^r+c^r}$.","x":"O truque da reta tangente dá $\\frac{a}{\\sqrt{a^2+8bc}}\\ge\\frac{a^{4/3}}{a^{4/3}+b^{4/3}+c^{4/3}}$ (equivalente, depois de elevar ao quadrado e usar a desigualdade das médias, a $(a^{4/3}+b^{4/3}+c^{4/3})^2-a^{8/3}\\ge8a^{2/3}bc$). Somando as três minorações obtém-se pelo menos $1$, com igualdade em $a=b=c$. (O problema original: provar que a soma é pelo menos $1$.)"}},{"s":"e-times-factorial","t":"e Times Factorial","d":"imo","r":2700,"c":["series","limits","taylor"],"q":"Evaluate $$\\lim_{n\\to\\infty}n\\sin\\left(2\\pi e\\,n!\\right).$$","k":"Njg1OTcxNzAzNTgxMzgyLjY=","at":"2\\pi","h":"Write $e\\,n!$ using $e=\\sum\\frac1{k!}$: it is an integer plus a small tail.","x":"$e\\,n!=\\sum_{k\\le n}\\frac{n!}{k!}+\\frac{1}{n+1}+\\frac{1}{(n+1)(n+2)}+\\cdots$, where the first part is an integer. The tail is $\\frac1n+O\\!\\left(\\frac1{n^2}\\right)$. So $\\sin(2\\pi en!)=\\sin\\left(\\frac{2\\pi}{n}+O(n^{-2})\\right)$ and $n\\sin(\\cdot)\\to2\\pi$.","g":"original","pt":{"t":"e Vezes Fatorial","q":"Calcule $$\\lim_{n\\to\\infty}n\\sin\\left(2\\pi e\\,n!\\right).$$","h":"Escreva $e\\,n!$ usando $e=\\sum\\frac1{k!}$: é um inteiro mais uma pequena cauda.","x":"$e\\,n!=\\sum_{k\\le n}\\frac{n!}{k!}+\\frac{1}{n+1}+\\frac{1}{(n+1)(n+2)}+\\cdots$, onde a primeira parte é um inteiro. A cauda é $\\frac1n+O\\!\\left(\\frac1{n^2}\\right)$. Logo $\\sin(2\\pi en!)=\\sin\\left(\\frac{2\\pi}{n}+O(n^{-2})\\right)$ e $n\\sin(\\cdot)\\to2\\pi$."}},{"s":"series-times-series","t":"Series Times Series","d":"imo","r":2800,"c":["series","improper","taylor"],"q":"Evaluate $$\\int_0^{\\infty}\\left(x-\\frac{x^3}{2}+\\frac{x^5}{2\\cdot4}-\\frac{x^7}{2\\cdot4\\cdot6}+\\cdots\\right)\\left(1+\\frac{x^2}{2^2}+\\frac{x^4}{2^2\\cdot4^2}+\\frac{x^6}{2^2\\cdot4^2\\cdot6^2}+\\cdots\\right)dx.$$","k":"MjgyMTAwNzA3MjEyNzg0Ni4x","at":"\\sqrt e","h":"The first factor is $xe^{-x^2/2}$. Multiply it into the second series and integrate term by term.","x":"The first factor equals $xe^{-x^2/2}$, and $\\int_0^\\infty x^{2k+1}e^{-x^2/2}dx=2^kk!$. The $k$th term of the second series is $\\frac{x^{2k}}{4^k(k!)^2}$, so term-by-term integration gives $\\sum\\frac{2^kk!}{4^k(k!)^2}=\\sum\\frac{(1/2)^k}{k!}=e^{1/2}$.","g":"olympiad","src":"Putnam 1997 A3","pt":{"t":"Série Vezes Série","q":"Calcule $$\\int_0^{\\infty}\\left(x-\\frac{x^3}{2}+\\frac{x^5}{2\\cdot4}-\\frac{x^7}{2\\cdot4\\cdot6}+\\cdots\\right)\\left(1+\\frac{x^2}{2^2}+\\frac{x^4}{2^2\\cdot4^2}+\\frac{x^6}{2^2\\cdot4^2\\cdot6^2}+\\cdots\\right)dx.$$","h":"O primeiro fator é $xe^{-x^2/2}$. Multiplique-o pela segunda série e integre termo a termo.","x":"O primeiro fator é igual a $xe^{-x^2/2}$, e $\\int_0^\\infty x^{2k+1}e^{-x^2/2}dx=2^kk!$. O termo de ordem $k$ da segunda série é $\\frac{x^{2k}}{4^k(k!)^2}$, logo a integração termo a termo dá $\\sum\\frac{2^kk!}{4^k(k!)^2}=\\sum\\frac{(1/2)^k}{k!}=e^{1/2}$."}},{"s":"the-m-bius-shape","t":"The Möbius Shape","d":"imo","r":2800,"c":["functional"],"q":"Let $S$ be the set of real numbers greater than $-1$. Find all functions $f:S\\to S$ such that\n(i) $f\\big(x+f(y)+xf(y)\\big)=y+f(x)+yf(x)$ for all $x,y\\in S$;\n(ii) $\\dfrac{f(x)}{x}$ is strictly increasing on each of the intervals $-1<x<0$ and $0<x$.","k":"NS4wLQ==","at":"-\\tfrac12","h":"With $x=y$, every point $x+f(x)+xf(x)$ is a fixed point of $f$. Condition (ii) allows at most one fixed point in each of $(-1,0)$, $\\{0\\}$, $(0,\\infty)$.","x":"A fixed point $u\\neq0$ would produce another fixed point $u^2+2u$ on the same side of $0$ (and with $x=y=u$), contradicting (ii). So the only fixed point is $0$, and $x+f(x)+xf(x)=0$, i.e. $f(x)=-\\frac{x}{1+x}$, which satisfies both conditions. The submitted value is $f(1)=-\\frac12$.","g":"olympiad","src":"IMO 1994 · Problem 5","ask":"There is exactly one such function. Enter $f(1)$.","pt":{"t":"A Forma de Möbius","q":"Seja $S$ o conjunto dos números reais maiores do que $-1$. Determine todas as funções $f:S\\to S$ tais que\n(i) $f\\big(x+f(y)+xf(y)\\big)=y+f(x)+yf(x)$ para todos os $x,y\\in S$;\n(ii) $\\dfrac{f(x)}{x}$ é estritamente crescente em cada um dos intervalos $-1<x<0$ e $0<x$.","h":"Com $x=y$, todo o ponto $x+f(x)+xf(x)$ é ponto fixo de $f$. A condição (ii) permite no máximo um ponto fixo em cada um dos conjuntos $\\mathopen{]}-1,0\\mathclose{[}$, $\\{0\\}$, $\\mathopen{]}0,\\infty\\mathclose{[}$.","x":"Um ponto fixo $u\\neq0$ produziria outro ponto fixo $u^2+2u$ do mesmo lado de $0$ (com $x=y=u$), o que contradiz (ii). Logo o único ponto fixo é $0$, e $x+f(x)+xf(x)=0$, isto é, $f(x)=-\\frac{x}{1+x}$, que satisfaz as duas condições. O valor a submeter é $f(1)=-\\frac12$.","ask":"Existe exatamente uma função nestas condições. Introduza $f(1)$."}},{"s":"fifth-powers","t":"Fifth Powers","d":"imo","r":2850,"c":["inequalities"],"q":"Let $x,y,z$ be positive reals with $xyz\\ge1$. Find the minimum value of $$\\frac{x^5-x^2}{x^5+y^2+z^2}+\\frac{y^5-y^2}{y^5+z^2+x^2}+\\frac{z^5-z^2}{z^5+x^2+y^2}.$$","k":"MC4w","at":"0","h":"Compare each term with $\\frac{x^5-x^2}{x^3(x^2+y^2+z^2)}$.","x":"Since $\\frac{x^5-x^2}{x^5+y^2+z^2}\\ge\\frac{x^5-x^2}{x^3(x^2+y^2+z^2)}=\\frac{x^2-1/x}{x^2+y^2+z^2}$, the sum is at least $\\frac{x^2+y^2+z^2-(1/x+1/y+1/z)}{x^2+y^2+z^2}$. With $xyz\\ge1$, $\\frac1x\\le yz\\le\\frac{y^2+z^2}{2}$, so the numerator is $\\ge0$. Equality at $x=y=z=1$, so the minimum is $0$.","g":"olympiad","src":"IMO 2005 · Problem 3","pt":{"t":"Quintas Potências","q":"Sejam $x,y,z$ reais positivos com $xyz\\ge1$. Determine o valor mínimo de $$\\frac{x^5-x^2}{x^5+y^2+z^2}+\\frac{y^5-y^2}{y^5+z^2+x^2}+\\frac{z^5-z^2}{z^5+x^2+y^2}.$$","h":"Compare cada termo com $\\frac{x^5-x^2}{x^3(x^2+y^2+z^2)}$.","x":"Como $\\frac{x^5-x^2}{x^5+y^2+z^2}\\ge\\frac{x^5-x^2}{x^3(x^2+y^2+z^2)}=\\frac{x^2-1/x}{x^2+y^2+z^2}$, a soma é pelo menos $\\frac{x^2+y^2+z^2-(1/x+1/y+1/z)}{x^2+y^2+z^2}$. Com $xyz\\ge1$, $\\frac1x\\le yz\\le\\frac{y^2+z^2}{2}$, logo o numerador é $\\ge0$. Igualdade em $x=y=z=1$, logo o mínimo é $0$."}},{"s":"arnolds-limit","t":"Arnold's Limit","d":"imo","r":2900,"c":["taylor","limits","trig"],"q":"Evaluate $$\\lim_{x\\to0}\\frac{\\sin(\\tan x)-\\tan(\\sin x)}{\\arcsin(\\arctan x)-\\arctan(\\arcsin x)}.$$","k":"MC4x","at":"1","h":"Both numerator and denominator vanish to order $x^7$. Compute their $x^7$ coefficients.","x":"Expanding with Taylor series, $\\sin(\\tan x)-\\tan(\\sin x)=-\\frac{x^7}{30}+O(x^9)$ and $\\arcsin(\\arctan x)-\\arctan(\\arcsin x)=-\\frac{x^7}{30}+O(x^9)$. The ratio tends to $1$. (A slicker argument uses that $f\\circ g-g\\circ f$ behaves the same way for any pair of functions tangent to the identity.)","g":"original","pt":{"t":"O Limite de Arnold","q":"Calcule $$\\lim_{x\\to0}\\frac{\\sin(\\tan x)-\\tan(\\sin x)}{\\arcsin(\\arctan x)-\\arctan(\\arcsin x)}.$$","h":"O numerador e o denominador anulam-se ambos até à ordem $x^7$. Calcule os seus coeficientes de $x^7$.","x":"Desenvolvendo em série de Taylor, $\\sin(\\tan x)-\\tan(\\sin x)=-\\frac{x^7}{30}+O(x^9)$ e $\\arcsin(\\arctan x)-\\arctan(\\arcsin x)=-\\frac{x^7}{30}+O(x^9)$. A razão tende para $1$. (Um argumento mais elegante usa o facto de $f\\circ g-g\\circ f$ se comportar da mesma forma para qualquer par de funções tangentes à identidade.)"}},{"s":"best-constant","t":"Best Constant","d":"imo","r":3000,"c":["inequalities","multivariable"],"q":"Determine the least real number $M$ such that $$\\left|ab(a^2-b^2)+bc(b^2-c^2)+ca(c^2-a^2)\\right|\\le M\\left(a^2+b^2+c^2\\right)^2$$ holds for all real numbers $a,b,c$.","k":"MzM0NzE0NDY1NzQ3NzkzLjA=","at":"\\tfrac{9\\sqrt2}{32}","h":"The left side factors as $|(a-b)(b-c)(c-a)(a+b+c)|$.","x":"Factor the left side as $|(a-b)(b-c)(c-a)(a+b+c)|$. WLOG $a\\le b\\le c$; AM–GM on $(b-a)(c-b)$ and a second AM–GM combining $(c-a)^2$ with $(a+b+c)^2$ yields the bound with $M=\\frac{9\\sqrt2}{32}$. Equality occurs for $a,b,c$ proportional to $1-\\frac{3}{\\sqrt2},\\,1,\\,1+\\frac{3}{\\sqrt2}$. So $M=\\frac{9\\sqrt2}{32}\\approx0.3977$.","g":"olympiad","src":"IMO 2006 · Problem 3","pt":{"t":"Melhor Constante","q":"Determine o menor número real $M$ tal que $$\\left|ab(a^2-b^2)+bc(b^2-c^2)+ca(c^2-a^2)\\right|\\le M\\left(a^2+b^2+c^2\\right)^2$$ para todos os números reais $a,b,c$.","h":"O lado esquerdo fatoriza-se como $|(a-b)(b-c)(c-a)(a+b+c)|$.","x":"Fatorize o lado esquerdo como $|(a-b)(b-c)(c-a)(a+b+c)|$. Sem perda de generalidade, $a\\le b\\le c$; a desigualdade das médias aplicada a $(b-a)(c-b)$ e uma segunda aplicação que combina $(c-a)^2$ com $(a+b+c)^2$ dão a majoração com $M=\\frac{9\\sqrt2}{32}$. A igualdade ocorre para $a,b,c$ proporcionais a $1-\\frac{3}{\\sqrt2},\\,1,\\,1+\\frac{3}{\\sqrt2}$. Logo $M=\\frac{9\\sqrt2}{32}\\approx0.3977$."}},{"s":"double-sum","t":"Double Sum","d":"imo","r":3000,"c":["series"],"q":"Evaluate $$\\sum_{k=1}^{\\infty}\\frac{(-1)^{k-1}}{k}\\sum_{n=0}^{\\infty}\\frac{1}{k2^n+1}.$$","k":"MC4x","at":"1","h":"Write $\\frac{1}{k2^n+1}=\\int_0^1x^{k2^n}\\,dx$ and sum over $k$ first.","x":"Summing over $k$ inside the integral, $\\sum_k\\frac{(-1)^{k-1}}{k}x^{k2^n}=\\ln\\!\\left(1+x^{2^n}\\right)$. Summing over $n$, $\\prod_{n\\ge0}\\left(1+x^{2^n}\\right)=\\frac{1}{1-x}$, because every exponent has exactly one binary expansion. So the double sum is $\\int_0^1-\\ln(1-x)\\,dx=1$.","g":"olympiad","src":"Putnam 2016 B6","pt":{"t":"Soma Dupla","q":"Calcule $$\\sum_{k=1}^{\\infty}\\frac{(-1)^{k-1}}{k}\\sum_{n=0}^{\\infty}\\frac{1}{k2^n+1}.$$","h":"Escreva $\\frac{1}{k2^n+1}=\\int_0^1x^{k2^n}\\,dx$ e some primeiro em $k$.","x":"Somando em $k$ dentro do integral, $\\sum_k\\frac{(-1)^{k-1}}{k}x^{k2^n}=\\ln\\!\\left(1+x^{2^n}\\right)$. Somando em $n$, $\\prod_{n\\ge0}\\left(1+x^{2^n}\\right)=\\frac{1}{1-x}$, porque cada expoente tem exatamente uma representação binária. Logo a soma dupla é $\\int_0^1-\\ln(1-x)\\,dx=1$."}}],"concepts":[{"k":"domains","n":"Domains & inequalities","d":"Where an expression makes sense, and solving inequalities with sign tables.","b":"**What it is.** The domain of an expression is the set of real $x$ where every piece makes sense: no division by zero, even roots only of non-negative numbers, logarithms only of positive numbers, $\\arcsin$ and $\\arccos$ only on $[-1,1]$. Solving an inequality means describing its solution set as a union of intervals, some of which may be single points.\n\n**How to use it.** Move everything to one side and factor. Build a sign table: mark every zero of a factor and every point where the expression is undefined, then record the sign of each factor in between. Watch for factors that are always positive (like $e^x$ or $x^2+1$), squares that vanish at a single point (they can create an isolated solution), and simplifications that silently change the domain: $\\sqrt{x^2}=|x|$, not $x$, and $\\ln(x^2)=2\\ln|x|$.\n\n**Example.** $\\frac{x-1}{x+2}\\ge0$: the critical points are $-2$ and $1$, and the sign table gives $(-\\infty,-2)\\,\\cup\\,[1,+\\infty)$. The point $-2$ is excluded because the denominator vanishes there.","pt":{"n":"Domínios e inequações","d":"Onde uma expressão faz sentido, e como resolver inequações com quadros de sinais.","b":"**O que é.** O domínio de uma expressão é o conjunto dos reais $x$ onde todas as partes fazem sentido: não há divisões por zero, raízes de índice par só de números não negativos, logaritmos só de números positivos, $\\arcsin$ e $\\arccos$ só em $[-1,1]$. Resolver uma inequação é descrever o conjunto-solução como uma união de intervalos, alguns dos quais podem reduzir-se a um ponto.\n\n**Como usar.** Passe tudo para um dos membros e fatorize. Construa um quadro de sinais: marque os zeros de cada fator e os pontos onde a expressão não está definida, e registe o sinal de cada fator entre eles. Atenção aos fatores sempre positivos (como $e^x$ ou $x^2+1$), aos quadrados que se anulam num único ponto (podem criar uma solução isolada) e às simplificações que alteram o domínio sem aviso: $\\sqrt{x^2}=|x|$, e não $x$, e $\\ln(x^2)=2\\ln|x|$.\n\n**Exemplo.** $\\frac{x-1}{x+2}\\ge0$: os pontos críticos são $-2$ e $1$, e o quadro de sinais dá $\\mathopen{]}-\\infty,-2\\mathclose{[}\\,\\cup\\,[1,+\\infty\\mathclose{[}$. O ponto $-2$ fica excluído porque anula o denominador."}},{"k":"induction","n":"Mathematical induction","d":"Proving a statement for every n with a base case and an inductive step.","b":"**What it is.** To prove a statement $P(n)$ for every integer $n\\ge n_0$, prove $P(n_0)$ (the base case), then prove that $P(k)$ implies $P(k+1)$ for every $k\\ge n_0$ (the inductive step).\n\n**How to use it.** In the step, write $P(k+1)$ and find $P(k)$ inside it: for a sum, split off the last term; for divisibility, write $a^{k+1}=a\\cdot a^k$; for an inequality, use $P(k)$ and then a simpler estimate. Both parts are needed: $\\sin\\left(\\frac\\pi3+2n\\pi\\right)=\\frac12$ passes the inductive step but is false for every $n$, because the base case fails.\n\n**Example.** $1+3+\\cdots+(2n-1)=n^2$: true for $n=1$, and if it holds for $k$, adding $2k+1$ gives $k^2+2k+1=(k+1)^2$.","pt":{"n":"Indução matemática","d":"Provar uma propriedade para todo o n com a base e a hereditariedade.","b":"**O que é.** Para provar uma propriedade $P(n)$ para todo o inteiro $n\\ge n_0$, prova-se $P(n_0)$ (a base da indução) e depois que $P(k)$ implica $P(k+1)$ para todo o $k\\ge n_0$ (a hereditariedade).\n\n**Como usar.** Na hereditariedade, escreva $P(k+1)$ e encontre $P(k)$ lá dentro: numa soma, separe a última parcela; numa divisibilidade, escreva $a^{k+1}=a\\cdot a^k$; numa desigualdade, use $P(k)$ e depois uma estimativa mais simples. As duas partes são necessárias: $\\sin\\left(\\frac\\pi3+2n\\pi\\right)=\\frac12$ é hereditária mas é falsa para todo o $n$, porque a base falha.\n\n**Exemplo.** $1+3+\\cdots+(2n-1)=n^2$: é verdade para $n=1$, e se vale para $k$, somando $2k+1$ obtém-se $k^2+2k+1=(k+1)^2$."}},{"k":"sup-inf","n":"Supremum & infimum","d":"Upper bounds, least upper bounds, maxima, and how ℚ sits inside ℝ.","b":"**What it is.** An upper bound of a set $A$ is any $M$ with $x\\le M$ for all $x\\in A$. The supremum $\\sup A$ is the least upper bound; if it belongs to $A$ it is the maximum. The infimum and minimum are defined the same way from below. Every non-empty set of reals that is bounded above has a supremum (completeness).\n\n**How to use it.** First describe $A$ as a union of intervals and points, then read off the ends. To show $s=\\sup A$, check that $s$ is an upper bound and that elements of $A$ come arbitrarily close to $s$, often through a sequence in $A$ converging to $s$. The rationals and the irrationals are both dense: every interval contains both. So $\\sup(A\\cap\\mathbb Q)$ can differ from $\\sup A$, and the boundary of $[a,b]\\cap\\mathbb Q$ is all of $[a,b]$.\n\n**Example.** $A=\\left\\{1-\\frac1n:n\\ge1\\right\\}$ has $\\min A=\\inf A=0$ and $\\sup A=1$, but no maximum.","pt":{"n":"Supremo e ínfimo","d":"Majorantes, minorantes, máximo, supremo, e como ℚ se distribui em ℝ.","b":"**O que é.** Um majorante de um conjunto $A$ é qualquer $M$ com $x\\le M$ para todo o $x\\in A$. O supremo $\\sup A$ é o menor dos majorantes; se pertencer a $A$, é o máximo. O ínfimo e o mínimo definem-se da mesma forma a partir dos minorantes. Todo o conjunto de reais não vazio e majorado tem supremo (axioma do supremo).\n\n**Como usar.** Descreva primeiro $A$ como uma união de intervalos e pontos e depois leia os extremos. Para mostrar que $s=\\sup A$, verifique que $s$ é majorante e que há elementos de $A$ arbitrariamente próximos de $s$, muitas vezes através de uma sucessão de termos em $A$ que converge para $s$. Os racionais e os irracionais são ambos densos: todo o intervalo contém uns e outros. Assim, $\\sup(A\\cap\\mathbb Q)$ pode ser diferente de $\\sup A$, e a fronteira de $[a,b]\\cap\\mathbb Q$ é todo o $[a,b]$. Noções vizinhas: interior, exterior, fronteira e aderência (fecho) de um conjunto; um ponto isolado de $A$ pertence a $A$ mas tem uma vizinhança sem outros pontos de $A$.\n\n**Exemplo.** $A=\\left\\{1-\\frac1n:n\\ge1\\right\\}$ tem $\\min A=\\inf A=0$ e $\\sup A=1$, mas não tem máximo."}},{"k":"exp-log","n":"Exponentials & logarithms","d":"The number e, the natural log, and powers like f(x)^g(x).","b":"**What it is.** $e\\approx2.71828$ is the base for which $e^x$ is its own derivative. The natural log $\\ln x$ undoes it: $e^{\\ln x}=x$ for $x>0$. It turns products into sums: $\\ln(ab)=\\ln a+\\ln b$ and $\\ln(a^b)=b\\ln a$.\n\n**How to use it.** Derivatives: $(e^x)'=e^x$, $(\\ln x)'=\\frac1x$, $(a^x)'=a^x\\ln a$. Any power can be rewritten as $a^x=e^{x\\ln a}$, and more generally $f(x)^{g(x)}=e^{g(x)\\ln f(x)}$: study the exponent, then exponentiate. The defining limit is $\\lim_{n\\to\\infty}\\left(1+\\frac{a}{n}\\right)^n=e^a$.\n\n**Example.** $\\lim_{x\\to0}(1+2x)^{1/x}$: the exponent $\\frac{\\ln(1+2x)}{x}\\to2$, so the limit is $e^2$.","pt":{"n":"Exponenciais e logaritmos","d":"O número e, o logaritmo neperiano e potências como f(x)^g(x).","b":"**O que é.** $e\\approx2.71828$ é a base para a qual $e^x$ é igual à sua própria derivada. O logaritmo neperiano $\\ln x$ é a sua inversa: $e^{\\ln x}=x$ para $x>0$. Transforma produtos em somas: $\\ln(ab)=\\ln a+\\ln b$ e $\\ln(a^b)=b\\ln a$.\n\n**Como usar.** Derivadas: $(e^x)'=e^x$, $(\\ln x)'=\\frac1x$, $(a^x)'=a^x\\ln a$. Qualquer potência se reescreve como $a^x=e^{x\\ln a}$ e, mais geralmente, $f(x)^{g(x)}=e^{g(x)\\ln f(x)}$: estude o expoente e depois aplique a exponencial. O limite que define $e$ é $\\lim_{n\\to\\infty}\\left(1+\\frac{a}{n}\\right)^n=e^a$.\n\n**Exemplo.** $\\lim_{x\\to0}(1+2x)^{1/x}$: o expoente $\\frac{\\ln(1+2x)}{x}\\to2$, logo o limite é $e^2$."}},{"k":"trig","n":"Trigonometry","d":"Identities, derivatives, and the arctangent integral.","b":"**What it is.** The workhorse identities: $\\sin^2x+\\cos^2x=1$, $\\sin2x=2\\sin x\\cos x$, $\\cos2x=1-2\\sin^2x$, $\\tan(a-b)=\\frac{\\tan a-\\tan b}{1+\\tan a\\tan b}$. And $a\\sin x+b\\cos x=R\\sin(x+\\varphi)$ with $R=\\sqrt{a^2+b^2}$.\n\n**How to use it.** Derivatives: $(\\sin x)'=\\cos x$, $(\\cos x)'=-\\sin x$, $(\\tan x)'=1+\\tan^2x$. The inverse tangent satisfies $(\\arctan x)'=\\frac{1}{1+x^2}$, so $\\int\\frac{dx}{a^2+x^2}=\\frac1a\\arctan\\frac xa+C$.\n\n**Example.** $\\int_0^1\\frac{dx}{1+x^2}=\\arctan1=\\frac\\pi4$.","pt":{"n":"Trigonometria","d":"Identidades, derivadas e a primitiva que dá o arco-tangente.","b":"**O que é.** As identidades essenciais: $\\sin^2x+\\cos^2x=1$, $\\sin2x=2\\sin x\\cos x$, $\\cos2x=1-2\\sin^2x$, $\\tan(a-b)=\\frac{\\tan a-\\tan b}{1+\\tan a\\tan b}$. E $a\\sin x+b\\cos x=R\\sin(x+\\varphi)$ com $R=\\sqrt{a^2+b^2}$.\n\n**Como usar.** Derivadas: $(\\sin x)'=\\cos x$, $(\\cos x)'=-\\sin x$, $(\\tan x)'=1+\\tan^2x$. O arco-tangente satisfaz $(\\arctan x)'=\\frac{1}{1+x^2}$, logo $\\int\\frac{dx}{a^2+x^2}=\\frac1a\\arctan\\frac xa+C$.\n\n**Exemplo.** $\\int_0^1\\frac{dx}{1+x^2}=\\arctan1=\\frac\\pi4$."}},{"k":"inverse-trig","n":"Inverse trig functions","d":"arcsin, arccos and arctan, their principal ranges, and the traps.","b":"**What it is.** Each trig function is inverted on one interval where it is injective, its principal branch: $\\arcsin:[-1,1]\\to\\left[-\\frac\\pi2,\\frac\\pi2\\right]$, $\\arccos:[-1,1]\\to[0,\\pi]$, $\\arctan:\\mathbb R\\to\\left(-\\frac\\pi2,\\frac\\pi2\\right)$.\n\n**How to use it.** $\\sin(\\arcsin y)=y$ always, but $\\arcsin(\\sin x)=x$ only for $x\\in\\left[-\\frac\\pi2,\\frac\\pi2\\right]$; otherwise move $x$ into that interval using $\\sin x=\\sin(\\pi-x)=\\sin(x-2\\pi)$. The same goes for $\\arccos$ on $[0,\\pi]$ and $\\arctan$ on $\\left(-\\frac\\pi2,\\frac\\pi2\\right)$. Useful facts: $\\cos(\\arcsin y)=\\sqrt{1-y^2}$, $\\arcsin y+\\arccos y=\\frac\\pi2$, $\\arctan y+\\arctan\\frac1y=\\pm\\frac\\pi2$ (the sign of $y$). Derivatives: $(\\arcsin x)'=\\frac{1}{\\sqrt{1-x^2}}$, $(\\arccos x)'=-\\frac{1}{\\sqrt{1-x^2}}$, $(\\arctan x)'=\\frac{1}{1+x^2}$.\n\n**Example.** $\\arcsin\\left(\\sin\\frac{5\\pi}{6}\\right)=\\frac\\pi6$, because $\\sin\\frac{5\\pi}6=\\sin\\frac\\pi6$ and $\\frac\\pi6$ is in the principal range.","pt":{"n":"Funções trigonométricas inversas","d":"arcsen, arccos e arctg, os seus contradomínios e as armadilhas.","b":"**O que é.** Cada função trigonométrica é invertida num intervalo onde é injetiva, a sua restrição principal: $\\arcsin:[-1,1]\\to\\left[-\\frac\\pi2,\\frac\\pi2\\right]$, $\\arccos:[-1,1]\\to[0,\\pi]$, $\\arctan:\\mathbb R\\to\\left]-\\frac\\pi2,\\frac\\pi2\\right[$.\n\n**Como usar.** $\\sin(\\arcsin y)=y$ sempre, mas $\\arcsin(\\sin x)=x$ só para $x\\in\\left[-\\frac\\pi2,\\frac\\pi2\\right]$; caso contrário, desloque $x$ para esse intervalo usando $\\sin x=\\sin(\\pi-x)=\\sin(x-2\\pi)$. O mesmo se passa com $\\arccos$ em $[0,\\pi]$ e $\\arctan$ em $\\left]-\\frac\\pi2,\\frac\\pi2\\right[$. Factos úteis: $\\cos(\\arcsin y)=\\sqrt{1-y^2}$, $\\arcsin y+\\arccos y=\\frac\\pi2$, $\\arctan y+\\arctan\\frac1y=\\pm\\frac\\pi2$ (com o sinal de $y$). Derivadas: $(\\arcsin x)'=\\frac{1}{\\sqrt{1-x^2}}$, $(\\arccos x)'=-\\frac{1}{\\sqrt{1-x^2}}$, $(\\arctan x)'=\\frac{1}{1+x^2}$.\n\n**Exemplo.** $\\arcsin\\left(\\sin\\frac{5\\pi}{6}\\right)=\\frac\\pi6$, porque $\\sin\\frac{5\\pi}6=\\sin\\frac\\pi6$ e $\\frac\\pi6$ está no contradomínio principal."}},{"k":"hyperbolic","n":"Hyperbolic functions","d":"sinh, cosh and tanh, their identities and their log-shaped inverses.","b":"**What it is.** $\\sinh x=\\frac{e^x-e^{-x}}{2}$, $\\cosh x=\\frac{e^x+e^{-x}}{2}$, $\\tanh x=\\frac{\\sinh x}{\\cosh x}$. They satisfy $\\cosh^2x-\\sinh^2x=1$, $\\sinh2x=2\\sinh x\\cosh x$ and $\\cosh x+\\sinh x=e^x$.\n\n**How to use it.** Derivatives: $(\\sinh x)'=\\cosh x$, $(\\cosh x)'=\\sinh x$, $(\\tanh x)'=\\frac{1}{\\cosh^2x}$. The inverses are logarithms: $\\operatorname{arsinh}x=\\ln\\left(x+\\sqrt{x^2+1}\\right)$, $\\operatorname{arcosh}x=\\ln\\left(x+\\sqrt{x^2-1}\\right)$ for $x\\ge1$, $\\operatorname{artanh}x=\\frac12\\ln\\frac{1+x}{1-x}$, with derivatives $\\frac{1}{\\sqrt{x^2+1}}$, $\\frac{1}{\\sqrt{x^2-1}}$ and $\\frac{1}{1-x^2}$. Near $0$: $\\sinh x\\approx x+\\frac{x^3}{6}$, $\\cosh x\\approx1+\\frac{x^2}{2}$, $\\tanh x\\approx x-\\frac{x^3}{3}$.\n\n**Example.** If $\\cosh x=\\frac54$ with $x>0$, then $\\sinh x=\\sqrt{\\frac{25}{16}-1}=\\frac34$, so $e^x=\\cosh x+\\sinh x=2$ and $x=\\ln2$.","pt":{"n":"Funções hiperbólicas","d":"sh, ch e th, as suas identidades e as inversas logarítmicas.","b":"**O que é.** $\\sinh x=\\frac{e^x-e^{-x}}{2}$, $\\cosh x=\\frac{e^x+e^{-x}}{2}$, $\\tanh x=\\frac{\\sinh x}{\\cosh x}$. Satisfazem $\\cosh^2x-\\sinh^2x=1$, $\\sinh2x=2\\sinh x\\cosh x$ e $\\cosh x+\\sinh x=e^x$.\n\n**Como usar.** Derivadas: $(\\sinh x)'=\\cosh x$, $(\\cosh x)'=\\sinh x$, $(\\tanh x)'=\\frac{1}{\\cosh^2x}$. As inversas são logaritmos: $\\operatorname{arsinh}x=\\ln\\left(x+\\sqrt{x^2+1}\\right)$, $\\operatorname{arcosh}x=\\ln\\left(x+\\sqrt{x^2-1}\\right)$ para $x\\ge1$, $\\operatorname{artanh}x=\\frac12\\ln\\frac{1+x}{1-x}$, com derivadas $\\frac{1}{\\sqrt{x^2+1}}$, $\\frac{1}{\\sqrt{x^2-1}}$ e $\\frac{1}{1-x^2}$. Perto de $0$: $\\sinh x\\approx x+\\frac{x^3}{6}$, $\\cosh x\\approx1+\\frac{x^2}{2}$, $\\tanh x\\approx x-\\frac{x^3}{3}$.\n\n**Exemplo.** Se $\\cosh x=\\frac54$ com $x>0$, então $\\sinh x=\\sqrt{\\frac{25}{16}-1}=\\frac34$, logo $e^x=\\cosh x+\\sinh x=2$ e $x=\\ln2$."}},{"k":"seq-limits","n":"Limits of sequences","d":"Dominance, conjugates, squeezing, subsequences and the e-limit.","b":"**What it is.** $u_n\\to L$ means that for every $\\varepsilon>0$, eventually $|u_n-L|<\\varepsilon$. A sequence converges exactly when all its subsequences converge to the same limit, so two different subsequential limits prove divergence.\n\n**How to compute.** Dominance scale: $\\ln n\\ll n^p\\ll a^n\\ll n!\\ll n^n$ (for $p>0$, $a>1$); divide by the dominant term. Differences of roots: multiply by the conjugate, $a-b=\\frac{a^2-b^2}{a+b}$ (or $\\frac{a^3-b^3}{a^2+ab+b^2}$ for cube roots). Squeeze theorem: if $v_n\\le u_n\\le w_n$ and both outer sequences tend to $L$, so does $u_n$; a bounded sequence times one tending to $0$ tends to $0$. For $1^\\infty$: if $u_n\\to1$ and $v_n(u_n-1)\\to a$, then $u_n^{v_n}\\to e^a$. Ratio-to-root rule: if $\\frac{u_{n+1}}{u_n}\\to L$ then $\\sqrt[n]{u_n}\\to L$.\n\n**Example.** $\\left(1+\\frac2n\\right)^{3n}\\to e^6$, because $3n\\cdot\\frac2n=6$.","pt":{"n":"Limites de sucessões","d":"Ordens de grandeza, conjugados, enquadramento, sublimites e o limite de e.","b":"**O que é.** $u_n\\to L$ significa que, para todo o $\\varepsilon>0$, a partir de certa ordem $|u_n-L|<\\varepsilon$. Uma sucessão converge exatamente quando todas as suas subsucessões convergem para o mesmo limite, logo dois sublimites diferentes provam a divergência.\n\n**Como calcular.** Diz-se que $v_n$ é dominante em relação a $u_n$, e escreve-se $u_n\\ll v_n$, quando $\\frac{u_n}{v_n}\\to0$. Escala: $\\ln n\\ll n^p\\ll a^n\\ll n!\\ll n^n$ (para $p>0$, $a>1$); divida pelo termo dominante. Diferenças de raízes: multiplique pelo conjugado, $a-b=\\frac{a^2-b^2}{a+b}$ (ou $\\frac{a^3-b^3}{a^2+ab+b^2}$ para raízes cúbicas). Teorema das sucessões enquadradas: se $v_n\\le u_n\\le w_n$ e as duas sucessões exteriores tendem para $L$, também $u_n$ tende; uma sucessão limitada vezes um infinitésimo é um infinitésimo. Para $1^\\infty$ (limite notável): se $u_n\\to1$ e $v_n(u_n-1)\\to a$, então $u_n^{v_n}\\to e^a$. Da razão para a raiz: se $\\frac{u_{n+1}}{u_n}\\to L$ então $\\sqrt[n]{u_n}\\to L$.\n\n**Exemplo.** $\\left(1+\\frac2n\\right)^{3n}\\to e^6$, porque $3n\\cdot\\frac2n=6$."}},{"k":"sequences","n":"Recursive sequences","d":"Sequences defined by a recursion: monotone convergence and rates.","b":"**What it is.** A sequence $a_n$ converges to $L$ if its terms eventually stay as close to $L$ as you like. An increasing sequence that is bounded above always converges.\n\n**How to use it.** For a recursion $a_{n+1}=g(a_n)$ with a limit $L$, pass to the limit: $L=g(L)$. To find the rate, transform: show that $a_{n+1}^2-a_n^2$ or $\\frac1{a_{n+1}}-\\frac1{a_n}$ tends to a constant $c$; summing gives $a_n^2\\approx cn$ or $\\frac1{a_n}\\approx cn$. (Stolz–Cesàro makes this rigorous.)\n\n**Example.** $a_{n+1}=\\frac{a_n}{1+a_n}$, $a_1=1$: $\\frac1{a_{n+1}}=\\frac1{a_n}+1$, so $a_n=\\frac1n$.","pt":{"n":"Sucessões por recorrência","d":"Sucessões definidas por recorrência: convergência monótona e velocidade.","b":"**O que é.** Uma sucessão $a_n$ converge para $L$ se os seus termos acabam por ficar tão perto de $L$ quanto se queira. Uma sucessão crescente e majorada é sempre convergente.\n\n**Como usar.** Para uma recorrência $a_{n+1}=g(a_n)$ com limite $L$, passe ao limite: $L=g(L)$. Para obter a velocidade, transforme: mostre que $a_{n+1}^2-a_n^2$ ou $\\frac1{a_{n+1}}-\\frac1{a_n}$ tende para uma constante $c$; somando obtém-se $a_n^2\\approx cn$ ou $\\frac1{a_n}\\approx cn$. (O Teorema de Stolz–Cesàro torna isto rigoroso.)\n\n**Exemplo.** $a_{n+1}=\\frac{a_n}{1+a_n}$, $a_1=1$: $\\frac1{a_{n+1}}=\\frac1{a_n}+1$, logo $a_n=\\frac1n$."}},{"k":"limits","n":"Limits","d":"What a function approaches, and the standard ways to compute it.","b":"**What it is.** $\\lim_{x\\to a}f(x)=L$ means $f(x)$ gets as close to $L$ as you like once $x$ is close enough to $a$ (with $x\\ne a$). The value at $a$ itself doesn't matter.\n\n**How to compute.** If $f$ is continuous at $a$, just plug in. If you get $\\frac00$, simplify first: factor and cancel, multiply by a conjugate, or reduce to standard limits: $\\frac{\\sin x}{x}\\to1$, $\\frac{1-\\cos x}{x^2}\\to\\frac12$, $\\frac{e^x-1}{x}\\to1$, $\\frac{\\ln(1+x)}{x}\\to1$. As $x\\to\\infty$, divide by the highest power. The squeeze theorem handles oscillating terms: if $g\\le f\\le h$ and $g,h\\to L$, then $f\\to L$.\n\n**Example.** $\\lim_{x\\to2}\\frac{x^2-4}{x-2}=\\lim_{x\\to2}(x+2)=4$.","pt":{"n":"Limites","d":"Para onde tende uma função, e as técnicas habituais para o calcular.","b":"**O que é.** $\\lim_{x\\to a}f(x)=L$ significa que $f(x)$ fica tão perto de $L$ quanto se queira desde que $x$ esteja suficientemente perto de $a$ (com $x\\ne a$). O valor em $a$ não interessa.\n\n**Como calcular.** Se $f$ é contínua em $a$, basta substituir. Se obtiver $\\frac00$, simplifique primeiro: fatorize e simplifique, multiplique pelo conjugado, ou reduza a limites notáveis: $\\frac{\\sin x}{x}\\to1$, $\\frac{1-\\cos x}{x^2}\\to\\frac12$, $\\frac{e^x-1}{x}\\to1$, $\\frac{\\ln(1+x)}{x}\\to1$. Quando $x\\to\\infty$, divida pela maior potência. O enquadramento resolve termos oscilantes: se $g\\le f\\le h$ e $g,h\\to L$, então $f\\to L$.\n\n**Exemplo.** $\\lim_{x\\to2}\\frac{x^2-4}{x-2}=\\lim_{x\\to2}(x+2)=4$."}},{"k":"continuity","n":"Continuity & the IVT","d":"No jumps or holes, and the guarantee that sign changes mean roots.","b":"**What it is.** $f$ is continuous at $a$ if $\\lim_{x\\to a}f(x)=f(a)$: no jumps, holes or blow-ups. Polynomials, $e^x$, $\\sin$ and $\\cos$ are continuous everywhere, $\\ln x$ on $x>0$.\n\n**How to use it.** The Intermediate Value Theorem: if $f$ is continuous on $[a,b]$ and $N$ lies between $f(a)$ and $f(b)$, then $f(c)=N$ for some $c\\in[a,b]$. In particular a sign change $f(a)<0<f(b)$ guarantees a root in between. Combine with monotonicity to count roots exactly.\n\n**Example.** $f(x)=x^3+x-1$ has $f(0)=-1<0<1=f(1)$ and $f'>0$, so it has exactly one root, and it lies in $(0,1)$.","pt":{"n":"Continuidade e Teorema de Bolzano","d":"Sem saltos nem buracos, prolongamentos por continuidade, e a garantia de que uma mudança de sinal dá um zero.","b":"**O que é.** $f$ é contínua em $a$ se $\\lim_{x\\to a}f(x)=f(a)$: sem saltos, buracos ou assíntotas. Pela definição de Heine, $f$ é contínua em $a$ se $f(x_n)\\to f(a)$ para toda a sucessão $x_n\\to a$ de termos no domínio. Os polinómios, $e^x$, $\\sin$ e $\\cos$ são contínuos em todo o $\\mathbb R$, e $\\ln x$ em $x>0$. Se $a$ não pertence ao domínio mas $\\lim_{x\\to a}f(x)$ existe e é finito, $f$ é prolongável por continuidade a $a$.\n\n**Como usar.** Teorema do valor intermédio: se $f$ é contínua em $[a,b]$ e $N$ está entre $f(a)$ e $f(b)$, então $f(c)=N$ para algum $c\\in[a,b]$. Em particular, uma mudança de sinal $f(a)<0<f(b)$ garante um zero entre $a$ e $b$ (Teorema de Bolzano). Combinado com a monotonia, permite contar zeros com exatidão. Teorema de Weierstrass: uma função contínua num intervalo fechado e limitado tem máximo e mínimo.\n\n**Exemplo.** $f(x)=x^3+x-1$ tem $f(0)=-1<0<1=f(1)$ e $f'>0$, logo tem exatamente um zero, que está em $\\mathopen{]}0,1\\mathclose{[}$."}},{"k":"derivatives","n":"Derivatives","d":"Slopes and rates of change, and the rules to compute them.","b":"**What it is.** $f'(a)=\\lim_{h\\to0}\\frac{f(a+h)-f(a)}{h}$, the slope of the tangent line at $a$, or the instantaneous rate of change.\n\n**How to compute.** Power rule $(x^n)'=nx^{n-1}$; sums and constant multiples go through. Product rule $(fg)'=f'g+fg'$, quotient rule $\\left(\\frac fg\\right)'=\\frac{f'g-fg'}{g^2}$, chain rule $\\big(f(g(x))\\big)'=f'(g(x))\\,g'(x)$. Standard ones: $(\\sin x)'=\\cos x$, $(\\cos x)'=-\\sin x$, $(e^x)'=e^x$, $(\\ln x)'=\\frac1x$. The tangent line at $a$ is $y=f(a)+f'(a)(x-a)$.\n\n**Example.** $\\frac{d}{dx}\\sin(x^2)=\\cos(x^2)\\cdot2x$.","pt":{"n":"Derivadas","d":"Declives e taxas de variação, e as regras para os calcular.","b":"**O que é.** $f'(a)=\\lim_{h\\to0}\\frac{f(a+h)-f(a)}{h}$, o declive da reta tangente em $a$, ou a taxa de variação instantânea.\n\n**Como calcular.** Regra da potência $(x^n)'=nx^{n-1}$; somas e múltiplos constantes passam diretamente. Regra do produto $(fg)'=f'g+fg'$, regra do quociente $\\left(\\frac fg\\right)'=\\frac{f'g-fg'}{g^2}$, regra da cadeia $\\big(f(g(x))\\big)'=f'(g(x))\\,g'(x)$. As habituais: $(\\sin x)'=\\cos x$, $(\\cos x)'=-\\sin x$, $(e^x)'=e^x$, $(\\ln x)'=\\frac1x$. A reta tangente em $a$ é $y=f(a)+f'(a)(x-a)$.\n\n**Exemplo.** $\\frac{d}{dx}\\sin(x^2)=\\cos(x^2)\\cdot2x$."}},{"k":"differentiability","n":"Differentiability","d":"One-sided derivatives, gluing pieces smoothly, and derivatives of inverses.","b":"**What it is.** $f$ is differentiable at $a$ when $\\lim_{x\\to a}\\frac{f(x)-f(a)}{x-a}$ exists and is finite. Where a formula changes (piecewise definitions, absolute values, roots of zero), compute the left and right derivatives separately; $f$ is differentiable there only if they agree. Differentiable implies continuous, but not the other way round.\n\n**How to use it.** To make a piecewise $f$ differentiable at the seam, first make it continuous (equal one-sided limits and value), then make the one-sided derivatives equal. A corollary of the Mean Value Theorem helps: if $f$ is continuous at $a$ and $\\lim_{x\\to a}f'(x)=L$ exists, then $f'(a)=L$. For inverses and composites: $(f^{-1})'(f(a))=\\frac{1}{f'(a)}$ and $(f\\circ g)'(a)=f'(g(a))\\,g'(a)$.\n\n**Example.** $|x|$ has left derivative $-1$ and right derivative $1$ at $0$, so it is continuous but not differentiable there.","pt":{"n":"Diferenciabilidade","d":"Derivadas laterais, colar ramos sem bicos e derivadas de inversas.","b":"**O que é.** $f$ é diferenciável em $a$ quando $\\lim_{x\\to a}\\frac{f(x)-f(a)}{x-a}$ existe e é finito. Onde a expressão muda (funções definidas por ramos, módulos, raízes de zero), calcule separadamente as derivadas à esquerda e à direita; $f$ só é diferenciável nesse ponto se coincidirem. Diferenciável implica contínua, mas não o contrário.\n\n**Como usar.** Para tornar diferenciável uma função definida por ramos no ponto de junção, torne-a primeiro contínua (limites laterais iguais ao valor) e depois iguale as derivadas laterais. Um corolário do Teorema de Lagrange ajuda: se $f$ é contínua em $a$ e $\\lim_{x\\to a}f'(x)=L$ existe, então $f'(a)=L$. Para inversas e compostas: $(f^{-1})'(f(a))=\\frac{1}{f'(a)}$ e $(f\\circ g)'(a)=f'(g(a))\\,g'(a)$.\n\n**Exemplo.** $|x|$ tem derivada à esquerda $-1$ e derivada à direita $1$ em $0$, logo é contínua mas não diferenciável nesse ponto."}},{"k":"implicit","n":"Implicit differentiation","d":"Finding slopes on curves like x² + y² = 25.","b":"**What it is.** When a curve is given by an equation in $x$ and $y$ rather than $y=f(x)$, you can still find $\\frac{dy}{dx}$.\n\n**How to use it.** Differentiate both sides with respect to $x$, treating $y$ as a function of $x$: every term with $y$ picks up a factor $y'$ by the chain rule. Then solve for $y'$.\n\n**Example.** $x^2+y^2=25$ gives $2x+2yy'=0$, so $y'=-\\frac xy$. At $(3,4)$ the slope is $-\\frac34$.","pt":{"n":"Derivação implícita","d":"Declives em curvas como x² + y² = 25.","b":"**O que é.** Quando uma curva é dada por uma equação em $x$ e $y$ em vez de $y=f(x)$, continua a ser possível calcular $\\frac{dy}{dx}$.\n\n**Como usar.** Derive ambos os membros em ordem a $x$, tratando $y$ como função de $x$: cada termo com $y$ ganha um fator $y'$ pela regra da cadeia. Depois resolva em ordem a $y'$.\n\n**Exemplo.** $x^2+y^2=25$ dá $2x+2yy'=0$, logo $y'=-\\frac xy$. Em $(3,4)$ o declive é $-\\frac34$."}},{"k":"related-rates","n":"Related rates","d":"Linking how fast connected quantities change.","b":"**What it is.** When several quantities change over time and are tied together by an equation, their rates of change are tied together too.\n\n**How to use it.** Draw the situation, name the variables, and write the equation that links them (Pythagoras, similar triangles, an area or volume formula). Differentiate with respect to $t$. Only then plug in the numbers for the instant you care about.\n\n**Example.** A circle's radius grows at $2$ cm/s. From $A=\\pi r^2$, $\\frac{dA}{dt}=2\\pi r\\frac{dr}{dt}$, which is $2\\pi\\cdot5\\cdot2=20\\pi$ cm²/s when $r=5$.","pt":{"n":"Taxas relacionadas","d":"Relacionar a rapidez com que variam grandezas ligadas entre si.","b":"**O que é.** Quando várias grandezas variam no tempo e estão ligadas por uma equação, as suas taxas de variação também estão ligadas.\n\n**Como usar.** Desenhe a situação, dê nome às variáveis e escreva a equação que as liga (Pitágoras, semelhança de triângulos, uma fórmula de área ou de volume). Derive em ordem a $t$. Só então substitua os valores do instante que interessa.\n\n**Exemplo.** O raio de um círculo cresce a $2$ cm/s. De $A=\\pi r^2$, $\\frac{dA}{dt}=2\\pi r\\frac{dr}{dt}$, que vale $2\\pi\\cdot5\\cdot2=20\\pi$ cm²/s quando $r=5$."}},{"k":"mvt","n":"Mean Value Theorem","d":"Somewhere, the instant slope equals the average slope.","b":"**What it is.** If $f$ is continuous on $[a,b]$ and differentiable inside, then $f'(c)=\\frac{f(b)-f(a)}{b-a}$ for some $c\\in(a,b)$. Rolle's theorem is the case $f(a)=f(b)$, which gives $f'(c)=0$.\n\n**How to use it.** It turns derivative bounds into value bounds: if $|f'|\\le M$ then $|f(b)-f(a)|\\le M|b-a|$. It also counts roots: between two roots of $f$ there is a root of $f'$, so $f$ has at most one more root than $f'$.\n\nCauchy's mean value theorem generalizes it: for $f,g$ continuous on $[a,b]$ and differentiable on $(a,b)$, $\\frac{f(b)-f(a)}{g(b)-g(a)}=\\frac{f'(c)}{g'(c)}$ for some $c\\in(a,b)$ (when the denominators don't vanish). It also justifies the linear approximation $f(x_0+\\Delta x)\\approx f(x_0)+f'(x_0)\\Delta x$.\n\n**Example.** If $f(0)=0$ and $f'(x)\\le3$ everywhere, then $f(2)\\le6$.","pt":{"n":"Teoremas de Rolle e Lagrange","d":"Algures, o declive instantâneo é igual ao declive médio. Inclui o Teorema de Cauchy.","b":"**O que é.** Teorema de Lagrange: se $f$ é regular em $[a,b]$ (contínua em $[a,b]$ e diferenciável em $\\mathopen{]}a,b\\mathclose{[}$), então $f'(c)=\\frac{f(b)-f(a)}{b-a}$ para algum $c\\in\\,\\mathopen{]}a,b\\mathclose{[}$. O Teorema de Rolle é o caso $f(a)=f(b)$, que dá $f'(c)=0$.\n\n**Como usar.** Transforma limites da derivada em limites dos valores: se $|f'|\\le M$ então $|f(b)-f(a)|\\le M|b-a|$. Também conta zeros: entre dois zeros de $f$ há um zero de $f'$, logo $f$ tem no máximo mais um zero do que $f'$. Consequência: se $f'>0$ num intervalo, $f$ é aí estritamente crescente.\n\nO Teorema de Cauchy generaliza-o: para $f,g$ regulares em $[a,b]$, $\\frac{f(b)-f(a)}{g(b)-g(a)}=\\frac{f'(c)}{g'(c)}$ para algum $c\\in\\,\\mathopen{]}a,b\\mathclose{[}$ (quando os denominadores não se anulam). Justifica também a fórmula dos acréscimos finitos $f(x_0+\\Delta x)\\approx f(x_0)+f'(x_0)\\Delta x$.\n\n**Exemplo.** Se $f(0)=0$ e $f'(x)\\le3$ em todo o lado, então $f(2)\\le6$."}},{"k":"lhopital","n":"L'Hôpital's rule","d":"Differentiate top and bottom to resolve 0/0 and ∞/∞.","b":"**What it is.** If $\\frac{f(x)}{g(x)}$ becomes $\\frac00$ or $\\frac{\\infty}{\\infty}$ as $x\\to a$, then $\\lim\\frac{f}{g}=\\lim\\frac{f'}{g'}$, provided the right side exists.\n\n**How to use it.** Differentiate the numerator and the denominator separately (this is not the quotient rule). You may need several rounds. Other indeterminate forms convert: write $0\\cdot\\infty$ as a fraction, and for $1^\\infty$, $0^0$, $\\infty^0$ take logs first.\n\nIf $\\lim\\frac{f'}{g'}$ does not exist, the rule says nothing: $\\frac{x^2\\cos(1/x)}{e^x-1}\\to0$, yet the quotient of derivatives has no limit.\n\n**Example.** $\\lim_{x\\to0}\\frac{e^x-1-x}{x^2}=\\lim\\frac{e^x-1}{2x}=\\lim\\frac{e^x}{2}=\\frac12$.","pt":{"n":"Regra de Cauchy","d":"Derivar numerador e denominador para levantar indeterminações 0/0 e ∞/∞.","b":"**O que é.** Se $\\frac{f(x)}{g(x)}$ dá $\\frac00$ ou $\\frac{\\infty}{\\infty}$ quando $x\\to a$, então $\\lim\\frac{f}{g}=\\lim\\frac{f'}{g'}$, desde que o segundo limite exista. (Fora de Portugal é conhecida como regra de L'Hôpital.)\n\n**Como usar.** Derive o numerador e o denominador separadamente (não é a regra do quociente). Pode ser preciso aplicá-la várias vezes. As outras indeterminações convertem-se: escreva $0\\cdot\\infty$ como fração e, para $1^\\infty$, $0^0$, $\\infty^0$, aplique primeiro logaritmos.\n\nSe $\\lim\\frac{f'}{g'}$ não existir, a regra nada permite concluir: $\\frac{x^2\\cos(1/x)}{e^x-1}\\to0$, mas o quociente das derivadas não tem limite.\n\n**Exemplo.** $\\lim_{x\\to0}\\frac{e^x-1-x}{x^2}=\\lim\\frac{e^x-1}{2x}=\\lim\\frac{e^x}{2}=\\frac12$."}},{"k":"optimization","n":"Optimization","d":"Finding the largest or smallest value with derivatives.","b":"**What it is.** The maximum and minimum of a differentiable function occur at critical points (where $f'(x)=0$ or is undefined) or at the endpoints of the domain.\n\n**How to use it.** Write the quantity as a function of one variable, using any constraint to eliminate the others. Find the critical points, then compare values at critical points and endpoints, or check that $f'$ switches sign. Second derivative test: if $f'(c)=0$ and $f''(c)<0$, it's a local max; if $f''(c)>0$, a local min.\n\n**Example.** Maximize $x(10-x)$: the derivative $10-2x$ vanishes at $x=5$, giving $25$.","pt":{"n":"Otimização","d":"Encontrar o maior ou o menor valor com derivadas.","b":"**O que é.** O máximo e o mínimo de uma função diferenciável ocorrem em pontos críticos (onde $f'(x)=0$ ou não existe) ou nos extremos do domínio.\n\n**Como usar.** Escreva a grandeza como função de uma só variável, usando as restrições para eliminar as outras. Determine os pontos críticos e compare os valores nesses pontos e nos extremos, ou verifique que $f'$ muda de sinal. Teste da segunda derivada: se $f'(c)=0$ e $f''(c)<0$, é um máximo local; se $f''(c)>0$, um mínimo local.\n\n**Exemplo.** Maximizar $x(10-x)$: a derivada $10-2x$ anula-se em $x=5$, o que dá $25$."}},{"k":"convexity","n":"Concavity & convexity","d":"How a graph bends, inflection points, and Jensen's inequality.","b":"**What it is.** If $f''>0$ the graph bends upward (convex, concave up) and lies above its tangent lines. If $f''<0$ it bends downward (concave). An inflection point is where the bending switches.\n\n**How to use it.** Jensen's inequality: for convex $f$, $f\\!\\left(\\frac{a+b}{2}\\right)\\le\\frac{f(a)+f(b)}{2}$, and in general $f(\\text{average})\\le\\text{average of }f$; the inequality flips for concave $f$. Tangent-line bound: a convex $f$ satisfies $f(x)\\ge f(a)+f'(a)(x-a)$.\n\n**Example.** $e^x$ is convex and its tangent at $0$ is $1+x$, so $e^x\\ge1+x$ for all $x$.","pt":{"n":"Concavidade e convexidade","d":"Como o gráfico curva, pontos de inflexão e a desigualdade de Jensen.","b":"**O que é.** Se $f''>0$ o gráfico tem a concavidade voltada para cima (função convexa) e fica acima das suas tangentes. Se $f''<0$ tem a concavidade voltada para baixo (côncava). Um ponto de inflexão é onde a concavidade muda.\n\n**Como usar.** Desigualdade de Jensen: para $f$ convexa, $f\\!\\left(\\frac{a+b}{2}\\right)\\le\\frac{f(a)+f(b)}{2}$ e, em geral, $f(\\text{média})\\le\\text{média de }f$; a desigualdade inverte-se para $f$ côncava. Majoração pela tangente: uma $f$ convexa satisfaz $f(x)\\ge f(a)+f'(a)(x-a)$.\n\n**Exemplo.** $e^x$ é convexa e a sua tangente em $0$ é $1+x$, logo $e^x\\ge1+x$ para todo o $x$."}},{"k":"roots","n":"Counting solutions","d":"Using the shape of a graph to count roots exactly.","b":"**What it is.** To count solutions of an equation, put it in the form $f(x)=0$ and study the graph of $f$.\n\n**How to use it.** The critical points of $f$ cut the line into pieces where $f$ is monotonic. On each piece there is at most one root, and there is exactly one when $f$ changes sign across it (IVT). Don't forget the behavior as $x\\to\\pm\\infty$. Rearranging can help: $e^x=kx$ is the same as $k=\\frac{e^x}{x}$, a horizontal line against a single graph.\n\n**Example.** For $x^3-3x-1=0$: the local max is $f(-1)=1>0$ and the local min is $f(1)=-3<0$, so there are three real roots.","pt":{"n":"Contar soluções","d":"Usar a forma do gráfico para contar zeros com exatidão.","b":"**O que é.** Para contar as soluções de uma equação, escreva-a na forma $f(x)=0$ e estude o gráfico de $f$.\n\n**Como usar.** Os pontos críticos de $f$ dividem a reta em intervalos onde $f$ é monótona. Em cada um há no máximo um zero, e há exatamente um quando $f$ muda de sinal nesse intervalo (TVI). Não se esqueça do comportamento quando $x\\to\\pm\\infty$. Reorganizar ajuda: $e^x=kx$ é o mesmo que $k=\\frac{e^x}{x}$, uma reta horizontal contra um único gráfico.\n\n**Exemplo.** Para $x^3-3x-1=0$: o máximo local é $f(-1)=1>0$ e o mínimo local é $f(1)=-3<0$, logo há três raízes reais."}},{"k":"inverse-functions","n":"Inverse functions","d":"Derivatives and integrals of f⁻¹ from those of f.","b":"**What it is.** A strictly monotonic $f$ has an inverse $f^{-1}$ with $f^{-1}(f(x))=x$. Its graph is the reflection of $f$'s graph across the line $y=x$.\n\n**How to use it.** Derivative: $(f^{-1})'(y)=\\frac{1}{f'(x)}$ where $y=f(x)$. Integral: reflecting the picture gives $\\int_{f(a)}^{f(b)}f^{-1}(y)\\,dy=b\\,f(b)-a\\,f(a)-\\int_a^bf(x)\\,dx$, so you never need a formula for $f^{-1}$.\n\n**Example.** $f(x)=x^3+2x$ has $f(1)=3$ and $f'(1)=5$, so $(f^{-1})'(3)=\\frac15$.","pt":{"n":"Funções inversas","d":"Derivadas e integrais de f⁻¹ a partir dos de f.","b":"**O que é.** Uma $f$ estritamente monótona tem inversa $f^{-1}$, com $f^{-1}(f(x))=x$. O seu gráfico é o simétrico do gráfico de $f$ em relação à reta $y=x$.\n\n**Como usar.** Derivada: $(f^{-1})'(y)=\\frac{1}{f'(x)}$ onde $y=f(x)$. Integral: refletindo a figura, $\\int_{f(a)}^{f(b)}f^{-1}(y)\\,dy=b\\,f(b)-a\\,f(a)-\\int_a^bf(x)\\,dx$, por isso nunca precisa de uma expressão para $f^{-1}$.\n\n**Exemplo.** $f(x)=x^3+2x$ tem $f(1)=3$ e $f'(1)=5$, logo $(f^{-1})'(3)=\\frac15$."}},{"k":"integrals","n":"Definite integrals & the FTC","d":"Signed area under a curve, computed with antiderivatives.","b":"**What it is.** $\\int_a^bf(x)\\,dx$ is the signed area between the graph of $f$ and the $x$-axis from $x=a$ to $x=b$: area above the axis counts positive, below counts negative.\n\n**How to calculate it.** The Fundamental Theorem of Calculus: if $F'=f$, then $\\int_a^bf(x)\\,dx=F(b)-F(a)$. So find an antiderivative and subtract its values at the ends. Basic antiderivatives: $x^n\\to\\frac{x^{n+1}}{n+1}$ ($n\\ne-1$), $\\frac1x\\to\\ln|x|$, $e^x\\to e^x$, $\\sin x\\to-\\cos x$, $\\cos x\\to\\sin x$. The other half of the theorem: $\\frac{d}{dx}\\int_a^xf(t)\\,dt=f(x)$, and with an upper limit $g(x)$ you get $f(g(x))\\,g'(x)$.\n\n**Example.** $\\int_0^23x^2\\,dx=\\big[x^3\\big]_0^2=8$.","pt":{"n":"Integrais e Teorema Fundamental","d":"Área com sinal sob uma curva, calculada com primitivas.","b":"**O que é.** $\\int_a^bf(x)\\,dx$ é a área com sinal entre o gráfico de $f$ e o eixo dos $x$, de $x=a$ a $x=b$: a área acima do eixo conta positivamente, a área abaixo conta negativamente.\n\n**Como calcular.** Teorema Fundamental do Cálculo: se $F'=f$, então $\\int_a^bf(x)\\,dx=F(b)-F(a)$. Basta encontrar uma primitiva e subtrair os seus valores nos extremos. Primitivas imediatas: $x^n\\to\\frac{x^{n+1}}{n+1}$ ($n\\ne-1$), $\\frac1x\\to\\ln|x|$, $e^x\\to e^x$, $\\sin x\\to-\\cos x$, $\\cos x\\to\\sin x$. A outra metade do teorema: $\\frac{d}{dx}\\int_a^xf(t)\\,dt=f(x)$, e com limite superior $g(x)$ obtém-se $f(g(x))\\,g'(x)$.\n\n**Exemplo.** $\\int_0^23x^2\\,dx=\\big[x^3\\big]_0^2=8$."}},{"k":"substitution","n":"u-substitution","d":"The chain rule run backwards.","b":"**What it is.** If the integrand looks like $f(g(x))\\,g'(x)$, the substitution $u=g(x)$, $du=g'(x)\\,dx$ simplifies it.\n\n**How to use it.** Spot an inner function whose derivative also appears (up to a constant factor). Change the limits too: $\\int_a^bf(g(x))g'(x)\\,dx=\\int_{g(a)}^{g(b)}f(u)\\,du$.\n\n**Example.** $\\int_0^12x(1+x^2)^3\\,dx$ with $u=1+x^2$ becomes $\\int_1^2u^3\\,du=\\frac{16-1}{4}=\\frac{15}{4}$.","pt":{"n":"Primitivação por substituição","d":"A regra da cadeia ao contrário.","b":"**O que é.** Se a função integranda tem a forma $f(g(x))\\,g'(x)$, a substituição $u=g(x)$, $du=g'(x)\\,dx$ simplifica-a.\n\n**Como usar.** Procure uma função interior cuja derivada também apareça (a menos de uma constante). Mude também os limites de integração: $\\int_a^bf(g(x))g'(x)\\,dx=\\int_{g(a)}^{g(b)}f(u)\\,du$.\n\n**Exemplo.** $\\int_0^12x(1+x^2)^3\\,dx$ com $u=1+x^2$ passa a $\\int_1^2u^3\\,du=\\frac{16-1}{4}=\\frac{15}{4}$."}},{"k":"symmetry","n":"Integral symmetry tricks","d":"Odd/even functions, King's rule, and x ↦ 1/x.","b":"**What it is.** Many hard-looking integrals collapse once you exploit a symmetry of the interval.\n\n**How to use it.** Odd functions ($f(-x)=-f(x)$) integrate to $0$ over $[-a,a]$. King's rule: $\\int_a^bf(x)\\,dx=\\int_a^bf(a+b-x)\\,dx$; if the new integrand pairs nicely with the old, add them: $2I=\\int_a^b\\big(f(x)+f(a+b-x)\\big)dx$. For intervals like $[\\frac1c,c]$ or $(0,\\infty)$ try $x\\mapsto\\frac1x$; for $\\frac{1}{1+a^x}$ on $[-c,c]$ try $x\\mapsto-x$.\n\n**Example.** $I=\\int_0^{\\pi/2}\\frac{\\sin x}{\\sin x+\\cos x}dx$: King's rule swaps $\\sin$ and $\\cos$, so $2I=\\frac\\pi2$ and $I=\\frac\\pi4$.","pt":{"n":"Simetrias em integrais","d":"Funções pares e ímpares, a troca x ↦ a+b−x e a troca x ↦ 1/x.","b":"**O que é.** Muitos integrais de aspeto difícil desfazem-se quando se aproveita uma simetria do intervalo.\n\n**Como usar.** As funções ímpares ($f(-x)=-f(x)$) têm integral $0$ em $[-a,a]$. Troca dos extremos: $\\int_a^bf(x)\\,dx=\\int_a^bf(a+b-x)\\,dx$; se a nova função integranda combina bem com a antiga, some-as: $2I=\\int_a^b\\big(f(x)+f(a+b-x)\\big)dx$. Para intervalos como $[\\frac1c,c]$ ou $\\mathopen{]}0,\\infty\\mathclose{[}$ experimente $x\\mapsto\\frac1x$; para $\\frac{1}{1+a^x}$ em $[-c,c]$ experimente $x\\mapsto-x$.\n\n**Exemplo.** $I=\\int_0^{\\pi/2}\\frac{\\sin x}{\\sin x+\\cos x}dx$: a troca $x\\mapsto\\frac\\pi2-x$ permuta $\\sin$ e $\\cos$, logo $2I=\\frac\\pi2$ e $I=\\frac\\pi4$."}},{"k":"riemann","n":"Riemann sums","d":"Integrals as limits of sums, and sums as integrals.","b":"**What it is.** An integral is the limit of rectangle sums: $\\int_0^1f(x)\\,dx=\\lim_{n\\to\\infty}\\frac1n\\sum_{k=1}^nf\\!\\left(\\frac kn\\right)$.\n\n**How to use it.** Read it backwards: to evaluate the limit of a sum, factor out $\\frac1n$ and write each term as a function of $\\frac kn$. That function is $f$, and the limit is $\\int_0^1f$. For products, take logs to get sums.\n\n**Example.** $\\lim\\frac1n\\sum_{k=1}^n\\left(\\frac kn\\right)^3=\\int_0^1x^3\\,dx=\\frac14$.","pt":{"n":"Somas de Riemann","d":"Integrais como limites de somas, e somas como integrais.","b":"**O que é.** Um integral é o limite de somas de retângulos: $\\int_0^1f(x)\\,dx=\\lim_{n\\to\\infty}\\frac1n\\sum_{k=1}^nf\\!\\left(\\frac kn\\right)$.\n\n**Como usar.** Leia ao contrário: para calcular o limite de uma soma, ponha $\\frac1n$ em evidência e escreva cada parcela como função de $\\frac kn$. Essa função é $f$, e o limite é $\\int_0^1f$. Para produtos, aplique logaritmos para obter somas.\n\n**Exemplo.** $\\lim\\frac1n\\sum_{k=1}^n\\left(\\frac kn\\right)^3=\\int_0^1x^3\\,dx=\\frac14$."}},{"k":"ibp","n":"Integration by parts","d":"The product rule run backwards.","b":"**What it is.** $\\int_a^bu\\,dv=\\big[uv\\big]_a^b-\\int_a^bv\\,du$.\n\n**How to use it.** Pick $u$ to be something that gets simpler when differentiated (polynomials, $\\ln x$, $\\arctan x$) and $dv$ something you can integrate ($e^x$, $\\sin x$, $\\cos x$, $dx$). Sometimes you apply it twice; with $e^x\\sin x$ the original integral comes back and you solve for it.\n\n**Example.** $\\int_0^1xe^{2x}dx$ with $u=x$, $dv=e^{2x}dx$: $\\left[\\frac{xe^{2x}}{2}\\right]_0^1-\\int_0^1\\frac{e^{2x}}{2}dx=\\frac{e^2}{2}-\\frac{e^2-1}{4}=\\frac{e^2+1}{4}$.","pt":{"n":"Primitivação por partes","d":"A regra do produto ao contrário.","b":"**O que é.** $\\int_a^bu\\,dv=\\big[uv\\big]_a^b-\\int_a^bv\\,du$.\n\n**Como usar.** Escolha para $u$ algo que fique mais simples ao derivar (polinómios, $\\ln x$, $\\arctan x$) e para $dv$ algo que saiba primitivar ($e^x$, $\\sin x$, $\\cos x$, $dx$). Por vezes aplica-se duas vezes; com $e^x\\sin x$ o integral original reaparece e resolve-se em ordem a ele.\n\n**Exemplo.** $\\int_0^1xe^{2x}dx$ com $u=x$, $dv=e^{2x}dx$: $\\left[\\frac{xe^{2x}}{2}\\right]_0^1-\\int_0^1\\frac{e^{2x}}{2}dx=\\frac{e^2}{2}-\\frac{e^2-1}{4}=\\frac{e^2+1}{4}$."}},{"k":"improper","n":"Improper integrals","d":"Integrals over infinite ranges or across blow-ups.","b":"**What it is.** When a limit of integration is infinite or the integrand blows up, the integral is defined as a limit: $\\int_1^\\infty f=\\lim_{b\\to\\infty}\\int_1^bf$, or $\\int_0^1f=\\lim_{\\varepsilon\\to0^+}\\int_\\varepsilon^1f$ if $f$ blows up at $0$. It converges if that limit is finite.\n\n**How to use it.** Benchmarks: $\\int_1^\\infty\\frac{dx}{x^p}$ converges iff $p>1$; $\\int_0^1\\frac{dx}{x^p}$ converges iff $p<1$; $\\int_0^\\infty e^{-ax}dx=\\frac1a$. The Gamma integral: $\\int_0^\\infty x^ne^{-x}dx=n!$.\n\n**Example.** $\\int_1^\\infty\\frac{dx}{x^3}=\\lim_{b\\to\\infty}\\left[-\\frac{1}{2x^2}\\right]_1^b=\\frac12$.","pt":{"n":"Integrais impróprios","d":"Integrais em intervalos ilimitados ou de funções ilimitadas.","b":"**O que é.** Quando um limite de integração é infinito ou a função integranda é ilimitada, o integral define-se como um limite: $\\int_1^\\infty f=\\lim_{b\\to\\infty}\\int_1^bf$, ou $\\int_0^1f=\\lim_{\\varepsilon\\to0^+}\\int_\\varepsilon^1f$ se $f$ explode em $0$. É convergente se esse limite for finito.\n\n**Como usar.** Referências: $\\int_1^\\infty\\frac{dx}{x^p}$ converge se e só se $p>1$; $\\int_0^1\\frac{dx}{x^p}$ converge se e só se $p<1$; $\\int_0^\\infty e^{-ax}dx=\\frac1a$. O integral Gama: $\\int_0^\\infty x^ne^{-x}dx=n!$.\n\n**Exemplo.** $\\int_1^\\infty\\frac{dx}{x^3}=\\lim_{b\\to\\infty}\\left[-\\frac{1}{2x^2}\\right]_1^b=\\frac12$."}},{"k":"areas-volumes","n":"Areas, volumes & length","d":"Geometry with integrals: discs, washers, arc length, polar area.","b":"**What it is.** Integrals measure more than area under a graph.\n\n**How to use it.** Area between curves: $\\int(\\text{top}-\\text{bottom})\\,dx$. Volume when $y=f(x)$ spins around the $x$-axis (discs): $V=\\pi\\int_a^bf(x)^2dx$; with a hole (washers): $\\pi\\int(R^2-r^2)\\,dx$. Arc length: $L=\\int_a^b\\sqrt{1+f'(x)^2}\\,dx$. Polar area: $A=\\frac12\\int r(\\theta)^2\\,d\\theta$.\n\n**Example.** Spinning $y=x$ on $[0,1]$ around the $x$-axis makes a cone of volume $\\pi\\int_0^1x^2dx=\\frac\\pi3$.","pt":{"n":"Áreas, volumes e comprimentos","d":"Geometria com integrais: discos, anilhas, comprimento de arco, área em polares.","b":"**O que é.** Os integrais medem mais do que a área sob um gráfico.\n\n**Como usar.** Área entre curvas: $\\int(\\text{cima}-\\text{baixo})\\,dx$. Volume quando $y=f(x)$ roda em torno do eixo dos $x$ (discos): $V=\\pi\\int_a^bf(x)^2dx$; com um buraco (anilhas): $\\pi\\int(R^2-r^2)\\,dx$. Comprimento de arco: $L=\\int_a^b\\sqrt{1+f'(x)^2}\\,dx$. Área em polares: $A=\\frac12\\int r(\\theta)^2\\,d\\theta$.\n\n**Exemplo.** Rodar $y=x$ em $[0,1]$ em torno do eixo dos $x$ dá um cone de volume $\\pi\\int_0^1x^2dx=\\frac\\pi3$."}},{"k":"series","n":"Infinite series","d":"Adding infinitely many terms: geometric, telescoping, power series.","b":"**What it is.** $\\sum a_n$ is the limit of its partial sums.\n\n**How to use it.** Geometric: $\\sum_{n\\ge0}r^n=\\frac1{1-r}$ for $|r|<1$. Telescoping: if $a_n=b_n-b_{n+1}$, partial sums collapse to $b_1-b_{N+1}$. Tests: the terms must tend to $0$; $\\sum\\frac1{n^p}$ converges iff $p>1$; ratio test: if $\\left|\\frac{a_{n+1}}{a_n}\\right|\\to\\rho<1$ it converges. A power series $\\sum c_nx^n$ converges for $|x|<R$, the rad
